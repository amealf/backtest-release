stable references.\n","modified":"2026-08-08T19:27:46.190Z","missing":false},{"id":"references.zh","pair":"references","group":"reference","path":"08_references/README.zh.md","lang":"zh","title":"参考材料","lead":"保留材料的来源、用途、相关性与审阅状态。","policy":"保留材料或其来源、相关性、状态变化时更新。","markdown":"# 参考材料\n\n- `D:\\Code\\backtest-release\\Backtest_V4.41_source_release_20260809.zip`：方案 A 的 Windows 正式源码发布包；相邻 `.sha256` 与 `.audit.json` 文件负责整包完整性和打包事实。\n- Git 标签 `V4.41`：已发布 `v4.41` 分支上的正式源码发布身份。\n- `project_management\\screenshots\\trade_review_inline_peer_20260809`：Chrome Beta 检查证据，覆盖配对按钮居中、同页载入训练结果、隐藏内嵌参数卡片以及关闭／卸载行为。\n\n- `F:\\Backtest test 6.11\\02_DATA_AND_AUDITS\\market_data\\k200_historical_ticks\\k200_ticks_20260523_to_20260723_20260723_014534\\README.md`：K200 原始 Tick 下载、已审计 016M／016U 边界与合并契约。\n- `F:\\Backtest test 6.11\\02_DATA_AND_AUDITS\\market_data\\k200_historical_ticks_supplements\\k200_postroll_supplement_20260723T024400_to_20260728T161430_20260728_151540\\README.md`：第一批保留的换月后补充数据与更新血缘。\n- `F:\\Backtest test 6.11\\02_DATA_AND_AUDITS\\market_data\\k200_historical_ticks_supplements\\k200_postroll_supplement_20260728T161430_to_20260807T032200_20260807_022303\\README.md`：当前最新 K200 Tick 补充数据、合约规则、更新时间与主要原始／衍生／审计文件。\n\n- `research_variants/short_momentum_net_drop_rebound_v4_4/SOURCE_MANIFEST.json`：当前源码与行为身份。\n- `runtime_inputs/RUNTIME_INPUTS.json`：仓库相对运行输入。\n- `runtime_inputs/data_preparation/data_preparation_manifest.json`：schema 5 准备数据身份。\n- `research_variants/short_momentum_net_drop_rebound_v4_4/plans/v4_4_temporary_single_combo_close_fill_20260802.json`：临时重跑计划。\n- `research_variants/short_momentum_net_drop_rebound_v4_4/plans/v4_4_cost_adjusted_multiround_20260803_round_01_broad_all_window.json`：已冻结 372 坐标第一轮计划。\n- `research_variants/short_momentum_net_drop_rebound_v4_4/plans/v4_4_cost_adjusted_multiround_20260803_round_02_broad_local_all_window.json`：已冻结 247 坐标第二轮大范围＋局部计划。\n- `research_variants/short_momentum_net_drop_rebound_v4_4/plans/v4_4_cost_adjusted_multiround_20260803_round_03_terminal_local_all_window.json`：已冻结 212 坐标终结型第三轮局部计划。\n- `research_variants/short_momentum_net_drop_rebound_v4_4/plans/v4_4_cost_adjusted_multiround_20260803_continuation_round_01_broad_span_all_window.json`：已冻结 528 坐标 Continuation 第一轮大范围计划。\n- `runtime_inputs/templates`：哈希受控的历史总入口／逐笔模板、Plotly 与市场选择器。\n- `runtime_inputs/provenance`：保留的 V4.3 身份与计划，只用于记录。\n- `research_variants/short_momentum_net_drop_rebound_v4_4/handoffs/v4_4_cost_adjusted_multiround_20260803/analysis_reports`：九份已保留 campaign 设计、解释、闭合与交付报告的稳定目录；这些报告原先位于临时 `.omo` 团队工作区。\n- `research_variants/short_momentum_net_drop_rebound_v4_4/handoffs/v4_4_cost_adjusted_multiround_20260803/analysis_reports/README.md`：上述报告的来源与迁移说明。\n- `results/all_completed_union_analysis/index.html` 与 `results/all_completed_union_analysis/trade_review/index.html`：未来刷新使用的当前共享累计总入口与逐笔入口。\n- `runtime_inputs/templates/historical_v4_trade.html`：当前逐笔展示权威文件，包含开仓理由第 2 项空心椭圆及桌面端「参数」标签上移 6 像素。\n\nKRX Mini KOSPI 200 合约规模规则是当前成本输入：期货价格 × 50,000 KRW。哈希绑定的当前名义价值参考还记录了活动 15 秒输入的最后真实价格，以及将 6 USD 手续费换算成 bps 所用的带日期 KRW/USD 收盘参考。最小变动单位资料继续只作为来源背景保留。\n\n当前结果与交付路径见 `SOURCE_OF_TRUTH.zh.md`。\n\n临时 `.omo` 团队工作区及其中非规范的 JSON／Python 审计辅助文件已于 2026-08-08 移入回收站。已接受的结论继续保留在当前状态与历史文档中；上述九份 Markdown 报告是当前稳定参考。\n","modified":"2026-08-08T19:27:46.192Z","missing":false},{"id":"archive.en","pair":"archive","group":"archive","path":"99_archive/README.en.md","lang":"en","title":"Archive Guide","lead":"Retention, inactive-state labels, traceability, and restoration rules.","policy":"Update when archive structure, retention, or restoration guidance changes.","markdown":"# Archive Guide\n\n## Purpose\n\nRetain inactive material for traceability without confusing it with current truth. Archiving changes status; it does not erase history.\n\n## Rules\n\n- Give each archived item a dated or stable descriptive folder.\n- Add an archive note with the original purpose, active period, retirement reason, replacement when one exists, and paths to retained evidence.\n- Keep archived material out of current authority tables and active task claims.\n- Read an item's archive note before reusing it.\n- Restore material only through a recorded decision and an updated validity boundary.\n- Do not permanently delete files as part of routine project-context maintenance.\n\n## Archive register\n\n| Item | Archived on | Reason | Replacement | Note |\n| --- | --- | --- | --- | --- |\n| None | 2026-08-01 | No project-specific material archived during initialization. | — | — |\n\n## Maintenance\n\nUpdate when archive structure or retention guidance changes, when material becomes inactive, or when an item is restored.\n","modified":"2026-08-01T13:50:01.080Z","missing":false},{"id":"archive.zh","pair":"archive","group":"archive","path":"99_archive/README.zh.md","lang":"zh","title":"存档说明","lead":"保留、非活动状态、追溯与恢复规则。","policy":"存档结构、保留或恢复规则变化时更新。","markdown":"# 存档说明\n\n## 用途\n\n保留非活动材料以便追溯，同时避免它与当前事实混淆。存档改变状态，不抹除历史。\n\n## 规则\n\n- 每个存档项目使用带日期或稳定描述的目录。\n- 存档说明包含原用途、生效区间、退役原因、存在时的替代项与保留证据路径。\n- 存档材料不能出现在当前权威表与当前任务结论中。\n- 复用项目前阅读对应存档说明。\n- 只有记录决策并更新有效边界后，才能恢复材料。\n- 日常项目上下文维护不得永久删除文件。\n\n## 存档登记\n\n| 项目 | 存档时间 | 原因 | 替代项 | 说明 |\n| --- | --- | --- | --- | --- |\n| 无 | 2026-08-01 | 初始化期间未存档项目专属材料。 | — | — |\n\n## 维护规则\n\n存档结构或保留规则变化、材料转为非活动或项目恢复时更新。\n","modified":"2026-08-01T13:50:01.082Z","missing":false},{"id":"data.en","pair":"data","group":"domain","path":"05_domains/data/DATA_REQUIREMENTS.en.md","lang":"en","title":"Data Requirements","lead":"Data sources, contracts, quality, lineage, access, retention, and recovery rules.","policy":"Update when a durable source, schema, quality, lineage, access, retention, or recovery rule changes.","markdown":"# Data Requirements\n\n## Instrument profile binding\n\n- Every new instrument binds its market-data and preparation-manifest path, size, SHA-256, and `bar_seconds` in an instrument profile. Campaign plans consume those bindings; code does not select a product-specific filename.\n- The profile records timezone, exchange session, continuous-contract policy, warm-up boundary, gap policy, low-activity policy, and optional scenario set.\n- Missing data, gap, or low-activity decisions keep the profile non-executable. K200 remains the only ready profile until another profile is explicitly completed.\n- The strategy's authoritative granularity is 15 seconds because the primary K200 research uses 15-second bars. Every transfer target must also use 15-second bars. Profile, preparation manifest, and observed timestamp grid must agree; any mismatch stops before compute and is reported to the user.\n- Gap and low-activity configuration/implementation files are hash-bound. Their policy IDs and hashes must match the preparation manifest; `status=ready` alone is insufficient.\n\n## Cross-instrument evaluation data\n\n- SImain comparison data is explicit SIH6 15-second session-filled OHLC in America/Chicago time. The current test interval is 2026-01-29 through 2026-02-23; data begins on 2026-01-28 to supply rolling warm-up.\n- Warm-up bars may feed rolling indicators, but the transaction population includes only positions whose entry time is inside the declared test interval.\n- Record the exchange session, source timezone, continuous-contract schedule, roll count and adjustment policy, real gaps, synthetic bars, zero-trade exposure, and the presence or absence of an instrument-specific low-activity policy.\n- Cross-instrument percentages and bps are comparable. Preserve raw price-point MFE, MAE, and realized point totals for within-instrument inspection.\n\n## Active sources\n\n- K200 session-filled 15-second OHLC under `runtime_inputs/market_data`: 233,368 rows from `2026-05-23T00:00:00+09:00` through `2026-08-07T03:21:45+09:00`, SHA-256 `9760d367a109777c4789ce45d982a6c0708bacddad8f549450ed94f81ad5c405`.\n- Prepared baseline atoms, events, and schema-5 manifest under `runtime_inputs/data_preparation`.\n- The current ready binding is `research_variants\\short_momentum_net_drop_rebound_v4_4\\instrument_profiles\\k200m.json`; SImain and NQ templates are input checklists, not active sources.\n\n## Market and scenario catalogs\n\n- `runtime_inputs\\scenarios\\market_catalog.json` contains only predeclared selector intervals. Each market entry records `market_id`, labels, instrument, evaluation package, timezone, UTC offset, 15-second bar size, exact start/end, round-trip cost bps, and the data file's path base, size, and SHA-256.\n- `runtime_inputs\\scenarios\\scenario_catalog.json` stores the qualification rule and named scenarios. Each scenario repeats its market and evaluation identities, data file, displayed interval, AND aggregation, and one or more selected segments.\n- A saved or edited scene must not retain `precomputed_qualification_field`; that field is only a migration bridge for the unchanged three historical V4.4 scenarios. New scenes are evaluated from immutable package trade records.\n- Scenario qualification changes only membership. Displayed return, average trade, drawdown, count, and cost fields remain the full evaluation package metrics.\n\n## Evaluation-result package contract\n\n- The logical root is `results\\evaluation_packages`; physical bytes continue through the existing results junction to F. Package identity is `\u003cinstrument_id>\\\u003cstart_YYYYMMDDTHHMMSS>__\u003cend_YYYYMMDDTHHMMSS>` and uses the evaluated interval rather than warm-up or unused file coverage.\n- `evaluation_manifest.json` records the instrument, display name, exact interval, timezone, bar size, status, artifact paths, storage mode, provenance, and experiment-record path. It does not assign train/test/transfer meaning.\n- `parameter_summary.csv` contains the package's completed parameter population in a neutral metric namespace. `browser_summaries\\\u003ccandidate_set_id>.js` is a smaller projection used by a comparison page; it never replaces the authoritative summary or trade records.\n- `trade_records\\trades.csv` retains immutable transaction evidence. A historical adapter may use a same-volume hard link whose manifest carries the already declared source hash. New native runs append immutable batches and publish one consolidated package summary after closure.\n- `trade_review\\index.html` is the package-owned per-trade entry. A compatibility package may redirect to a retained historical page while preserving query and hash; a native package owns its process payload, catalog, and deterministic per-coordinate chunks.\n- `EXPERIMENT.md`, the comparison plan, and bilingual project records state what the run tested and how a package is used. The date directory remains stable when a later experiment assigns a different role.\n- A comparison reaches complete status only when its candidate set has unique exact `combo_id` values and every selected package supplies the declared population. Comparison pages load summaries, not complete trade records.\n- New completed evaluations use `runtime_inputs\\templates\\EVALUATION_PACKAGE_SPEC.template.json` to declare source files, neutral parameter fields, neutral metric mappings, interval identity, and the current experiment description. `tools\\register_v4_4_evaluation_package.py` refuses to replace a package whose manifest already exists.\n\n## Per-download README contract\n\n- Every instrument acquisition creates `README.md` inside that exact download directory. Refresh the same file whenever the run is resumed or completed; do not keep the only explanation in project memory or a separate report.\n- Record the instrument, upstream source and data type, source/request timezone, half-open requested interval, actual first/last observation when available, creation/resume/completion times, status, and principal raw/derived/audit files.\n- State how candidate contracts are compared, which contract is considered main, every effective contract interval with inclusive/exclusive boundaries, and whether adjustment is applied. When a supplement inherits an earlier audited decision instead of recomputing candidates, say so explicitly.\n- State the lineage and merge contract: the supplement starts at the parent's exclusive end, raw download directories remain separate, derived rows append in timestamp order with identical schemas, overlaps/duplicates/reversals fail, real gaps remain, and roll price differences remain when the series is unadjusted.\n- Keep a chronological update table in the README so later data management can reconstruct the acquisition chain across all retained download directories.\n\n## Baseline availability contract\n\n- Normal atom: available when its bar completes.\n- Pending low-volume atom: immediately available and entry-neutral while the run remains unconfirmed.\n- Pending interval later recovered: no exclusion is created.\n- Confirmed interval: every low-volume atom from the run start carries the confirmation time in `baseline_excluded_from`; it is eligible before that time and unavailable at and after that time.\n- `confirmed_low_activity_active` is true from the confirmation atom through the final low-volume atom. The first normal-volume atom is outside the gate.\n- `all_window`: every finite TR15 atom inside one continuity segment remains eligible.\n- `exclude_marked`: at calculation time t, an atom is eligible only when `baseline_available_from \u003c= t`.\n- `confirmed_low_activity_gate`: at calculation time t, an atom is eligible only when `baseline_excluded_from` is empty or greater than t; active gate atoms block new entries and cancel unfilled entry orders.\n\nDuplicate timestamps fail closed. Historical absolute paths are provenance only and are not active runtime dependencies.\n\n## ZIP handoff records\n\n- A user-requested V4.41 ZIP includes the active `RELEASE.json`, the hash-bound 15-second OHLC input, and transaction records for every completed compatible V4.4 strategy-major stage.\n- Package each immutable raw `batches/**/trades.csv` below `trade_records/`, preserving file bytes. Include `analysis/stage_trades.csv` when the completed stage produced it; record a missing optional derived ledger in the manifest and never recompute it during packaging.\n- `trade_records/TRADE_RECORDS_MANIFEST.json` must state the source campaign/stage, record role, relative source path, row count, size, SHA-256, and the source completion/stage-manifest hashes.\n- Other result payloads remain outside the archive: campaign files, batch manifests, summaries, grid files, chunks, snapshots, HTML output, logs, locks, and partial or failed stages.\n- Package verification binds source-to-staging hashes, the manifest record-set hash, ZIP entry names and sizes, forbidden/duplicate paths, and the whole-archive SHA-256. It does not create a duplicate extraction tree or repeat each ZIP entry hash.\n","modified":"2026-08-08T10:43:47.436Z","missing":false},{"id":"data.zh","pair":"data","group":"domain","path":"05_domains/data/DATA_REQUIREMENTS.zh.md","lang":"zh","title":"数据要求","lead":"数据来源、契约、质量、血缘、访问、保留与恢复规则。","policy":"长期来源、结构、质量、血缘、访问、保留或恢复规则变化后更新。","markdown":"# 数据要求\n\n## 品种配置绑定\n\n- 每个新品种都在品种配置中绑定行情数据和准备清单的路径、大小、SHA-256 与 `bar_seconds`。campaign 计划读取这些绑定；代码不选择特定品种文件名。\n- 配置记录时区、交易所时段、连续合约规则、预热边界、gap policy、low-activity policy 和可选 scenario set。\n- 数据、gap 或低活跃决策缺失时，配置不可执行。其他品种配置明确完成以前，K200 是唯一已就绪配置。\n- 主回测品种 K200 使用 15 秒 bar，因此策略权威颗粒度为 15 秒。所有迁移目标也必须使用 15 秒 bar。品种配置、数据准备清单与实际时间戳网格必须一致；任一处不一致都在计算以前停止并报告用户。\n- gap 与低活跃配置／实现文件需要绑定哈希。它们的 policy ID 和哈希必须与数据准备清单一致；只有 `status=ready` 不足以执行。\n\n## 跨品种评价数据\n\n- SImain 对比数据使用 America/Chicago 时区下明确 SIH6 的 15 秒补齐交易时段 OHLC。当前测试区间为 2026-01-29 至 2026-02-23；数据从 2026-01-28 开始，为滚动指标提供预热。\n- 预热 bar 可以参与滚动指标，但逐笔总体只包含开仓时间位于声明测试区间内的持仓。\n- 必须记录交易所时段、源时区、连续合约日程、换月次数与调整政策、真实 gap、synthetic bar、零成交暴露，以及是否存在专用品种低活动政策。\n- 跨品种使用百分比和 bps 比较；同时保留原始价格点数的 MFE、MAE 与已实现点数合计，供单品种检查。\n\n## 当前来源\n\n- `runtime_inputs/market_data` 下的 K200 补齐交易时段 15 秒 OHLC：233,368 行，范围为 `2026-05-23T00:00:00+09:00` 至 `2026-08-07T03:21:45+09:00`，SHA-256 为 `9760d367a109777c4789ce45d982a6c0708bacddad8f549450ed94f81ad5c405`。\n- `runtime_inputs/data_preparation` 下的 baseline 原子、事件与 schema 5 清单。\n- 当前已就绪绑定为 `research_variants\\short_momentum_net_drop_rebound_v4_4\\instrument_profiles\\k200m.json`；SImain 与 NQ 模板只用于收集输入，不是活动来源。\n\n## 行情与场景目录\n\n- `runtime_inputs\\scenarios\\market_catalog.json` 只保存预先登记的选择器区间。每项行情记录 `market_id`、中英文名称、品种、评价结果包、时区、UTC 偏移、15 秒 bar、精确起止时间、往返成本 bps，以及数据文件的路径基准、大小和 SHA-256。\n- `runtime_inputs\\scenarios\\scenario_catalog.json` 保存资格规则与命名场景。每个场景重复记录行情和评价身份、数据文件、显示区间、AND 聚合方式，以及一段或多段选区。\n- 新保存或编辑的场景不能保留 `precomputed_qualification_field`；该字段只用于迁移未变化的三个 V4.4 历史场景。新场景根据结果包的不可变逐笔记录判断资格。\n- 场景资格只改变参数集合。页面显示的收益、笔均、回撤、交易数和成本仍使用完整评价结果包指标。\n\n## 回测结果包契约\n\n- 逻辑根目录为 `results\\evaluation_packages`，实体字节继续通过现有 results 目录联接写入 F 盘。结果包身份为 `\u003cinstrument_id>\\\u003cstart_YYYYMMDDTHHMMSS>__\u003cend_YYYYMMDDTHHMMSS>`，时间只取实际评价区间，不包含预热或文件内尚未使用的行情。\n- `evaluation_manifest.json` 记录品种、显示名称、精确区间、时区、bar 周期、状态、产物路径、存储方式、来源和实验记录路径。清单不把结果包固定为训练、测试或迁移角色。\n- `parameter_summary.csv` 使用统一指标名称保存该结果包的完整已完成参数总体。`browser_summaries\\\u003ccandidate_set_id>.js` 是比较页面使用的小型候选集数据，不能替代权威参数汇总或逐笔记录。\n- `trade_records\\trades.csv` 保存不可变逐笔证据。历史适配包可以使用同卷硬链接，清单沿用来源文件已经声明的哈希。以后生成的原生结果以不可变批次追加，闭合后发布一份结果包汇总。\n- `trade_review\\index.html` 是结果包自己的逐笔入口。兼容结果包可以在保留 query 和 hash 的情况下跳转到历史页面；原生结果包在本目录保存 process payload、目录和确定性逐坐标区块。\n- `EXPERIMENT.md`、比较方案和双语项目记录说明本次回测完成了什么，以及该结果包在实验中的用途。后续实验改变用途时，日期目录保持不变。\n- 候选集合的 `combo_id` 必须精确、唯一，而且每个已选结果包都覆盖声明总体，比较才能标记为完成。比较页面只加载指标摘要，不加载完整逐笔记录。\n- 新完成的评价使用 `runtime_inputs\\templates\\EVALUATION_PACKAGE_SPEC.template.json` 声明来源文件、统一参数字段、统一指标映射、区间身份和当前实验说明。`tools\\register_v4_4_evaluation_package.py` 会拒绝替换已经存在清单的结果包。\n\n## 每次下载的 README 契约\n\n- 每个品种的每个下载目录都创建 `README.md`。恢复下载或完成下载时刷新同一文件；说明不能只保存在项目记忆或独立报告中。\n- 记录品种、上游来源和数据类型、来源／请求时区、右端不包含的请求区间、可用时的实际首末观察值、创建／恢复／完成时间、状态，以及主要原始／衍生／审计文件。\n- 写明候选合约的比较方式、主力合约判定、每段有效合约区间及其边界是否包含，并说明是否复权。补充批次沿用较早审计结论、没有重新比较候选合约时，需要明确注明。\n- 写明血缘和合并契约：补充批次从父批次的右端不包含时间开始；原始下载目录相互独立；衍生行在字段一致的前提下按时间追加；重叠、重复与倒序均禁止；真实 gap 保留；未复权序列保留换月价差。\n- README 保留按时间排列的更新表，使后续数据管理可以从所有保留下载目录还原完整获取链路。\n\n## Baseline 可用时间契约\n\n- 正常原子：该 bar 完结时可用。\n- 待确认低成交量原子：连续段尚未确认时立即可用，也不影响开仓。\n- 待确认区间后来恢复：不产生排除记录。\n- 已确认区间：从连续段第一根低成交量原子起，每根原子的 `baseline_excluded_from` 都记录确认时刻；确认前可用，确认时及以后不可用。\n- `confirmed_low_activity_active` 从确认原子持续到最后一根低成交量原子；第一根正常成交量原子已经离开门禁。\n- `all_window`：同一连续段内所有有限 TR15 原子仍可用。\n- `exclude_marked`：计算时间 t 只能使用满足 `baseline_available_from \u003c= t` 的原子。\n- `confirmed_low_activity_gate`：计算时间 t 只能使用 `baseline_excluded_from` 为空或晚于 t 的原子；门禁生效时停止新开仓，并取消未成交开仓委托。\n\n重复时间戳默认报错。历史绝对路径只用于来源记录，不是当前运行依赖。\n\n## ZIP 交接记录\n\n- 用户要求 V4.41 ZIP 时，纳入当前 `RELEASE.json`、哈希绑定的 15 秒 OHLC 输入，以及每个已完成且兼容 V4.4 策略主版本阶段的逐笔交易记录。\n- 每份不可变原始 `batches/**/trades.csv` 都复制到 `trade_records/`，并保持文件字节不变。已完成阶段生成了 `analysis/stage_trades.csv` 时一并纳入；缺少可选衍生账本时写入清单，打包过程不会重新计算。\n- `trade_records/TRADE_RECORDS_MANIFEST.json` 必须记录来源 campaign／阶段、记录角色、相对来源路径、行数、大小、SHA-256，以及来源 completion／stage manifest 哈希。\n- 其他结果载荷继续留在 ZIP 外：campaign 文件、batch manifest、summary、grid、chunks、snapshot、HTML 输出、日志、锁，以及未完成或失败阶段。\n- 打包核验绑定来源到 staging 的哈希、清单记录集哈希、ZIP 条目名称与大小、禁止／重复路径和整包 SHA-256；不建立重复解压目录，也不重复计算每个 ZIP 条目哈希。\n","modified":"2026-08-08T10:43:47.438Z","missing":false},{"id":"research.en","pair":"research","group":"domain","path":"05_domains/research/RESEARCH_CONSTRAINTS.en.md","lang":"en","title":"Research Constraints","lead":"Research questions, methods, evidence boundaries, reproducibility, and interpretation rules.","policy":"Update when an accepted method, evidence boundary, reproducibility rule, or interpretation constraint changes.","markdown":"# Research Constraints\n\n- Cross-instrument validation freezes candidates from source-instrument evidence before target-instrument execution. The frozen record must include parameters, source filters, source metrics, generation time, implementation/data identities, and a canonical content hash. Target results may evaluate only and may never alter that candidate record.\n- Same-instrument temporal migration may adapt across sequential slices only when each next candidate set is frozen before that slice is read. Closed earlier slices may inform later freezes; the declared latest slice remains a final holdout. A full-subsequent-interval replay is labeled post-hoc descriptive and cannot be presented as another independent validation.\n- Rolling indicators may use declared pre-test warm-up, while reported transactions are restricted to entries created inside the target test interval. Timezone, exchange session, continuous-contract roll, gap, synthetic, and low-activity policies are mandatory audit fields.\n- Cross-instrument tables begin with parameter fields, followed by target metrics, source metrics, and transfer diagnostics. Use percentages or bps for transfer comparison while retaining raw price points for within-instrument inspection. Do not create a combined score.\n- Any target full-grid run is a separately labeled post-hoc diagnostic with separate files and page status. It cannot be merged into frozen-candidate validation or used to rewrite the candidate set.\n- Every frozen candidate exposed by the cross-instrument comparison must use the K200-style rank button and open its own target-instrument per-trade review in a new tab. The rank heading is role-neutral `排名`, and the button text is only `#N`. Every displayed source, source-test, and target total-return cell uses the same blue-button treatment and opens that role's per-trade evidence in a new tab. File-backed source instrument, source interval, target instrument, and target interval selectors plus global and composable field filters cover every displayed column. Its return-view control switches ranking and displayed source/target total return, median trade, maximum drawdown, and win rate between cost-adjusted and gross modes; adjusted mode is default. Long candidate-source and `combo_id` fields remain hidden. The source-return hover help must disclose material interval differences. The cumulative stable entry remains a presentation-only navigation shell that embeds the immutable snapshot and links to the comparison page.\n\n- V4.4 is an in-sample research version; no leader is an accepted parameter.\n- Every parameter-exploration task must read and follow `PARAMETER_EXPLORATION_GUIDE.en.md`.\n- Use the frozen instrument cost model for each future campaign. It derives notional from reference price times point value, then converts commission, slippage, and any FX into round-trip bps. Raw compute keeps `entry_slippage=0` and unchanged fills/returns. Historical K200 cost views remain preserved and must not be overwritten.\n- Declare one mode before every campaign: `transfer_exact`, `target_local_refinement`, `continuation_search`, or `fresh_search`. Transfer candidates are frozen before target evidence and must exactly equal the plan coordinates; target refinement requires a completed same-target transfer plus a machine-validated neighborhood; continuation requires a completed same-instrument, same-lineage parent; fresh search imports neither source candidates nor a parent and binds the current exploration guide.\n- Transfer source and target data must share the current 15-second strategy granularity. Profile, preparation-manifest, and observed-grid disagreement stops the campaign before compute.\n- A schema-v5+ profile with no scenario set has no scenario qualification. It cannot inherit K200 `event_01` or `event_02`.\n- Entry qualification requires positive baseline, drop, and threshold values. The 2026-08-05 P0-8 correction retired the prior active K200 campaign because 4,383 of 4,704 coordinates contained at least one zero-baseline/zero-drop entry. The retired bytes remain recoverable historical evidence; the complete 4,704-coordinate set was rerun and later compatible additions now form one 4,732-coordinate result-semantics lineage.\n- Keep rankings instrument- and major-version-lineage-specific. Later V4.4 K200 rounds remain in the accepted V4.4 cumulative ranking even after minor engine or preparation corrections. Stage hashes and semantic identities remain provenance, not ranking partitions. Target-instrument ranks are separate; cross-instrument comparison may display both without combining ranks.\n- Judge improvement across several metrics without a fixed aggregate score or a permanent high-weight metric. The model must explain gains, regressions, trade-offs, concentration, neighborhood stability, and uncertainty. Gap-excluded return remains display-only dependency evidence and cannot decide ranking, qualification, or continuation by itself.\n- W uses available prefixes 1..W and exact `w_open_to_end_low_drop`; do not reinterpret it as full-W-only or internal maximum ordered decline.\n- Pending entry is retained-signal `fill_first_real_open` within 120 continuous candidate bars; do not add recross or structural cancellation.\n- Raw compute must use a reviewed, hash-bound plan and an explicit user instruction.\n- Generated review pages must reuse the fixed historical main/trade templates and local Plotly asset.\n- Interpret only immutable completed results; do not interpret partial batches.\n- Build the active multi-round cumulative from completed stages in the accepted V4.4 K200 ranking lineage. Preserve the retired pre-repair campaign and other campaigns as separate historical evidence. Minor V4.4 identity differences are recorded per stage and do not split the cumulative rank.\n- Broad and refinement branches remain separately motivated. Continue only from closed-round evidence; lack of eligible improvement stops that branch.\n- Large time parameters use relative search resolution. Continued single-digit absolute-step densification of E, BH, or S is treated as overfitting. Use the guide's multiplicative broad, local, and stability grids; the finest grid checks stability only.\n- Exploration alternates phases in a repeating AI-led cycle: multi-round leap search across nonadjacent legal regions, finite one-parameter grids around promising nonadjacent anchors, then renewed leap search. Individual rounds may be phase-specific; no local-grid phase can establish global convergence.\n- Each grid block changes exactly one parameter and keeps every other field fixed. There is no fixed point-count cap; finite bounds, steps, anchor, and expected coordinate count are frozen before compute. Leap and grid evidence remain separately identified across the cycle.\n- User observation and correction occur between cycles or at requested checkpoints. Autonomous rounds while the user is unavailable remain inside the authorized time, instrument, method, data, and resource boundary.\n- Historical stop decisions remain historical evidence. Current or future work follows the latest user authorization, its explicit mode, instrument profile, evidence-led design, and separately hash-bound plan.\n- Preserve existing stage pages as historical evidence. Intermediate continuation rounds require immutable raw closure and compact summaries but no HTML publication. Publish the shared cumulative main and per-trade entries once after the exploration series ends, or earlier only on explicit user request.\n- One executor or multiple executors may perform evidence analysis, raw compute, and the final HTML publication. Intermediate rounds may proceed after immutable raw closure without waiting for HTML because no publication is scheduled. The final publication uses exactly one cumulative publisher.\n- A delivery finding that affects result semantics pauses new compute until another source identity closes. Presentation-only findings preserve immutable raw evidence but still require corrected derived delivery.\n- K200 continuation work remains in the accepted V4.4 K200 major-version lineage until a V4.5 update is explicitly adopted. Every later K200 round still requires the guide's multi-metric delivered interpretation, recorded reasons, exact anti-join, and a reviewed hash-bound plan. A different instrument uses a separate lineage.\n- Every closed exploration round creates a standalone handoff directory with expanded, unique next-round coordinates in `next_round_parameters.csv`; the CSV must pass completed+active+pending anti-join before plan binding.\n","modified":"2026-08-07T21:01:16.559Z","missing":false},{"id":"research.zh","pair":"research","group":"domain","path":"05_domains/research/RESEARCH_CONSTRAINTS.zh.md","lang":"zh","title":"研究约束","lead":"研究问题、方法、证据边界、可复现与解释规则。","policy":"已确认方法、证据边界、可复现规则或解释约束变化后更新。","markdown":"# 研究约束\n\n- 跨品种验证必须在运行目标品种前，仅依据原品种证据冻结候选。冻结记录必须包含参数、原品种筛选条件、原品种指标、生成时间、实现／数据身份与规范内容哈希。目标品种结果只能评价，永远不能修改候选记录。\n- 同品种时间迁移只有在读取下一时间片以前冻结候选，才可以按连续时间片调整。已经闭合的更早时间片可以影响后续冻结；最新声明的时间片保留为最终留出。完整后续区间重放必须标记为事后描述，不能再次声称为独立验证。\n- 滚动指标可以使用声明的测试前预热，但报告的逐笔只限于目标测试区间内产生的开仓。时区、交易所时段、连续合约换月、gap、synthetic 与低活动政策都是必审字段。\n- 跨品种表格以参数字段开始，随后依次排列目标品种指标、原品种指标与迁移诊断字段。迁移比较使用百分比或 bps，同时保留原始价格点数供单品种检查。不建立综合分数。\n- 任何目标品种全网格运行都必须作为单独标注的事后诊断，使用独立文件和页面状态。它不能混入冻结候选验证，也不能改写候选集。\n- 跨品种对比展示的每个冻结候选都必须使用 K200 风格排名按钮，并在新标签页打开自己的目标品种逐笔分析。排名表头使用与角色无关的「排名」，按钮文字只显示「#N」。所有展示的原品种、原品种测试期和目标品种总收益单元格都使用相同蓝色按钮样式，并在新标签页打开该角色的逐笔证据。文件驱动的原品种、原区间、目标品种和目标区间选择器，以及全文与可叠加字段筛选，覆盖每个展示列。收益口径控件在成本后与毛收益之间同步切换排名，以及原品种／目标品种的总收益、中位单笔、最大回撤和胜率；默认采用成本后口径。冗长候选来源与 `combo_id` 字段继续隐藏。原品种收益悬停说明必须披露重要的区间差异。累计稳定入口保持为嵌入不可变快照并链接对比页的纯展示导航壳。\n\n- V4.4 是样本内研究版本；任何领先坐标都不等于参数被接受。\n- 每次参数探索都必须阅读并遵守 `PARAMETER_EXPLORATION_GUIDE.en.md`。\n- 每个后续 campaign 使用冻结的品种成本模型。名义价值按参考价乘以 point value 推导，再把手续费、滑点与必要汇率转换为往返 bps。原始运算保留 `entry_slippage=0` 以及原有成交／收益；历史 K200 成本视图继续保留，不得覆盖。\n- 每个 campaign 在开始以前声明一种模式：`transfer_exact`、`target_local_refinement`、`continuation_search` 或 `fresh_search`。迁移候选要在读取目标证据以前冻结并与 plan 坐标完全相同；目标局部细化需要相同目标品种的已完成迁移与机器验证邻域；续探需要同品种、同谱系的已完成父阶段；全新搜索不导入源候选或父阶段，并绑定当前探索指南。\n- 迁移源品种与目标品种必须共享当前 15 秒策略颗粒度。profile、数据准备清单与实际数据网格不一致时，campaign 在计算以前停止。\n- schema-v5+ 品种配置没有 scenario set 时表示无情景资格，不能继承 K200 的 `event_01` 或 `event_02`。\n- 开仓资格要求 baseline、drop 与 threshold 都为正值。2026-08-05 的 P0-8 修正使旧 K200 活动 campaign 退出当前权威，因为 4,704 个坐标中有 4,383 个至少包含一笔零 baseline／零 drop 开仓。旧字节继续作为可恢复历史证据保留；完整 4,704 坐标已经重新运算，后续兼容新增结果共同形成单一的 4,732 坐标结果语义谱系。\n- 排名按品种与大版本谱系隔离。后续 V4.4 K200 轮次即使包含小幅引擎或数据准备修正，也继续进入已接受的 V4.4 累计排名。阶段哈希与语义身份保留为来源证据，不作为排名分区。目标品种使用独立名次；跨品种比较可以并列展示，但不合并名次。\n- 改善采用多指标判断，不使用固定综合分数，也不给任何指标设置长期高权重。模型必须解释改善、恶化、取舍、收益集中度、邻域稳定性与不确定性。排除跨 gap 收益只作为展示和依赖性证据，不能单独决定排名、资格或是否继续研究。\n- W 使用 1 到 W 的可用前缀与精确 `w_open_to_end_low_drop`；不得解释为必须完整 W 或窗口内部最大有序下跌。\n- pending entry 采用 120 根连续候选 bar 边界内的保留信号 `fill_first_real_open`；不得增加再穿越或结构取消。\n- 原始运算必须使用经过审阅、绑定哈希的计划，并取得用户明确指令。\n- 逐笔页面必须复用固定历史总入口／逐笔模板与本地 Plotly。\n- 只解释不可变完结结果，不解释进行中的批次。\n- 当前多轮累计纳入已接受 V4.4 K200 排名谱系中的已完成阶段。修复前已退出权威的 campaign 与其他 campaign 作为独立历史证据保留。V4.4 内的小幅身份差异按阶段记录，不拆分累计名次。\n- 大范围与局部细化分支分别说明动机。只有完整闭合轮次证据可以授权继续；没有合格改进时停止对应分支。\n- 大时间参数使用相对搜索分辨率。E、BH、S 按个位数绝对步长持续加密，视为过拟合；粗搜索、局部搜索与稳定性检查使用指南规定的乘法网格，最细网格只检查稳定性。\n- 探索采用反复循环的 AI 主导阶段：对互不相邻的合法区域开展多轮跳跃搜索，围绕互不相邻的优秀锚点做有限单参数网格，随后再次开展跳跃搜索。单轮可以只属于一个阶段；局部网格阶段不能证明整个参数空间已经收敛。\n- 每个网格区块固定其余字段，只测试一个参数。网格不设固定点数上限，但运算前必须冻结有限边界、步长、锚点和预计坐标数。跳跃与网格证据在完整循环中分别标记。\n- 用户在循环之间或指定检查点查看并修正。用户暂时不在线时，自主轮次不得超出已授权的时间、品种、方法、数据和资源边界。\n- 历史停止决定继续作为历史证据保留。当前与后续工作遵循用户最新授权、明确模式、品种配置、证据驱动设计和独立哈希绑定计划。\n- 已有阶段页面作为历史证据保留。中间 continuation 轮需要不可变原始闭合与小型汇总，但不发布 HTML。整组探索结束后生成一次共享累计总入口与逐笔入口；只有用户明确要求时才提前发布。\n- 一个执行者或多个执行者均可完成证据分析、原始运算与最终 HTML 发布。中间轮不可变原始闭合后即可继续，无需等待 HTML，因为不会安排发布。最终发布只使用一个累计发布者。\n- 交付发现影响结果语义的问题时，新的运算暂停，直到另一个源码身份闭合。纯展示问题保留不可变原始证据，但仍需修正衍生交付。\n- K200 continuation 工作在明确采用 V4.5 以前，继续进入已接受的 V4.4 K200 大版本谱系。任何后续 K200 轮次仍需指南要求的多指标已交付解释、已记录理由、精确反连接和经审阅的哈希绑定计划。其他品种使用独立谱系。\n- 每个已闭合探索轮次都要建立独立交付文件夹，用 `next_round_parameters.csv` 保存完整展开且唯一的下一轮坐标；CSV 通过 completed+active+pending 反连接后才能绑定计划。\n","modified":"2026-08-07T21:01:16.560Z","missing":false},{"id":"parameter-exploration-guide.en","pair":"parameter-exploration-guide","group":"domain","path":"05_domains/research/PARAMETER_EXPLORATION_GUIDE.en.md","lang":"en","title":"Parameter Exploration Guide","lead":"Mandatory trade diagnosis, experiment-block design, multi-metric judgment, and next-round CSV handoff rules.","policy":"Read for every parameter exploration; update when an accepted diagnosis, improvement, experiment-block, or CSV-handoff rule changes.","markdown":"# Parameter Exploration Guide\n\n## Mandatory reading\n\nBefore an agent designs, runs, or interprets a parameter exploration, or prepares the next-round coordinates, it must read and follow this guide together with the current project constraints, research constraints, experiment progress, source identity, and latest complete evidence.\n\nThis guide turns trade-level observations into testable parameter hypotheses and defines how each round assesses improvement, records evidence, and hands off the next coordinates. It does not change the accepted V4.4 execution and signal contracts.\n\n## 1. Fixed research boundary\n\n- V4.4 remains in-sample research; no leader is an accepted parameter.\n- Research cost comes from the campaign's frozen instrument cost model. It applies only to derived analysis; raw compute keeps `entry_slippage=0`, raw fills, and raw returns unchanged. Historical K200 rows retain their existing cost reference.\n- Do not use a fixed aggregate score or assign any metric a permanent high weight.\n- Gap-excluded return remains a display and dependency-audit field. It cannot independently rank, filter, qualify, or authorize continuation.\n- Interpret only complete `IMMUTABLE_CLOSED` evidence, never partial batches.\n- Ordinary parameter exploration preserves the current method contract. Direction efficiency, micro-new-low reset, trigger fill, gap policy, synthetic fill, W definition, and pending-entry policy changes are method variants that require separate user authorization and a new closed source identity.\n\n### Choose the campaign mode\n\n- `transfer_exact`: freeze source candidates before target execution and prohibit target-driven tuning.\n- `target_local_refinement`: require a completed exact-transfer parent and a frozen bounded neighborhood.\n- `continuation_search`: continue from a completed same-instrument, same-lineage parent while retaining broad, local, diagnostic, and stability evidence rules.\n- `fresh_search`: specify an instrument, import no source candidates or parent stage, bind this guide, and start with instrument-appropriate broad coverage.\n\nAll transfer modes preserve the source strategy's 15-second data granularity. A target using another granularity is outside the current strategy contract and must stop for user review.\n\nRead `project_management\\20_campaigns\\CAMPAIGN_WORKFLOW.en.md` for the full workflow and short prompt forms. A mode cannot change after target evidence is read.\n\n## 2. How trade observation begins\n\nEarly exploration may sample trades randomly to learn how the strategy enters, holds, and exits across market states. Include profitable and losing trades, varied holding periods and exit reasons, and trades involving gaps, synthetic data, or low activity.\n\nAfter some parameter combinations earn meaningful cost-adjusted returns, increasingly inspect those combinations for remaining improvement opportunities. Keep a random control sample so unfamiliar failure modes can still surface.\n\nFor a high-return trade, ask whether entry was late, exit was early or late, open profit was surrendered, results depended on gaps/synthetic data/idealized fills, the trade survives entry-parameter changes, or a few trades dominate the result.\n\nFor a losing trade, ask whether the decline was too weak, the baseline too low, the decline too slow, a strong opposite move preceded entry, rebound exit was too wide, speed exit was repeatedly reset by tiny new lows, or the loss came from signal quality, timing, or fill assumptions.\n\nA single trade produces a hypothesis only. Parameter changes require type-level and portfolio-level evidence.\n\n## 3. Classify trades into diagnostic types\n\nAssign each important trade to one or more diagnostic types, then locate all similar trades.\n\n| Diagnostic type | Typical evidence | Existing parameters to study | Separate method-version ideas |\n| --- | --- | --- | --- |\n| Weak-decline false entry | Low decline magnitude and speed, no continuation | K, E, A/floor | Direction-efficiency filter |\n| Baseline too low | Low-activity period, small decline triggers | BH, TRW, A/floor | New activity filter |\n| Entry too late | Most decline completes before the signal | E, K | New trigger fill |\n| Rebound exit too early | New low follows soon after exit | W, M | New rebound baseline |\n| Speed exit too early | Sideways pause precedes another decline | S | New speed-exit definition |\n| Speed exit too late | Little progress followed by reversal | S | Micro-new-low reset rule |\n| Excess profit giveback | Large MFE, small realized return | W, M, S | Structural exit |\n| Gap-dependent | Most profit comes from a market closure jump | Robustness audit | Gap policy |\n| Synthetic-related | Signal or fill depends on filled data | Baseline-sampling audit | Fill policy |\n| Concentrated return | A few trades dominate total return | Trade-type and neighborhood checks | Usually no method change |\n\nFor each type, compare count, aggregate and median cost-adjusted return, win rate, drawdown contribution, MFE, MAE, MFE retention, and retained/disappeared/new trades after a parameter change.\n\n## 4. Maintain anchor-trade diagnostics\n\nMaintain a complete trade catalog for representative anchor combinations. Anchors may include profitable candidates, centers of stable regions, or informative failed combinations; they are not limited to the highest-return point.\n\nAt minimum calculate gross and instrument-cost-adjusted trade return, MFE, MAE, MFE retention, time to a new low after entry, new lows 30/60/120 minutes after exit, actual signal-window length, baseline/drop/ratio, gap/synthetic/low-activity participation, contribution to total return and maximum drawdown, and portfolio results after removing the best one and two trades.\n\nList at least the top 10 return contributors, 10 largest losses, 10 largest profit givebacks, 10 greatest post-exit continuations, major drawdown contributors, and all relevant gap/synthetic/low-activity trades.\n\nDiagnostics may run in the same round as parameter compute; they do not require a dedicated diagnostic-only round.\n\n## 5. Run exploration as a repeating AI-led cycle\n\nParameter exploration alternates two purposes. Leap search samples nonadjacent legal regions away from current leaders so promising combinations are less likely to be missed. Evidence-led grid search starts from promising, mutually nonadjacent anchors, changes exactly one parameter per grid, and tests whether return quality or maximum drawdown improves.\n\nThe operating cycle is: AI performs one or more leap-search rounds, selects promising nonadjacent anchors from closed multi-metric evidence, performs one or more finite one-parameter grid rounds around those anchors, then returns to leap search. Individual rounds may belong to only one phase. Every report records the phase and keeps leap and grid evidence separate. A local-grid phase cannot support a claim of global convergence.\n\nThe user observes summaries and may correct the objective, anchors, ranges, metrics needing emphasis, or search direction between cycles. When the user is temporarily unavailable, AI may continue multiple rounds only within the already authorized duration, instrument, method, data, and resource boundary. A requested method change, new data identity, new instrument authority, or materially wider scope pauses for user confirmation.\n\nLeap jumps, single-axis grids, supported module pairs, trade-type experiments, and stability checks may coexist when each block has its own question and evidence. Module pairs do not replace a declared one-parameter grid phase.\n\n### Broad-jump block\n\nLeap-search rounds evaluate and normally retain broad-jump coordinates outside the current leading neighborhood. Report them separately from local grids. Failure of one leap block stops that block only.\n\n### One-axis directional batch\n\nChoose one of E, BH, TRW, K, A/floor, W, M, or S and hold every other parameter fixed. Test a declared finite scale-aware grid in one parameter direction and keep the current anchor as the comparison row. There is no fixed point-count cap. This applies equally to time windows and threshold multipliers.\n\n- If the closed grid shows a useful and reasonably consistent direction, the next grid may continue farther or refine a supported interval.\n- If results deteriorate, behave abnormally, or fail to support the hypothesis, stop that direction, return to the anchor, and test the opposite direction or another parameter.\n- Do not combine parameters or densify around one value until a closed directional grid supports doing so.\n- User-supplied legal values take precedence; otherwise use Section 5A's scale-aware steps.\n\nThis rule creates an experiment block but does not authorize compute by itself. A run still requires user authorization and a reviewed plan.\n\n### Same-module pair block\n\nCombine only parameter pairs supported by diagnostic evidence, such as E × K, BH × K, TRW × K, A × K, W × M, M × S, or W × S. Do not build a full joint grid across every entry and exit dimension.\n\n### Trade-type block\n\nChange parameters for a named diagnostic type and list filtered, retained, new, and disappeared trades. Assess both the target type and the global trade set.\n\n### Stable-region block\n\nUse smaller steps around candidates to find neighboring parameter regions with similar behavior. A stable region has more research value than one isolated maximum.\n\n## 5A. Scale search resolution to parameter magnitude\n\nDo not routinely refine large time parameters with fixed single-digit absolute steps. In this project, continued single-digit densification of E, BH, or S is treated as overfitting: moving a parameter by a few bars around a large anchor adds in-sample selection freedom without representing a comparable economic change. Scale the search step to the current anchor instead.\n\n| Parameter | Broad search | Local search | Finest check |\n| --- | --- | --- | --- |\n| E, BH, S | 20%–30% of the anchor | About 10% | About 5%; stability check only |\n| TRW, W | 1–2 bars, or about 10%–25% | 1 bar | Usually no finer search |\n| K, M | 10%–20% | 5%–10% | 2.5%–5%; stability check only |\n| A/floor | Set from tick size, a baseline ratio, or historical quantiles | Change on an economically meaningful scale | Do not densify with arbitrary decimals |\n\nEach one-axis directional batch contains the unchanged anchor and a finite set of new scale-aware points. There is no fixed point-count cap. Before compute, record the finite lower and upper bounds, step schedule or exact values, and expected coordinate count. Fast compute supports broader grid evidence; it does not justify one-point chasing, unbounded densification, or repeated reuse of completed coordinates.\n\nUse a multiplicative grid for large time parameters. Do not switch step rules abruptly at an arbitrary absolute boundary such as 100. Around anchor `x`, use:\n\n- Broad search: `0.70x`, `0.85x`, `1.00x`, `1.20x`, `1.50x`.\n- Local search: `0.90x`, `1.00x`, `1.10x`.\n- Stability check: `0.95x`, `1.00x`, `1.05x`.\n\nAn explicit legal step schedule supplied by the user overrides these defaults. Record that schedule in the frozen block definition and preserve every other coordinate field when the task is a one-axis contraction challenge.\n\nWhen a proportional value must map back to discrete bars, round it to the parameter's legal unit, remove duplicates, and run the exact completed+active+pending anti-join. The finest check only tests whether the neighborhood is continuous and the ordering is stable. A leader that depends on one exact single-digit bar location, or disappears within the 5% neighborhood, must be marked as high overfitting risk and must not justify further step reduction.\n\n### Return to leap search after local grids\n\nThe parameter space is high-dimensional and its legal bounds are broad. After a finite local-grid phase closes, return to leap search across under-sampled directions, legal regions away from incumbents, or alternative hypotheses that compete with the current explanation.\n\nThere is no permanent quota for leap-search coordinates. Each plan states their count, coverage, selection reason, and distinction from grid refinement. Several consecutive grid rounds are allowed when closed evidence supports them, but the campaign must label the phase and cannot treat local success or failure as global convergence.\n\n## 6. Attribute entry and exit changes separately\n\nFor entry problems, prefer E, BH, TRW, K, and A/floor. For exit problems, prefer W, M, and S.\n\nThis is an attribution rule, not a fixed round schedule. Entry, exit, and broad blocks may coexist, but each block needs an independent hypothesis. Limit large cross-module searches until a direction is supported; use small interaction sets when evidence exists.\n\n## 7. Define each block before compute\n\nRecord the question, diagnostic type, range, step, coordinate source, expected behavior change, supporting and falsifying outcomes, metrics to inspect, minimum trade count, evidence boundary, neighborhood check, gap/synthetic/idealized-fill disclosure, and conditions for widening, refining, observing, or stopping the block.\n\nFreeze these statements before viewing new results.\n\n## 8. Judge improvement across multiple metrics\n\nThe model must not assign a permanent high weight to one metric or replace research judgment with a fixed score.\n\nEach decision reviews cost-adjusted total return, median cost-adjusted trade, maximum drawdown, win rate, trade count, MFE/MAE/MFE retention, return concentration, neighboring parameters, the target diagnostic type, retained/disappeared/new trades, gap/synthetic/low-activity dependency, and whether improvement exists only at an isolated point.\n\nThe round question determines which evidence is most informative for that hypothesis. Total return is always reported but has no automatic priority.\n\nClassify the result as `improved`, `mixed`, `not_improved`, or `uncertain`, and state which metrics improved, which worsened, whether a few trades caused the gain, the trade-offs, why the classification is justified, and what supports further exploration.\n\nPareto comparison may identify non-dominated candidates, but it does not mechanically replace model judgment.\n\n## 9. Validation-data boundary\n\nCurrent work uses training data. If validation or holdout data is introduced later, freeze candidates, ranges, and decision rules before viewing it. Validation evaluates frozen candidates; it cannot be reused to generate new parameters repeatedly.\n\n## 10. Required round interpretation\n\nRecord experiment mode, instrument profile, experiment blocks and hypotheses, coordinates and evidence sources, gross and stage-bound cost-adjusted results, retained/disappeared/new trades for important types, MFE/MAE/profit retention/post-exit continuation, return and drawdown concentration, neighborhood stability, gap/synthetic/low-activity dependency, the multi-metric improvement classification, each block's widen/refine/observe/stop decision, and `parameter_acceptance=none`.\n\n## 11. Deliver next-round parameters as CSV\n\nAt the end of every exploration round, create a separate handoff directory whose core file is `next_round_parameters.csv`. Each row is one complete coordinate intended for the next run; do not store only a Cartesian-product definition.\n\nRequired columns:\n\n| Column | Meaning |\n| --- | --- |\n| `candidate_id` | Unique ID inside the proposal |\n| `experiment_block` | Owning experiment block |\n| `search_mode` | `broad_jump`, `single_axis`, `module_pair`, `trade_type`, or `stability` |\n| `anchor_combo_id` | Source anchor; blank for independent broad jumps |\n| `diagnostic_type` | Target trade type |\n| `hypothesis` | Question being tested |\n| `method` | Fixed method |\n| `baseline_sampling_policy` | Baseline sampling policy |\n| `e`, `bh`, `trw`, `k`, `abs_floor_value`, `w`, `m`, `speed_window_bars` | Complete coordinate |\n| `cost_bps` | Exact round-trip bps from the frozen instrument cost model |\n| `expected_behavior_change` | Expected trade-behavior change |\n| `evidence_summary` | Current-round evidence |\n| `selection_reason` | Model's reason for selecting the coordinate |\n| `source_round` | Evidence round |\n| `status` | `proposed_for_next_round` |\n\nThe CSV must contain expanded unique coordinates, distinguish broad and local blocks, trace every row to a hypothesis, and pass an exact anti-join against completed, active, and pending coordinates. It is a research handoff; compute still requires a reviewed, hash-bound execution plan. If no next round is supported, deliver a header-only CSV and record the stop reason in the interpretation.\n\n## 12. Agent checklist for every round\n\n1. Read this guide and the current authorities.\n2. Confirm source identity, instrument profile, experiment mode, ranking lineage, completed coordinates, and frozen cost model.\n3. Use random trade observation early; as profitable candidates emerge, inspect their remaining improvement opportunities while retaining a random control sample.\n4. Classify important trades instead of tuning around one trade.\n5. Consider several improvement paths without assigning a permanent high weight to any metric.\n6. Let the round question determine which metrics need more explanation, and record trade-offs.\n7. Label every round as leap search or grid refinement, follow the cycle sequence, and return to nonadjacent leap coverage after a supported finite grid phase; do not infer global convergence from local grids.\n8. For one parameter direction, run a declared finite scale-aware grid with every other parameter fixed; continue, refine, widen, stop, or change direction only after the complete closed grid pattern is interpreted.\n9. Prefer entry parameters for entry problems and exit parameters for exit problems; require evidence for cross-module coordinates.\n10. Freeze hypotheses, coordinates, evidence boundaries, and falsification conditions before compute.\n11. Use a reviewed hash-bound plan and pass uniqueness plus completed/active/pending anti-join checks.\n12. Pass source, output-root, process, lock, memory, and validate-only gates.\n13. Interpret only `IMMUTABLE_CLOSED` evidence. Invalid closure, nonfinite evidence, or unattributable results do not advance.\n14. Compare new, retained, and disappeared trades; inspect return concentration and neighborhood stability.\n15. Issue an `improved`, `mixed`, `not_improved`, or `uncertain` classification with reasons.\n16. Stop a block without eligible improvement; other blocks and broad exploration may continue.\n17. Create the standalone handoff directory, write expanded `next_round_parameters.csv`, and complete its anti-join.\n18. Defer cumulative main and per-trade HTML during intermediate rounds. After the exploration series ends, publish them once with `DELIVERY_FINAL`; publish earlier only on explicit user request.\n19. Pause new compute if delivery finds a result-semantic source issue; wait for another closed source identity.\n20. Keep `parameter_acceptance=none`.\n","modified":"2026-08-05T21:51:11.096Z","missing":false},{"id":"parameter-exploration-guide.zh","pair":"parameter-exploration-guide","group":"domain","path":"05_domains/research/PARAMETER_EXPLORATION_GUIDE.zh.md","lang":"zh","title":"参数探索指南","lead":"每次参数探索必须遵守的交易诊断、实验块、多指标判断与下一轮 CSV 交付规则。","policy":"每次参数探索都要阅读；已确认诊断、改善、实验块或 CSV 交付规则变化后更新。","markdown":"# 参数探索指南\n\n## 强制读取\n\n任何 agent 在设计、运行、解释参数探索，或整理下一轮参数前，都必须阅读并遵守本指南，同时读取当前项目约束、研究约束、实验进度、来源身份和最近一轮完整证据。\n\n本指南负责把逐笔观察转成可检验的参数假设，并规定每轮研究如何判断改善、如何留下证据、如何交付下一轮坐标。它不改变 V4.4 已确认的成交和信号规则。\n\n## 1. 固定研究边界\n\n- V4.4 仍是样本内研究；任何领先组合都不等于参数被接受。\n- 每笔完整往返交易的研究成本来自 campaign 冻结的品种成本模型。该成本只用于衍生分析；原始运算保持 `entry_slippage=0`，原始成交和原始收益不变。历史 K200 行保留现有成本参考。\n- 不使用固定综合分数，也不为任何指标设置长期高权重。\n- 排除跨 gap 收益保留为展示和依赖性审计字段，不能单独决定排序、筛选、资格或是否继续研究。\n- 只解释 `IMMUTABLE_CLOSED` 的完整结果，不解释部分批次。\n- 普通参数探索保持当前方法契约。方向效率、微小新低重置、trigger fill、gap policy、synthetic fill、W 定义或 pending-entry policy 的改变属于方法变体，需要用户另行授权并闭合新的源码身份。\n\n### 选择 campaign 模式\n\n- `transfer_exact`：在目标运算以前冻结源候选，并禁止使用目标结果调参。\n- `target_local_refinement`：需要已完成的完整迁移父实验与冻结的有限邻域。\n- `continuation_search`：从同品种、同谱系的已完成父阶段继续，并保留广度、局部、诊断与稳定性证据规则。\n- `fresh_search`：指定品种，不导入源候选或父阶段，绑定本指南，并从适合目标品种的大范围覆盖开始。\n\n所有迁移模式都保持源策略的 15 秒数据颗粒度。目标使用其他颗粒度时超出当前策略协议，必须停止并交由用户确认。\n\n完整流程与简短指令格式见 `project_management\\20_campaigns\\CAMPAIGN_WORKFLOW.en.md`。读取目标证据以后不能改变模式。\n\n## 2. 单笔观察怎样开始\n\n探索初期可以随机抽取交易，目的是看清策略在不同市场状态下怎样开仓、持仓和平仓。随机样本应覆盖盈利、亏损、不同持仓时长、不同退出原因，以及 gap、synthetic、低活动时段相关交易。\n\n当若干参数组合已经获得一定成本后收益，观察重点逐渐移向这些组合，寻找仍有改善空间的交易。随机抽查继续保留，用来发现当前诊断框架遗漏的问题。\n\n观察高收益交易时，检查：\n\n- 入场是否过晚，前段下跌是否已经错过？\n- 平仓是否过早，后续下跌是否仍在延续？\n- 平仓是否过晚，已经获得的浮盈是否大量回吐？\n- 收益是否依赖 gap、synthetic 数据或理想化成交？\n- 调整开仓参数后，这笔交易是否仍然存在？\n- 收益是否过度集中在这一笔或少数几笔交易？\n\n观察亏损交易时，检查：\n\n- 下跌幅度是否不足，却因 baseline 太低而触发？\n- 下跌速度是否太慢？\n- 入场前是否刚出现强烈反向上涨？\n- 回撤退出是否太宽？\n- 速度退出是否被微小新低反复重置？\n- 提高开仓阈值能否过滤这一类交易，同时保留真正的大跌交易？\n- 亏损来自信号质量、入场时机、退出时机，还是成交假设？\n\n单笔观察只产生假设。是否改参数，要看同类交易和全局结果。\n\n## 3. 把单笔归入交易类型\n\n重点交易需要归入一个或多个诊断类型，再搜索全部相似交易。\n\n| 交易类型 | 典型特征 | 可研究的现有参数 | 需要独立方法版本的方向 |\n| --- | --- | --- | --- |\n| 弱下跌误开仓 | 下跌幅度和速度低，后续没有延续 | K、E、A／floor | 方向效率过滤 |\n| Baseline 过低 | 低活动时段，小幅下跌也触发 | BH、TRW、A／floor | 新活动度过滤 |\n| 入场过晚 | 信号成立前已经完成大部分下跌 | E、K | 新 trigger fill |\n| 回撤退出过早 | 平仓后很快继续创新低 | W、M | 新回撤基准定义 |\n| 速度退出过早 | 横盘后仍继续明显下跌 | S | 新速度退出定义 |\n| 速度退出过晚 | 长时间不推进，随后反转 | S | 微小新低重置规则 |\n| 浮盈回吐过多 | MFE 很大，实际收益偏小 | W、M、S | 结构退出 |\n| Gap 依赖 | 主要收益来自休市跳空 | 参数稳健性审计 | Gap policy |\n| Synthetic 相关 | 信号或成交依赖填充数据 | Baseline sampling 审计 | Fill policy |\n| 收益集中 | 总收益主要来自极少数交易 | 交易类型与邻域检查 | 通常无需改方法 |\n\n每类交易至少比较：数量、成本后收益合计和中位数、胜率、最大回撤贡献、MFE、MAE、MFE 保留率，以及参数变化后保留、消失和新增的交易。\n\n## 4. 建立锚点交易诊断\n\n每个探索阶段都维护代表组合的完整逐笔目录。锚点可以来自当前表现较好的组合、稳定区域中心或有对照价值的失败组合，不限于收益最高的单点。\n\n逐笔诊断至少计算：\n\n- 毛收益和按品种成本模型计算的成本后收益；\n- MFE、MAE 和 MFE 保留率；\n- 入场后多久创新低；\n- 平仓后 30、60、120 分钟是否继续创新低；\n- 信号窗口实际长度；\n- baseline、drop 和 ratio；\n- gap、synthetic 和低活动数据参与情况；\n- 每笔交易对总收益和最大回撤的贡献；\n- 去掉收益最高 1 笔、2 笔后的组合结果。\n\n诊断报告至少列出：收益贡献最高的 10 笔、亏损最大的 10 笔、浮盈回吐最大的 10 笔、平仓后继续下跌最多的 10 笔、最大回撤贡献交易，以及 gap、synthetic、低活动相关交易。\n\n诊断可以和参数运算处于同一轮，无需占用固定的「诊断轮」。\n\n## 5. 采用 AI 主导的循环探索\n\n参数探索交替承担两个目的。跳跃搜索检查远离当前领先组合、互不相邻的合法区域，降低遗漏潜在组合的概率；有证据支持的网格搜索从互不相邻的优秀锚点出发，每个网格只改变一个参数，观察收益质量或最大回撤能否改善。\n\n工作循环为：AI 完成一轮或多轮跳跃搜索，根据闭合的多指标证据选择互不相邻的优秀锚点，围绕这些锚点完成一轮或多轮有限单参数网格，随后回到跳跃搜索。单轮可以只属于一个阶段。每份报告都标明阶段，并分开保存跳跃与网格证据。局部网格阶段不能用来声称整个参数空间已经收敛。\n\n用户在循环之间查看摘要，并可修正目标、锚点、范围、需要重点解释的指标或搜索方向。用户暂时不在线时，AI 只能在已经授权的时长、品种、方法、数据和资源边界内连续完成多个轮次。方法变化、新数据身份、新品种授权或明显扩大的范围需要用户确认。\n\n跳跃式大跨度、单参数网格、有证据支持的双参数、交易类型和稳定区域实验仍可并存，各块分别说明问题和证据。双参数区块不能取代明确的单参数网格阶段。\n\n### 大跨度跳跃块\n\n跳跃搜索轮次应评估并原则上保留大跨度坐标：\n\n- 搜索当前领先区域之外的位置；\n- 覆盖锚点两侧较远的参数值；\n- 与局部细化分开统计和解释；\n- 该块没有改善时，只停止该块，不牵连其他研究方向。\n\n### 单轴方向网格\n\n从 E、BH、TRW、K、A／floor、W、M、S 中选择一个参数，其余参数全部固定。在声明的一个方向上测试有限的尺度网格，并保留当前锚点作为对照。点数不设固定上限。时间窗口与倍率阈值都遵守这条规则。\n\n- 完整闭合网格显示出有用且较一致的方向时，下一轮网格可以沿该方向扩大，或细化得到支持的区间。\n- 结果恶化、异常或不支持假设时，停止该方向，回到锚点，改测反方向或另一个参数。\n- 一个方向的闭合网格形成支持以前，不组合多个参数，也不围绕单个数值加密。\n- 用户给出的合法值具有更高优先级；没有指定值时使用第 5A 节的尺度步长。\n\n本规则形成实验块，但本身不授权运算。运行仍需用户授权与经审阅计划。\n\n### 同模块双参数块\n\n只组合有诊断依据的参数，例如 E × K、BH × K、TRW × K、A × K、W × M、M × S 或 W × S。一次覆盖全部开仓和退出维度会失去归因，不建立七维完整联合网格。\n\n### 交易类型实验块\n\n围绕一种交易类型改变参数，并列出被过滤、保留、新增和消失的交易。既要看这一类交易是否改善，也要看全局交易集合发生了什么变化。\n\n### 稳定区域块\n\n在候选附近缩小步长，寻找相邻参数都接近的区域。稳定区域的研究价值高于孤立最高点。\n\n## 5A. 搜索分辨率必须匹配参数尺度\n\n大时间参数不得用固定个位数步长做常规细化。在本项目中，E、BH、S 按个位数绝对步长持续加密，视为过拟合：围绕较大的锚点移动几根 bar，只会增加样本内选择自由度，却不代表同等幅度的经济变化。搜索步长应随当前锚点按比例变化。\n\n| 参数 | 粗搜索 | 局部搜索 | 最细检查 |\n| --- | --- | --- | --- |\n| E、BH、S | 当前锚点的 20%—30% | 约 10% | 约 5%；只检查稳定性 |\n| TRW、W | 1—2 根 bar，或约 10%—25% | 1 根 bar | 通常无需更细 |\n| K、M | 10%—20% | 5%—10% | 2.5%—5%；只检查稳定性 |\n| A／floor | 按 tick、baseline 比例或历史分位数设定 | 按真实经济尺度变化 | 不用任意小数加密 |\n\n每个单轴方向网格包含不变的锚点和一组有限、符合尺度的新点，不设固定点数上限。运算前记录有限上下界、步长安排或精确取值，以及预计坐标数。快速回测用于取得更完整的网格证据，不能用于逐点追峰、无限加密或重复计算已完成坐标。\n\nE、BH、S 使用乘法网格，不在 100 等任意绝对边界附近突然更换步长规则。围绕锚点 `x` 使用：\n\n- 粗搜索：`0.70x`、`0.85x`、`1.00x`、`1.20x`、`1.50x`。\n- 局部搜索：`0.90x`、`1.00x`、`1.10x`。\n- 稳定性检查：`0.95x`、`1.00x`、`1.05x`。\n\n用户明确给出的合法步长覆盖这些默认值。定点单轴收缩任务必须在冻结实验块时记录该步长，并保持其他坐标字段不变。\n\n比例值映射回离散 bar 时，必须按参数的合法单位取整、去重，并与 completed+active+pending 坐标做精确反连接。最细检查只用于确认邻域是否连续、排序是否稳定。若领先结果依赖某个精确的个位数 bar 位置，或在 5% 邻域内消失，必须标记为高过拟合风险，不能据此继续缩小步长。\n\n### 局部网格结束后回到跳跃搜索\n\n参数空间维度高、合法边界宽。有限局部网格阶段闭合后，回到跳跃搜索，覆盖尚未充分采样的方向、远离当前领先组合的合法区域，或与当前解释竞争的替代假设。\n\n跳跃搜索坐标不设永久固定比例。每份计划必须写明坐标数、覆盖范围、选择理由，以及它与网格细化的区别。闭合证据支持时，可以连续完成多个网格轮次，但 campaign 必须标明阶段，也不能把局部成功或失败解释为全局收敛。\n\n## 6. 开仓与平仓分开归因\n\n发现开仓问题时，主要检查 E、BH、TRW、K 和 A／floor。发现平仓问题时，主要检查 W、M 和 S。\n\n这条规则只用于归因，不规定轮次安排。同一轮可以同时包含开仓块、平仓块和大跨度块，但每个块必须独立写明假设。开仓和退出参数都未形成稳定方向时，限制大规模跨模块联合搜索；已有证据时，可以加入少量交互坐标。\n\n## 7. 参数块在运算前写清楚\n\n每个实验块都要记录：\n\n- 研究问题和对应交易类型；\n- 参数范围、步长和坐标来源；\n- 预期改变的交易行为；\n- 支持假设与推翻假设的结果；\n- 需要观察的多项指标；\n- 最低交易数与证据有效边界；\n- 邻域稳定性检查；\n- gap、synthetic 和理想化成交依赖说明；\n- 扩大、细化、保持观察或停止该块的条件。\n\n这些内容在查看新结果前冻结，不能根据结果临时改写门槛。\n\n## 8. 怎样判断是否改善\n\n改善采用多指标判断。模型不得给某一指标预设长期高权重，也不得用固定 score 代替研究判断。\n\n每次判断都要查看：\n\n- 成本后总收益；\n- 成本后中位单笔；\n- 最大回撤；\n- 胜率和交易数量；\n- MFE、MAE 和 MFE 保留率；\n- 收益是否集中于少数交易；\n- 相邻参数是否接近；\n- 目标交易类型是否改善；\n- 新增、保留和消失了哪些交易；\n- gap、synthetic 和低活动依赖；\n- 改善是否只存在于孤立参数点。\n\n本轮研究问题决定哪些指标更有解释力，但这种侧重只对本轮假设有效。总收益必须报告，却没有自动优先级。\n\n模型需要给出四类结论之一：`improved`、`mixed`、`not_improved`、`uncertain`，并写明：\n\n1. 哪些指标改善；\n2. 哪些指标恶化；\n3. 改善是否来自少数异常交易；\n4. 指标之间有什么取舍；\n5. 为什么仍作出当前判断；\n6. 哪些证据支持下一轮继续研究。\n\nPareto 比较可以帮助保留未被其他候选全面支配的组合，但不能机械替模型作决定。\n\n## 9. 验证数据边界\n\n当前结果来自训练样本。若以后引入 validation 或 holdout，候选、范围和判断规则必须在查看验证结果前冻结。验证结果只能评价已冻结候选，不能用来反复产生新参数。\n\n## 10. 每轮解释要留下什么\n\n每轮解释至少包含：\n\n- 本轮实验块及其假设；\n- 参数坐标与证据来源；\n- 毛收益和按阶段绑定成本模型计算的成本后结果；\n- 重点交易类型的保留、消失和新增交易；\n- MFE、MAE、浮盈保留和退出后继续下跌情况；\n- 收益与回撤的交易贡献集中度；\n- 邻域稳定性；\n- gap、synthetic 和低活动依赖；\n- 多指标改善判断及理由；\n- 每个实验块的扩大、细化、观察或停止决定；\n- 明确的 `parameter_acceptance=none`。\n\n## 11. 下一轮参数用 CSV 交付\n\n每轮探索结束时建立一个独立交付文件夹，核心文件固定为 `next_round_parameters.csv`。每行是一组完整、实际准备运行的参数坐标，不能只保存笛卡尔积定义。\n\nCSV 至少包含：\n\n| 字段 | 含义 |\n| --- | --- |\n| `candidate_id` | 本次提案中的唯一编号 |\n| `experiment_block` | 所属实验块 |\n| `search_mode` | `broad_jump`、`single_axis`、`module_pair`、`trade_type` 或 `stability` |\n| `anchor_combo_id` | 来源锚点；大跨度搜索可以为空 |\n| `diagnostic_type` | 对应交易类型 |\n| `hypothesis` | 准备验证的问题 |\n| `method` | 当前固定方法 |\n| `baseline_sampling_policy` | Baseline 采样策略 |\n| `e`、`bh`、`trw`、`k`、`abs_floor_value`、`w`、`m`、`speed_window_bars` | 完整参数坐标 |\n| `cost_bps` | 冻结品种成本模型给出的精确往返 bps |\n| `expected_behavior_change` | 预期改变的交易行为 |\n| `evidence_summary` | 支持该坐标的本轮证据 |\n| `selection_reason` | 模型选择该坐标的理由 |\n| `source_round` | 参数来自哪一轮证据 |\n| `status` | `proposed_for_next_round` |\n\nCSV 必须满足：\n\n- 坐标完整展开，内部无重复；\n- 大跨度和局部坐标通过 `experiment_block` 区分；\n- 每行都能追溯到假设或探索目的；\n- 生成后与 completed、active、pending 坐标做精确 anti-join；\n- CSV 是研究交付，运算前仍需转换或绑定为经过审阅、带哈希的正式计划；\n- 若证据不支持下一轮，仍交付只有表头、零参数行的 CSV，并在本轮解释中写明停止原因。\n\n## 12. Agent 每轮行动清单\n\n每次参数探索，agent 必须完成以下事项：\n\n1. 阅读本指南和当前权威文件。\n2. 确认当前源码身份、品种配置、实验模式、排名谱系、已完成坐标集合和冻结成本模型。\n3. 探索初期允许随机观察；已有盈利候选后，增加对这些参数改善空间的检查，同时保留随机抽查。\n4. 把重点交易归入诊断类型，避免围绕单笔交易调参。\n5. 同时考虑多种改善路径，不给某个指标设置长期高权重。\n6. 根据本轮问题决定需要重点解释的指标，并记录指标间的取舍。\n7. 每轮标明跳跃搜索或网格细化阶段，遵守循环顺序；有限网格阶段得到支持并闭合后，回到互不相邻的跳跃覆盖，不能根据局部网格推断全局收敛。\n8. 探索一个参数方向时，运行预先声明的有限尺度网格，其余参数全部固定；完整闭合网格得到解释后，才决定继续、细化、扩大、停止或更换方向。\n9. 开仓问题主要检查开仓参数，平仓问题主要检查平仓参数；跨模块坐标必须有证据。\n10. 在运算前冻结实验块假设、坐标、有效边界和推翻条件。\n11. 使用经审阅、带哈希的计划，完成坐标唯一性以及 completed、active、pending anti-join。\n12. 完成源码、输出目录、进程、锁、内存和 validate-only 门禁。\n13. 只解释 `IMMUTABLE_CLOSED` 的结果；无效闭合、非有限证据或无法归因的结果不进入下一轮。\n14. 比较参数变化前后的新增、保留和消失交易，检查收益集中度和邻域稳定性。\n15. 给出 `improved`、`mixed`、`not_improved` 或 `uncertain` 判断及理由。\n16. 没有合格改善时停止对应实验块；其他块和大跨度探索可以继续。\n17. 建立独立交付文件夹，写出展开后的 `next_round_parameters.csv`，并完成 anti-join。\n18. 中间轮暂不生成累计总入口与逐笔 HTML。整组探索结束后生成一次并完成 `DELIVERY_FINAL`；只有用户明确要求时才提前发布。\n19. 交付发现影响结果语义的源码问题时，暂停新运算，等待新源码身份闭合。\n20. 保持 `parameter_acceptance=none`。\n","modified":"2026-08-05T21:51:11.098Z","missing":false}];

          { title: "选择退出路径", copy: "反弹、速度、非真实成交等待和样本末强平，各自遵守对应的因果成交规则。", branchLabel: "退出路径", branches: [
            { name: "rebound", copy: "open 已高于退出价按 open；否则 high 触发时按理论价。严格同 bar 新低例外按 close。" },

          ] },
          { title: "写入逐笔和组合结果", copy: "记录成交、收益、MFE／MAE、gap／synthetic／低活跃依赖和退出原因，再汇总为组合指标和 HTML 证据。", primary: true }
        ],
        directoryTitle: "项目文档目录",
        directoryLead: "目录根据项目管理清单生成。点击文档即可进入内容页；点击左上角项目图标可以回到这里。"
      },
      en: {

        note: "This page is a human-facing navigation aid. It is not strategy, execution, or evidence authority and is not part of the AI priority reading order. Current project rules, English management documents, and real artifacts govern any discrepancy.",
        policy: "Human orientation and navigation; excluded from the AI reading order.",
        path: "project_management\\index.html#home.en",
        programTitle: "Backtest program and research workflow",
        programLead: "The four official modes define where parameters come from. After mode selection, every campaign shares the same plan-freeze, compute, closure, delivery, and interpretation pipeline. Later work either selects another authorized mode or stops.",

            { name: "continuation_search", copy: "Continue from a completed parent in the same instrument and ranking lineage." },

        ],
        tradeTitle: "Lifecycle of one trade",

        tradeSteps: [
          { title: "Complete a new 15-second bar", copy: "Resolve continuity, real versus synthetic status, and which TR atoms are available to the baseline at this time.", primary: true },
          { title: "Flat state: find H and entry inputs", copy: "Find ordered high H inside E, form the BH/TRW baseline from eligible completed atoms, and calculate H-to-current-low drop plus K×baseline threshold." },
          { title: "Positive signal gate", copy: "An entry signal requires finite baseline, drop, and threshold; all three must be above zero and drop must be at least the threshold. Otherwise remain flat." },
          { title: "Fill the entry", copy: "On a real trigger bar, an open through the theoretical price fills at open; otherwise fill at threshold. A synthetic signal is retained for up to 120 continuous bars and fills at the first real open.", branchLabel: "Fill paths", branches: [
            { name: "real bar", copy: "Open through price → open; otherwise threshold. Equality fills." },
            { name: "synthetic signal", copy: "Retain signal → first real bar open." }
          ] },
          { title: "Update the open position", copy: "Maintain the maximum W net-decline baseline from H, convert it through M into a rebound line, and let S detect when decline stops advancing." },
          { title: "Choose an exit path", copy: "Rebound, speed, non-real pending, and sample-end exits each retain their causal fill rule.", branchLabel: "Exit paths", branches: [
            { name: "rebound", copy: "Open above exit fills at open; otherwise a high trigger fills at theory. A strict same-bar new-low exception fills at close." },
            { name: "speed", copy: "Exit when the S window confirms that decline has stopped advancing." },

            { name: "sample end", copy: "Any remaining position closes at the declared sample-end close." }
          ] },
          { title: "Write trade and coordinate evidence", copy: "Record fills, return, MFE/MAE, gap/synthetic/low-activity dependence, and exit reason, then aggregate coordinate metrics and HTML evidence.", primary: true }
        ],
        directoryTitle: "Project document directory",
        directoryLead: "The directory is generated from the project-management manifest. Open any formal document below; use the project icon at top left to return here."
