ode\\qa_v4_4_cross_instrument_comparison.mjs` owns file-based browser interaction checks plus desktop/mobile screenshots for both the comparison page and the SImain trade review.\n- The comparison reads the current complete cumulative snapshot and its trade CSV, then writes only below `results\\cross_instrument_comparison`. Target evaluation calls the existing immutable engine and does not alter campaign stages, plans, cumulative data, or frozen candidates.\n- The current snapshot remains immutable. `build_v4_4_combined_union_analysis.py::publish_stable_main_assets` derives a small stable presentation under `results\\all_completed_union_analysis\\main`: it strips each main row to the fields consumed by the controls/table, keeps exact links into the current snapshot, and does not copy or regenerate trade chunks. The stable cumulative `index.html` is a presentation-only shell that embeds this lean main in an iframe and exposes cumulative/cross-instrument navigation; future cumulative snapshots remain independently hash-bound.\n\n## Result-storage indirection\n\nAll runner, analyzer, and delivery components continue to use the logical project-relative `results` root. On Windows this resolves from `D:\\Code\\backtest-release\\Backtest V4.4\\results` through a directory junction to the physical root `F:\\Backtest\\Backtest V4.4\\results`. This keeps historical absolute paths valid while placing every future result byte on F. Source code and runtime inputs remain on D.\n\n## Active flow\n\n1. `data_preparation/prepare_dataset.py` builds repository-local prepared inputs, confirmation-time exclusion timestamps, and the active low-activity entry-gate flag.\n2. `code/v4_4_engine.py` calculates entries, exits, W baselines, and trade audits.\n3. `code/run_v4_4_resumable_campaign.py` validates a frozen plan and writes immutable batch results.\n4. `code/analyze_v4_4_scenario_3_stage.py` validates a completed stage, loads its instrument-bound cost model or the legacy K200 default, derives per-trade cost without mutating raw returns, and creates separate gross/cost-adjusted rankings with cost-adjusted default. A profile may omit scenarios; such a stage exposes unrestricted views only.\n5. `code/build_v4_4_review_delivery.py` generates the fixed historical-template trade review with four workers.\n6. `code/build_v4_4_combined_union_analysis.py` recursively discovers completed stages below the supplied `campaigns_root`, admits the accepted V4.4 K200 major ranking lineage, preserves each stage's implementation and preparation identities as provenance, and publishes the cumulative snapshot and stable entries. Structural fields required to parse a closed stage remain validated.\n\nThe cumulative builder applies the cost model bound to each source stage. Minor V4.4 engine, preparation, strategy, or result-identity differences do not split the accepted K200 major ranking lineage. A V4.5 update or a different instrument uses another cumulative root and ranking lineage.\n\n## Boundaries\n\nRaw compute, derived cost analysis, and cumulative publication remain separate boundaries. Intermediate rounds close immutable raw outputs and compact summaries; the runner does not publish HTML unless `--publish-html` is supplied. After the exploration series ends, one explicit publication builds the shared cumulative main and shared per-trade entries from every compatible completed stage. Existing stage pages remain historical evidence. Active runtime inputs are repository-relative. Historical absolute paths under `runtime_inputs/provenance` are records only.\n\n`analyze_v4_4_scenario_3_stage.py::_legacy_v4_main_html()` transforms the fixed main template for the V4.4 cumulative entry. It hides the summary-card strip, fills `#all-strategy-count` from `DATA.coordinateCount`, and renders full-row multi-select minute ranges for BH, E, W, and S. Each axis unions selected intervals; the four axis predicates are intersected before ranking. `main_summary_payload()` defines the main-page data boundary, while the generated JavaScript pre-indexes rows by method and baseline policy and sorts/filters integer row indexes rather than cloning row objects.\n","modified":"2026-08-08T18:08:32.846Z","missing":false},{"id":"architecture.zh","pair":"architecture","group":"state","path":"02_current_state/CODE_ARCHITECTURE.zh.md","lang":"zh","title":"代码架构","lead":"当前代码流程、组件、职责、依赖与边界。","policy":"代码入口、组件职责、调用关系、数据流、依赖或接口边界变化后更新。","markdown":"# 代码架构\n\n## 外部审阅修复边界——2026-08-09\n\n`build_v4_4_review_delivery.py::_native_trade_frame_fast` 遇到合法的零交易坐标时返回空表。多进程 worker 仍写入该坐标的正常 `NATIVE_COMBO` 记录，同时写入 `NATIVE_TRADES=[]`、`waited_count=0` 和 `maximum_wait=0`。线程与进程发布路径由此保持一致，也不会制造交易。\n\n`analyze_v4_4_scenario_3_stage.py` 继续在 `report_data.js` 中保留完整阶段 `instrumentProfile`。精简的 `analysis_data.js` 只加入 `instrumentSummary`，包含品种 ID、显示名称、排序谱系、成本模型 ID、实验模式和情景策略。本地配置路径与策略实现路径不会进入精简浏览器载荷。\n\n`build_v4_4_cross_instrument_comparison.py::_comparison_html` 允许单元测试传入基础 CSS；正常发布仍从当前累计页面读取 CSS。跨品种测试可以验证按角色生成的动态名称，无需依赖 F 盘快照。展示测试改为检查当前语义属性和「开仓理由」中的现行信息位置，不再依赖过期的 CSS 顺序或图内标签文字。\n\n## 行情场景流程\n\n`runtime_inputs\\scenarios\\market_catalog.json` 把选择器选项映射到一个品种、一个评价结果包、一个行情文件、一个时区和一个精确区间。`tools\\build_v4_41_scenario_manager.py` 为每个区间生成压缩浏览器资源并发布选择器，界面代码不包含品种专用文件名。\n\n选择器每次只加载一项已登记行情，选区保存在浏览器内存中，再通过 Chrome 的文件保存流程写出完整 `scenario_catalog.json`。载入控件导入整份多场景目录；新草稿使用下一个未占用的 `scenario_N` ID 和「新场景N」默认名称，仅名称可以修改。框选结果会规范为铺满图表高度的时间带。每个场景重复记录数据文件、评价身份、显示区间和全部选区，单独查看文件也能还原来源。\n\n`tools\\apply_v4_41_scenario.py` 解析绑定的评价结果包，根据 `trade_records\\trades.csv` 判断每段选区，再用 AND 合并分段资格，筛选结果包中的参数总体，并生成 `analysis_data.js` 和当前总入口页面外壳。迁入的 V4.4 场景可以复用兼容的预计算资格字段；新增或编辑后的场景会流式读取不可变逐笔记录。逐笔链接通过结果包自己的 `trade_review\\index.html` 打开。\n\n## V4.41 交付打包\n\n- `tools\\package_v4_4_with_trade_records.ps1` 发布 `Backtest_V4.41_current_with_trade_records_20260808.zip`。脚本名保留 V4.4 策略主版本命名空间；交付包身份与根发布记录采用 V4.41。\n- 交付包复制 `RELEASE.json`、根运行／配置文档、当前研究变体、`runtime_inputs`、`project_management`、工具、来自 `research_variants\\short_momentum_net_drop_rebound_v4_4\\handoffs\\v4_4_cost_adjusted_multiround_20260803\\analysis_reports` 的九份保留规范报告，以及已完成 campaign 阶段的不可变原始逐笔记录与已有衍生逐笔记录。`.omo` 不再是打包依赖。\n- 完整结果载荷、HTML 快照、`.git`、`.omo`、依赖、缓存、浏览器配置与编译字节码不进入 ZIP。原始 batch 逐笔账本为强制项；衍生阶段账本只在该已完成阶段实际生成时纳入。可恢复终结流程检查清单身份、ZIP 名称与大小和整包 SHA-256，不再建立重复解压目录。\n\n## 发布身份边界\n\n- `RELEASE.json` 管理当前界面发布版本（`V4.41`），并声明策略／排序主版本继续使用 V4.4。引擎清单、参数身份与累计纳入规则继续采用现有 V4.4 合同和排序谱系。\n- 页面生成程序在当前标题中显示 V4.41。`v4_4_engine.py::VERSION_LABEL`、`SOURCE_MANIFEST.json::version_label` 与 `build_v4_4_combined_union_analysis.py::RANKING_MAJOR_VERSION` 保持 V4.4，使已完成结果继续兼容。\n\n## 按日期区间保存的结果包与通用比较入口\n\n- `tools\\build_v4_4_evaluation_framework.py` 负责发布结果框架。结果包身份由 `instrument_id`、精确评价开始时间和结束时间组成。程序写入清单、实验说明、统一参数汇总、按候选集生成的浏览器数据、不可变逐笔记录链接和逐笔兼容入口，再生成比较方案与结果包读取页面。\n- `tools\\register_v4_4_evaluation_package.py` 根据声明式模板 `runtime_inputs\\templates\\EVALUATION_PACKAGE_SPEC.template.json` 登记一个新完成的品种／区间。说明文件把来源汇总列映射为统一参数和指标字段；登记过程创建日期结果包、硬链接不可变逐笔记录并更新共享目录，同时拒绝改写已有结果包。\n- `results\\evaluation_packages\\catalog.json` 是机器可读目录。每个品种按精确区间建立目录。结果包不保存固定实验角色，因此同一份已完成证据可以被后续多份方案引用。\n- `results\\evaluation_comparison` 保存比较目录和方案。浏览器加载器读取每个已选结果包的数据，按 `combo_id` 建立查找表，按原字段顺序恢复保留页面需要的角色指标，随后运行未改动的比较界面。\n- 历史大体积逐笔 CSV 在兼容结果包内使用同卷硬链接。结果包逐笔入口保留 query 和 hash，再跳转到字节不变的历史页面。以后生成的原生结果包可以在自己的目录内保存区块，并增量复用未变化区块。\n- `tools\\qa_v4_4_evaluation_framework.mjs` 用 Chromium 比较保留页面与结果包页面，检查标题、全部可见正文、首行数据、可见行数和控制台／页面错误，并保存两张截图。\n- `run_v4_4_resumable_campaign.py` 已经通过品种配置解析行情与准备数据，并从计划读取 `train_start`／`train_end`。新的存储层只移除目录身份对 K200 和训练／测试角色的依赖，不改变引擎或 runner 语义。\n\n## 当前 K200 优参数后续一个月重放\n\n- `tools\\run_v4_4_k200_current_optimal_forward_initial.py` 从训练期多指标冻结候选，对非对照坐标执行早期时间迁移结果反连接，写入 schema-4 精确迁移计划，调用既有四工作线程可续跑执行器，并生成精简比较与 Markdown，不生成 HTML。\n- 候选必须满足训练期成本后收益为正。程序在反连接新增坐标以前选取八个训练视图对照；冻结文件记录每个精确坐标是否曾有后续评价。\n- 程序复用 `run_v4_4_k200_temporal_migration.py` 的计划执行与成本／依赖分析，因此引擎、成交、成本、准备数据和 gap 语义均未改变。\n\n## K200 训练／测试／SI 三组迁移流程\n\n- `tools\\run_v4_4_train_test_si_triple_migration.py` 对保留的 250 组 SI 候选执行精确反连接，冻结 100 组只依赖 K200 时间迁移证据的新增候选；四个工作线程完成 SI 评价，再把合并后的 350 组重放到 K200 测试期，最终写入三组收益比较与解释报告。\n- `build_v4_4_cross_instrument_comparison.py` 读取可选的 `source_test` 合同，使用相对角色显示 K200（训）、K200（测）和 SI 收益列，把每列总收益按钮路由到对应角色的逐笔证据，并根据保留交易记录生成专用 K200（测）逐笔入口，无需重跑策略。K200（训）复用累计 K200 逐笔入口；SI 保持增量逐笔入口。\n- SI 最终逐笔发布将保留的 250 组运行作为 `incremental_parent_run`，复用 250 个区块，只生成新增 100 组区块。中间迁移阶段不发布 HTML。\n\n## K200 时间迁移工作流\n\n- `tools\\run_v4_4_k200_temporal_migration.py` 从训练期多指标证据冻结 R1 候选，用四个 worker 运行可续跑阶段并写入成本与依赖摘要。后续候选由已闭合的更早时间片、训练期邻近组合和结构性对照组成。最后一段保持未见状态；完整区间重放明确标为事后描述。\n- 计划与候选 CSV 位于 `research_variants\\short_momentum_net_drop_rebound_v4_4\\plans\\k200_temporal_migration_20260807`；原始与派生阶段位于 `results\\temporal_migration\\v4_4_k200_temporal_migration_20260807`。内存门槛暂停时保留已完成批次，恢复运行不会改动候选冻结文件。\n- 最终阶段写入一份时间迁移 HTML/CSV、一份 Markdown 报告和一份阶段逐笔分析。后续只刷新报告时复用已完成分析，不重新生成回测或逐笔区块。\n- `build_v4_4_review_delivery.py::_stage_filter_bundle` 同时接受保留的 policy-neutral 准备身份与当前确认后低活动门禁身份，并继续核对来源和产物哈希。`analyze_v4_4_scenario_3_stage.py::_atomic_json` 把清单中的路径字段序列化为字符串。\n\n## 逐笔区间统计展示\n\n- `runtime_inputs\\templates\\historical_v4_trade.html` 负责配对逐笔按钮、无版本号标签标题、蓝色 `Z` 图标、理由面板指标框、精简交易选择器和底部图例。`build_v4_4_review_delivery.py` 注入可选的配对路由与研究合同身份，共享模板继续保持品种无关。\n- `results\\all_completed_union_analysis\\trade_review_peer.json` 把当前累计 K200 逐笔页面绑定到后续测试逐笔页面。`build_v4_4_combined_union_analysis.py` 在当前快照刷新和后续累计外壳中读取这份小型发布合同；`build_v4_4_cross_instrument_comparison.py` 发布 K200 测试逐笔页面时提供反向链接。\n- `runtime_inputs\\templates\\historical_v4_trade.html` 负责「区间统计」、Plotly 横向圈选、右栏紧凑结果框、基于现有 OHLC 的圈选后计算、清除原生选择状态、持续显示的浅色普通图形，以及关闭时恢复缩放模式。\n- 同一模板负责互斥的「持仓检测」，并保留 Plotly 拖动缩放。图表记录 pointer-down，`document` 接收 pointer-up；移动超过五像素视为拖动，短按通过当前坐标轴映射到最近的可见 K 线，右键被排除。随后解析逐根来源 bar 或合并 K 线的末端来源 bar，查找所在交易，按引擎规则重建完成 W 候选从下一根生效的 max-W 回撤状态和 S 窗口累计低点状态，在所选 close 绘制蓝色点，并绘制更深的无描边蓝色「基准起点至 active low」填充。启用任一模式会收起参数抽屉。\n- K 线 trace 使用 `whiskerwidth=0`，只移除高低点末端横线，不改变 OHLC 数值。\n- `build_v4_4_review_delivery.py::refresh_trade_review_shell` 只重新生成 `trade_review\\index.html`，并更新资源审计与逐笔清单；process payload 和各坐标逐笔区块保持不变。\n- `build_v4_4_combined_union_analysis.py::_refresh_completed_snapshot_trade_shell` 更新已完成快照外层的分析与完成产物引用，不运行累计交易或逐笔区块生成。\n\n## K200 增量 Tick 获取与启用\n\n- `tools\\download_k200_incremental_ticks.py` 从保留的 IBKR K200 `TRADES` Tick 检查点续传，每个下载目录独立保留，使用当前一秒即时恢复规则清理 Tick，生成补齐交易时段的 15 秒衍生数据和有序扩展候选。请求间隔保持 10.25 秒；IBKR 缺少完成回调时，用一页 500 笔沿同一游标前进，随后恢复每页 1,000 笔。\n- `tools\\write_k200_download_readme.py` 在每个保留的 K200 下载目录内写入并刷新 `README.md`。它从血缘清单生成更新时间记录，并写明已审计的主力合约规则、016M／016U 准确边界、未复权合并政策、请求区间、状态和主要文件。\n- `tools\\activate_k200_incremental_15s.py` 按严格时间顺序追加原活动 K200 来源和各段独立清理后的补充数据，替换仓库内的活动 15 秒文件，重新生成准备数据，并刷新品种配置、证明、运行输入和源码清单身份。启用数据不会重新计算历史结果阶段。\n\n## K200 累计展示路由\n\n- `build_v4_4_cross_instrument_comparison.py::publish_current_main_standalone_view` 将稳定根入口发布为保留 query／hash 的 `main\\index.html` 跳转页，不再生成重复导航外壳与 iframe。\n- `analyze_v4_4_scenario_3_stage.py::_legacy_v4_main_html` 负责当前 K200 标题、颜色、可见列顺序与名称、固定宽度排名按钮、每页 500 行的客户端分页，以及全宽表头固定滚动区域；页面不再生成「研究合同」。`publish_stable_main_assets` 只根据当前不可变快照载荷刷新轻量主展示。\n\n## 双目的探索工具\n\n- `tools\\build_v4_4_k200_dual_purpose_round_15_plan.py` 生成确定性大范围覆盖与精确单参数细化区块，执行已完成坐标反连接，并写入经审阅的执行计划和审计。\n- `tools\\analyze_v4_4_k200_dual_purpose_round_15.py` 把计划区块身份附加到已完成阶段结果，分开比较大范围与细化分支，生成主视图与逐笔诊断，并写入经过反连接的下一轮交接。这两个工具不改变引擎、成交、成本或结果语义。\n\n## 累计逐笔增量发布\n\n- `build_v4_4_combined_union_analysis.py` 递归解析嵌套生成计划，在不保留全部交易表的情况下读取阶段汇总，并逐阶段处理保留交易。累计交易 CSV 流式写入临时文件，全部阶段闭合后再原子改名。\n- 确定性命名且未变化的坐标区块通过同卷硬链接复用。缺失区块使用向量化逐笔转换和四个工作进程生成；排名、目录、process payload、汇总、清单与稳定路由只在完整兼容阶段集合上更新一次。\n- 闭合阶段清单构成发布审计边界，累计发布不再重复执行完整交易文件哈希和逐笔成交审计；策略、结果、成本、情景与计划身份仍保持约束。\n- 当前交付复用 5,320 个区块，生成 31,738 个新区块，以低于 2 GB 的发布器内存完成 37,058 个坐标和 11,749,606 笔交易。\n\n## 与品种无关的契约\n\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\contracts\\STRATEGY_CONTRACT_V4_4.json` 只保存共享开仓、平仓、时序与状态机语义。\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\instrument_profiles\\*.json` 绑定品种数据、准备证据、成本、gap、低活跃、可选情景和排名谱系。K200 已就绪；SImain 与 NQ 在用户提供成本和 gap 决策以前保持模板状态。\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\campaign_contracts\\CAMPAIGN_MANIFEST.template.json` 是 `transfer_exact`、`target_local_refinement` 或 `fresh_search` 的配置起点。\n- `code\\instrument_contracts.py` 验证这些文件并统一成本字段。名义价值按参考价乘以 point value 计算，同时保留 K200 旧字段。\n- schema-v5 runner 计划绑定 campaign manifest、品种配置、模式、排名谱系与情景策略。旧计划不含这些字段，继续保留历史行为。\n\n## 跨品种对比\n\n- 目标品种逐笔增量发布由 `build_v4_4_review_delivery.py::build_stage_trade_review` 实现。运行配置可以声明 `incremental_parent_run`；`build_v4_4_cross_instrument_comparison.py` 解析已完成父逐笔目录，把确定性命名且未变化的组合区块硬链接到新交付，只生成缺少的组合区块，然后更新小型 shell、目录、process payload、汇总与清单。固定命令为 `build_v4_4_cross_instrument_comparison.py build --run-id \u003crun_id>`。清单记录父运行、复用数量、新增数量与复用方式。\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\code\\build_v4_4_repaired_source_transfer.py` 可以把已经完成的精确迁移结果组成展示并集，无需重跑任一品种。它从用户表格移除批次来源字段，绑定经审阅的迁移方案，生成与品种无关的相对名称，发布一份合并目标逐笔与迁移报告，并让修复后独立结果转向合并展示。\n- 对比构建器从运行配置绑定的 `migration_plan` 读取原品种／目标品种名称与样本区间。表格把原品种总收益放在目标品种总收益前一列，并采用三态排序。累计导航壳与跨品种页头提供采用新标签页的双向导航。\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\code\\build_v4_4_cross_instrument_comparison.py` 负责候选冻结、隔离的 SImain 评价、迁移诊断、CSV／JSON 发布、支持范围选择与全字段过滤的 K200 风格排名表、SImain 专用逐笔生成、已完成运行目录路由，以及不修改不可变快照的累计导航壳。构建阶段根据保留的原品种／目标品种逐笔 CSV 推导用于展示切换的毛中位单笔、回撤、胜率与迁移诊断字段；它不重跑目标评价，也不修改冻结候选。\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\code\\build_v4_4_strict_entry_transfer.py` 冻结只使用来源数据的 K200 前 20% 严格开仓 Pareto 批次，调用不变的 SImain 评价器，在各自独立冻结的迁移批次之间重算合并诊断，并发布一个共享对比入口和一个共享 SImain 逐笔入口。它记录阈值四分位及五维跨品种 Pareto 集合，不建立综合分数。\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\code\\qa_v4_4_cross_instrument_comparison.mjs` 负责对比页和 SImain 逐笔页的本地文件浏览器交互检查与桌面／移动截图。\n- 对比读取当前完整累计快照及其逐笔 CSV，只向 `results\\cross_instrument_comparison` 写入新结果。目标品种评价调用现有不可变引擎，不修改 campaign 阶段、计划、累计数据或冻结候选。\n- 当前快照保持不可变。`build_v4_4_combined_union_analysis.py::publish_stable_main_assets` 在 `results\\all_completed_union_analysis\\main` 生成小型稳定展示：每个主表行只保留控制与表格实际使用的字段，精确链接继续进入当前快照，不复制或重新生成逐笔区块。稳定累计 `index.html` 是纯展示导航壳，通过 iframe 嵌入这个轻量主入口，并提供累计结果与跨品种页面链接；以后生成的累计快照继续独立绑定哈希。\n\n## 结果存储间接层\n\n全部 runner、analyzer 与 delivery 组件继续使用项目相对逻辑 `results` 根目录。在 Windows 上，`D:\\Code\\backtest-release\\Backtest V4.4\\results` 通过目录联接解析到物理根目录 `F:\\Backtest\\Backtest V4.4\\results`。这样可以保留历史绝对路径，同时让后续每个结果字节存放于 F 盘。源码与运行输入继续位于 D 盘。\n\n## 当前流程\n\n1. `data_preparation/prepare_dataset.py` 生成仓库内准备数据、确认时排除时间戳与低活跃开仓门禁状态。\n2. `code/v4_4_engine.py` 计算开仓、平仓、W 基准与逐笔审计。\n3. `code/run_v4_4_resumable_campaign.py` 验证冻结计划并写入不可变批次结果。\n4. `code/analyze_v4_4_scenario_3_stage.py` 验证完结阶段，读取阶段绑定的品种成本模型；旧阶段使用 K200 默认参考。它在不修改原始收益的前提下推导每笔成本视图，并生成独立毛收益／成本后排名；默认使用成本后口径。品种配置可以不含情景，此时阶段只展示全坐标视图。\n5. `code/build_v4_4_review_delivery.py` 使用四个工作线程生成固定历史模板的逐笔页面。\n6. `code/build_v4_4_combined_union_analysis.py` 递归发现指定 `campaigns_root` 下的已完成阶段，纳入已接受的 V4.4 K200 大版本排名谱系，把每个阶段的实现与数据准备身份保留为来源证据，并发布累计快照与稳定入口。读取闭合阶段所需的结构字段继续验证。\n\n累计构建器按每个来源阶段绑定的成本模型计算。V4.4 内引擎、数据准备、策略或结果身份的小幅差异不会拆分已接受的 K200 大版本排名谱系。升级到 V4.5 或迁移到其他品种时，使用另外的累计根目录与排名谱系。\n\n## 边界\n\n原始运算、衍生成本分析与累计发布保持独立边界。中间轮闭合不可变原始输出与小型汇总；运行器只有收到 `--publish-html` 才发布 HTML。整组探索结束后，一次明确发布从全部兼容已完成阶段生成共享累计总入口与共享逐笔入口。已有阶段页面作为历史证据保留。当前运行输入采用仓库相对路径；`runtime_inputs/provenance` 中的历史绝对路径只用于来源记录。\n\n`analyze_v4_4_scenario_3_stage.py::_legacy_v4_main_html()` 将固定主入口模板转换为 V4.4 累计入口。它隐藏摘要卡条，由 `DATA.coordinateCount` 填入 `#all-strategy-count`，并为 BH、E、W、S 渲染独占整行的分钟区间多选控件。每个轴对已选区间取并集，排名前再对四个轴条件取交集。`main_summary_payload()` 定义主入口资料边界；生成的 JavaScript 按方法与基准策略预建索引，筛选和排序只排列整数行索引，不克隆行对象。\n","modified":"2026-08-08T18:08:32.850Z","missing":false},{"id":"tasks.en","pair":"tasks","group":"work","path":"03_active_work/CURRENT_TASKS.en.md","lang":"en","title":"Current Tasks","lead":"Active work, ownership, status, acceptance, blockers, and handoff state.","policy":"Update when a task is declared, completed, blocked, resumed, or changes scope.","markdown":"# Current Tasks\n\n## 2026-08-08 — Catalog-driven market scenarios complete\n\nThe market registry, saved-scenario registry, selector save flow, scenario application script, and three current scenario ranking pages are complete. Existing result packages and stable main/per-trade pages were not changed. Future work adds a market by extending the market catalog, then saves and applies scenarios without product-specific selector code.\n\n## 2026-08-08 — V4.41 compact external-review package complete\n\nThe compact review-candidate ZIP, sidecar, audit, package-root test runner, current cumulative browser payload, and representative per-trade chunk are complete. The independently extracted test runner reproduces 4 failures, 105 passes, and 2 skips. The failures are preserved for the requested external review; no source or test repair is authorized in this task.\n\n## 2026-08-08 — V4.41 package and safe local cleanup complete\n\nThe final ZIP, SHA-256 sidecar, audit, stable canonical-report source, and lean resumable package builder are complete. Obsolete packages, staging copies, local Agent state, dependencies, and caches were moved to the Recycle Bin. Current results and required historical/runtime dependencies remain retained; no cleanup task is active.\n\n## 2026-08-08 — V4.41 minor release complete\n\nThe active presentation release is V4.41. Strategy computation and cumulative result compatibility remain on the V4.4 major ranking lineage, so earlier compatible results stay included. No result recomputation or historical-result archive is part of this release.\n\n## 2026-08-08 — K200 paired per-trade review update complete\n\nThe current training and test per-trade pages switch bidirectionally by exact `combo_id`. Redundant selector metadata is removed, audit values are placed below the reason heading, the legend is below the chart, and the browser tab uses a version-free title with a blue `Z`. Only the HTML shells and their manifests changed; no result compute is active.\n\n## 2026-08-08 — Date-based multi-instrument result framework complete\n\nThree current evidence intervals are registered as independent packages named only by instrument and exact evaluated dates. The generic comparison reader loads package-owned browser projections and reproduces all 350 retained comparison rows exactly. At framework publication, the existing K200 main/per-trade, retained comparison, K200-test per-trade, and SI per-trade pages were byte-preserved. The later approved K200 paired-review shell update is recorded separately. Future median-based candidate selection remains outside this completed framework task.\n\n## 2026-08-07 — Current K200 optimal-parameter initial forward replay complete\n\nThe corrected 100-candidate freeze, four-worker raw closure, comparison CSV, machine summary, and Markdown report are complete. The current evidence shows weak one-month portability and strong gap dependence; the sparse BH612/S308 branch remains observation-only. The first candidate-selection attempt is historical and invalid for decisions, with the `_v2_` run as replacement. No compute remains active, no HTML was requested, and `parameter_acceptance=none`.\n\n## 2026-08-07 — K200 train/test/SI migration complete\n\nThe combined 350-candidate entry, SI per-trade analysis, K200 test replay, comparison CSV, plan, manifests, and final Markdown report are delivered. The stable page shows all three returns. New candidates were frozen before SI evaluation and have zero overlap with the retained 250. Publication reused 250 SI trade chunks and generated 100. The promising new neighborhood remains gap-dependent on K200 test data, so `parameter_acceptance=none`; no migration compute remains active.\n\n## 2026-08-07 — K200 training-to-subsequent-market temporal migration complete\n\nFour workers completed 400 candidates in each of R1–R4 and the descriptive full replay. The final holdout has 25/400 positive coordinates; 2/218 four-slice candidates are positive in every slice, both with sparse concentrated trades. The final ranking, target-period per-trade analysis, comparison CSV, and Markdown report are delivered. Conclusion: `no_static_general_parameter_found`; `parameter_acceptance=none`.\n\n## 2026-08-07 — K200 data extension and management records complete\n\nK200 IBKR `TRADES` ticks were extended from the retained 2026-07-28 boundary through the 2026-08-07 request boundary, cleaned, converted to session-filled 15-second rows, and appended to the active repository source. The active file now contains 233,368 rows through `2026-08-07T03:21:45+09:00`. All three retained K200 acquisition directories and the retained SImain directory contain a local contract/merge `README.md`. The bilingual backtest management log and its mandatory pre-run operation are active.\n\n## 2026-08-07 — Per-trade interval statistics complete\n\nThe specified view-mode sentence is removed. The current cumulative per-trade snapshot now provides on-demand `区间统计` and `持仓检测` before the theme controls. Both result panels render in the right detail column and collapse the parameter drawer when activated. Interval selection clears Plotly's native selection state, keeps normal chart opacity, and redraws a persistent pale range shape. Holding check responds to a short press on any visible candle while preserving drag-to-zoom, uses the exact raw bar or an aggregate's final source bar, derives the contemporaneous rebound and speed conditions, marks the selected close with a blue point, and highlights its effective baseline interval with a darker borderless blue fill. Candlestick endpoint caps and baseline/threshold color-name suffixes are removed. Both calculations start only after interaction and read already loaded data. No result data or trade chunk changed.\n\n## 2026-08-06 — Six-hour autonomous K200 leap/grid cycle complete\n\nFour workers closed automated Rounds 20–108: sixty leap rounds and twenty-nine adaptive-grid rounds, 31,375 exact new coordinates, and 10,843,398 trades. Together with the three opening rounds and prior lineage, final cumulative snapshot `eb3398757b8ffe52332aec6ecdedc60df86b70afb4e1509c8fa3fcccd7b53dd5` contains 37, arkdown":"# Work Progress\n\n## 2026-08-09 — K200 paired review opens inline\n\n- Replaced the training/test navigation link with a centered toolbar button using the existing button states and no hover underline.\n- The exact paired `combo_id` now loads in an overlay on the current page. The overlay closes through its `隐藏…` button or Escape and unloads its iframe on close.\n- Embedded reviews omit the `当前参数` card. Outer-page content is hidden while the overlay is open, preventing duplicated information from showing through.\n- Refreshed only the K200 training/test review shells and their presentation metadata. Chrome Beta checks passed in both directions with no browser errors; trades, OHLC, metrics, and rankings were not rebuilt.\n\n## 2026-08-09 — V4.41 formal source publication\n\n- Adopted Scheme A for the formal release: publish the GitHub source, compact Windows source ZIP, SHA-256 sidecar, machine audit, and `V4.41` tag. The multi-gigabyte historical ledgers remain outside the public assets.\n- The package keeps the current source, tests, project documents, runtime contracts, scenario catalogs and tools, current cumulative browser payload, stable main shell, and one representative per-trade chunk.\n- Independent preflight extraction caught a stale market-selector source hash in the scenario test contract. The source binding was corrected before final packaging; the failed preflight archive is excluded from publication.\n- Formal acceptance requires an independent final-package extraction with 112 passed, 2 skipped, and 0 failed. No engine run, result recomputation, or historical-ranking replacement is part of publication.\n\n## 2026-08-09 — External-review findings repaired\n\n- Zero-trade coordinates now publish valid empty per-trade chunks in the four-process path instead of failing on absent DataFrame columns. No synthetic trade is created.\n- Compact `analysis_data.js` now retains a minimal target-instrument summary while excluding local profile and policy paths. Full `report_data.js` keeps the complete closed-stage profile.\n- Cross-instrument page tests use injected CSS and dynamic instrument labels. Presentation assertions follow the current table CSS and the current placement of the six colored values under Entry Reason.\n- The source-review packaging script now records 109 passed, 2 skipped, and 0 failed. The existing 2026-08-08 ZIP remains unchanged with its historical 4-failure record; no replacement ZIP was generated.\n- The complete selected suite finished with 109 passed and 2 skipped. Engine, fills, costs, trades, returns, rankings, existing HTML, and retained result snapshots were not recomputed or modified.\n\n## 2026-08-09 — Scenario draft and time-band selection update\n\n- Changed the market selector to explain that `scenario_catalog.json` is a multi-scenario directory. Import loads the complete catalog; a new draft receives the next unused `scenario_N` ID and `新场景N` default name, with only the name editable.\n- After a successful save, the selector advances to the next unused draft. Drawn shapes are normalized to `yref: paper`, `y0: 0`, and `y1: 1`, so qualification records keep the x-axis time interval and do not use a price-axis rectangle.\n- Rebuilt `results\\market_scenario_manager\\index.html`; strategy, qualification, trade, and result data remain unchanged.\n\n## 2026-08-08 — Market selector and reusable scenario application delivered\n\nRegistered K200 training, K200 subsequent-test, and current SI market intervals in a machine-readable catalog. Migrated the retained three K200 scenario definitions into one saved-scenario catalog. The selector now switches among registered markets, preserves custom-file loading, accepts one or more chart selections, loads an existing scenario file, and saves the updated catalog.\n\nAdded a scenario application script that reads date-based evaluation packages and emits a current-main-style ranking under `results\\scenario_analysis`. Current Scene 1 contains 4 (39.972 GiB), plus earlier caches and obsolete QA material, to the Windows Recycle Bin. Preserved current results and required evidence/runtime dependencies.\n\n## 2026-08-08 — Visual delivery evidence rule\n\n- Future work with a visible result includes a representative screenshot when the environment allows it, with a brief assessment of overlap, garbling, asymmetry, and obvious layout errors. Local Chrome file pages may be opened through Computer Use.\n\n## 2026-08-08 — V4.41 minor release identity\n\n- Added `RELEASE.json` with V4.41 as the active minor release and V4.4 as the unchanged strategy/ranking major version.\n- Updated active presentation labels and package metadata to V4.41 while retaining all V4.4 engine, result, parameter, and ranking-lineage identities.\n- Kept every compatible completed V4.4 result eligible for the existing cumulative ranking. No backtest output was recomputed or excluded.\n\n## 2026-08-08 — K200 train/test paired per-trade review\n\n- Added destination-named toolbar controls to the current K200 training and test reviews. They transfer the exact selected `combo_id` and the destination research-contract identity in both directions.\n- Removed the trade-picker heading/count and secondary summary line while retaining the transaction dropdown with an accessible label.\n- Moved drop, ratio, entry baseline, entry threshold, W baseline, and active-low boxes from Plotly annotations to the reason panel. Their borders and semantic colors are retained in compact wrapping controls.\n- Moved the Plotly legend below the x-axis, changed the browser title to `组合平仓逐笔查看`, and installed a blue `Z` favicon.\n- Refreshed only the K200 training/test HTML shells and their manifests. Existing OHLC, process payloads, catalogs, deterministic trade chunks, fills, metrics, and ranking data were not rebuilt. Desktop dark/light and 390-pixel browser checks passed with exact-coordinate round-trip navigation and zero errors.\n\n## 2026-08-08 — Date-based evaluation packages and compatibility comparison\n\n- Added `tools\\build_v4_4_evaluation_framework.py` and registered three current date packages: K200 `2026-05-26 00:00:00`–`2026-07-08 23:52:00`, K200 `2026-07-08 23:52:15`–`2026-08-07 03:21:45`, and SImain `2026-01-29 00:00:00`–`2026-02-23 23:59:45`.\n- Added `tools\\register_v4_4_evaluation_package.py` and a declarative package-spec template so a newly completed executable instrument and exact interval can enter the same catalog without adding instrument-specific directory logic.\n- Each package contains `evaluation_manifest.json`, `EXPERIMENT.md`, a neutral `parameter_summary.csv`, a 350-candidate browser projection, an immutable trade-record hard link, and a query/hash-preserving per-trade compatibility entry. The first K200 package retains all 37,058 completed training-summary rows.\n- Added `results\\evaluation_comparison` with a comparison plan and loader that reads all three packages, joins exact `combo_id` values, restores the retained field order, and runs the unchanged 350-coordinate page shell. The stable cross-instrument URL now redirects to this entry; the prior entry is retained under the compatibility directory.\n- Compatibility audit passed exact row/value reconstruction for all 350 candidates. Existing K200 stable main/per-trade and retained comparison/test/SI per-trade page hashes remain unchanged. Chromium found equal title, visible body text, first-row data, and visible row count with zero errors; paired screenshots and the QA report are retained under `project_management\\screenshots\\evaluation_framework_20260808`.\n- Updated bilingual operating, goal, constraint, current-state, architecture, data, backtest-management, campaign, decision, reason, task, and progress records. No backtest, metric, parameter, engine rule, or per-trade result was recomputed.\n\n## 2026-08-08 — Triple-return per-trade routing published\n\n- Renamed the cross-instrument rank heading to `排名` and reduced the fixed-width blue nter-up。Plotly 左键拖动层此前可能保留释放事件，旧状态随后被右键误用。持仓模式现在保留 Plotly 拖动缩放：移动超过五像素视为拖动，短按选择 K 线，右键被排除。所选 close 显示蓝色点。更深的无描边蓝色基准填充从有效基准起点延伸到所选时点的 active low，真实 max-W 来源区间仍显示在面板中。\n- 持仓检测现在用带标注的浅红密虚线横线显示当时的理论回撤平仓价（`active low + threshold`）。S 窗口尚未形成时，还会在最早具备速度检查条件的 bar 绘制带标注的竖线，并显示剩余 bar 数与时间；该竖线表示最早检查资格，不代表必然成交。\n- 速度竖线改为 `activeLowIndex + S`，因此 S 已形成后仍会显示，表示当前 active low 后没有新低时的理论速度平仓位置。蓝色选中点改用显示聚合 K 线的中心与最高价，不再使用末端来源 bar 的横坐标和 close。\n- 通过展示层刷新路径更新快照 `eb3398757b8ffe52332aec6ecdedc60df86b70afb4e1509c8fa3fcccd7b53dd5`。本次没有运行回测，也没有重新生成结果指标、process payload 或各坐标逐笔区块。\n- 浏览器安全策略禁止本地 `file://` 页面导航，因此没有交互截图。生成页面的内联脚本已通过一次聚焦的源码级交互检查。\n\n## 2026-08-06——K200 交易数筛选与列标题已更新\n\n- 累计页筛选标题由「最低交易数」改为「交易数」，保留不限、至少 10 笔、至少 20 笔三个预设，并移除至少 100 笔和至少 150 笔。\n- 增加严格的「大于」与「小于」交易数输入条件；两个条件可以同时使用，并与保留的预设门槛分别生效。\n- 主表列标题统一居中；数据单元格对齐、结果数值、排序与不可变证据均未改变。\n\n## 2026-08-06——六小时 K200 跳跃／网格循环闭合并发布\n\n- 四个工作线程闭合 89 轮自动探索：六十轮跳跃、二十九轮自适应网格，新增 31,375 个坐标和 10,843,398 笔交易；精确反连接保证坐标不重复。\n- 最终累计总体为 37,058 个唯一坐标、11,749,606 笔交易和 109 个阶段。成本后正收益坐标从 4,721 增至 19,974，情景一合格坐标从 1,471 增至 4,406；四个主视图冠军均保持不变。\n- 任务结束时统一发布快照 `eb3398757b8ffe52332aec6ecdedc60df86b70afb4e1509c8fa3fcccd7b53dd5`。逐笔发布复用 5,320 个区块，生成 31,738 个新区块；流式、向量化、四进程改造后，发布器峰值内存低于 2 GB。\n- 后期跳跃轮仍持续出现互不相邻的优秀锚点，因此没有证明 K200 全局收敛，也没有启动 SI 迁移。没有接受参数。\n\n## 2026-08-06——跳跃／网格探索规则已更新\n\n- 后续单参数搜索不再受固定点数限制。每个网格需要冻结有限边界、取值或步长、锚点和预计坐标数，但不设固定点数上限。\n- 「每轮同时混合大范围与细化区块」改为 AI 主导循环：多轮跳跃搜索、围绕互不相邻优秀锚点的网格、再次跳跃搜索，以及循环之间的用户观察或修正。\n- 约六小时、四线程的 K200 无人值守搜索已经登记为活动任务。中间 HTML 继续延后；本条规则记录不声称已有新运算证据。\n\n## 2026-08-06——K200 累计展示精简完成\n\n- 稳定入口不再保留导航外壳与 iframe，改为保留 query／hash 并跳转到轻量主页面。\n- 更新标题与蓝色，简化收益列名，移除可见的 gap 依赖收益审计，把往返成本和跨 gap 笔数移到最后两列；排名按钮改为固定宽度的「#名次」。\n- 完整表格 DOM 改为每页 500 行的客户端分页。筛选和排序仍处理完整合格集合；翻页或重新排序时只渲染当前分片。表格使用全宽布局，占用接近一个视口高度，后方不再显示「研究合同」。\n\n## 2026-08-06——统一迁移排序已更新至 K1.75\n\n- 固定 E320／BH240／TRW20／W6／M4.5／S332，四个工作线程完成 K1.5／K1.6／K1.75 的 K200 来源阶段与 SImain 原样评价。\n- 247 候选父结果与三个新候选已发布为一份 250 候选排序，共包含 24,194 笔目标交易。\n- 更严格 K 的方向在 K1.4 目标局部峰值处闭合。当前没有接受参数，也没有后续迁移运行正在进行。\n\n## 2026-08-05——K200 双目的 continuation 轮次闭合\n\n- 记录长期探索规则：常规轮次同时包含大范围合法空间覆盖和有证据支持的单参数细化，两类结果分开解释。\n- 冻结 276 个零重合坐标：192 个确定性分层广域点，以及围绕四个优秀锚点、七个参数各三个新值的细化点。四个工作线程完成全部 35 个批次与 54,314 笔交易；可用内存持续高于 4,096 MiB 门槛。\n- 大范围覆盖得到 103 个成本后正收益坐标和一个新收益／回撤前沿点。该远端点有 55 笔交易、8.0376% 收益和 1.6933% 回撤，但剔除 gap 后成本后收益为负，36 个信号来自合成 bar，最好的两笔盈利占正收益的 50.3%。大范围分支分类为 `mixed`，不支持围绕该点继续局部细化。\n- 单参数细化改善了平均收益 E 分支。E96 成为至少 10 笔与至少 20 笔的笔均冠军：25 笔、总收益 35.2290%、笔均 1.23914%、回撤 3.0190%。E128 的平衡更好：29 笔、总收益 38.9271%、笔均 1.16460%、回撤 4.21795%，三项指标均优于 E112。\n- 最终快照包含 5,320 个坐标和 797,020 笔交易。累计逐笔增量发布复用 5,044 个区块，生成 276 个新区块。下一轮交接包含六十个坐标，与 completed、active、pending 均零重合，目前没有运算授权。\n\n## 2026-08-05——K200 大规模多区块轮次闭合并完成增量发布\n\n- 355 个请求候选中移除十二个内部重复与四十九个已完成重合坐标，形成 294 坐标冻结计划。四个工作线程完成全部 37 个批次和 28,577 笔交易；可用内存持续高于 4,096 MiB 运算门槛。\n- 最终累计快照包含 5,044 个坐标、742,706 笔交易和十五个兼容阶段。累计发布程序复用旧快照中的 4,747 个未变化逐笔区块，并生成 297 个缺失区块，其中包括本轮 294 个坐标和此前尚未累计发布的三个更严格 K 坐标。\n- 全坐标总收益冠军仍为 E480／BH171／TRW12／K1.26／W7／M4.5／S388，收益 82.4664%；情景一冠军也未变化。至少 10 笔与至少 20 笔的笔均收益视图均由 E112／BH612／TRW24／K1.6／W16／M2／S308 领先：29 笔、总收益 38.4486%、笔均 1.15253%、回撤 4.23380%。\n- 与旧笔均冠军相比，总收益增加 4.34393 个百分点，笔均增加 0.14630 个百分点，回撤减少 0.40942 个百分点，交易少一笔。开仓集合只少一笔，另外十笔保留交易改变了退出时间，因此改善主要来自退出行为。\n- 结果仍受合成信号交易与 gap 交易影响。当前没有接受参数。下一轮交接写入十四个已通过反连接的提议坐标；后续运算没有启动。\n\n## 2026-08-05——项目管理 Dashboard 新增面向人的项目导览\n\n- 增加默认打开的人类专用导览首页，包含两张响应式流程图：四种正式 campaign 模式及共用执行路径，以及一笔交易的因果生命周期。\n- 依据既有管理清单自动生成分组目录。目录链接打开当前正式文档，左上角项目图标返回导览。\n- 将「项目导览」固定为左侧目录第一项，并让它与其他管理文档共用相同的文档页头、元数据、正文宽度、字体、页内目录和响应式页面框架。\n- 导览没有加入文档 manifest 或 AI 优先阅读矩阵。桌面与 390 像素手机检查覆盖双语、主题、导航与横向溢出，未发现可见布局问题。\n\n## 2026-08-05——更严格开仓迁移与增量迁移发布程序闭合\n\n- 使用四个工作线程闭合一个包含三个坐标、243 笔交易的 K200 确认批次，中间没有生成 HTML。相较 K1.1 的 89 笔，K1.2／K1.3／K1.4 降到 83／83／77 笔；K200 成本后收益降到 46.9394%／29.3673%／19.7248%。\n- 冻结三个坐标并使用四个工作线程迁移到 SImain。目标交易数为 85／73／67，成本后收益为 16.4678%／33.9182%／35.6004%。K1.3／K1.4 相较 K1.1 父锚点也改善目标回撤与非 gap 收益。\n- 统一发布一次 247 候选跨品种入口。固定迁移构建器通过同卷硬链接复用父运行的 244 个确定性目标逐笔区块，只生成三个新区块；逐笔清单记录 reused=244、generated=3。\n- 为固定对比构建器增加 `--run-id`，并通过 `run_config.json::incremental_parent_run` 绑定后续增量发布。\n- 通过固定阶段分析程序生成原品种侧三个坐标的本轮总入口与逐笔分析，同时关闭累计刷新。4,747 坐标 K200 稳定快照及其约 71.4 万笔历史交易没有重建。\n\n## 2026-08-05——方案驱动的 244 候选迁移重新交付完成\n\n- 增加经审阅的迁移方案文件，保存相对原品种／目标品种身份字段，并把候选过滤状态标为待定。\n- 将用户指定的 180 候选结果与修复后来源的 64 候选结果合并为一份 244 候选排序；坐标重合为零，两份已完成来源运行继续保留为证据。\n- 移除迁移批次字段，把原品种总收益放在目标品种总收益前一列，加入三态排序，并让全部品种名称由方案驱动。\n- 增加原品种总入口与跨品种入口的新标签页双向导航，发布一份合并 SImain 逐笔分析与双语迁移报告。\n- 在双语项目管理中记录「额外修改必须获得许可」与五项最终迁移交付契约。针对性浏览器检查覆盖受影响交互，没有运行错误或可见布局错误。\n\n## 2026-08-05——五轮 K200 单轴探索只发布一次\n\n- 使用四个 worker 运行五个不可变三坐标轮次；每个不受支持的方向结束后都回到 E480／BH171／TRW12／K1.26／W6／M4.5／S388 锚点。原始运算新增十五个坐标与 1,707 笔交易。\n- BH205／257／480、TRW13／14／15、K1.4／1.5／1.6 及 K1.15／1.05／0.95 均没有改善锚点。W7 成本后收益为 82.4664%，W6 为 82.4352%，但 W8／W9 降到 75.2452%／75.4916%；W7 的笔均更低、回撤略高、剔除 gap 后收益也更低。\n- 每个中间轮都保留原始证据、解释 JSON 与通过反连接的下一轮 CSV，没有生成 HTML。最终表头 CSV 以 `parameter_acceptance=none` 关闭本组探索。\n- 整组结束后统一发布一次累计 HTML。快照 `7528265de87be7e855f8e2c80585c52de95c248f0747ca60c1f3a7bcc5ae81b2` 包含 4,732 个坐标、712,108 笔交易、八个兼容阶段和零重复坐标；稳定总入口与共享逐笔入口均指向该快照。\n- 运算内存保持在 4,096 MiB 门槛以上；最终发布期间观察到的可用内存始终高于约 4.4 GiB。最终发布进程正常退出。\n\n## 2026-08-05——采用探索小批量与末轮统一发布 HTML\n\n- 这项历史更新把孤立单点改为有边界、符合尺度的单轴方向集合与锚点，其余参数全部固定。固定点数限制已被 2026-08-06 跳跃／网格循环取代。\n- 可续跑 campaign 运行器默认让中间轮次延后累计 HTML。最终发布或用户要求的提前发布需要使用 `--publish-html`，并继续支持已有的后台或同步交付模式。\n- 已更新双语目标、约束、研究指南、campaign 工作流、架构、事实来源、决策与当前记录。已有原始证据与已发布快照保持不变。\n\n## 2026-08-05——E 窗口缩小实验已发布\n\n- 通过两个四-worker 阶段运行十三个固定其他参数的新 E 坐标：E=304、256、192、160、136、112、96、80、64、48、32、24、16。原始闭合新增 1,388 笔交易。\n- 发布累计快照 `b077548e654277738e1d953ce7bea01eb184a0e223f064c7728dbc2de4d1a561`，包含 4,717 个坐标与 710,401 笔交易。稳定总入口和共享逐笔入口均已纳入全部新坐标。\n- 第一次阶段计划使用了分析器无法识别的状态名称。完整原始字节已经原样移入 `results\\staging_recoverable\\entry_window_reduction_plan_status_failed_20260805`，没有删除文件；获批准的替代阶段产生了相同的八坐标原始汇总。\n- 项目长期规则已经加入最小实现、减少防御性代码与按风险限制核验。本实验的最终证据只保留不可变原始闭合、交付完成、新坐标／交易已纳入及两个入口文件存在。\n- 全量累计发布仍是性能瓶颈：每个小阶段都会重建约 71 万笔交易的不可变快照。增量发布继续作为待确认的性能改进，本任务没有实施。\n\n## 2026-08-05——澄清滚动总和均值标签并审计开仓因果性\n\n- 将累计页面的方法显示从「滚动 TR 总和」改为「滚动 TR 总和均值」，覆盖当前生成器、用户指定快照、别名、状态摘要与阶段页面源码。实际值继续为 `rolling_tr_sum`；筛选、排名、坐标、逐笔与收益保持不变。\n- 确认实际公式：BH=171、TRW=11 形成 161 个重叠 11 原子窗口和，基准是这些窗口和的平均值。所选 2026-06-26 交易记录基准 4.6642857、阈值 6.53、下跌 7.0、比例 1.5007657。\n- 审计源码索引与领先坐标的全部 114 笔交易。每笔均满足 `baseline_start \u003c= baseline_end == H \u003c signal \u003c= entry`；引擎只从当前信号计算时已经观察的 bar 中选择 H，拒绝同 bar H／信号顺序，并保留批量结果与逐步前缀结果相等的测试。\n- 红色 E 大区间是高点搜索范围，并非实际净下跌区间。所选交易的 E 为 19:15:15–20:35:00，BH 为 19:30:00–20:12:30，实际净下跌从 20:12:30 的 H 延伸至 20:35:00 的信号。当前逻辑没有读取未来资料，但 BH 包含完整 H 原子。严格截止到 H 前一根的基准会形成新方法，需要新源码身份与全新结果。\n- 聚焦浏览器 QA 确认新标签、未改变的 `rolling_tr_sum` 值、单一方法选项、已加载排名与逐笔路由、零运行错误、零外部请求、无替换字符和无页面溢出。目视检查未发现截断、重叠、乱码或不对称。\n\n## 2026-08-05——发布低延迟纯图标累计筛选面板\n\n- 将文字与三角形切换改为固定尺寸的纯 SVG 折线箭头披露按钮。按钮没有可见标签，展开时朝上、缩小时朝下，并保留英文无障碍标签与 `aria-expanded` 状态。\n- 使用 `contain: layout paint` 隔离大型排名表。按钮处理耗时最高 0.3 毫秒，12 次切换的下一帧 p95 为 14.9 毫秒，替代此前观测到的 150–450 毫秒重绘延迟。\n- 将纯 UI 变更发布到用户指定快照 `e4a20d1d5bcb8974f4341a3647e2e246c3c1ab855d66ce4b3d7d4998d7fb3d44` 及其 `analysis_report.html` 别名，并同步更新分析与完成清单哈希。分析数据、原始逐笔、排名及其他全部快照产物保持不变。\n- 聚焦浏览器检查覆盖缩小、再次展开、箭头方向、固定按钮尺寸、ARIA 状态、桌面与精确 390 像素手机布局、运行错误、外部请求、替换字符和页面溢出。目视检查未发现重叠、乱码、不对称或异常空白。\n\n## 2026-08-05——分离策略、品种与 campaign 契约\n\n- 新增与品种无关的策略协议、已就绪 K200 配置、未完成 SImain／NQ 模板，以及覆盖 `transfer_exact`、`target_local_refinement` 与 `fresh_search` 的 campaign manifest 模板。\n- 新增通用成本加载器，按参考价乘以 point value 计算名义价值，同时保留历史 K200 数值契约与旧字段。\n- schema-v5 计划新增品种配置、campaign 模式、可选情景策略和排名谱系身份；旧计划行为继续保留。\n- 累计成本处理改为保留每个来源阶段绑定的模型。现有 K200 结果保持不变；后续兼容 K200 行披露实际成本并进入同一谱系排名。\n- 双语项目管理与简短指令格式已经更新。本次没有运行回测、写入原始结果、重建累计结果或接受参数。\n\n## 2026-08-05——增加毛／成本后对比口径与成对总收益列\n\n- 新增 K200 风格双选项收益口径控件，默认采用手续费／滑点后，也可以切换到无手续费／滑点。所选口径同步改变排名，以及 K200／SImain 的总收益、中位单笔、最大回撤和胜率。\n- 保留 K200／SImain 两种收益口径，并按参数、SImain 指标、K200 指标与迁移诊断形成最终列分组。K200 总收益悬停说明解释其更长的评价区间。\n- 保留已完成运行选择器、全文／字段筛选与纯展示累计导航壳，同时加入新的收益口径轴。\n- 根据保留的原品种／目标品种逐笔 CSV 推导毛收益展示指标，只重建派生 HTML／数据资源；冻结候选、目标逐笔、迁移 CSV／JSON 与不可变累计快照文件保持不变。\n\n## 2026-08-05——恢复可选择、全字段可过滤的跨品种审阅\n\n- 新增由已完成运行目录驱动的原品种、原样本区间、被比较品种与被比较区间选择器。当前默认仍为 K200 2026-05-26 至 2026-07-08，对比 SImain 2026-01-29 至 2026-02-23。\n- g-only multi-metric candidates; four workers; no target metric in selection; no intermediate or final HTML.\n- Candidate authority: the corrected freeze requires positive cost-adjusted training return. It retains six previously evaluated headline controls and adds 94 exact coordinates not previously run over the later month. The period itself is reused, so the result is parameter-level new evidence and period-level post-hoc evidence.\n- Closure: 29/100 later returns are positive, 28/100 are positive with at least ten trades, and 8/100 have positive non-gap return. Median later return is -0.671%; mean is -1.049%; median drawdown is 13.048%; train/later Spearman is -0.346.\n- Interpretation: the high-total branch around E320–432/BH200–240/TRW18–23/W6/M4.5 is positive but gap-dependent. The BH612/S308 low-frequency branch contributes the few non-gap-positive results, with only 8–15 trades and high positive-return concentration. Current training leaders do not transfer reliably; `parameter_acceptance=none`.\n- Superseded attempt: the earlier root without `_v2_` admitted twelve cost-negative training candidates through an unadjusted non-gap queue. It remains historical, invalid-for-decisions evidence and is replaced by the corrected run.\n\n## 2026-08-07 — K200 train/test/SI triple comparison closed\n\n- Design: retain the completed 250-candidate SI population; select and freeze 100 additional candidates from closed K200 temporal evidence without reading their SI outcomes; evaluate the new freeze on SI; replay all 350 over the K200 test interval. The final page displays K200 training, K200 test, and SI return together.\n- Closure: K200 test contains 34,248 trades and 199 positive candidates. SI contains 48,022 trades and 275 positive candidates. Three-column positives total 149; the new 100 contribute 72 K200-test positives, 59 SI positives, and 43 three-column positives.\n- Rank evidence: overall Spearman is -0.349 for train/test, +0.319 for train/SI, and +0.003 for test/SI. The new 100 were selected with K200 temporal evidence, while the old 250 had prior SI selection; no candidate has three pristine unseen columns.\n- Interpretation: a seven-point neighborhood around E320/BH240/TRW12/K1.25/W6, M4.25–4.75, S340–370 has median returns +50.123%/+8.827%/+14.350%, but median K200-test non-gap return is -12.213%. Preserve the strategy skeleton and test short-window re-estimation on future unseen K200 data; do not accept a static parameter. `parameter_acceptance=none`.\n\n## 2026-08-07 — K200 four-slice temporal migration closed\n\n- Design: training source `2026-05-26 00:00:00` through `2026-07-08 23:52:00`; test begins at the next 15-second bar. R1 uses 400 source-only multi-metric candidates. R2 and R3 freeze repeated, neighboring, and diverse source candidates from closed earlier slices. R4 is frozen before the final unseen week. The full replay evaluates the unchanged R4 freeze and is descriptive.\n- Closure: R1/R2/R3/R4 each contain 400 coordinates and 18,886/15,006/13,985/12,505 trades. Their positive-coordinate counts are 296/26/383/25. The full replay contains 400 coordinates and 62,375 trades; 196 are positive over the aggregated interval.\n- Stability: 218 candidates have four-slice coverage and two are positive in every slice. Those two have 11 and 13 full-test trades, worst-slice returns of +0.048% and +0.160%, and 100% median Top-2 concentration. The best at-least-20-trade three-of-four candidate is E30/BH456/TRW9/K0.8/W32/M0.5/S144: +10.661% full-test return, -3.095% worst slice, and 7.566% drawdown.\n- Transfer diagnosis: training/full-test Spearman is -0.26169. The training leader E480/BH171/TRW12/K1.26/W7/M4.5/S388 records -1.567% full-test return and 14.902% drawdown. Classification: `no_static_general_parameter_found`; retain regime-sensitive short-window fitting as an untested future direction. `parameter_acceptance=none`.\n\n## 2026-08-06 — Six-hour K200 leap/grid cycle closed\n\n- Execution: four workers complete
