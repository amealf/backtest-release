Code\\data\\ibkr\\SImain\\SImain_15s_20260128_20260223_session_filled.csv` | `2026-01-29 00:00:00` | `2026-02-23 23:59:45` |\n| K200 test replay for the combined 350 candidates | `D:\\Code\\backtest-release\\Backtest V4.4\\runtime_inputs\\market_data\\k200_clean_15s_session_filled.csv` | `2026-07-08 23:52:15` | `2026-08-07 03:21:45` |\n| K200 current-optimal 100-candidate initial forward replay | `D:\\Code\\backtest-release\\Backtest V4.4\\runtime_inputs\\market_data\\k200_clean_15s_session_filled.csv` | `2026-07-08 23:52:15` | `2026-08-07 03:21:45` |\n| K200 current-optimal positive-training 100-candidate corrected replay | `D:\\Code\\backtest-release\\Backtest V4.4\\runtime_inputs\\market_data\\k200_clean_15s_session_filled.csv` | `2026-07-08 23:52:15` | `2026-08-07 03:21:45` |\n","modified":"2026-08-07T22:40:37.115Z","missing":false},{"id":"backtest-management.zh","pair":"backtest-management","group":"work","path":"03_active_work/BACKTEST_MANAGEMENT.zh.md","lang":"zh","title":"回测管理","lead":"每次回测必须记录品种、数据文件与实际回测区间。","policy":"每次启动回测前阅读并追加；回测中途停止时仍保留该行。","lifecycle":"active","authority":"operational","readWhen":"每次运行回测前。","updateWhen":"每次启动回测前。","privateLookup":false,"markdown":"# 回测管理\n\n## 必做操作\n\n每次启动回测前，在本文档追加一行，记录：\n\n- 品种；\n- 本次回测实际读取的数据文件；\n- 回测区间的开始时间；\n- 回测区间的结束时间。\n\n起止时间以本次回测实际使用的区间为准。数据文件中仅用于预热或尚未使用的后续数据不计入区间。回测中途停止时仍保留该行，确保每次启动都有记录。生成 HTML 与这项记录无关。\n\n原始计算闭合后，在本次结果包的 `EXPERIMENT.md` 和 `evaluation_manifest.json` 中登记结果。目录由品种和精确评价区间确定。记录候选集来源、计划、完成状态、参数汇总、不可变逐笔记录、逐笔入口，以及使用该结果包的比较方案。实验角色只写入这些记录，不改结果包目录名。\n\n新运行完成后，填写 `runtime_inputs\\templates\\EVALUATION_PACKAGE_SPEC.template.json`，再调用 `tools\\register_v4_4_evaluation_package.py`。声明文件把运行专用汇总列映射为共享参数／指标字段。已有结果包清单保持不可变；同一品种和区间的另一组候选，需要通过经过确认的发布改动，在同一结果包内增加候选集产物。\n\n这套规则适用于所有品种和评价区间。已就绪品种配置、完整数据契约、精确起止时间和已授权实验计划共同构成执行边界；管理规则不再依赖 K200 专用命名。\n\n## 回测记录\n\n| 品种 | 数据文件 | 回测开始时间 | 回测结束时间 |\n| --- | --- | --- | --- |\n| K200 时间迁移 R1 | `D:\\Code\\backtest-release\\Backtest V4.4\\runtime_inputs\\market_data\\k200_clean_15s_session_filled.csv` | `2026-07-08 23:52:15` | `2026-07-17 05:59:45` |\n| K200 时间迁移 R2 | `D:\\Code\\backtest-release\\Backtest V4.4\\runtime_inputs\\market_data\\k200_clean_15s_session_filled.csv` | `2026-07-20 08:45:00` | `2026-07-25 05:59:45` |\n| K200 时间迁移 R3 | `D:\\Code\\backtest-release\\Backtest V4.4\\runtime_inputs\\market_data\\k200_clean_15s_session_filled.csv` | `2026-07-27 08:45:00` | `2026-08-01 05:59:45` |\n| K200 时间迁移 R4 最终留出 | `D:\\Code\\backtest-release\\Backtest V4.4\\runtime_inputs\\market_data\\k200_clean_15s_session_filled.csv` | `2026-08-03 08:45:00` | `2026-08-07 03:21:45` |\n| K200 时间迁移全测试期描述性重放 | `D:\\Code\\backtest-release\\Backtest V4.4\\runtime_inputs\\market_data\\k200_clean_15s_session_filled.csv` | `2026-07-08 23:52:15` | `2026-08-07 03:21:45` |\n| SI 精确迁移新增 100 组时间迁移候选 | `D:\\Code\\data\\ibkr\\SImain\\SImain_15s_20260128_20260223_session_filled.csv` | `2026-01-29 00:00:00` | `2026-02-23 23:59:45` |\n| K200 测试集重放合并后的 350 组候选 | `D:\\Code\\backtest-release\\Backtest V4.4\\runtime_inputs\\market_data\\k200_clean_15s_session_filled.csv` | `2026-07-08 23:52:15` | `2026-08-07 03:21:45` |\n| K200 当前优参数 100 组初步后续重放 | `D:\\Code\\backtest-release\\Backtest V4.4\\runtime_inputs\\market_data\\k200_clean_15s_session_filled.csv` | `2026-07-08 23:52:15` | `2026-08-07 03:21:45` |\n| K200 当前优参数训练期成本后为正 100 组修正重放 | `D:\\Code\\backtest-release\\Backtest V4.4\\runtime_inputs\\market_data\\k200_clean_15s_session_filled.csv` | `2026-07-08 23:52:15` | `2026-08-07 03:21:45` |\n","modified":"2026-08-07T22:40:37.116Z","missing":false},{"id":"decisions.en","pair":"decisions","group":"reference","path":"04_decisions/DECISIONS.en.md","lang":"en","title":"Decisions","lead":"Accepted, retired, and reversed durable choices with rationale.","policy":"Update when a durable choice is accepted, retired, or reversed.","markdown":"# Decisions\n\n## 2026-08-09 — Keep paired K200 reviews on the current page\n\n- Open the exact training/test counterpart inside the current review page instead of navigating away.\n- Provide an explicit hide control and Escape handling. Unload the paired iframe on close to release its renderer.\n- Keep the established button vocabulary. Omit the embedded `当前参数` card and hide outer content while the overlay is open.\n\n## 2026-08-09 — Publish V4.41 through Scheme A\n\n- Publish the GitHub source, one compact Windows source ZIP, its SHA-256 sidecar, its machine audit, and annotated tag `V4.41`.\n- Exclude multi-gigabyte historical trade ledgers from public release assets. Keep the complete 2026-08-08 handoff local and independently recoverable.\n- Require the compact release to pass from an independent extraction. The release gate is 112 passed, 2 explicit historical-artifact skips, and 0 failed.\n- Keep the 2026-08-08 compact review archive immutable as historical evidence. A failed preflight package has no release authority and is never uploaded.\n\n## 2026-08-08 — Keep V4.41 packaging recoverable and proportional\n\n- Require immutable raw batch trade ledgers for every completed stage; include a derived stage ledger only when that stage produced one, and never recompute it for packaging.\n- Keep canonical reports in the project handoff tree so `.omo` can be recycled without breaking future packages.\n- Verify source-to-staging copies, the manifest record set, ZIP names/sizes, forbidden/duplicate paths, and the whole-archive SHA-256. Omit redundant extraction and per-entry ZIP rehashing.\n- Move an older package or staging copy to the Recycle Bin only after its replacement passes.\n\n## 2026-08-08 — Include representative screenshots in visual deliveries\n\n- Whenever completed work has a visible result and the environment allows it, include one representative screenshot and judge basic display errors.\n- Use Computer Use to open local Chrome `file:///` pages when ordinary browser automation cannot access the path. This does not expand small changes into broad browser matrices.\n\n## 2026-08-08 — Separate the V4.41 release label from the V4.4 result lineage\n\n- Use V4.41 for the active release, page headings, and package metadata.\n- Keep V4.4 as the strategy major version, result identity boundary, parameter namespace, and cumulative ranking major version.\n- Treat this release as minor: earlier compatible V4.4 results remain active in the same cumulative ranking and are not archived or excluded.\n\n## 2026-08-08 — Pair K200 training and test reviews by exact coordinate\n\n- Training/test navigation names the destination and carries the exact `combo_id`; it never translates or approximates parameter values.\n- Entry audit numbers belong beside their textual explanation rather than over the price chart. The chart keeps the evidence paths and moves its legend below the x-axis.\n- Presentation refreshes remain shell-only. Result data and deterministic trade chunks keep their existing identities.\n\n## 2026-08-08 — Identify result packages by instrument and exact dates\n\n- The project is no longer organized around one instrument or fixed train/test directory names. Any executable instrument profile and exact evaluated interval can produce an independent result package.\n- Directory identity is `\u003cinstrument_id>\\\u003cstart_YYYYMMDDTHHMMSS>__\u003cend_YYYYMMDDTHHMMSS>`. Experiment roles such as training, test, transfer, holdout, and descriptive replay are declared in `EXPERIMENT.md` and `comparison_plan.json`.\n- The generic comparison entry reads package-owned browser summaries and joins exact `combo_id` values. Candidate-selection methods remain independent and are not part of this framework change.\n- Existing stable and completed main/per-trade pages remain compatibility contracts. A stable redirect changes only after exact data parity and browser-visible parity pass; retained pages and the prior entry remain available for rollback.\n\n## 2026-08-07 — Present K200 training, K200 test, and SI in one migration entry\n\n- Retain the completed 250-candidate SI population, freeze 100 additional K200-temporal candidates before reading their SI outcomes, and anti-join the two populations exactly.\n- Replay all 350 candidates on K200 test data and present the three total-return columns together with role-relative labels. Evidence roles remain explicit: old-candidate SI and new-candidate K200 test are descriptive rather than pristine validation.\n- Publish HTML once after compute. Reuse the retained 250 SI per-trade chunks and generate only the 100 additions. A promising neighborhood remains unaccepted when its K200 test return depends on gap trades.\n\n## 2026-08-07 — Evaluate live subsequent data with sequential unseen slices\n\n- Freeze each round before evaluating its next time slice. Later rounds may use closed earlier slices, but they cannot read or tune within the slice they are about to evaluate.\n- Keep the latest declared slice as the final holdout. A replay over the complete subsequent interval is post-hoc descriptive evidence and cannot become a second validation claim.\n- Compare total return, average/median trade, drawdown, trade count, non-gap return, concentration, worst-slice return, and neighborhood evidence without a combined score. Sparse all-positive candidates remain observations, not accepted parameters.\n\n## 2026-08-07 — Keep a contract and merge README in every data-download directory\n\n- Every instrument acquisition directory contains its own `README.md`, created with the directory and refreshed on every resume and completion.\n- The README records update times, source interval, main-contract calculation, exact contract split, adjustment policy, lineage, merge rules, and principal files.\n- A supplement explicitly distinguishes a freshly recomputed main-contract decision from an inherited audited decision. The chronological update table remains with the downloaded data so future multi-instrument management does not depend on conversation history.\n\n## 2026-08-07 — Record every backtest in one management document\n\n- Before compute starts, append one row to `03_active_work\\BACKTEST_MANAGEMENT.en.md` and its Chinese mirror.\n- Each row records the instrument, exact market-data file, evaluated start time, and evaluated end time. File-only warm-up and later unused rows stay outside the recorded interval.\n- Keep the row when a launched run stops early. This record is independent from raw-result closure and HTML publication.\n\n## 2026-08-06 — Use a repeating AI-led leap/grid exploration cycle\n\n- AI performs one or more leap-search rounds across nonadjacent legal regions, selects promising mutually nonadjacent anchors from closed multi-metric evidence, runs finite one-parameter grids around them, then returns to leap search.\n- Individual rounds may be phase-specific. The complete cycle preserves separately labeled leap and grid evidence; local grids cannot establish global convergence.\n- One-parameter grids have no fixed point-count cap. Each plan freezes finite bounds, exact values or steps, anchor, expected coordinates, resource limits, and completed+active+pending anti-join evidence before compute.\n- The user reviews summaries and may correct objectives, anchors, ranges, or direction between cycles. During an explicitly authorized unattended period, AI may continue rounds inside the frozen instrument, method, data, duration, and resource boundary.\n- This decision supersedes the fixed two-or-three-point rule and the requirement that broad and refinement blocks coexist in every individual round. Deferred intermediate HTML and one final cumulative publication remain unchanged.\n\n## 2026-08-05 — Historical directional-grid and deferred-HTML decision\n\n- Change one parameter per exploration batch and hold every other parameter at the current anchor.\n- Use a bounded scale-aware directional set together with the anchor. The fixed point-count portion of this decision is superseded by the 2026-08-06 leap/grid cycle; single-parameter attribution remains current.\n- Intermediate rounds close immutable raw evidence and compact summaries only. Publish the cumulative main and shared per-trade HTML once after the exploration series ends, or earlier only when the user explicitly requests it.\n- The resumable campaign runner defers HTML by default. The final round opts in with `--publish-html`. This decision supersedes earlier requirements to publish cumulative HTML after every round.\n\n## 2026-08-05 — Use strict-entry source Pareto selection for the second exact SImain transfer\n\n- Freeze at most 100 source-only candidates from completed K200 evidence. Use the unrestricted fixed-cost total-return top 20% with at least 10 trades, exclude the original 180 transfers and current primary-view champions, and retain only W/M/S families already represented in the original transfer.\n- Within each W/M/S family, vary only E/BH/TRW/K and retain the nondominated set on higher K200 cost-adjusted return, higher `median(entry_baseline_value × K)`, and lower K200 trade count. Do not use a combined score.\n- Reuse the exact prior SIH6 target contract and append the completed batch to one shared SImain migration main entry and one shared per-trade entry. Do not run a SImain local grid.\n- The aggregate cross-instrument Pareto set maximizes K200 cost-adjusted total return, SImain cost-adjusted total return, and SImain median cost-adjusted trade while minimizing SImain trade count and maximum drawdown.\n\n## 2026-08-05 — Separate strategy, instrument, and campaign authorities\n\n- Strategy semantics are instrument-neutral. Instrument data, cost, gap, low-activity, scenarios, and ranking lineage live in an instrument profile.\n- Campaign intent is explicit: `transfer_exact`, `target_local_refinement`, or `fresh_search`.\n- Cost and gap rules must be confirmed by the user for a new instrument. Missing values block execution.\n- Compatible K200 additions stay in the current rank lineage. Other instruments use separate ranks; cross-instrument views compare evidence without merging ranks.\n- Existing K200 results are not rebuilt. Future cumulative construction retains the cost model bound to each source stage.\n\n## 2026-08-05 — Cross-instrument scope selection is file-backed and result-neutral\n\n- The four scope selectors enumerate completed comparison runs and navigate to their retained pages. They do not create candidates or start target compute from the browser.\n- Every displayed column remains sortable and filterable. Filtering changes only the visible row population; it does not alter metrics, frozen candidates, reports, or parameter acceptance.\n- The stable cumulative entry provides navigation while the current cumulative snapshot remains byte-preserved and authoritative for its own results.\n\n## 2026-08-04 — Store all V4.4 results physically on F while preserving the D logical path\n\nThe authoritative physical result root is `F:\\Backtest\\Backtest V4.4\\results`. The established path `D:\\Code\\backtest-release\\Backtest V4.4\\results` remains as a Windows directory junction so historical absolute paths, manifests, plans, and HTML continue to work. Future result writers use the same logical root and therefore write physically to F. A verified recovery copy and recoverable old-result quarantine remain on F; no permanent deletion is part of the migration.\n\n## 2026-08-04 — Use composable minute ranges for all four main timing windows\n\nThe cumulative main entry exposes entry baseline BH, entry market E, exit baseline W, and exit market S as independent minute-range filters. Each control supports any number of selected intervals. Selections are ORed within one control and ANDed across controls; `All` means unrestricted. This is a derived presentation filter and cannot alter ranking inputs, raw trades, or parameter acceptance.\n\n## 2026-08-04 — Continue parameter exploration in the existing cumulative lineage\n\n- Keep campaign ID/root `v4_4_cost_adjusted_multiround_20260803`; do not create a separate result branch.\n- Compare every new coordinate against all compatible completed coordinates in one cumulative ranking and one shared per-trade HTML. Round 10 expanded that set from 3,584 to 3,667.\n- Continuation Round 10 closed at 83 coordinates after exact anti-join against 3,585 completed current-V4.4 coordinates. Its average-return leader improved, while negative median trade and concentration remained. The resulting stop record remains historical evidence; the user's 2026-08-04 instruction reopens the same lineage with bounded broad controls and evidence-led local refinement. `parameter_acceptance` remains `none`.\n- Continuation Round 11 improved the average-return candidate to W10/M2.5 while reducing drawdown and best-two concentration. Round 12 therefore refines the supported W/M/S surface and retests entry modules at the new exit anchor, with small distant W/M/S controls.\n- Preserve independent Scenario-1 and unrestricted objectives, multi-metric judgment, broad-jump coverage, per-row selection reasons, and `parameter_acceptance=none`.\n\n## 2026-08-04 — Make the Parameter Exploration Guide mandatory\n\n- Every parameter-exploration agent reads and follows the bilingual guide before design, compute, interpretation, or next-round handoff.\n- Each round may mix broad jumps, local axes, same-module pairs, trade-type experiments, and stability checks. Broad-jump coverage remains under consideration throughout exploration.\n- E, BH, and S use relative multiplicative grids instead of continued single-digit absolute-step refinement. TRW/W, K/M, and A/floor use the parameter-specific resolutions recorded in the guide; the finest grid is a stability check, not a new peak-seeking phase.\n- The current cycle returns to leap search after supported finite grid phases. Individual rounds may be phase-specific, and local grids cannot establish global convergence.\n- Improvement is a model-explained multi-metric judgment. No metric receives a permanent high weight and no fixed aggregate score selects candidates.\n- Future exploration cost is fixed at `3.57 bps` per completed round trip.\n- Every round hands off expanded next-round coordinates in a standalone `next_round_parameters.csv`, including hypotheses and selection reasons, before plan binding and anti-join gates.\n\n## 2026-08-04 — Use risk-tiered validation instead of routine full-suite runs\n\n- Version upgrades and changes affecting engine behavior, fills, returns/costs, data preparation, schemas, execution contracts, or result semantics require the complete regression suite.\n- Frontend filters, sorting, selectors, buttons, navigation, and state synchronization use focused interaction checks.\n- Presentation-only copy, style, spacing, color, typography, alignment, visibility, and responsive layout use regenerated HTML, a simple functional check, and desktop/mobile screenshots.\n- A presentation change escalates when it also alters behavior or data, or when its semantic impact is uncertain.\n\n## 2026-08-02 — Create V4.4 as an independent temporary version\n\nV4.4 is a copied, renamed workspace. V4.3 code and results remain unchanged. V4.4 is temporary and may receive further user-directed changes.\n\n## 2026-08-02 — Causal rebound execution\n\n- A previously established trigger uses `open >= trigger` for an open fill, then `high >= trigger` for a trigger fill.\n- A strict-new-low bar cannot use its own completed W candidate. If its close confirms the rebound against the prior completed basis, the fill is that close.\n- Equality triggers an exit.\n\n## 2026-08-02 — H-bounded W source\n\nThe W source start is `max(H, continuous_start, end-W+1)`. The H-to-entry decline remains eligible; pre-H history is excluded.\n\n## 2026-08-02 — Sample and low-activity causality\n\nOpen positions close at the declared sample-end bar close. `exclude_marked` uses causal `baseline_available_from`; `all_window` remains unchanged.\n\n## 2026-08-03 — Exact W candidate and available-prefix contract\n\n- Generate candidates from every available prefix length 1..W; do not wait for a full W or apply a minimum-window ratio.\n- Define the candidate as `w_open_to_end_low_drop = open[start] - low[end]`, not the maximum ordered decline from any internal high to a later low.\n- Retain the monotonic maximum inside one actual position, so an early shorter-prefix maximum may govern later exits. Keep legacy raw audit field names for compatibility.\n\n## 2026-08-03 — Retained pending-entry contract\n\nUse `retained_signal_fill_first_real_open`: preserve the signal for at most 120 continuous candidate bars and fill at the first real-trade bar open. Do not require a trigger recross or cancel on a higher high or structural reversal. A continuity break still cancels the wait.\n\n## 2026-08-03 — Dual gross/cost-adjusted ranking\n\nEvery primary view has gross and cost-adjusted ordering/display modes. The chosen mode changes both sorting and displayed returns; cost-adjusted is default. The selected derived model is 2 bps round-trip slippage plus USD 6 round-trip commission at 7.8 HKD/USD on HKD 300,000 notional: HKD 106.8, or 3.56 bps, per completed trade. Raw fills and raw returns remain unchanged. Mini KOSPI 200 tick facts are provenance only and are excluded from this calculation.\n\n## 2026-08-03 — Derived K200M current-notional cost reference\n\nFor future derived rankings, calculate one-contract notional from Mini KOSPI 200 price × KRW 50,000 rather than a fixed HKD amount. Freeze the latest real 15-second reference price and a dated KRW/USD reference in a hash-bound JSON record; derive the USD 6 commission in bps from that notional and add the already-confirmed 2 bps round-trip slippage. The initial frozen reference yields 3.568663594470046 bps. Existing raw results remain immutable and usable; legacy 3.56-bps outputs remain historical evidence.\n\n## 2026-08-03 — Multi-round exploration governance\n\nExplore Scenario-1-qualified and unrestricted cost-adjusted total return with multiple broad blocks before using closed evidence for concurrent broad coverage and local refinement. Each round is separately planned, hash-bound, closed, delivered, and interpreted; continuation is evidence-driven and never implies parameter acceptance.\n\n## 2026-08-03 — Active-campaign cumulative boundary\n\nThe current multi-round cumulative lineage is built only from completed stages under campaign `v4_4_cost_adjusted_multiround_20260803`. A completed stage must agree on the union identity fields within that campaign. The older temporary validation campaign has a different engine identity, remains preserved as historical evidence, and is excluded from this cumulative lineage with that reason recorded. Failed partial snapshots are retained and never promoted to stable routes.\n\n## 2026-08-03 — Terminal Round-3 boundary resolution\n\nRound 2 gave strict cost-adjusted improvement to both objective-specific local branches and no improvement to the broad branch. Stop broad exploration. Run one terminal 212-coordinate local refinement around the new Scenario-1 lower-M/upper-S boundaries and unrestricted lower-S boundary. Round 3 closes the bounded in-sample campaign regardless of its result; Round 4 and parameter acceptance are prohibited.\n\n## 2026-08-03 — Close the bounded campaign\n\nRound 3 improved the Scenario-1 objective to 30.6696% cost-adjusted but did not improve the unrestricted objective, whose Round-2 leader remains at 36.0556%. End the campaign at 831 unique coordinates and 353,874 trades. Preserve both leaders as in-sample descriptive evidence only. Do not create Round 4 or accept a parameter.\n\n## 2026-08-03 — Start a separately named continuation subseries\n\nNew user authorization permits further V4.4 exploration without reopening the closed original series. Preserve its Round-4 prohibition as historical truth; name new stages `continuation_round_*` under the same campaign ID and compatible active root. Begin with a 528-coordinate broad-span round, then refine only fully delivered promising regions.\n\nEvery continuation round must eventually complete immutable raw closure, stage main/per-trade delivery, cumulative main/per-trade refresh, and hash/browser/desktop/mobile/manual visual QA. Objectives remain independent, cost-adjusted remains default at 3.56 bps, and no parameter is accepted.\n\n## 2026-08-03 — Role-neutral pipelined execution governance\n\nOne executor or multiple executors may perform analysis, backtest compute, and HTML delivery. After immutable closure, HTML delivery and evidence analysis may run concurrently; overlapping work is permitted only under closed-source, exact anti-join, separate process/output/root/lock, single-union-writer, and live-delivery-aware resource gates.\n\nEvery round still requires eventual stage main, stage per-trade, cumulative main, cumulative per-trade, full QA, and `DELIVERY_FINAL`. Delivery no longer blocks next-round analysis or compute. A result-affecting source inconsistency discovered by delivery pauses new compute until a new source identity closes.\n\n## 2026-08-03 — Simplify per-trade chart presentation without rerunning raw compute\n\nEntry Reason step 2 uses hollow colored-outline high/entry ellipses instead of solid fills. The collapsed desktop Parameters tab moves upward by six pixels; mobile drawer positioning remains unchanged. Every candlestick interval and guide stroke is solid while its semantic color remains. The long theoretical-line/actual-fill chart annotation is removed while detailed side-panel exit reasoning remains. The green frozen-low chart label is exactly `L=\u003cformatted value>` without freeze, duration, or bar-count suffixes. Preserve the immutable Continuation Round-1 raw stage and old-source delivery, then close a new source identity before any new compute. After that closure, one corrected-source derived redelivery and Continuation Round-1 interpretation/Round-2 work may pipeline concurrently under the governance gates.\n\n## 2026-08-03 — Include transaction records in V4.4 ZIP handoffs\n\nUser-requested V4.4 ZIPs now include every completed stage's raw per-batch `trades.csv` and derived `stage_trades.csv`. They are the auditable per-parameter buy/sell records, copied under `trade_records/` with a hash-bound manifest. Retain the narrow result boundary: all other `results/` payloads remain outside the ZIP.\n\n## 2026-08-03 — Superseded stop-after-R2 boundary\n\nThe earlier stop-after-R2 boundary is superseded by the user's renewed instruction to continue parameter exploration. Complete immutable raw closure, stage/cumulative main/per-trade delivery, objective-specific interpretation, bilingual records, and read-only total audit for the current Round 2. Its delivered evidence alone may authorize a later plan; no later plan or compute is automatic. No parameter is accepted automatically.\n\n## 2026-08-03 — Supersede the V4-bound Round-2 plan before compute\n\nDo not bypass the V4-to-V5 source-identity mismatch. Preserve frozen plan `05d0d2ed...` and partial root fingerprint `976fac8d...` byte-for-byte as superseded pre-compute evidence; they contain only deterministic metadata and no progress, batch, trade, completion, or analysis. After the current source identity is confirmed, create a new bound Round-2 plan with the same audited 416 coordinates, a new filename/stage ID, and an absent output root. Exclude only the explicitly superseded V4 plan/root from the new target's active/pending anti-join. Any later round remains unapproved until current-Round-2 delivery and interpretation provide fresh evidence.\n\n## 2026-08-03 — Preserve results and consolidate future per-trade delivery\n\nPreserve all completed raw results, the current five-stage cumulative snapshot, and every existing stage page. Do not rebuild or replace them. For each future user-authorized round, update only the current cumulative main entry and the one shared cumulative per-trade entry so they include every completed compatible result. A dedicated per-round per-trade HTML page is retired as a required deliverable. Execution remains role-neutral: no subagent, separate conversation, or separate compute-versus-HTML thread is mandatory. Future compute still waits for an explicit user instruction and the established identity, anti-join, root/lock, resource, and single-writer gates.\n\n## 2026-08-03 — Reduce cumulative-main summaries and separate the speed selector\n\nRetire the four-card cumulative-main summary strip. The only summary retained in the top header is the dynamic all-strategy coordinate count. Give the S speed-window selector a full row because its option set is materially larger than the ranking-metric selector. This affects the next generated cumulative main page only; it does not authorize replacement of the sealed current snapshot.\n\n## 2026-08-05 — Replace the zero-signal K200 lineage\n\nThe user authorized removal and rerun of every coordinate that produced `baseline\u003c=0`, `drop\u003c=0`, and `K×baseline\u003c=0`. Because 4,383 of 4,704 coordinates are affected and batch manifests mix affected and unaffected coordinates, retire the entire old campaign recoverably and rerun all 4,704 coordinates under the positive-entry gate. The corrected cumulative snapshot replaces the old snapshot as current authority; the old bytes remain historical reference evidence.\n## 2026-08-06 — Confirmation-time low-activity gate and V4.4 ranking boundary\n\nPending low-volume runs have no strategy effect. At the 120th consecutive low-volume 15-second atom, the complete run from its first atom becomes excluded from every later baseline calculation; unfilled entry orders are cancelled and new entries are blocked until the first normal-volume atom. Existing positions keep their normal exit rules.\n\nK200 cumulative ranking is partitioned by accepted major version. Minor V4.4 corrections remain in the same V4.4 ranking page. Stage hashes and semantic identities remain integrity and provenance evidence. A V4.5 adoption creates a new ranking partition.\n","modified":"2026-08-08T19:27:46.187Z","missing":false},{"id":"decisions.zh","pair":"decisions","group":"reference","path":"04_decisions/DECISIONS.zh.md","lang":"zh","title":"历史决策","lead":"已确认、已退役与已反转的长期选择及理由。","policy":"长期选择被确认、退役或反转时更新。","markdown":"# 决策\n\n## 2026-08-09——K200 配对逐笔保留在当前页面\n\n- 在当前逐笔页面内打开精确的训练／测试配对结果，不离开当前页面。\n- 提供明确的隐藏按钮和 Esc 操作；关闭时卸载配对 iframe，释放对应 renderer。\n- 沿用现有按钮样式。内嵌页面不显示「当前参数」卡片，对照层打开期间隐藏外层内容。\n\n## 2026-08-09——按方案 A 发布 V4.41\n\n- 发布 GitHub 源码、一个 Windows 紧凑源码 ZIP、SHA-256 sidecar、机器审计和 `V4.41` 附注标签。\n- 数 GB 历史逐笔账本不进入公开发布资产。2026-08-08 完整交接包保存在本地，并保持独立可恢复。\n- 紧凑发布包必须通过独立解压测试。发布门槛为 112 项通过、2 项明确依赖历史文件的跳过、0 项失败。\n- 2026-08-08 紧凑审阅包继续作为不可变历史证据。失败的预发布包没有发布权威，也不会上传。\n\n## 2026-08-08——V4.41 打包保持可恢复并控制核验强度\n\n- 每个已完成阶段必须提供不可变原始 batch 逐笔账本；衍生阶段账本只在该阶段实际生成时纳入，打包不会补算。\n- 规范报告保存在项目 handoff 目录，使 `.omo` 移入回收站后仍可继续打包。\n- 核验来源到 staging 的复制、清单记录集、ZIP 名称／大小、禁止／重复路径和整包 SHA-256；省略重复解压与逐条 ZIP 哈希。\n- 替代包通过后，旧包或 staging 副本才移入回收站。\n\n## 2026-08-08——可视交付附代表性截图\n\n- 完成的工作存在可视结果且环境允许时，附一张有代表性的截图，并判断基础显示错误。\n- 常规浏览器自动化无法访问本地 `file:///` 路径时，使用 Computer Use 打开 Chrome；小改动仍不扩展成大范围浏览器矩阵。\n\n## 2026-08-08——V4.41 发布标签与 V4.4 结果谱系分离\n\n- 当前发布、页面标题和包元数据使用 V4.41。\n- 策略主版本、结果身份边界、参数命名空间和累计排序主版本继续使用 V4.4。\n- 本次属于小版本：较早且兼容 V4.4 的结果继续参与同一累计排序，不归档，也不排除。\n\n## 2026-08-08——按精确坐标配对 K200 训练与测试逐笔页面\n\n- 训练／测试切换显示目标名称，并携带精确 `combo_id`；参数不会转换，也不会近似匹配。\n- 开仓审计数值放在文字解释旁边，不再覆盖价格图。图表继续保留证据路径，图例移到横轴下方。\n- 展示刷新只处理页面外壳，结果数据和确定性逐笔区块沿用已有身份。\n\n## 2026-08-08——用品种和精确日期标识结果包\n\n- 项目不再围绕单一品种或固定的 train／test 目录名组织。任何可执行品种配置和精确评价区间都可以生成独立结果包。\n- 目录标识采用 `\u003cinstrument_id>\\\u003cstart_YYYYMMDDTHHMMSS>__\u003cend_YYYYMMDDTHHMMSS>`。训练、测试、迁移、留出和描述性重放等实验角色写在 `EXPERIMENT.md` 与 `comparison_plan.json` 中。\n- 通用比较入口读取各结果包拥有的浏览器汇总，并按精确 `combo_id` 连接。候选选择方法保持独立，不属于本次框架改动。\n- 现有稳定总入口和已完成逐笔页面继续作为兼容合同。只有精确数据一致和浏览器可见内容一致均通过后，稳定跳转才会改变；保留页面与旧入口都可用于恢复。\n\n## 2026-08-07——在一个迁移入口展示 K200 训练、K200 测试与 SI\n\n- 保留已完成的 250 组 SI 候选，在读取新增候选的 SI 结果前冻结 100 组 K200 时间迁移候选，并对两批候选执行精确反连接。\n- 将全部 350 组重放到 K200 测试期，用相对角色列名同时展示三列总收益。证据角色保持明确：原有候选的 SI 与新增候选的 K200 测试期只作描述，不能视为全新验证。\n- 运算结束后统一发布一次 HTML。复用保留的 250 个 SI 逐笔区块，只生成新增 100 个区块。较有希望的邻域若依赖 K200 测试期 gap 交易，仍不接纳为参数。\n\n## 2026-08-07——后续实时数据采用连续未见时间片评价\n\n- 每轮在评价下一时间片以前冻结候选。后续轮可以使用已经闭合的更早时间片，但不能读取或调整即将评价的时间片。\n- 最新声明的时间片保留为最终留出。完整后续区间重放属于事后描述，不能再次作为独立验证。\n- 同时比较总收益、笔均／中位单笔、回撤、交易数、非 gap 收益、集中度、最差时间片收益和邻域证据，不建立综合分数。交易稀少的全正候选只保留为观察对象，不接受为参数。\n\n## 2026-08-07——每个数据下载目录保留合约与合并 README\n\n- 每个品种的每个下载目录都包含自身的 `README.md`，目录创建时生成，恢复或完成下载时刷新。\n- README 记录更新时间、来源区间、主力合约计算方式、准确的合约切割、复权政策、血缘、合并规则和主要文件。\n- 补充批次需要区分重新计算的主力合约结论与沿用的已审计结论。更新时间表与下载数据共同保留，使后续多品种管理无需依赖对话历史。\n\n## 2026-08-07——每次回测统一写入回测管理文档\n\n- 回测运算开始前，在 `03_active_work\\BACKTEST_MANAGEMENT.en.md` 及其中文镜像追加一行。\n- 每行记录品种、实际读取的数据文件、回测开始时间和回测结束时间。仅用于预热或尚未使用的文件内容不计入回测区间。\n- 已启动的回测即使中途停止也保留记录。该记录与原始结果闭合、HTML 发布相互独立。\n\n## 2026-08-06——采用 AI 主导的跳跃／网格循环探索\n\n- AI 对互不相邻的合法区域完成一轮或多轮跳跃搜索，根据闭合的多指标证据选择互不相邻的优秀锚点，围绕锚点运行有限单参数网格，随后回到跳跃搜索。\n- 单轮可以只属于一个阶段。完整循环分别保留跳跃与网格证据；局部网格不能证明全局收敛。\n- 单参数网格不设固定点数上限。每份计划在运算前冻结有限边界、精确取值或步长、锚点、预计坐标数、资源限制和 completed／active／pending 反连接证据。\n- 用户在循环之间查看摘要，并可修正目标、锚点、范围或方向。在用户明确授权的无人值守时段，AI 可以在冻结的品种、方法、数据、时长和资源边界内继续多个轮次。\n- 本决策取代固定两至三个点的规则，也取代每个单轮必须同时包含大范围与细化区块的要求。中间轮延后 HTML、末轮统一发布的规则保持不变。\n\n## 2026-08-05——历史方向网格与延后 HTML 决策\n\n- 每批只修改一个参数，其余参数全部固定在当前锚点。\n- 采用有边界、符合参数尺度的方向集合，并与锚点比较。本决策中的固定点数部分已被 2026-08-06 跳跃／网格循环取代；单参数归因继续有效。\n- 中间轮次只闭合不可变原始证据与精简摘要。整组探索结束后统一发布一次累计总入口与共享逐笔 HTML；只有用户明确要求时才提前发布。\n- 可续跑 campaign 运行器默认延后 HTML。最终轮使用 `--publish-html` 明确开启发布。本决策取代此前每轮都发布累计 HTML 的要求。\n\n## 2026-08-05——第二批 SImain 完全迁移采用严格开仓来源 Pareto 筛选\n\n- 从已完成 K200 证据中冻结最多 100 个只使用来源数据的候选。采用固定成本后总收益前 20%且至少 10 笔交易，排除原 180 个迁移坐标和当前主要视图冠军，并只保留原迁移已经出现的 W／M／S 参数族。\n- 每个 W／M／S 参数族内部只改变 E／BH／TRW／K，保留 K200 成本后收益更高、`median(entry_baseline_value × K)` 更高且 K200 交易数更低的非支配集合。不建立综合分数。\n- 复用原 SIH6 目标合同，把完成批次追加到一个共享 SImain 迁移总入口和一个共享逐笔入口。不得运行 SImain 本地网格。\n- 合并后的跨品种 Pareto 集合最大化 K200 成本后总收益、SImain 成本后总收益与 SImain 成本后中位单笔，同时最小化 SImain 交易数和最大回撤。\n\n## 2026-08-05——分离策略、品种与 campaign 权威\n\n- 策略语义与品种无关。品种数据、成本、gap、低活跃、情景和排名谱系写入品种配置。\n- campaign 意图必须明确选择 `transfer_exact`、`target_local_refinement` 或 `fresh_search`。\n- 新品种的成本与 gap 规则由用户确认。缺失值会阻止执行。\n- 兼容 K200 新结果继续进入当前排名谱系。其他品种使用独立名次；跨品种视图比较证据但不合并名次。\n- 现有 K200 结果不重建。后续累计构建保留每个来源阶段绑定的成本模型。\n\n## 2026-08-05——跨品种范围选择以文件为依据且不改变结果\n\n- 四个范围选择器列举已完成的比较运行，并导航至其保留页面。它们不会在浏览器内创建候选或启动目标品种运算。\n- 每个展示列均可排序和过滤。过滤只改变可见行集合，不修改指标、冻结候选、报告或参数接受状态。\n- 稳定累计入口提供导航；当前累计快照保持字节一致，并继续作为其结果的权威证据。\n\n## 2026-08-04——V4.4 结果物理存放于 F 盘并保留 D 盘逻辑路径\n\n权威结果物理根目录为 `F:\\Backtest\\Backtest V4.4\\results`。既有路径 `D:\\Code\\backtest-release\\Backtest V4.4\\results` 继续作为 Windows 目录联接，使历史绝对路径、清单、计划与 HTML 保持可用。后续结果 writer 继续使用同一逻辑根目录，因此字节物理写入 F 盘。F 盘保留已核验恢复副本与可恢复旧结果隔离区；迁移过程不进行永久删除。\n\n## 2026-08-04——四组主要时间窗口统一使用可组合分钟区间\n\n累计总入口把开仓基准 BH、开仓行情 E、平仓基准 W 与平仓行情 S 作为四个独立分钟区间筛选器。每组均可选择任意数量的区间；组内取并集，组间取交集，「全部」表示不限制。本功能属于衍生展示筛选，不改变排名输入、原始逐笔或参数接受状态。\n\n## 2026-08-04——在既有累计 lineage 中继续参数探索\n\n- 保持 campaign ID／根目录 `v4_4_cost_adjusted_multiround_20260803`，不建立独立结果分支。\n- 每个新坐标都要在同一累计排名和同一个共享逐笔 HTML 中与全部兼容已完成坐标比较。第十轮把该集合从 3,584 个扩展到 3,667 个。\n- Continuation 第十轮在对 3,585 个当前 V4.4 已完成坐标精确反连接后按 83 个坐标闭合。笔均收益领先组合继续改善，但逐笔中位数为负且集中性仍高。原停止记录保留为历史证据；用户于 2026-08-04 要求在相同 lineage 中恢复边界内大跨度对照与基于证据的局部细化。`parameter_acceptance` 继续为 `none`。\n- Continuation 第十一轮把笔均收益候选改善到 W10／M2.5，同时降低回撤与最佳两笔集中度。第十二轮因此细化已获支持的 W／M／S 表面，并在新退出锚点下重测入口模块，同时保留少量远端 W／M／S 对照。\n- 保留情景一与全坐标独立目标、多指标判断、大跨度覆盖、逐行选择理由及 `parameter_acceptance=none`。\n\n## 2026-08-04——参数探索必须遵守统一指南\n\n- 每个参数探索 agent 在设计、运算、解释或交付下一轮参数前，都要阅读并遵守中英文指南。\n- 每轮可以同时安排大跨度跳跃、单参数局部、同模块双参数、交易类型和稳定区域实验。整个探索期间都要考虑大跨度覆盖。\n- E、BH、S 使用相对乘法网格，不再按个位数绝对步长持续细化。TRW／W、K／M 与 A／floor 采用指南规定的参数分辨率；最细网格只检查稳定性，不用于继续追逐新峰值。\n- 当前循环在有限网格阶段得到支持并闭合后回到跳跃搜索。单轮可以只属于一个阶段，局部网格不能证明全局收敛。\n- 改善由模型结合多项指标解释。任何指标都没有长期固定高权重，也不使用固定综合分数挑选候选。\n- 后续探索对每笔完整往返交易固定使用 `3.57 bps` 成本。\n- 每轮都要在独立文件夹中用 `next_round_parameters.csv` 交付完整展开的下一轮坐标、假设和选择理由，再进入计划绑定与反连接门槛。\n\n## 2026-08-04——采用风险分级验证，不再例行运行完整测试\n\n- 版本升级，以及影响引擎行为、成交、收益／成本、数据准备、schema、执行契约或结果语义的变化，需要完整回归测试。\n- 前端筛选、排序、选择器、按钮、导航和状态同步采用针对性交互检查。\n- 纯文案、样式、间距、颜色、字体、对齐、可见性和响应式布局采用重新生成 HTML、简单功能检查及桌面／手机截图。\n- 展示变化同时影响行为或数据，或语义影响不明确时，提高验证级别。\n\n## 2026-08-02——建立独立临时 V4.4\n\nV4.4 是复制并改名后的独立工作区。V4.3 代码与结果保持不变。V4.4 仍为临时版本，可继续接受用户指定修改。\n\n## 2026-08-02——因果回撤成交\n\n- 已存在触发线时，`open >= trigger` 按 open 成交；否则 `high >= trigger` 按 trigger 成交。\n- 严格创新低 bar 不能使用自身完结后的 W 候选值。若该 bar 的 close 相对此前完结基准确认反弹，则按该 close 成交。\n- 等于边界也触发平仓。\n\n## 2026-08-02——H 限制 W 来源\n\nW 来源起点为 `max(H, continuous_start, end-W+1)`。H 到开仓之间的下跌可以参与，H 之前的旧行情不可参与。\n\n## 2026-08-02——样本与低成交因果性\n\n样本结束时按末端 bar 的 close 平仓。`exclude_marked` 使用因果 `baseline_available_from`；`all_window` 保持原样。\n\n## 2026-08-03——W 精确定义与可用前缀契约\n\n- 使用 1 到 W 的每个可用前缀生成候选，不等待完整 W，也不设置最小窗口比例。\n- 候选定义为 `w_open_to_end_low_drop = open[start] - low[end]`，不表示窗口内部任意 high 到后续 low 的最大有序下跌。\n- 一次真实持仓内保留单调最大值，因此较短的早期前缀可以继续控制后续平仓。原始审计字段名为兼容性保留。\n\n## 2026-08-03——保留信号的 pending-entry 契约\n\n采用 `retained_signal_fill_first_real_open`：信号最多保留 120 根连续候选 bar，并按第一根真实成交 bar 的 open 开仓。不要求 trigger 再穿越，也不因更高 high 或结构反转取消。连续性中断仍会取消等待。\n\n## 2026-08-03——毛收益／成本后双排名\n\n每个主要视图均提供毛收益与成本后排序／显示模式。所选模式同时改变排序与收益显示；默认使用成本后口径。当前衍生模型为 2 bps 往返滑点，加上按 7.8 HKD/USD 折算的 6 USD 往返手续费；名义价值为 300,000 HKD，每笔总成本 106.8 HKD，即 3.56 bps。原始成交与原始收益保持不变。Mini KOSPI 200 最小变动单位资料只用于来源背景，不参与该计算。\n\n## 2026-08-03——衍生 K200M 当前名义价值成本参考\n\n后续衍生排名以 Mini KOSPI 200 价格 × 50,000 KRW 计算单手名义价值，不再使用固定 HKD 金额。将最后真实 15 秒参考价与带日期的 KRW/USD 参考冻结在哈希绑定 JSON 中；由该名义价值推导 6 USD 手续费的 bps，并加入已确认的 2 bps 往返滑点。首个冻结参考得到 3.568663594470046 bps。既有原始结果继续不可变且可用；旧版 3.56 bps 输出作为历史证据保留。\n\n## 2026-08-03——多轮探索治理\n\n围绕情景一合格与全坐标成本后总收益开展探索。前期使用多个大范围区块，后续根据完整闭合证据并行推进大范围覆盖与局部细化。每轮分别计划、绑定哈希、闭合、交付和解释；是否继续由证据决定，且不代表参数被接受。\n\n## 2026-08-03——当前 campaign 的累计边界\n\n当前多轮累计 lineage 只使用 campaign `v4_4_cost_adjusted_multiround_20260803` 内已完成的阶段。同一 campaign 内的完成阶段必须在累计身份字段上保持一致。旧临时验证 campaign 使用不同引擎身份，继续作为历史证据保留，并以此原因排除在当前累计 lineage 之外。失败的局部快照继续保留，且不会提升为稳定路由。\n\n## 2026-08-03——终结型第三轮边界解决\n\n第二轮的两个目标独立局部分支均取得严格成本后改进，大范围分支没有改进。停止大范围探索。围绕新的情景一较低 M／较高 S 边界及全坐标较低 S 边界，运行一个 212 坐标终结型局部细化。无论第三轮结果如何，该轮都会结束有边界样本内 campaign；禁止创建第四轮，也不接受参数。\n\n## 2026-08-03——结束有边界 campaign\n\n第三轮把情景一目标提升至成本后 30.6696%，但没有改进全坐标目标；后者仍由第二轮的 36.0556% 领先坐标保持。campaign 在 831 个唯一坐标、353,874 笔交易处结束。两个领先坐标只作为样本内描述证据保留。禁止创建第四轮，也不接受参数。\n\n## 2026-08-03——启动独立命名的 continuation 子序列\n\n新的用户授权允许继续 V4.4 探索，但不重新打开已闭合的原序列。其第四轮禁止继续作为历史事实保留；新阶段在同一 campaign ID 与兼容当前根目录下命名为 `continuation_round_*`。continuation 以 528 坐标大范围轮次开始，后续只细化完整交付后显示出前景的区域。\n\n每个 continuation 轮次最终都必须完成不可变原始闭合、阶段主入口／逐笔交付、累计主入口／逐笔刷新，以及哈希／浏览器／桌面／移动／人工视觉 QA。两个目标保持独立，3.56 bps 成本后仍为默认口径，也不接受参数。\n\n## 2026-08-03——角色中立的流水执行治理\n\n一个执行者或多个执行者均可完成分析、回测运算与 HTML 交付。不可变闭合后，HTML 交付与证据分析可以并行；重叠工作只能在源码闭合、精确反连接、独立进程／输出／根目录／锁、单一 union writer 及计入实时交付的资源门槛下进行。\n\n每轮最终仍必须完成阶段主入口、阶段逐笔、累计主入口、累计逐笔、完整 QA 与 `DELIVERY_FINAL`。交付不再阻塞下一轮分析或运算。交付发现影响结果的源码不一致时，暂停新运算，直到新源码身份闭合。\n\n## 2026-08-03——不重跑原始运算，简化逐笔图表展示\n\n开仓理由第 2 项的 high／entry 椭圆由实心改为彩色轮廓、透明填充的空心样式。折叠后的桌面端「参数」标签上移 6 像素；移动端抽屉定位保持不变。全部 K 线区间与指引在保留语义颜色的同时使用实线。冗长的理论线／实际成交图表注释移除，详细侧栏退出推理继续保留。绿色冻结低点图表标签精确为 `L=\u003cformatted value>`，不带冻结、持续时间或 bar 数后缀。保留不可变 Continuation 第一轮原始阶段与旧源码交付，并在任何新运算前闭合新源码身份。闭合后，恰好一次修正源码衍生重新交付可以与 Continuation 第一轮解释／第二轮工作流水并行。\n\n## 2026-08-03——V4.4 ZIP 交接包纳入逐笔交易记录\n\n用户要求的 V4.4 ZIP 现在纳入每个已完成阶段的原始分批 `trades.csv` 与衍生 `stage_trades.csv`。它们是可审计的逐参数组合买卖记录，复制到 `trade_records/` 并附带哈希绑定清单。结果边界保持收窄：其余 `results/` 载荷继续不纳入 ZIP。\n\n## 2026-08-03——已被替代的第二轮后停止边界\n\n此前第二轮后停止的边界已被用户继续探索参数组合的指令替代。完成当前第二轮不可变原始闭合、阶段／累计主入口与逐笔交付、两个目标独立解释、双语记录和只读总审计。只有其已交付证据可以授权后续计划；后续计划或运算均不会自动发生。仍不自动接受参数。\n\n## 2026-08-03——运算前替代绑定 V4 的第二轮计划\n\n不得绕过 V4 到 V5 的源码身份不一致。冻结计划 `05d0d2ed...` 与局部根目录指纹 `976fac8d...` 按字节保留为已替代的运算前证据；其中只有确定性元数据，不存在 progress、批次、逐笔、completion 或 analysis。当前源码身份得到确认后，使用相同的 416 个已审计坐标建立新的绑定第二轮计划，并采用新文件名、stage ID 与不存在的输出根。新目标的 active／pending 反连接只排除被明确替代的 V4 计划／根目录。后续轮次仍需当前第二轮交付与解释提供新的证据，尚未获授权。\n\n## 2026-08-03——保留结果并收敛后续逐笔交付\n\n保留所有已完成原始结果、当前五阶段累计快照和每个已有阶段页面，不重建或替换。每个未来获用户授权的轮次只更新当前累计总入口与唯一共享累计逐笔入口，使两者包含全部已完成且兼容的结果。每轮独立逐笔 HTML 不再属于必需交付。执行继续采用角色中立方式：无需强制使用子代理、独立对话或分开的运算／HTML 线程。后续运算仍等待用户明确指令，并遵守既有身份、反连接、根目录／锁、资源与唯一发布者门槛。\n\n## 2026-08-03——减少累计总入口摘要并分离速度选择器\n\n取消累计总入口的四张摘要卡。顶栏只保留动态全部策略坐标数。S 速度窗口选择器因选项明显多于排序指标选择器而独占完整一行。这只影响下一次生成的累计总入口，不授权替换当前已闭合快照。\n\n## 2026-08-05——替换 K200 零信号结果谱系\n\n用户授权移除并重跑所有曾产生 `baseline\u003c=0`、`drop\u003c=0` 与 `K×baseline\u003c=0` 的坐标。由于 4,704 个坐标中有 4,383 个受影响，且批次清单把受影响与未受影响坐标混合保存，因此完整旧 campaign 以可恢复方式退出活动状态，并在正值开仓门槛下重跑全部 4,704 个坐标。修正后的累计快照取代旧快照成为当前权威；旧字节继续作为历史参考证据保留。\n## 2026-08-06——确认时生效的低活跃门禁与 V4.4 排名边界\n\n低成交量连续段处于待确认状态时不影响策略。连续第 120 根低成交量 15 秒原子确认后，从第一根原子开始的完整区间退出此后每次 baseline 计算；未成交开仓委托取消，并停止新开仓，直到第一根正常成交量原子。已有持仓继续使用原平仓规则。\n\nK200 累计排名以已接受的大版本为分区。V4.4 内的小修正继续进入同一张 V4.4 排名页。阶段哈希与语义身份继续用于完整性和来源记录。明确采用 V4.5 时建立新的排名分区。\n","modified":"2026-08-08T19:27:46.189Z","missing":false},{"id":"change-reasons.en","pair":"change-reasons","group":"reference","path":"04_decisions/CHANGE_REASONS.en.md","lang":"en","title":"Change Reasons","lead":"Focused rationale for behavior-changing repairs and other changes whose previous behavior and evidence impact must remain auditable.","policy":"Add an entry when a material behavior change needs a durable reason, prior behavior, updated behavior, and evidence-impact record.","markdown":"# Change Reasons\n\n## 2026-08-09 — Close external-review reporting and identity gaps\n\n\u003cstrong>Reason:\u003c/strong> Valid zero-trade coordinates could complete numerical evaluation but fail during four-process HTML publication. Compact browser data also dropped the target instrument identity, and two presentation tests depended on a local snapshot path or obsolete literal UI text.\n\n\u003cstrong>Prior behavior:\u003c/strong> The process worker assumed trade columns existed even for a completely empty DataFrame. `main_summary_payload()` omitted the stage instrument profile entirely. Cross-instrument HTML tests read current snapshot CSS from the result drive and asserted fixed K200/SImain labels; presentation assertions depended on CSS property order and chart annotations removed by later accepted layout changes.\n\n\u003cstrong>Updated behavior:\u003c/strong> A zero-trade coordinate writes an empty chunk with zero wait statistics. Compact browser data retains only a minimal `instrumentSummary`. Cross-instrument tests inject CSS and check dynamic labels, while presentation tests check current semantic behavior. The package script records the current full-suite result.\n\n\u003cstrong>Evidence impact:\u003c/strong> No strategy state, fill, cost, trade, return, ranking, completed result, or existing published HTML changed. The source manifest binds the repaired report generators and tests; compatible V4.4 results remain eligible for the same cumulative ranking.\n\n\u003cstrong>Validity boundary:\u003c/strong> These changes affect future report generation, compact analysis metadata, tests, and future source-review packages. The retained 2026-08-08 compact ZIP remains immutable historical review evidence.\n\n## 2026-08-09 — Make scenario drafts self-managing\n\n- Prior behavior: the selector exposed manual scenario ID and name fields and labeled the full-catalog import as opening a scenario file, leaving the multi-scenario storage model implicit. Drawn ranges also looked like two-axis rectangles.\n- Updated behavior: the selector imports the complete `scenario_catalog.json`, generates the next unused ID and default name, keeps only the name editable, advances to the next draft after saving, and renders selection as a full-height time band.\n- Reason: scenario creation should not require bookkeeping, while the stored catalog and time endpoints remain explicit and reusable.\n- Evidence boundary: this is a selector-only presentation and authoring change; strategy, qualification, immutable trade records, and result packages are unchanged.\n\n## 2026-08-08 — Separate market identity, saved intuition, and result application\n\n- Prior behavior: the selector had one bundled K200 source and could only copy or export ranges. The retained scenarios lived in one strategy plan, and producing another scenario ranking required code-directed publication work.\n- Updated behavior: market intervals live in a reusable JSON catalog; named scenarios live in a separate JSON catalog; the selector can save its current one-or-many-range selection; one script applies a scenario to the matching completed evaluation package and generates the accepted main interface.\n- Reason: the researcher needs to test market intuitions repeatedly across instruments and dates without changing strategy code or rebuilding the storage model.\n- Validity boundary: one scenario belongs to one evaluation package. Cross-evaluation comparisons remain the responsibility of the generic evaluation comparison layer.\n\n## 2026-08-08 — Replace exhaustive package revalidation with bounded integrity checks\n\nThe retained transaction population makes the current package several gigabytes. Re-extracting the archive and hashing every file again duplicated already completed source-to-staging hashes, created a second multi-gigabyte tree, and exceeded the execution window. The package now preserves the same evidence boundary while checking the manifest record set, archive index, forbidden/duplicate paths, and one whole-archive SHA-256. Missing optional derived ledgers are recorded instead of recomputed. This changes packaging cost only; strategy results and retained trade bytes are unchanged.\n\n## 2026-08-08 — V4.41 release identity\n\nThe current accumulated work needs a visible release name without splitting comparable backtest evidence. Separating the V4.41 presentation release from the V4.4 strategy/ranking identity gives the release a precise name while preserving all compatible completed results in one ranking.\n\n## 2026-08-08 — Separate trade explanation metadata from the price plot\n\n\u003cstrong>Reason:\u003c/strong> The training and test charts lacked a one-action way to inspect the same coordinate across time intervals. Repeated picker metadata and in-chart audit boxes also consumed space needed for price evidence.\n\n\u003cstrong>Prior behavior:\u003c/strong> Users returned to the comparison table to change intervals. The picker showed a heading/count plus a repeated summary line, audit values covered the upper-left price area, the legend occupied the chart top, and the browser tab used a versioned title with an empty icon.\n\n\u003cstrong>Updated behavior:\u003c/strong> Training and test reviews link bidirectionally by exact `combo_id`. The dropdown stands alone, audit values wrap below the reason heading, the legend sits below the x-axis, and the tab uses a version-free title with a blue `Z`.\n\n\u003cstrong>Evidence impact:\u003c/strong> Only HTML shells and their presentation manifests changed. Existing market data, process payloads, catalogs, trade chunks, fills, returns, metrics, and rankings remain authoritative and unchanged.\n\n\u003cstrong>Validity boundary:\u003c/strong> The pair is available for the current K200 training and later-period test reviews. Coordinates absent from the destination catalog are reported as absent; no substitute coordinate is loaded. SI has no paired K200-time role and therefore receives no switch.\n\n## 2026-08-08 — Replace role-named result storage with date-based evaluation packages\n\n\u003cstrong>Reason:\u003c/strong> Training, test, migration, holdout, and later research roles can change while the evaluated bytes and interval remain the same. Result locations therefore need stable factual identities that also work for any instrument and time range.\n\n\u003cstrong>Prior behavior:\u003c/strong> Current evidence was distributed across the K200 union directory, a K200 later-period campaign, an SI migration run, and a comparison run whose data were embedded in one generated JavaScript file. The comparison entry depended on those role-specific locations.\n\n\u003cstrong>Updated behavior:\u003c/strong> Each current interval has an independent package identified by instrument plus exact start/end timestamps. Each package records data lineage, experiment meaning, parameter metrics, browser summary, immutable trade records, and a per-trade compatibility route. A generic comparison plan lists package roles and loads their browser summaries by exact `combo_id`.\n\n\u003cstrong>Evidence impact:\u003c/strong> This is a storage and reading-boundary change only. Existing main and per-trade artifacts remain byte-identical; the new comparison reconstructs all 350 rows and the retained browser-visible content exactly. No backtest, fill, cost, metric, or candidate selection was recomputed.\n\n\u003cstrong>Validity boundary:\u003c/strong> The current adapter registers retained K200 and SImain evidence. A future instrument still requires an executable profile and a completed interval result before it can be packaged. The proposed median-selection workflow remains unimplemented.\n\n## 2026-08-07 — Require cost-positive training eligibility for the current-optimal replay\n\n\u003cstrong>Reason:\u003c/strong> The requested population is current K200 optimal parameters. A gross non-gap ranking can favor extremely high-frequency coordinates whose cost-adjusted training return is negative.\n\n\u003cstrong>Prior behavior:\u003c/strong> The first frozen queue admitted twelve cost-negative training coordinates because gross non-gap return had no cost-positive eligibility gate. The completed output therefore mixed deliberately profitable training parameters with unsuitable stress cases.\n\n\u003cstrong>Updated behavior:\u003c/strong> The corrected `_v2_` freeze restricts every queue to positive cost-adjusted training return, retains six previously evaluated headline controls, and adds 94 exact coordinates not previously run over the later month.\n\n\u003cstrong>Evidence impact:\u003c/strong> The first run remains historical and invalid for decisions. Its raw bytes are retained. Only the corrected run supports the current interpretation; engine, fills, cost model, data, target interval, and four-worker execution remain unchanged.\n\n\u003cstrong>Validity boundary:\u003c/strong> The target month was already used by earlier temporal work. The corrected result is new at the exact-coordinate level and post-hoc at the period level. It cannot support parameter acceptance.\n\n## 2026-08-07 — Compute interval statistics only after chart selection\n\n\u003cstrong>Reason:\u003c/strong> Researchers need quick measurements for an arbitrary visible candlestick interval, while startup and chart-drag latency must remain unchanged.\n\n\u003cstrong>Prior behavior:\u003c/strong> The per-trade chart supported zoom and trade inspection but had no interval measurement. The header also carried a view-mode explanation sentence the user no longer wanted.\n\n\u003cstrong>Updated behavior:\u003c/strong> The sentence is removed. An explicit `区间统计` mode changes Plotly drag behavior to horizontal selection; `plotly_selected` then scans the selected OHLC slice once and opens a temporary statistics panel.\n\n\u003cstrong>Evidence impact:\u003c/strong> This is presentation-only. It adds no backtest field, payload, request, startup precomputation, interval cache, ranking change, or parameter acceptance.\n\n\u003cstrong>Validity boundary:\u003c/strong> Price change and amplitude use the first selected open as denominator. Maximum drawdown uses the largest running-high to current-or-later-low decline inside the inclusive selected interval.\n\n## 2026-08-06 — Replace per-round mixed blocks and point caps with an AI-led cycle\n\n\u003cstrong>Reason:\u003c/strong> K200 backtests are fast enough to evaluate finite grids with more evidence than a fixed two-or-three-point batch. Requiring leap coverage and local refinement inside every individual round also makes each plan less focused.\n\n\u003cstrong>Prior behavior:\u003c/strong> Every ordinary round mixed broad and refinement blocks, and each one-parameter direction used a fixed small point count.\n\n\u003cstrong>Updated behavior:\u003c/strong> AI alternates multi-round leap search, finite one-parameter grids around promising nonadjacent anchors, and renewed leap search. The user observes and corrects between cycles. Grids have no fixed point-count cap, but every plan freezes finite bounds, values or steps, expected coordinates, and anti-join evidence.\n\n\u003cstrong>Evidence impact:\u003c/strong> This changes future exploration design and handoff rules only. Existing plans, raw results, rankings, migration evidence, and immutable snapshots remain historical facts.\n\n\u003cstrong>Validity boundary:\u003c/strong> Fast compute does not authorize unbounded densification, repeated coordinates, method changes, new data identities, or parameter acceptance. Unattended work remains inside the explicitly authorized duration and resources.\n\n## 2026-08-06 — Simplify and stabilize the K200 cumulative table\n\n\u003cstrong>Reason:\u003c/strong> The stable entry repeated navigation already available in the main page, several display-only diagnostics and the research-contract section were not needed, and rendering the complete ranking table caused avoidable browser work while long-table review lost column context.\n\n\u003cstrong>Prior behavior:\u003c/strong> The root kept an iframe and duplicate top bar. Cost-adjusted return labels repeated the cost wording, rank buttons included `查看`, several display-only diagnostic columns and the research-contract section were visible, and the browser generated every eligible row in one DOM update.\n\n\u003cstrong>Updated behavior:\u003c/strong> The root redirects to the lean main page. The full-width main page uses the confirmed title and darker blues, simplified return and rank labels, fixed-width `#N` buttons, fewer display-only diagnostics, cost and cross-gap count as the final columns, no research-contract section, and 500-row pagination within a sticky-header viewport.\n\n\u003cstrong>Evidence impact:\u003c/strong> Only generated presentation source, the stable presentation, focused UI assertions, and project records changed. Underlying fields, raw trades, metrics, filters, ranking semantics, and immutable snapshots remain unchanged.\n\n\u003cstrong>Validity boundary:\u003c/strong> Pagination changes only rendered row count. It does not change the complete filtered member set, ranking order, result data, or immutable snapshots; virtualization and sort-result caching remain absent.\n\n## 2026-08-05 — Give ordinary parameter exploration two explicit purposes\n\n\u003cstrong>Reason:\u003c/strong> Local refinement alone can miss distant promising regions, while broad search alone cannot attribute an improvement to one parameter around a strong combination.\n\n\u003cstrong>Updated behavior:\u003c/strong> This 2026-08-05 change established both broad coverage and single-parameter attribution. Its per-round coexistence requirement and fixed point-count limit are superseded by the 2026-08-06 AI-led leap/grid cycle; separately labeled leap and grid evidence remain current.\n\n\u003cstrong>Evidence impact:\u003c/strong> Continuation Round 15 used 192 broad coordinates and 84 one-parameter coordinates. The broad branch found no robust primary leader; the refinement branch improved the average-E region. Existing strategy semantics, historical results, ranking rules, and parameter acceptance remain unchanged.\n\n## 2026-08-05 — Make cumulative K200 per-trade publication incremental\n\n\u003cstrong>Reason:\u003c/strong> Final cumulative publication previously regenerated every historical K200 per-trade chunk even when a round added only a small coordinate set. The repeated work dominated exploration delivery time and rewrote unchanged derived presentation artifacts.\n\n\u003cstrong>Updated behavior:\u003c/strong> When a compatible current snapshot exists, the cumulative builder supplies its trade-review directory as a reuse source. Deterministic unchanged chunks are reused through same-volume hard links; only missing coordinate chunks are generated. The ranking payload, catalog, summaries, manifests, and stable routes are refreshed from the complete compatible population.\n\n\u003cstrong>Evidence impact:\u003c/strong> The 5,044-coordinate delivery reused 4,747 chunks and generated 297. Raw trades, metrics, strategy semantics, qualification rules, and historical snapshot bytes are unchanged by reuse. The new snapshot and manifest make the new complete population explicit.\n\n## 2026-08-05 — Make migration HTML publication incremental\n\n\u003cstrong>Reason:\u003c/strong> A small migration append previously rebuilt every historical target per-trade chunk. That repeated unchanged work and left the migration workflow without a fixed, documented publication command.\n\n\u003cstrong>Updated behavior:\u003c/strong> Completed combined runs declare `incremental_parent_run` and publish through `build_v4_4_cross_instrument_comparison.py build --run-id \u003crun_id>`. Deterministic unchanged combo chunks are reused through same-volume hard links; only missing new-candidate chunks are generated. The small ranking index, catalog, process payload, summaries, and manifests are refreshed.\n\n\u003cstrong>Evidence impact:\u003c/strong> The 247-candidate delivery reused 244 parent chunks and generated three. Target trades, metrics, frozen candidates, and strategy semantics are unchanged by chunk reuse. Each trade-review manifest records its incremental parent and reused/generated counts.\n\n## 2026-08-05 — Restore one combined, plan-driven migration delivery\n\n\u003cstrong>Reason:\u003c/strong> The repaired transfer was published as a separate current page and exposed a migration-batch column without user approval. That split hid the earlier positive result from the current comparison and made instrument-specific column names require future code edits.\n\n\u003cstrong>Updated behavior:\u003c/strong> The current page is the 244-candidate union of the user-linked 180 and repaired 64 results. It removes batch display, reads relative instrument names from the approved migration plan, places source total return before target total return, restores default ranking on the third same-header click, and provides reciprocal new-tab navigation.\n\n\u003cstrong>Governance:\u003c/strong> Any modification outside an explicit request or accepted proposal requires prior approval. A migration starts with required-information intake and a reviewed plan, and finishes with source main, source per-trade, combined ranking, target per-trade, and migration report.\n\n\u003cstrong>Evidence impact:\u003c/strong> Completed raw transfer evaluations remain unchanged. The new artifacts are a presentation union, combined target trade review, relative-label plan, navigation shell update, and bilingual report. No combined score or parameter acceptance is introduced.\n\n## 2026-08-05 — Batch nearby points and defer cumulative HTML to the final round\n\n\u003cstrong>Reason:\u003c/strong> Raw parameter compute completes quickly, while each cumulative publication rebuilds roughly 710,000 historical trades and takes about twenty minutes. Publishing after every small round spends most of the exploration time rewriting unchanged historical output. A single new point also gives weak directional evidence.\n\n\u003cstrong>Updated behavior:\u003c/strong> Each one-axis grid holds all other parameters fixed. The former fixed point-count limit is superseded by finite declared grids without a fixed cap. Intermediate campaign runs close raw evidence and compact summaries without HTML. The runner publishes cumulative main and per-trade HTML only when invoked with `--publish-html`, normally once after the complete exploration series.\n\n\u003cstrong>Evidence impact:\u003c/strong> Existing snapshots and historical pages remain unchanged. Intermediate raw results remain authoritative but do not appear in the stable cumulative HTML until the final publication. An explicit user request can authorize an earlier publication.\n\n## 2026-08-05 — Name the rolling-sum mean precisely without changing entry semantics\n\n\u003cstrong>Reason:\u003c/strong> The short label `滚动 TR 总和` can be read as one total over BH, while the implemented method averages all overlapping TRW window sums. The chart also shades the full E high-search window, which visually overlaps BH and can be mistaken for an overlap between the baseline and the measured H-to-low drop.\n\n\u003cstrong>Updated behavior:\u003c/strong> The cumulative and stage-page method display is `滚动 TR 总和均值`. The method value, formula, engine, and result selection remain unchanged. E continues to search strict H through the observed signal bar; BH ends at and includes the complete H atom; the net drop is `high[H] - low[signal]` with `H \u003c signal`.\n\n\u003cstrong>Evidence impact:\u003c/strong> Only presentation HTML, the generated-page label contract, declared HTML hashes, QA evidence, and bilingual records change. Source inspection, the stepwise-prefix equality test, and a 114-trade invariant audit show no future-data read. Raw trades, ranks, returns, and parameter acceptance remain unchanged.\n\n\u003cstrong>Validity boundary:\u003c/strong> This audit validates causal availability, not the user's proposed strict no-shared-bar method. Ending BH at H-minus-one would change every affected baseline and threshold, require a new strategy/source identity, and require fresh compute before comparing performance.\n\n## 2026-08-05 — Collapse the cumulative filter panel after selection\n\n\u003cstrong>Reason:\u003c/strong> The full filter-and-sort panel occupies more than one desktop viewport after the four minute-range selectors were added. Researchers need to recover table space after finishing their selections without losing the chosen population or rank order.\n\n\u003cstrong>Updated behavior:\u003c/strong> The panel starts expanded and exposes a fixed-size, icon-only SVG chevron disclosure button. The chevron points up while expanded and down while collapse
