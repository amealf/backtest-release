    const DOCUMENTS = [{"id":"agent-rules.en","pair":"agent-rules","group":"priority","path":"../AGENTS.md","lang":"en","title":"Agent Instructions","lead":"Concise mandatory rules and the task-based reading map for agents.","policy":"Update when mandatory operating rules or reading requirements change.","markdown":"# Project Operating Rules\n\n\u003c!-- generated-by: manage-project-context; review before merging into an existing user-owned file -->\n\nThis file is the concise operating protocol for agents working on \u003cstrong>Backtest V4.41 Research\u003c/strong>. V4.41 is a minor release on the V4.4 strategy and ranking lineage. Detailed context and maintenance rules live under `project_management`.\n\n## Required reading\n\n1. Read this file.\n2. Read `project_management\\00_START_HERE.en.md` for evidence priority and the complete task matrix.\n3. Read the English documents selected by that matrix. English is the operational source; `*.zh.md` files are Chinese review mirrors.\n\n## Read by task\n\n- Scope or planning: read `01_goal\\PROJECT_GOAL.en.md`, `01_goal\\PROJECT_CONSTRAINTS.en.md`, `03_active_work\\CURRENT_TASKS.en.md`, and `03_active_work\\WORK_PROGRESS.en.md`.\n- Parameter exploration design, execution, interpretation, or next-round handoff: also read and follow `05_domains\\research\\PARAMETER_EXPLORATION_GUIDE.en.md`, `05_domains\\research\\RESEARCH_CONSTRAINTS.en.md`, and `03_active_work\\EXPERIMENT_PROGRESS.en.md`.\n- Any backtest execution: also read and update `03_active_work\\BACKTEST_MANAGEMENT.en.md`.\n- Cross-instrument transfer or a fresh instrument search: also read `00_core\\STRATEGY_CONTRACT_V4_4.en.md`, `10_instruments\\INSTRUMENT_PROFILE_CONTRACT.en.md`, and `20_campaigns\\CAMPAIGN_WORKFLOW.en.md`.\n- Deliverable or current-behavior changes: also read `02_current_state\\SOURCE_OF_TRUTH.en.md`, `02_current_state\\CURRENT_VERSION.en.md`, and relevant `04_decisions\\DECISIONS.en.md` entries.\n- Behavior-changing repairs or changes whose rationale affects future work: also read `04_decisions\\CHANGE_REASONS.en.md`.\n- Code entry point, execution flow, component responsibility, dependency, data flow, or interface-boundary changes: also read `02_current_state\\CODE_ARCHITECTURE.en.md` and `03_active_work\\WORK_PROGRESS.en.md`.\n- New direction: read `07_future\\NEXT_DIRECTIONS.en.md` plus current goal, constraints, tasks, and work progress.\n- Historical or inactive work: read `06_history\\PROJECT_HISTORY.en.md` and the relevant `99_archive` note only when the task needs past evidence, reuse, or restoration.\n- References: verify provenance in `08_references\\README.en.md` before relying on retained source material.\n\nPaths in this section are relative to `project_management`.\n\n## Conversation-driven project memory\n\n- At the start of project-changing work, review the conversation and delegated context available in the current task. Do not claim access to unseen chats.\n- Compare the latest confirmed user statements with this file, `00_START_HERE.en.md`, and the task-selected English documents. A newer explicit correction supersedes an older summary.\n- When project work establishes an accepted durable change, update the mapped English document and Chinese mirror before finishing the task, even when the user does not separately request documentation maintenance.\n- Append completed or materially changed work to `03_active_work\\WORK_PROGRESS.en.md` and its Chinese mirror. When a major delivery version or working method changes, archive obsolete detailed progress and leave a concise restoration pointer.\n- Do not modify files for explanation-only questions, hypotheticals, or unaccepted ideas.\n- Record concise facts, decisions, and useful rationale. Never store raw transcripts, secrets, or private personal data.\n\n## Active domain modules\n\n- Read `project_management\\05_domains\\data\\DATA_REQUIREMENTS.en.md` before changing schemas, migrations, pipelines, lineage, or data contracts.\n- Read `project_management\\05_domains\\research\\RESEARCH_CONSTRAINTS.en.md` before changing methods, running experiments, or interpreting results.\n- Read and follow `project_management\\05_domains\\research\\PARAMETER_EXPLORATION_GUIDE.en.md` for every parameter-exploration task.\n\n## Execution orchestration\n\n- This is an instrument- and interval-neutral backtest project. Any executable instrument profile may run an independently declared evaluation interval; K200 is one retained evidence lineage, not the project-wide storage identity.\n- Publish every completed evaluation under `results\\evaluation_packages\\\u003cinstrument_id>\\\u003cstart_YYYYMMDDTHHMMSS>__\u003cend_YYYYMMDDTHHMMSS>`. Directory names contain only the instrument and exact evaluated interval. Training, test, transfer, holdout, and descriptive roles belong in `EXPERIMENT.md`, the comparison plan, and bilingual management records.\n- Each evaluation package owns `evaluation_manifest.json`, `parameter_summary.csv`, candidate-set browser projections, immutable trade records, an experiment record, and a per-trade entry. Append future compute as immutable batches and generate only missing per-coordinate review chunks.\n- `results\\evaluation_comparison` is the generic multi-evaluation reader. A comparison plan selects any completed date packages, joins them by exact `combo_id`, and keeps each package's ranking lineage independent. A comparison may describe transfer, temporal validation, or another experiment without changing package names.\n- `runtime_inputs\\scenarios\\market_catalog.json` is the registry for fixed selector intervals. Each entry binds one instrument, one evaluation package, one data file, one timezone, and one exact interval.\n- `runtime_inputs\\scenarios\\scenario_catalog.json` is the saved-scenario authority. One scenario references exactly one market entry and contains one or more AND-aggregated selected ranges. `tools\\apply_v4_41_scenario.py` evaluates those ranges against completed immutable trade records and writes a separate current-main-style ranking; it does not rerun the strategy or mutate an evaluation package.\n- Existing stable entries and completed main/per-trade HTML are compatibility contracts. Build a parallel package-backed page, prove exact row/value parity and browser-visible parity, then change only the stable redirect. Preserve the prior entry and completed pages for immediate rollback.\n- Every market-data acquisition directory must contain a `README.md`. Create it with the directory, refresh it on every resume/completion, and record the instrument, source, request/update times, contract split, main-contract selection rule, merge rule, lineage, and principal files.\n- Before each backtest starts, append its instrument, exact market-data file, evaluated start time, and evaluated end time to `project_management\\03_active_work\\BACKTEST_MANAGEMENT.en.md` and its Chinese mirror. Keep the record if the run stops early.\n- Backtest compute and evidence analysis are separate from HTML publication. Intermediate exploration rounds close immutable raw evidence and compact summaries without generating cumulative or per-trade HTML.\n- Migration HTML uses the fixed cross-instrument builder after the migration series closes. A new combined run declares `incremental_parent_run`; unchanged target per-trade chunks are reused and only new-candidate chunks are generated. Do not regenerate every historical migration chunk for a small append.\n- Parameter exploration follows a repeating AI-led cycle: multi-round leap search across nonadjacent legal regions, finite one-parameter grids around promising nonadjacent anchors, then a return to leap search. Individual rounds may belong to one phase; the complete cycle preserves both exploration and refinement evidence.\n- A one-parameter grid has no fixed point-count cap. Freeze its finite bounds, step schedule, anchor, and expected coordinate count before compute. Continue, refine, widen, or stop only after the closed grid pattern is interpreted; every later grid must pass the completed+active+pending anti-join.\n- The user reviews summaries and may correct objectives, anchors, ranges, or direction between cycles. While the user is unavailable, AI may continue multiple rounds only inside the already authorized time, instrument, method, data, and resource boundary. A method change or authority expansion still requires user approval.\n- Publish the shared cumulative main entry `results\\all_completed_union_analysis\\index.html` and shared per-trade entry `results\\all_completed_union_analysis\\trade_review\\index.html` once, after the exploration series ends or when the user explicitly requests an intermediate publication. The final publication contains all compatible completed rounds.\n\n## Working rules\n\n- Answer questions without changing files unless the user requests a change.\n- Before changing any file, behavior, output, workflow, field, or artifact beyond what the user explicitly requested or accepted, stop and obtain user approval. Technical convenience, provenance concerns, adjacent cleanup, and agent interpretation do not expand the authorized scope.\n- Prefer the smallest implementation that satisfies the confirmed contract. Add defensive branches only for a concrete, severe, and plausible failure; do not add speculative fallback layers.\n- Keep verification proportional and minimal. Do not run broad regression, repeated hash audits, or browser matrices for a small change. Whenever work has a visible result and the environment allows it, capture a representative screenshot for the user and judge basic overlap, garbling, asymmetry, and obvious layout errors. Use Computer Use for local Chrome `file:///` pages when ordinary browser automation cannot open the path.\n- When the user names an existing tool, template, or behavior, inspect and use that exact item. Ask for confirmation before substituting a newly authored implementation or expanding the requested scope.\n- Treat the project's current real files, behavior, and produced artifacts as execution evidence. Use management documents to explain intent, status, and validity boundaries.\n- Keep unknown facts marked as unconfirmed. Do not turn a proposal, future direction, or archived item into current truth.\n- Preserve existing project files. Review `*.project-management.proposed*` siblings before any merge.\n- Keep English and Chinese management documents aligned when either changes.\n- When creating or materially editing human-facing Chinese project documentation or Chinese UI copy, invoke the `qu-ai-wei` skill after facts and technical meaning are stable. Preserve code identifiers, formulas, parameters, numbers, paths, commands, hashes, and English-Chinese semantic alignment exactly.\n- Use HTML `\u003cstrong>...\u003c/strong>` for bold text in managed Markdown. Do not use Markdown `**...**`; inline code, fenced code, and glob paths such as `batches/**/trades.csv` keep their literal asterisks.\n\n## Validation tiers\n\n- Run the complete regression suite only for version upgrades and changes to the backtest engine, entry/exit or fill logic, return/cost calculations, data preparation, schemas, execution contracts, or result semantics.\n- Use focused tests or a targeted browser interaction check for frontend behavior such as filters, sorting, selectors, buttons, navigation, or state synchronization. Exercise only the affected interaction and its nearest dependent state unless risk expands the boundary.\n- For presentation-only changes such as copy, color, spacing, typography, alignment, responsive layout, or visibility, regenerate the affected HTML and perform one simple functional check. Screenshots are needed only when visual judgment is part of the request or the layout changed materially.\n- Escalate to the higher tier whenever a change crosses tiers or its semantic impact is uncertain. Record the chosen tier and evidence in the handoff; do not run a broader suite by habit.\n\n## After changes\n\n- Classify accepted conversation changes with the maintenance-trigger table in `00_START_HERE.en.md`.\n- Update the document named by `00_START_HERE.en.md` for the change type.\n- Update `WORK_PROGRESS` after completed or materially changed work, and `CHANGE_REASONS` when a behavior change needs durable rationale.\n- Run `node \"project_management\\tools\\build_dashboard.mjs\"` after changing managed Markdown or the manifest.\n- Verify the generated dashboard when a change affects its layout or interaction.\n","modified":"2026-08-08T09:25:54.749Z","missing":false},{"id":"agent-rules.zh","pair":"agent-rules","group":"priority","path":"../AGENTS.zh.md","lang":"zh","title":"Agent 工作规则","lead":"Agent 必须遵守的简明规则与按任务读取地图。","policy":"强制工作规则或读取要求变化后更新。","markdown":"# 项目工作规则\n\n\u003c!-- generated-by: manage-project-context; 合并到现有用户文件前必须审阅 -->\n\n这是 Agent 处理 \u003cstrong>Backtest V4.41 Research\u003c/strong> 时使用的简明工作协议。V4.41 是建立在 V4.4 策略与排序谱系上的小版本。详细项目上下文与维护规则保存在 `project_management` 下。\n\n## 必须阅读\n\n1. 阅读本文件。\n2. 阅读 `project_management\\00_START_HERE.en.md`，了解证据优先级与完整任务读取矩阵。\n3. 按矩阵阅读对应英文文档。英文是执行来源，`*.zh.md` 是中文审阅镜像。\n\n## 按任务读取\n\n- 范围或规划：阅读 `01_goal\\PROJECT_GOAL.en.md`、`01_goal\\PROJECT_CONSTRAINTS.en.md`、`03_active_work\\CURRENT_TASKS.en.md` 与 `03_active_work\\WORK_PROGRESS.en.md`。\n- 设计、运行、解释参数探索或交付下一轮参数：还要阅读并遵守 `05_domains\\research\\PARAMETER_EXPLORATION_GUIDE.en.md`、`05_domains\\research\\RESEARCH_CONSTRAINTS.en.md` 与 `03_active_work\\EXPERIMENT_PROGRESS.en.md`。\n- 运行任何回测：还要阅读并更新 `03_active_work\\BACKTEST_MANAGEMENT.en.md`。\n- 跨品种迁移或对新品种开展全新搜索：还要阅读 `00_core\\STRATEGY_CONTRACT_V4_4.en.md`、`10_instruments\\INSTRUMENT_PROFILE_CONTRACT.en.md` 与 `20_campaigns\\CAMPAIGN_WORKFLOW.en.md`。\n- 交付物或当前行为修改：另外阅读 `02_current_state\\SOURCE_OF_TRUTH.en.md`、`02_current_state\\CURRENT_VERSION.en.md` 与 `04_decisions\\DECISIONS.en.md` 中相关记录。\n- 行为修复，或变化理由会影响后续工作：另外阅读 `04_decisions\\CHANGE_REASONS.en.md`。\n- 代码入口、执行流程、组件职责、依赖、数据流或接口边界修改：另外阅读 `02_current_state\\CODE_ARCHITECTURE.en.md` 与 `03_active_work\\WORK_PROGRESS.en.md`。\n- 新方向：阅读 `07_future\\NEXT_DIRECTIONS.en.md`，以及当前目标、约束、任务与工作进展。\n- 历史或非活动工作：只有任务需要过去证据、复用或恢复时，才阅读 `06_history\\PROJECT_HISTORY.en.md` 与相关 `99_archive` 说明。\n- 参考材料：使用前在 `08_references\\README.en.md` 中确认来源。\n\n本节路径均相对于 `project_management`。\n\n## 聊天驱动的项目记忆\n\n- 开始修改项目时，阅读当前任务内可用的聊天与委派上下文。不能声称读取了不可见聊天。\n- 将用户最新确认内容与本文件、`00_START_HERE.en.md` 及任务对应英文文档进行比较。较新的明确更正覆盖较旧摘要。\n- 项目工作确认了长期变化后，在任务结束前更新对应英文文档与中文镜像；用户无需另外提出维护文档。\n- 已完成或发生重要变化的工作追加到 `03_active_work\\WORK_PROGRESS.en.md` 及其中文镜像。主交付版本或工作方法变化时，存档已经失效的详细进展，并保留简洁恢复指针。\n- 解释型问题、假设讨论或未确认想法不触发文件修改。\n- 只记录简明事实、决定与有用理由，不保存聊天原文、秘密信息或私人个人数据。\n\n## 已启用领域模块\n\n- 修改数据结构、迁移、管线、血缘或数据契约前，阅读 `project_management\\05_domains\\data\\DATA_REQUIREMENTS.en.md`。\n- 修改研究方法、运行实验或解释结果前，阅读 `project_management\\05_domains\\research\\RESEARCH_CONSTRAINTS.en.md`。\n- 每次参数探索都必须阅读并遵守 `project_management\\05_domains\\research\\PARAMETER_EXPLORATION_GUIDE.en.md`。\n\n## 执行编排\n\n- 本项目按品种与评价区间组织回测。任何已就绪的品种配置都可以声明独立评价区间并运行；K200 是保留的证据谱系之一，不再承担全项目存储身份。\n- 每个已完成评价保存到 `results\\evaluation_packages\\\u003cinstrument_id>\\\u003cstart_YYYYMMDDTHHMMSS>__\u003cend_YYYYMMDDTHHMMSS>`。目录名只包含品种和实际评价区间。训练、测试、迁移、留出或描述性用途写入 `EXPERIMENT.md`、比较方案和双语管理记录。\n- 每个日期结果包包含 `evaluation_manifest.json`、`parameter_summary.csv`、按候选集生成的浏览器精简数据、不可变逐笔记录、实验记录和逐笔入口。后续计算以不可变批次追加，只生成缺少的逐坐标区块。\n- `results\\evaluation_comparison` 是通用多区间比较入口。比较方案可以选择任意已完成日期结果包，按精确 `combo_id` 连接，并保持每个品种的排名谱系独立。比较可以用于迁移、时间验证或其他实验，无需修改结果包名称。\n- `runtime_inputs\\scenarios\\market_catalog.json` 是行情选择器的固定分段目录。每项绑定一个品种、一个评价结果包、一个数据文件、一个时区和一个精确区间。\n- `runtime_inputs\\scenarios\\scenario_catalog.json` 是场景记录来源。一个场景只引用一项行情，可包含一段或多段选区；多段使用 AND。`tools\\apply_v4_41_scenario.py` 根据已完成的不可变逐笔记录判断资格，并生成独立的总入口样式排序页；它不重跑策略，也不改写评价结果包。\n- 现有稳定入口与已完成总入口／逐笔 HTML 属于兼容契约。新读取链路要在平行目录生成，完成逐行数值一致性与浏览器可见内容一致性后，只切换稳定跳转。旧入口和已完成页面继续保留，可立即恢复。\n- 每个行情数据下载目录都必须包含 `README.md`。目录创建时生成，恢复下载或完成下载时刷新，并记录品种、来源、请求与更新时间、合约切割、主力合约选择规则、合并规则、血缘和主要文件。\n- 每次启动回测前，将品种、实际读取的数据文件、回测开始时间与回测结束时间追加到 `project_management\\03_active_work\\BACKTEST_MANAGEMENT.en.md` 及其中文镜像。回测中途停止时仍保留记录。\n- 回测运算与证据分析和 HTML 发布分离。中间探索轮只闭合不可变原始结果与小型汇总，不生成累计或逐笔 HTML。\n- 参数探索采用 AI 主导的循环：对互不相邻的合法区域开展多轮跳跃搜索，选择互不相邻的优秀锚点并做有限单参数网格，随后回到跳跃搜索。单轮可以只属于其中一个阶段；完整循环同时保留探索与细化证据。\n- 单参数网格不设固定点数上限。运算前冻结有限边界、步长安排、锚点和预计坐标数；只依据闭合后的完整网格趋势决定继续、细化、扩大或停止。后续网格必须通过 completed／active／pending 精确反连接。\n- 用户在循环之间查看摘要，并可修正目标、锚点、范围或方向。用户暂时不在线时，AI 只能在已经授权的时间、品种、方法、数据和资源边界内连续完成多个轮次；方法变化或授权扩展仍需用户确认。\n- 整组探索结束后，或用户明确要求中途发布时，才生成一次共享累计总入口 `results\\all_completed_union_analysis\\index.html` 与共享逐笔入口 `results\\all_completed_union_analysis\\trade_review\\index.html`。最终发布包含全部兼容已完成轮次。\n\n## 工作规则\n\n- 用户只要求回答问题时不修改文件；用户要求修改后再变更项目内容。\n- 采用满足已确认契约的最小实现。只有存在具体、严重且现实的故障风险时才增加防御分支，不添加推测性的多层兜底。\n- 核验保持最小且与风险相称。小改动不运行大范围回归、重复哈希审计或浏览器矩阵。工作存在可视结果且环境允许时，应向用户提供一张有代表性的截图，并判断是否存在重叠、乱码、不对称或明显布局错误。常规浏览器自动化无法打开本地 `file:///` 页面时，使用 Computer Use 控制 Chrome。\n- 用户指定现有工具、模板或行为时，必须检查并使用该指定项目。若要改用新写实现或扩大需求范围，必须取得用户确认。\n- 项目当前真实文件、行为与产物是执行证据；管理文档用于解释意图、状态与有效边界。\n- 未知事实保持「待确认」。不能把提案、后续方向或存档材料描述成当前事实。\n- 保留项目已有文件。任何 `*.project-management.proposed*` 文件都需要审阅后才能合并。\n- 任一管理文档变化时，保持英文与中文内容一致。\n- 新增或实质修改面向人的中文项目文档或中文界面文案时，在事实与技术含义稳定后调用 `qu-ai-wei` 技能打磨。代码标识符、公式、参数、数值、路径、命令、哈希及中英文含义必须保持不变。\n- 管理 Markdown 的加粗只使用 HTML `\u003cstrong>...\u003c/strong>`，不使用 Markdown `**...**`。inline code、围栏代码块，以及 `batches/**/trades.csv` 这类 glob 路径中的星号保持原样。\n\n## 验证分级\n\n- 只有版本升级，以及回测引擎、开平仓或成交逻辑、收益／成本计算、数据准备、schema、执行契约或结果语义发生变化时，才运行完整回归测试。\n- 前端筛选、排序、选择器、按钮、导航或状态同步等行为变化，采用小范围针对性测试或浏览器交互检查。只覆盖受影响交互及其最近依赖状态；风险边界扩大时再提高验证级别。\n- 纯展示变化，例如文案、颜色、间距、字体、对齐、响应式布局或可见性，只需重新生成对应 HTML 并进行一次简单功能检查；环境允许时附一张有代表性的截图。\n- 变更跨越多个级别或语义影响不明确时，采用更高级别。交接时记录所选级别与证据，不能因为习惯而运行更大范围测试。\n\n## 修改后\n\n- 使用 `00_START_HERE.en.md` 的维护触发条件归类聊天中已确认的变化。\n- 按 `00_START_HERE.en.md` 的变更类型规则更新对应文档。\n- 工作完成或发生重要变化时更新 `WORK_PROGRESS`；行为变化需要长期理由时更新 `CHANGE_REASONS`。\n- 管理 Markdown 或 manifest 变化后运行 `node \"project_management\\tools\\build_dashboard.mjs\"`。\n- 变更影响 Dashboard 布局或交互时进行页面检查。\n","modified":"2026-08-08T09:25:54.751Z","missing":false},{"id":"start.en","pair":"start","group":"priority","path":"00_START_HERE.en.md","lang":"en","title":"Start Here","lead":"Purpose, evidence priority, reading order, and maintenance triggers.","policy":"Update when the entry point, reading map, or maintenance protocol changes.","markdown":"# Project Management Entry\n\n## Purpose\n\nThis folder is the shared working memory for \u003cstrong>Backtest V4.41 Research\u003c/strong>. V4.41 is a minor release on the V4.4 strategy and ranking lineage. It records current intent, constraints, valid files, version state, active work, decisions, history, future directions, references, and archive boundaries. It does not duplicate large project files or raw source material.\n\nThe folder was initialized for a \u003cstrong>existing project\u003c/strong> on 2026-08-01.\n\n## Current orientation\n\n- \u003cstrong>Durable goal:\u003c/strong> Repair execution realism and keep V4.4 reproducible from repository-local runtime inputs.\n- \u003cstrong>Optional domain modules:\u003c/strong> data, research\n- \u003cstrong>Operational language:\u003c/strong> English.\n- \u003cstrong>Review mirror:\u003c/strong> Chinese.\n- \u003cstrong>Unknown facts:\u003c/strong> remain unconfirmed until supported by the user or project evidence.\n\nThe management dashboard is an offline document reader. Its use of HTML does not imply that this project contains or needs a frontend.\n\n## Evidence priority\n\nUse the highest applicable source:\n\n1. Current user instruction and accepted decisions.\n2. Current real project artifacts and behavior, including configuration, tests, or commands only when they exist.\n3. Current English project-management documents.\n4. Chinese review mirrors.\n5. Historical, proposed, future, and archived material.\n\nWhen sources disagree, record the discrepancy. Do not silently choose the more convenient source.\n\n## Conversation intake and ongoing maintenance\n\nBefore initialization or project-changing work, review the conversation and delegated context available in the current task. Extract confirmed goals, constraints, decisions, tasks, current state, domains, corrections, and unknowns. Do not claim access to conversation that is not available.\n\nFor a new project, use those confirmed facts to populate the neutral management scaffold. Build a project implementation scaffold only when the user requests it and the available conversation establishes enough project shape. For an existing project, reconcile the intake with real project evidence and keep every user-owned file protected.\n\nDuring later work, an accepted durable change in the conversation triggers the matching document update before the task ends. Explanation-only questions, hypotheticals, and unaccepted ideas do not change files. Store conclusions and useful rationale rather than raw transcripts, secrets, or private personal data.\n\nWhen a request names an existing tool, template, or behavior, that named item defines the implementation boundary. Inspect it before work and obtain user confirmation before substituting a newly authored implementation or adding behavior outside the stated request.\n\nBefore changing any file, behavior, output, workflow, field, or artifact beyond the user's explicit request or accepted proposal, stop and obtain approval. Technical convenience, provenance concerns, adjacent cleanup, and agent interpretation do not broaden authorization.\n\n## Role-neutral execution governance\n\n- The project accepts any executable instrument profile and any exact evaluation interval. Completed results use date-based evaluation packages; experiment roles live in plans and records rather than directory names.\n- `results\\evaluation_comparison` reads package-owned browser summaries and joins exact `combo_id` values. Existing stable main and per-trade pages remain compatibility contracts during framework changes.\n- Intermediate exploration rounds close immutable raw evidence and compact summaries only. They do not generate cumulative or per-trade HTML by default.\n- Parameter exploration follows a repeating AI-led cycle: multi-round leap search, finite one-parameter grids around promising nonadjacent anchors, then renewed leap search. A round may belong to one phase; reports preserve the phase and keep exploration and refinement evidence separate across the cycle.\n- One-axis grids have no fixed point-count cap. Freeze finite bounds, steps, anchor, and expected coordinates before compute; interpret the complete closed pattern before continuing, refining, widening, stopping, or changing direction.\n- User observation and correction occur between cycles or at a requested checkpoint. Autonomous rounds while the user is unavailable remain inside the authorized time, instrument, method, data, and resource boundary.\n- The shared cumulative main and per-trade entries are published once after the exploration series ends. An intermediate publication requires an explicit user request. Final publication includes every compatible completed round and uses one cumulative writer.\n\n## Validation-tier routing\n\n- \u003cstrong>Complete regression:\u003c/strong> version upgrades and changes to engine behavior, entry/exit or fills, return/cost calculations, data preparation, schemas, execution contracts, or result semantics.\n- \u003cstrong>Focused interaction:\u003c/strong> frontend filters, sorting, selectors, buttons, navigation, and state synchronization. Check the affected interaction and its closest dependent state.\n- \u003cstrong>Visual-only:\u003c/strong> copy, color, spacing, typography, alignment, responsive layout, and visibility. Regenerate the affected HTML, perform a simple functional check, and retain desktop/mobile screenshots; do not run the complete suite unless behavior or data also changes.\n- If scope crosses tiers or semantic impact is uncertain, use the higher tier and record the selected tier in the handoff.\n\n## Default reading order\n\nRead before project changes:\n\n1. `..\\AGENTS.md`\n2. `00_START_HERE.en.md`\n3. `01_goal\\PROJECT_GOAL.en.md`\n4. `01_goal\\PROJECT_CONSTRAINTS.en.md`\n5. `02_current_state\\SOURCE_OF_TRUTH.en.md`\n6. `02_current_state\\CURRENT_VERSION.en.md`\n7. `03_active_work\\CURRENT_TASKS.en.md`\n8. `03_active_work\\WORK_PROGRESS.en.md`\n9. `03_active_work\\EXPERIMENT_PROGRESS.en.md` when the task runs, interprets, or closes an experiment.\n10. `03_active_work\\BACKTEST_MANAGEMENT.en.md` before every backtest run.\n11. `05_domains\\research\\PARAMETER_EXPLORATION_GUIDE.en.md` for every parameter-exploration design, run, interpretation, or next-round CSV handoff.\n12. `00_core\\STRATEGY_CONTRACT_V4_4.en.md`, `10_instruments\\INSTRUMENT_PROFILE_CONTRACT.en.md`, and `20_campaigns\\CAMPAIGN_WORKFLOW.en.md` for cross-instrument transfer or a fresh instrument search.\n\nLoad other documents only when the task requires them.\n\n## Task selection matrix\n\n| Task | Additional documents |\n| --- | --- |\n| Explain or answer | Only the files needed for the answer; do not mutate project state unless requested. |\n| Change scope or plan | Goal, constraints, current tasks, and work progress. |\n| Change a deliverable or current behavior | Goal, constraints, source of truth, current version, current tasks, work progress, and relevant decisions. |\n| Repair or materially change behavior | Current version, work progress, change reasons, and relevant decisions. |\n| Change code structure, execution flow, components, dependencies, data flow, or interface boundaries | Source of truth, current version, code architecture, current tasks, work progress, and relevant decisions. |\n| Change a confirmed domain | The matching active module listed below, plus current state, work progress, and decisions. |\n| Design, run, interpret, or hand off parameter exploration | Parameter Exploration Guide, research constraints, experiment progress, current constraints, current tasks, and the current source identity. |\n| Run any backtest | Backtest Management, current source identity, instrument profile, campaign workflow, and the documents required by the run's mode. |\n| Transfer to another instrument or start a fresh instrument search | Strategy Contract, Instrument Profile Contract, Campaign Workflow, Parameter Exploration Guide, data requirements, and current source identity. |\n| Propose a direction | Current goal, constraints, tasks, work progress, decisions, and next directions. |\n| Reuse a reference | Reference index and its source file. |\n| Inspect, reuse, or restore historical work | Project history, archive guide, and the archived item's note. |\n\n### Active domain reading rules\n\n- Read `project_management\\05_domains\\data\\DATA_REQUIREMENTS.en.md` before changing schemas, migrations, pipelines, lineage, or data contracts.\n- Read `project_management\\05_domains\\research\\RESEARCH_CONSTRAINTS.en.md` before changing methods, running experiments, or interpreting results.\n- Read and follow `project_management\\05_domains\\research\\PARAMETER_EXPLORATION_GUIDE.en.md` for every parameter-exploration task.\n\n## Document maintenance triggers\n\n| Document | Update trigger |\n| --- | --- |\n| `PROJECT_GOAL` | The user changes the durable objective or accepted success criteria. |\n| `PROJECT_CONSTRAINTS` | A durable cross-project constraint is accepted, changed, or retired. |\n| `SOURCE_OF_TRUTH` | An authoritative path, entry point, branch, configuration, or artifact changes. |\n| `CURRENT_VERSION` | A deliverable, current behavior, project structure, interface, dependency, or operating procedure changes. |\n| `CODE_ARCHITECTURE` | A code entry point, component responsibility, dependency or call relationship, data flow, generated artifact, or interface boundary changes. Mark it not applicable when the project has no code. |\n| `CURRENT_TASKS` | A task is declared, completed, blocked, resumed, or changes scope. |\n| `WORK_PROGRESS` | Work completes or changes materially enough to affect handoff, review, or the current understanding of the project. |\n| `EXPERIMENT_PROGRESS` | An authorized experimental round closes or the experimental evidence boundary changes. |\n| `BACKTEST_MANAGEMENT` | Before every backtest starts; keep the row even when the run stops early. |\n| `PARAMETER_EXPLORATION_GUIDE` | The accepted parameter-diagnosis, improvement-judgment, experiment-block, or next-round CSV handoff rule changes. |\n| `STRATEGY_CONTRACT_V4_4` | Accepted instrument-neutral entry, exit, timing, or state-machine semantics change. |\n| `INSTRUMENT_PROFILE_CONTRACT` | Data, cost, gap, low-activity, scenario, or ranking-lineage interfaces change. |\n| `CAMPAIGN_WORKFLOW` | Exact transfer, target-local refinement, same-lineage continuation search, fresh search, cross-instrument ranking, or prompt-handoff rules change. |\n| `CHANGE_REASONS` | A material behavior change needs a durable reason, prior behavior, updated behavior, evidence impact, and validity boundary. |\n| `DECISIONS` | A durable choice is accepted, retired, or reversed. |\n| `PROJECT_HISTORY` | An event changes how past or current work should be understood. |\n| `NEXT_DIRECTIONS` | A testable research question, strategy hypothesis, or validation path appears, changes, becomes active, or is retired. Execution, delivery, and resource gates belong in constraints, tasks, or operating rules rather than future research directions. |\n| `08_references\\README` | A retained source or its provenance, relevance, or review status changes. |\n| `99_archive\\README` | Material becomes inactive, archive policy changes, or an item is restored. |\n| Active domain document | A durable rule in that confirmed domain changes. |\n| Root agent files and this entry | The reading order or maintenance protocol changes. |\n\nUpdate the English source and Chinese mirror together. Regenerate `index.html` with:\n\n```powershell\nnode \"project_management\\tools\\build_dashboard.mjs\"\n```\n\n## History and archive boundary\n\nThe Dashboard separates current guidance and work from project history and inactive material. Do not load history or archive documents during normal work unless the task needs past evidence, reuse, or restoration.\n\nWhen a major delivery version or working method changes and prior detailed progress would mislead current work, move the superseded body into a dated folder under `99_archive`, keep a concise restoration pointer in `WORK_PROGRESS`, and preserve the archived material.\n\n## Initialization inventory\n\nThe initializer detected these pre-existing files, limited to a small orientation sample:\n\n- `.gitignore`\n- `.python-version`\n- `package-lock.json`\n- `package.json`\n- `PRODUCT.md`\n- `README.md`\n- `RELEASE.json`\n- `requirements-v4_4.txt`\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\__init__.py`\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\README.md`\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\SOURCE_MANIFEST.json`\n- `runtime_inputs\\data_preparation\\baseline_filter_atoms.csv`\n- `runtime_inputs\\data_preparation\\baseline_filter_events.json`\n- `runtime_inputs\\data_preparation\\data_preparation_manifest.json`\n- `runtime_inputs\\market_data\\data_preparation_audit.json`\n- `runtime_inputs\\market_data\\k200_clean_15s_session_filled.csv`\n- `runtime_inputs\\provenance\\V4_2_SOURCE_MANIFEST.json`\n- `runtime_inputs\\templates\\historical_v4_main.html`\n- `runtime_inputs\\templates\\historical_v4_trade.html`\n- `runtime_inputs\\templates\\market-intuition-selector.html`\n- `runtime_inputs\\scenarios\\market_catalog.json`\n- `runtime_inputs\\scenarios\\scenario_catalog.json`\n- `tools\\build_v4_41_scenario_manager.py`\n- `tools\\apply_v4_41_scenario.py`\n- `runtime_inputs\\templates\\plotly.min.js`\n- `RUNTIME.md`\n\nDetection is not authority. Confirm current entry points and artifacts in `02_current_state\\SOURCE_OF_TRUTH.en.md`.\n\n## Review style\n\n- Keep documents concise and factual.\n- Separate current, retired, proposed, and unknown states.\n- Link to real paths instead of copying large outputs.\n- Record why a fact is believed and when it stops being valid.\n- Use HTML `\u003cstrong>...\u003c/strong>` for bold text. Do not author Markdown `**...**`; this avoids CommonMark delimiter ambiguity around Chinese punctuation. Inline code, fenced code, and glob paths retain literal asterisks.\n","modified":"2026-08-08T10:43:47.439Z","missing":false},{"id":"start.zh","pair":"start","group":"priority","path":"00_START_HERE.zh.md","lang":"zh","title":"从这里开始","lead":"用途、证据优先级、读取顺序与维护触发条件。","policy":"入口、读取地图或维护协议变化后更新。","markdown":"# 项目管理入口\n\n## 用途\n\n这个目录是 \u003cstrong>Backtest V4.41 Research\u003c/strong> 的共享工作记录。V4.41 是建立在 V4.4 策略与排序谱系上的小版本。它保存当前意图、约束、有效文件、版本状态、当前工作、决策、历史、后续方向、参考材料与存档边界，不复制大型项目文件或原始来源材料。\n\n该目录于 2026-08-01 为一个\u003cstrong>现有项目\u003c/strong>建立。\n\n## 当前概览\n\n- \u003cstrong>长期目标：\u003c/strong>修复成交真实性，并让 V4.4 使用仓库本地运行输入实现可复现。\n- \u003cstrong>可选领域模块：\u003c/strong>data、research\n- \u003cstrong>执行语言：\u003c/strong>英文。\n- \u003cstrong>审阅镜像：\u003c/strong>中文。\n- \u003cstrong>未知事实：\u003c/strong>在获得用户确认或项目证据前保持「待确认」。\n\n管理 Dashboard 是离线文档查看器。它使用 HTML，不能据此认定项目包含或需要前端。\n\n## 证据优先级\n\n使用适用范围内优先级最高的来源：\n\n1. 用户当前指令与已确认决定。\n2. 项目当前真实材料与行为；配置、测试或命令只在实际存在时适用。\n3. 当前英文项目管理文档。\n4. 中文审阅镜像。\n5. 历史、提案、后续方向与存档材料。\n\n来源发生冲突时记录差异，不能默默选择更方便的来源。\n\n## 聊天内容摄取与持续维护\n\n初始化或修改项目前，阅读当前任务内可用的聊天与委派上下文，提取已确认目标、约束、决定、任务、当前状态、领域、更正与未知项。不能声称读取了不可用聊天。\n\n新项目使用这些已确认事实填充中立管理框架。只有用户要求建立项目实现，并且可用聊天已明确项目形态时，才建立项目实现框架。已有项目需要把聊天内容与真实项目证据进行核对，并保护每个用户已有文件。\n\n后续工作中，聊天确认了长期变化后，在任务结束前更新对应文档。解释型问题、假设讨论或未确认想法不修改文件。只保存结论与有用理由，不保存聊天原文、秘密信息或私人个人数据。\n\n需求指定现有工具、模板或行为时，该指定项目就是实现边界。工作前必须检查它；若要改用新写实现或增加需求之外的行为，必须取得用户确认。\n\n任何文件、行为、输出、工作流、字段或材料的改动，只要超出用户明确提出或已经同意的范围，都必须停止并取得用户许可。技术便利、来源追溯、相邻清理与 agent 自己的理解都不会扩大授权范围。\n\n## 角色中立执行治理\n\n- 项目允许任何已就绪品种配置使用任意精确评价区间。已完成结果按日期区间保存为结果包，实验角色写在方案和记录中，不进入目录名。\n- `results\\evaluation_comparison` 读取各结果包自己的浏览器摘要，并按精确 `combo_id` 连接。框架调整期间，现有稳定总入口和逐笔页面继续作为兼容契约。\n- 中间探索轮只闭合不可变原始证据与小型汇总，默认不生成累计或逐笔 HTML。\n- 参数探索采用 AI 主导的循环：多轮跳跃搜索、围绕互不相邻优秀锚点的有限单参数网格、再次跳跃搜索。单轮可以只属于其中一个阶段；报告标明阶段，并在完整循环中分开保留探索与细化证据。\n- 单轴网格不设固定点数上限。运算前冻结有限边界、步长、锚点和预计坐标数；完整闭合结果得到解释后，才决定继续、细化、扩大、停止或更换方向。\n- 用户在循环之间或指定检查点查看结果并修正。用户暂时不在线时，自主轮次不得超出已经授权的时间、品种、方法、数据和资源边界。\n- 整组探索结束后生成一次共享累计总入口与共享逐笔入口。中途发布需要用户明确要求；最终发布包含全部兼容已完成轮次，并只允许一个累计 writer。\n\n## 验证级别路由\n\n- \u003cstrong>完整回归：\u003c/strong>版本升级，以及引擎行为、开平仓或成交、收益／成本计算、数据准备、schema、执行契约或结果语义发生变化。\n- \u003cstrong>针对性交互：\u003c/strong>前端筛选、排序、选择器、按钮、导航和状态同步。检查受影响交互及其最近依赖状态。\n- \u003cstrong>仅视觉检查：\u003c/strong>文案、颜色、间距、字体、对齐、响应式布局和可见性。重新生成对应 HTML，完成简单功能检查，并保留桌面／手机截图；只有同时影响行为或数据时才运行完整测试。\n- 变更跨越多个级别或语义影响不明确时，采用更高级别，并在交接中记录所选级别。\n\n## 默认读取顺序\n\n修改项目前阅读：\n\n1. `..\\AGENTS.md`\n2. `00_START_HERE.en.md`\n3. `01_goal\\PROJECT_GOAL.en.md`\n4. `01_goal\\PROJECT_CONSTRAINTS.en.md`\n5. `02_current_state\\SOURCE_OF_TRUTH.en.md`\n6. `02_current_state\\CURRENT_VERSION.en.md`\n7. `03_active_work\\CURRENT_TASKS.en.md`\n8. `03_active_work\\WORK_PROGRESS.en.md`\n9. 任务涉及运行、解释或闭合实验时，阅读 `03_active_work\\EXPERIMENT_PROGRESS.en.md`。\n10. 每次运行回测前，阅读 `03_active_work\\BACKTEST_MANAGEMENT.en.md`。\n11. 每次设计、运行、解释参数探索或交付下一轮 CSV 时，阅读 `05_domains\\research\\PARAMETER_EXPLORATION_GUIDE.en.md`。\n12. 跨品种迁移或对新品种开展全新搜索时，阅读 `00_core\\STRATEGY_CONTRACT_V4_4.en.md`、`10_instruments\\INSTRUMENT_PROFILE_CONTRACT.en.md` 和 `20_campaigns\\CAMPAIGN_WORKFLOW.en.md`。\n\n其他文档只在任务需要时读取。\n\n## 任务选择矩阵\n\n| 任务 | 追加读取文档 |\n| --- | --- |\n| 解释或回答 | 只读取回答所需文件；用户未要求修改时不改变项目状态。 |\n| 修改范围或规划 | 目标、约束、当前任务与工作进展。 |\n| 修改交付物或当前行为 | 目标、约束、当前有效文件、当前版本、当前任务、工作进展与相关决策。 |\n| 修复行为或对行为作重要修改 | 当前版本、工作进展、变更理由与相关决策。 |\n| 修改代码结构、执行流程、组件、依赖、数据流或接口边界 | 当前有效文件、当前版本、代码架构、当前任务、工作进展与相关决策。 |\n| 修改已确认领域 | 下方对应模块，以及当前状态、工作进展与相关决策。 |\n| 设计、运行、解释参数探索或交付下一轮参数 | 参数探索指南、研究约束、实验进度、当前约束、当前任务与当前源码身份。 |\n| 运行任何回测 | 回测管理、当前源码身份、品种配置、实验活动流程，以及该运行模式要求的其他文档。 |\n| 迁移到其他品种或对新品种开展全新搜索 | 策略协议、品种配置协议、实验活动流程、参数探索指南、数据要求和当前源码身份。 |\n| 提议方向 | 当前目标、约束、任务、工作进展、决策与后续方向。 |\n| 使用参考材料 | 参考索引及其源文件。 |\n| 检查、复用或恢复历史工作 | 项目历史、存档说明与对应项目说明。 |\n\n### 已启用领域读取规则\n\n- 修改数据结构、迁移、管线、血缘或数据契约前，阅读 `project_management\\05_domains\\data\\DATA_REQUIREMENTS.en.md`。\n- 修改研究方法、运行实验或解释结果前，阅读 `project_management\\05_domains\\research\\RESEARCH_CONSTRAINTS.en.md`。\n- 每次参数探索都必须阅读并遵守 `project_management\\05_domains\\research\\PARAMETER_EXPLORATION_GUIDE.en.md`。\n\n## 文档维护触发条件\n\n| 文档 | 更新条件 |\n| --- | --- |\n| `PROJECT_GOAL` | 用户改变长期目标或已确认成功标准。 |\n| `PROJECT_CONSTRAINTS` | 长期通用约束被确认、修改或退役。 |\n| `SOURCE_OF_TRUTH` | 权威路径、入口、分支、配置或产物变化。 |\n| `CURRENT_VERSION` | 交付物、当前行为、项目结构、接口、依赖或运行流程变化。 |\n| `CODE_ARCHITECTURE` | 代码入口、组件职责、依赖或调用关系、数据流、生成产物或接口边界变化。项目没有代码时标为「不适用」。 |\n| `CURRENT_TASKS` | 任务被声明、完成、阻塞、恢复或改变范围。 |\n| `WORK_PROGRESS` | 工作完成，或变化程度足以影响交接、审阅或当前项目理解。 |\n| `EXPERIMENT_PROGRESS` | 已授权实验轮次闭合，或实验有效边界发生变化。 |\n| `BACKTEST_MANAGEMENT` | 每次启动回测前更新；回测中途停止时仍保留该行。 |\n| `PARAMETER_EXPLORATION_GUIDE` | 已确认的交易诊断、多指标改善判断、实验块或下一轮 CSV 交付规则发生变化。 |\n| `STRATEGY_CONTRACT_V4_4` | 已接受的品种无关开仓、平仓、时序或状态机语义发生变化。 |\n| `INSTRUMENT_PROFILE_CONTRACT` | 数据、成本、gap、低活跃、情景或排名谱系接口发生变化。 |\n| `CAMPAIGN_WORKFLOW` | 完整迁移、目标局部细化、同谱系续探、全新搜索、跨品种排名或指令交接规则发生变化。 |\n| `CHANGE_REASONS` | 重要行为变化需要长期保留修改原因、原有表现、新表现、证据影响与有效边界。 |\n| `DECISIONS` | 长期选择被确认、退役或反转。 |\n| `PROJECT_HISTORY` | 事件改变历史或当前工作的解释。 |\n| `NEXT_DIRECTIONS` | 可检验的研究问题、策略假设或验证路径出现、变化、转为当前工作或退役。执行、交付和资源门槛写入约束、任务或工作规则，不归入后续研究方向。 |\n| `08_references\\README` | 保留材料或其来源、相关性、审阅状态变化。 |\n| `99_archive\\README` | 材料转为非活动、存档规则变化或项目恢复。 |\n| 已启用领域文档 | 对应领域的长期规则变化。 |\n| 根目录 Agent 文件与本入口 | 读取顺序或维护协议变化。 |\n\n英文来源与中文镜像需要同步更新。使用下方命令重新生成 `index.html`：\n\n```powershell\nnode \"project_management\\tools\\build_dashboard.mjs\"\n```\n\n## 历史与存档边界\n\nDashboard 将当前规则与工作、项目历史及非活动材料分开。日常工作不加载历史或存档文档；任务需要过去证据、复用或恢复时再读取。\n\n主交付版本或工作方法变化，并且旧进展细节会误导当前工作时，将被替代的正文移入 `99_archive` 下带日期的目录，在 `WORK_PROGRESS` 中保留简洁恢复指针，并完整保留存档材料。\n\n## 初始化文件概览\n\n初始化器检测到以下已有文件；该列表只保留少量定位信息：\n\n- `.gitignore`\n- `.python-version`\n- `package-lock.json`\n- `package.json`\n- `PRODUCT.md`\n- `README.md`\n- `RELEASE.json`\n- `requirements-v4_4.txt`\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\__init__.py`\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\README.md`\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\SOURCE_MANIFEST.json`\n- `runtime_inputs\\data_preparation\\baseline_filter_atoms.csv`\n- `runtime_inputs\\data_preparation\\baseline_filter_events.json`\n- `runtime_inputs\\data_preparation\\data_preparation_manifest.json`\n- `runtime_inputs\\market_data\\data_preparation_audit.json`\n- `runtime_inputs\\market_data\\k200_clean_15s_session_filled.csv`\n- `runtime_inputs\\provenance\\V4_2_SOURCE_MANIFEST.json`\n- `runtime_inputs\\templates\\historical_v4_main.html`\n- `runtime_inputs\\templates\\historical_v4_trade.html`\n- `runtime_inputs\\templates\\market-intuition-selector.html`\n- `runtime_inputs\\scenarios\\market_catalog.json`\n- `runtime_inputs\\scenarios\\scenario_catalog.json`\n- `tools\\build_v4_41_scenario_manager.py`\n- `tools\\apply_v4_41_scenario.py`\n- `runtime_inputs\\templates\\plotly.min.js`\n- `RUNTIME.md`\n\n检测结果不是权威结论。请在 `02_current_state\\SOURCE_OF_TRUTH.en.md` 中确认当前入口与产物。\n\n## 审阅方式\n\n- 文档保持简洁并使用事实描述。\n- 区分当前、已退役、提案与未知状态。\n- 链接真实路径，不复制大型输出。\n- 记录事实依据与失效边界。\n- 加粗只使用 HTML `\u003cstrong>...\u003c/strong>`，不写 Markdown `**...**`，避免中文标点附近的 CommonMark 分隔符歧义。inline code、围栏代码块和 glob 路径中的星号保持原样。\n","modified":"2026-08-08T10:43:47.442Z","missing":false},{"id":"goal.en","pair":"goal","group":"planning","path":"01_goal/PROJECT_GOAL.en.md","lang":"en","title":"Project Goal","lead":"Durable objective, current milestone, success criteria, and non-goals.","policy":"Update only after the user changes the durable project objective.","markdown":"# Project Goal\n\n## Scenario research surface\n\nLet the researcher choose one registered instrument-and-date market interval, mark one or more exact ranges, save that selection as a named scenario, and apply it to completed evaluation packages. The resulting qualified-coordinate page must preserve the current main ranking workflow and route every coordinate to its package-owned per-trade evidence without rerunning the strategy.\n\n## Durable objective\n\nMaintain one reproducible instrument-neutral V4.4 strategy protocol. Any executable instrument profile and exact time interval can be backtested independently, stored as its own date-based evaluation package, and compared through an explicit experiment plan. Preserve the established K200 evidence lineage while supporting controlled exact transfer, target-local refinement, continuation, and fresh exploration on other futures instruments.\n\n## Current milestone\n\nThe four-slice K200 temporal migration is complete. Among 218 candidates observed in all four subsequent-market slices, two are positive in every slice and both are low-frequency, concentrated results. The training/full-test return-rank Spearman is -0.262, and only 25 of 400 frozen candidates are positive in the final holdout. Current evidence does not support one static broadly applicable parameter set. The active research direction is short-window re-estimation plus a separately authorized market-regime gate, followed by frozen forward evaluation. No parameter is accepted.\n\nThe current K200 cumulative snapshot `5b4e11b4c137028dc0a33d792a47800c8d792f6125e2cc8d2f5796ec6ef4fa94` contains 5,320 coordinates, 797,020 trades, and sixteen compatible positive-entry stages. Continuation Round 15 combined 192 broad-coverage coordinates with 84 one-parameter refinement coordinates. The average-return branch improved; the unrestricted total-return and Scenario-1 leaders remain unchanged. Another instrument receives a separate ranking lineage and can be compared through an explicit cross-instrument view. No parameter is accepted.\n\n## Success criteria\n\n- Same-bar rebound confirmation never assumes an intrabar threshold fill that cannot be ordered from 15-second OHLC.\n- Prior-trigger exits use `open >= trigger` then `high >= trigger`, including equality.\n- Every W source window begins at or after the trade's H.\n- No exit reads a price after the declared sample end.\n- `exclude_marked` baseline atoms become available only according to their causal lifecycle.\n- W uses available prefixes from 1 through W and measures `w_open_to_end_low_drop = open[start] - low[end]`.\n- Pending entry remains a retained signal that fills at the first real-trade open within 120 continuous candidate bars.\n- Gross and cost-adjusted modes change both ranking and displayed returns; cost-adjusted is the default.\n- Instrument profiles bind data, cost, gap, low-activity, optional scenario, and ranking-lineage identities without changing the shared strategy semantics.\n- Evaluation-package directories are identified by instrument and exact evaluated start/end timestamps. Training, test, transfer, holdout, and descriptive roles remain experiment metadata.\n- A generic comparison entry reads completed evaluation packages, joins exact `combo_id` values, and routes each metric to that package's own per-trade entry without rewriting retained trade evidence.\n- Framework changes preserve the visible content and behavior of existing stable main and per-trade HTML; compatibility is proven before a stable redirect changes.\n- `transfer_exact`, `target_local_refinement`, `continuation_search`, and `fresh_search` have separate evidence rules and cannot be silently substituted for one another.\n- Cross-instrument transfer preserves the strategy's 15-second data granularity. A different target granularity fails closed before compute.\n- Future entry signals require positive baseline, drop, and threshold values; equality at a positive threshold remains valid. Historical results remain immutable and are not recomputed by this contract repair.\n- Existing K200 results remain unchanged. Later compatible K200 results rank with them; other-instrument ranks remain separate.\n- Intermediate continuation rounds close immutable raw evidence and compact summaries without HTML publication. After the authorized multi-round exploration series ends, publish the shared cumulative main and shared per-trade entries once and apply the risk-proportional final delivery checks. An intermediate publication occurs only on explicit user request.\n- Ordinary parameter exploration serves two purposes in the same round: broad legal-space coverage to reduce missed promising regions, and evidence-led one-parameter refinement around strong combinations to seek cost-adjusted return or maximum-drawdown improvement. Report the two branches separately.\n\n## Non-goals\n\n- In-sample leaders do not accept or promote a parameter.\n- Derived cost analysis does not alter raw fills or raw returns.\n- Cross-instrument comparison does not treat target refinement as evidence that an exact transfer succeeded.\n","modified":"2026-08-08T09:25:54.752Z","missing":false},{"id":"strategy-contract.en","pair":"strategy-contract","group":"core","path":"00_core/STRATEGY_CONTRACT_V4_4.en.md","lang":"en","title":"Strategy Contract V4.4","lead":"Instrument-neutral entry, exit, state-machine, and timing semantics.","policy":"Update when accepted strategy semantics change.","markdown":"# Strategy Contract V4.4\n\n## Purpose\n\nThis document defines the instrument-neutral trading protocol. Instrument data, sessions, costs, gap rules, low-activity thresholds, and event dates belong to instrument profiles or campaign manifests. The current strategy sampling contract is one completed 15-second bar per execution atom; a transfer target must use the same granularity.\n\n## Entry contract\n\n- Find the ordered high anchor H and measure the E-window decline from that anchor.\n- Build the entry baseline from completed TR atoms inside BH, grouped by TRW.\n- The entry threshold is `max(K × baseline, absolute floor)`.\n- Entry qualification requires finite `baseline`, `drop`, and `threshold`, with `baseline > 0`, `drop > 0`, `threshold > 0`, and `drop >= threshold`. Equality remains a valid positive-boundary signal; zero baseline/drop/threshold cannot open a trade.\n- A calculated-threshold signal fills at the threshold unless the real bar opens through it, in which case the open is used.\n- A signal formed on a non-real bar is retained and fills at the first real-trade open within 120 continuous candidate bars.\n\n## Exit contract\n\n- W uses available prefixes from 1 through W and measures `open[start] - low[end]`.\n- The W start is no earlier than H, the continuous-segment start, or `end-W+1`.\n- M converts the maximum completed W decline into the rebound threshold.\n- A prior trigger exits at `open >= trigger`; otherwise `high >= trigger` exits at the trigger. Equality exits.\n- A strict same-bar new low is confirmed with the close and exits at that close.\n- S detects a stopped decline. Non-real exits wait for the next real-trade open.\n- Any position remaining at the declared sample end closes at that sample-end close.\n\n## Shared state machine\n\nFlat reset, calculated-threshold fill, synthetic bars, pending entry, pending exit, and the confirmed low-activity gate are part of the core. A low-volume run has no strategy effect while pending: its atoms remain baseline-eligible and entries remain allowed. If it recovers before confirmation, the run is discarded. At the 120th consecutive low-volume 15-second atom, the run confirms: all atoms from its first atom through confirmation become unavailable to every later baseline calculation, unfilled entry orders are cancelled, and new entries are blocked through the final low-volume atom. The first normal-volume atom ends the gate and is immediately eligible for new baseline sampling and entry evaluation. Existing positions continue their normal exit rules. This confirmation-time rule uses no future state.\n\n## Instrument boundary\n\nThe core contains no instrument name, exchange, currency, multiplier, commission, slippage, scenario date, or session clock. It does bind the shared 15-second execution granularity and positive-entry qualification. The executable JSON authority is `research_variants\\short_momentum_net_drop_rebound_v4_4\\contracts\\STRATEGY_CONTRACT_V4_4.json`.\n","modified":"2026-08-06T13:31:33.544Z","missing":false},{"id":"strategy-contract.zh","pair":"strategy-contract","group":"core","path":"00_core/STRATEGY_CONTRACT_V4_4.zh.md","lang":"zh","title":"V4.4 策略协议","lead":"与品种无关的开仓、平仓、状态机和时序语义。","policy":"已接受的策略语义变化后更新。","markdown":"# V4.4 策略协议\n\n## 用途\n\n本文定义与品种无关的交易协议。品种数据、交易时段、成本、gap 规则、低活跃阈值和事件日期归入品种配置或实验清单。当前策略的数据颗粒度协议为每个执行原子对应一根已经完成的 15 秒 bar；迁移目标必须使用相同颗粒度。\n\n## 开仓协议\n\n- 寻找有序高点锚 H，并从 H 计算 E 窗口下跌。\n- 使用 BH 内已经完成的 TR 原子并按 TRW 分组，形成开仓基准。\n- 开仓阈值为 `max(K × baseline, absolute floor)`。\n- 开仓资格要求 `baseline`、`drop` 和 `threshold` 都是有限值，同时满足 `baseline > 0`、`drop > 0`、`threshold > 0` 与 `drop >= threshold`。正值边界相等仍可开仓；零 baseline、零 drop 或零 threshold 不能开仓。\n- calculated-threshold 信号按阈值成交；真实 bar 的 open 穿过阈值时使用 open。\n- 非真实 bar 形成的信号会保留，并在 120 根连续候选 bar 内按第一根真实成交 bar 的 open 开仓。\n\n## 平仓协议\n\n- W 使用 1 到 W 的可用前缀，计算 `open[start] - low[end]`。\n- W 起点不早于 H、连续交易段起点或 `end-W+1`。\n- M 把本次持仓已经完成的最大 W 下跌转换为回撤阈值。\n- 旧理论线按 `open >= trigger` 退出；否则按 `high >= trigger` 在理论线退出；相等也退出。\n- 同 bar 出现严格新低时，使用 close 确认并按该 close 平仓。\n- S 判断下跌停止推进。非真实 bar 的平仓等待下一根真实成交 bar 的 open。\n- 样本结束仍有持仓时，按样本结束 bar 的 close 强制平仓。\n\n## 通用状态机\n\nflat reset、calculated-threshold fill、synthetic bar、pending entry、pending exit 与确认后低活跃门禁都属于策略核心。低成交量连续段处于待确认状态时，对策略没有影响：原子可以进入 baseline，也可以开仓；确认前恢复时，待确认状态取消。连续第 120 根低成交量 15 秒原子完成时，过滤正式成立：从第一根低成交量原子到确认原子全部退出此后每次 baseline 计算，未成交开仓委托取消，并从确认原子起停止新开仓，直到最后一根低成交量原子结束。第一根正常成交量原子结束门禁，并立即允许新的 baseline 采样与开仓判断。已有持仓继续使用原有平仓规则。该规则只使用确认时已经完成的数据，不读取未来状态。\n\n## 品种边界\n\n策略核心不包含品种名称、交易所、币种、合约乘数、手续费、滑点、情景日期或交易时钟。它会绑定共享的 15 秒执行颗粒度与正值开仓资格。可执行 JSON 权威为 `research_variants\\short_momentum_net_drop_rebound_v4_4\\contracts\\STRATEGY_CONTRACT_V4_4.json`。\n","modified":"2026-08-06T13:31:33.546Z","missing":false},{"id":"instrument-profile.en","pair":"instrument-profile","group":"instrument","path":"10_instruments/INSTRUMENT_PROFILE_CONTRACT.en.md","lang":"en","title":"Instrument Profile Contract","lead":"Data, cost, gap, low-activity, scenario, and ranking-lineage bindings.","policy":"Update when the instrument-profile interface changes.","markdown":"# Instrument Profile Contract\n\n## Required profile fields\n\nEach executable instrument profile binds:\n\n- `instrument_id`, display name, timezone, and the shared strategy-contract ID;\n- market data and preparation-manifest path, size, and SHA-256, plus explicit `bar_seconds`;\n- a frozen cost-model reference;\n- a supported gap-policy mode with hash-bound configuration and implementation identities;\n- a supported low-activity policy with hash-bound configuration and implementation identities plus the causal baseline-availability rule;\n- an optional scenario set;\n- a sample-specific `ranking_lineage_id`.\n\nMissing cost or gap decisions keep a profile at `requires_user_input`; execution must stop and request those values. SImain and NQ templates deliberately contain no invented fees, slippage, FX, or gap policy. The profile, preparation manifest, and observed market-data grid must all declare the strategy's 15-second granularity; any difference stops execution and reports the expected and observed values.\n\n## Cost model\n\nNotional is calculated as `reference price × point value`. Commission is converted into the quote currency with the frozen FX reference when needed. Round-trip cost is:\n\n`slippage bps + 10,000 × round-trip commission in quote currency / contract notional`.\n\nThe normalized output fields are `point_value`, `quote_currency`, `commission`, `slippage_bps`, `contract_notional_quote`, and `round_trip_total_cost_bps`. The K200 legacy aliases remain available for historical tests and pages.\n\nExisting K200 results keep their frozen cost reference. A later K200 stage may bind a newer price-derived reference. Each coordinate retains its source-stage cost model and can remain in the same K200 ranking lineage with its actual `round_trip_cost_bps` disclosed.\n\n## Scenario and low-activity rules\n\n`scenario_set` is optional. Under schema-v5+ `profile_optional`, a profile with no scenario set produces an empty scenario population and cannot fall back to K200 events. Only an explicit legacy policy may load legacy K200 events. K200 event intervals stay in the K200 profile and remain separate filters or diagnostic views. A transfer or fresh-search primary result cannot require K200 scenario qualification.\n\nGap and low-activity policy labels are executable identities, not free-form descriptions. The profile policy IDs, configuration hashes, implementation hashes, and preparation-manifest declarations must match before compute. Those identities enter the plan fingerprint, stage contract, completion evidence, and result-semantics boundary. The shared low-activity lifecycle remains instrument-neutral; instrument thresholds and enable/disable decisions come only from the bound policy.\n\n## Current files\n\n- Ready K200 profile: `research_variants\\short_momentum_net_drop_rebound_v4_4\\instrument_profiles\\k200m.json`.\n- SImain input template: `research_variants\\short_momentum_net_drop_rebound_v4_4\\instrument_profiles\\simain.template.json`.\n- NQ input template: `research_variants\\short_momentum_net_drop_rebound_v4_4\\instrument_profiles\\nq.template.json`.\n","modified":"2026-08-04T21:24:17.936Z","missing":false},{"id":"instrument-profile.zh","pair":"instrument-profile","group":"instrument","path":"10_instruments/INSTRUMENT_PROFILE_CONTRACT.zh.md","lang":"zh","title":"品种配置协议","lead":"数据、成本、gap、低活跃、情景和排名谱系绑定。","policy":"品种配置接口变化后更新。","markdown":"# 品种配置协议\n\n## 必填配置\n\n每个可执行品种配置都要绑定：\n\n- `instrument_id`、显示名称、时区和共享策略协议 ID；\n- 行情数据与准备清单的路径、大小和 SHA-256，以及明确的 `bar_seconds`；\n- 冻结的成本模型参考；\n- 受支持的 gap policy 模式，以及绑定哈希的配置与实现身份；\n- 受支持的 low-activity policy，以及绑定哈希的配置、实现身份和因果 baseline availability 规则；\n- 可选 scenario set；\n- 与样本对应的 `ranking_lineage_id`。\n\n成本或 gap 决策缺失时，配置保持 `requires_user_input`，执行必须停止并询问用户。SImain 与 NQ 模板不会虚构手续费、滑点、汇率或 gap 规则。品种配置、数据准备清单与实际行情网格都必须声明策略使用的 15 秒颗粒度；任一值不同都要停止执行，并报告期望值与实际值。\n\n## 成本模型\n\n名义价值按 `参考价格 × point value` 计算。手续费币种与报价币种不同时，使用冻结的汇率参考转换。往返成本为：\n\n`slippage bps + 10,000 × 报价币种往返手续费 / 合约名义价值`。\n\n通用输出字段为 `point_value`、`quote_currency`、`commission`、`slippage_bps`、`contract_notional_quote` 和 `round_trip_total_cost_bps`。K200 旧字段继续保留，供历史测试与页面使用。\n\n现有 K200 结果保留原成本参考。后续 K200 阶段可以绑定按新参考价计算的成本。每个坐标保留来源阶段的成本模型，并披露实际 `round_trip_cost_bps`；它仍可进入同一个 K200 排名谱系。\n\n## 情景与低活跃规则\n\n`scenario_set` 可以为空。schema-v5+ 的 `profile_optional` 遇到没有 scenario set 的配置时，情景总体为空，不能回退到 K200 事件。只有明确声明的 legacy policy 可以加载旧 K200 事件。K200 事件区间保留在 K200 配置中，只作为独立过滤或诊断视图。迁移或全新搜索的主结果不得依赖 K200 情景资格。\n\ngap 与低活跃 policy 标签属于可执行身份，不能使用自由文本冒充规则。计算以前必须确认 profile policy ID、配置哈希、实现哈希与数据准备清单声明完全一致；这些身份进入计划指纹、阶段协议、完成证据和结果语义边界。共享低活跃生命周期属于通用层；具体阈值与启用／停用决定只来自绑定 policy。\n\n## 当前文件\n\n- 已就绪 K200 配置：`research_variants\\short_momentum_net_drop_rebound_v4_4\\instrument_profiles\\k200m.json`。\n- SImain 输入模板：`research_variants\\short_momentum_net_drop_rebound_v4_4\\instrument_profiles\\simain.template.json`。\n- NQ 输入模板：`research_variants\\short_momentum_net_drop_rebound_v4_4\\instrument_profiles\\nq.template.json`。\n","modified":"2026-08-04T21:24:17.936Z","missing":false},{"id":"campaign-workflow.en","pair":"campaign-workflow","group":"campaign","path":"20_campaigns/CAMPAIGN_WORKFLOW.en.md","lang":"en","title":"Campaign Workflow","lead":"Official transfer, local-refinement, and fresh-search modes plus prompt forms.","policy":"Update when campaign modes, ranking lineages, or handoff rules change.","markdown":"# Campaign Workflow\n\n## Four official modes\n\n### `transfer_exact`\n\nFreeze a nonempty, unique source-instrument candidate set before reading target results. The plan must contain exactly the same recomputed coordinate IDs: no missing, extra, duplicate, or altered coordinate is allowed. Source and target must use the strategy's same 15-second data granularity. This mode must precede any local target refinement.\n\n### `target_local_refinement`\n\nStart from a completed `transfer_exact` parent for the same target instrument and test a declared bounded neighborhood. Bind the parent's candidate freeze, select anchors that exist in that freeze, declare fixed fields and numeric per-parameter bounds, and validate every new coordinate against at least one anchor. A distant grid cannot be labeled local merely by naming its scope `bounded_neighborhood`.\n\n### `continuation_search`\n\nContinue evidence-led exploration for the same instrument and ranking lineage from a completed parent stage. The parent instrument and lineage must match the new campaign. Follow the Parameter Exploration Guide for broad, local, diagnostic, stability, anti-join, interpretation, and handoff rules. This mode cannot import a parent from another instrument.\n\n### `fresh_search`\n\nExplore a specified instrument from scratch. Do not import source candidates or a parent stage. Bind the current Parameter Exploration Guide by path, size, and SHA-256; declare the legal parameter space, coordinate budget, and experiment-block/search-mode labels. Begin with instrument-appropriate broad coverage.\n\n## Ranking and result lineages\n\nThe cumulative rank table merges only compatible results from the same instrument and `ranking_lineage_id`. Current K200 exploration remains under the repaired campaign/result root, so later compatible K200 rounds continue ranking with the existing 4,732 coordinates. A new instrument receives a separate lineage and rank table. Cross-instrument comparison displays source and target evidence together without mixing their ranks.\n\nEvery completed run also publishes or updates one date-based evaluation package for its instrument and exact evaluated interval. Package identity is independent from campaign mode and experiment role. The same package may later be described as training evidence, a holdout, a transfer source, or a comparison reference without moving or renaming it.\n\nCompleted migration batches are ranked together when target instrument, target sample, cost model, strategy semantics, and result schema match. Migration mode, run ID, and source stage remain provenance fields and do not create separate rank partitions. Deduplicate exact coordinates before publication; conflicting metrics for the same coordinate invalidate the union.\n\nHistorical K200 rows are not recomputed. New K200 rows use their stage-bound cost model, and the cumulative table sorts the union by each row's stored cost-adjusted metric. Every row exposes its actual round-trip cost.\n\n## Same-instrument temporal migration\n\nUse sequential walk-forward slices when completed training evidence is evaluated on subsequently observed data. Freeze the first candidate set from training only. Freeze each later set from training plus completed earlier slices before reading the next slice. Preserve the latest declared slice as the final holdout. The complete subsequent interval may be replayed once for descriptive ranking and per-trade delivery; label it post-hoc and keep it outside independent validation claims. Intermediate slices close raw evidence and compact summaries without HTML; publish the temporal ranking, target-period per-trade analysis, and report once after the series.\n\n## Minimum workflow\n\n1. Ask the user for any missing migration facts and write a reviewed migration plan containing source and target instrument IDs/display names, mode, data/sample, commission/slippage/FX, gap policy, low-activity policy, and candidate-filter status. Filtering remains deferred when it has not been approved.\n2. Confirm that source and target use the same 15-second bar granularity. Stop and tell the user when profile, preparation manifest, or observed data differs.\n3. Freeze the instrument profile and campaign manifest.\n4. Freeze coordinates before compute and perform completed+active+pending anti-join inside the target lineage.\n5. Apply the mode-specific contract: exact-set equality, bounded-neighborhood validation, same-lineage continuation, or from-scratch search-space validation.\n6. Before compute starts, append the instrument, exact market-data file, evaluated start time, and evaluated end time to `project_management\\03_active_work\\BACKTEST_MANAGEMENT.en.md` and its Chinese mirror.\n7. Run immutable raw compute only after explicit user authorization.\n8. For intermediate rounds, keep immutable raw results and compact summaries without HTML publication. Continue only from complete evidence.\n9. After a run or compatible series closes, write its date-based evaluation package: manifest, experiment record, neutral parameter summary, immutable trade records, browser projection when requested, and per-trade entry. Append only immutable batches and missing per-coordinate chunks.\n10. After the exploration series ends, publish the shared cumulative main and shared per-trade HTML once for the lineage. Publish earlier only on explicit user request. No parameter is accepted automatically.\n11. A multi-interval or multi-instrument report creates `comparison_plan.json`, assigns experiment roles there, and reads the selected completed packages by `combo_id`. The package directories remain role-neutral.\n12. For a migration experiment, deliver the source main entry, source per-trade analysis, combined cross-instrument ranking, target per-trade analysis, and migration report. Read relative source/target labels from the plan. Link the source and cross-instrument entries to each other in new tabs.\n13. Historical migration HTML may still be produced through `build_v4_4_cross_instrument_comparison.py build --run-id \u003crun_id>`. Package-backed comparison publication uses `tools\\build_v4_4_evaluation_framework.py`; unchanged per-trade chunks and immutable trade records are reused, and reused/generated counts remain recorded.\n\n## Required pre-transfer smoke test\n\nBefore a new generic transfer path is used on full target data, run a small 15-second target fixture with an independent cost model, no scenario set, an independent ranking lineage, and two or three frozen K200 candidates. It must prove exact freeze/plan equality, freeze-before-target identity, target cost use, absence of K200 scenarios, target-instrument page naming, target-only lineage placement, plan-identity invalidation after any freeze change, target-tuning rejection, and granularity mismatch rejection. The fixture is validation evidence and never joins a research ranking.\n\n## Short prompt forms\n\n`Run transfer_exact from the current frozen K200 candidates to SImain. Data=...; sample=...; commission/slippage/FX=...; gap policy=...; low-activity policy=.... Do not tune on SImain.`\n\n`Run target_local_refinement from the completed SImain transfer. Neighborhood=...; keep the same SImain profile and lineage.`\n\n`Run continuation_search on K200 from the latest completed K200 stage. Follow the current exploration guide; keep the same profile and lineage; deliver a completed+active+pending anti-joined plan.`\n\n`Run fresh_search on NQ. Data=...; sample=...; commission/slippage/FX=...; gap policy=...; low-activity policy=.... Start with broad coverage.`\n\nIf cost or gap information is missing, ask for it and do not launch compute.\n\nThe JSON starting point is `research_variants\\short_momentum_net_drop_rebound_v4_4\\campaign_contracts\\CAMPAIGN_MANIFEST.template.json`.\n","modified":"2026-08-07T22:30:41.015Z","missing":false},{"id":"campaign-workflow.zh","pair":"campaign-workflow","group":"campaign","path":"20_campaigns/CAMPAIGN_WORKFLOW.zh.md","lang":"zh","title":"实验活动流程","lead":"正式迁移、局部细化、全新搜索模式与简短指令格式。","policy":"实验模式、排名谱系或交接规则变化后更新。","markdown":"# 实验活动流程\n\n## 四种正式模式\n\n### `transfer_exact`\n\n读取目标结果以前冻结非空且唯一的源品种候选集。计划必须包含完全相同的重算坐标 ID，不允许缺失、增加、重复或改动坐标。源品种与目标品种必须使用策略统一的 15 秒数据颗粒度。任何目标局部细化都要在该模式完成以后开展。\n\n### `target_local_refinement`\n\n从相同目标品种已经完成的 `transfer_exact` 父实验出发，测试预先声明的有限邻域。绑定父候选冻结文件；锚点必须存在于该冻结文件；固定字段和各参数数值边界需要机器可读；每个新坐标都要位于至少一个锚点的邻域内。远距离全网格不能仅凭 `bounded_neighborhood` 名称成为局部细化。\n\n### `continuation_search`\n\n从同一品种、同一排名谱系的已完成父阶段继续进行证据驱动探索。父阶段品种与谱系必须和新 campaign 一致。广度、局部、诊断、稳定性、反连接、解释和交接遵循《参数探索指南》。该模式不能导入其他品种的父阶段。\n\n### `fresh_search`\n\n对指定品种从头探索，不导入源候选或父阶段。按路径、大小和 SHA-256 绑定当前《参数探索指南》，声明合法参数空间、坐标预算与 experiment-block／search-mode 标签，并从适合该品种的大跨度覆盖开始。\n\n## 排名与结果谱系\n\n累计排名只合并同一品种、同一 `ranking_lineage_id` 的兼容结果。当前 K200 探索继续使用修复后的 campaign 与结果根目录，因此后续兼容 K200 轮次会和现有 4,732 个坐标共同排序。新用品种建立独立谱系和排名表。跨品种比较页可以并列展示源品种与目标品种证据，但不会混合两者名次。\n\n每次已完成运行还要为自己的品种和精确评价区间发布或更新一个日期结果包。结果包身份不依赖 campaign 模式或实验角色。同一结果包以后可以作为训练证据、留出区间、迁移来源或比较参考，无需移动或改名。\n\n目标品种、目标样本、成本模型、策略语义与结果结构一致时，已完成迁移批次进入同一排名。迁移模式、运行 ID 与来源阶段保留为来源字段，不形成独立排名分区。发布时对完全相同坐标去重；同一坐标出现冲突指标时，该并集无效。\n\n历史 K200 行不会重算。新 K200 行使用阶段绑定的成本模型；累计表按每行保存的成本后指标对并集排序，并披露每行实际往返成本。\n\n## 同品种时间迁移\n\n已经完成的训练证据需要在随后出现的数据上评价时，采用连续前推时间片。第一批候选只从训练期冻结；后续每批只能使用训练期和已经闭合的更早时间片，并在读取下一时间片以前冻结。最新声明的时间片保留为最终留出。完整后续区间可以重放一次，用于描述性排名和逐笔交付；该结果必须标为事后描述，不能计作另一份独立验证。中间时间片只闭合原始证据与精简摘要，不生成 HTML；整组结束后生成一次时间迁移排序、目标期逐笔分析和报告。\n\n## 最小工作流\n\n1. 向用户询问缺少的迁移信息，并生成经审阅的迁移方案；方案包含原品种与目标品种 ID／显示名称、模式、数据／样本、手续费／滑点／汇率、gap policy、low-activity policy 与候选过滤状态。尚未获准的过滤规则保持待定。\n2. 确认源品种与目标品种都使用 15 秒 bar。品种配置、数据准备清单或实际数据不一致时，停止并告诉用户。\n3. 冻结品种配置与 campaign manifest。\n4. 计算以前冻结坐标，并在目标谱系内执行 completed+active+pending 反连接。\n5. 执行模式专属协议：精确集合相等、有限邻域验证、同谱系续探或从头搜索空间验证。\n6. 回测运算前，将品种、实际读取的数据文件、回测开始时间和回测结束时间追加到 `project_management\\03_active_work\\BACKTEST_MANAGEMENT.en.md` 及其中文镜像。\n7. 得到用户明确授权以后运行不可变原始计算。\n8. 中间轮只保留不可变原始结果与小型汇总，不发布 HTML；只有完整证据才能支持继续探索。\n9. 单次运行或兼容轮次闭合后，写入日期结果包：清单、实验记录、统一参数汇总、不可变逐笔记录、需要时生成的浏览器精简数据和逐笔入口。只追加不可变批次与缺少的逐坐标区块。\n10. 整组探索结束后，为该谱系生成一次共享累计总入口与共享逐笔 HTML。只有用户明确要求时才提前发布；参数不会自动被接受。\n11. 多区间或多品种报告创建 `comparison_plan.json`，在方案中分配实验角色，并按 `combo_id` 读取已选完整结果包。结果包目录继续保持角色中立。\n12. 迁移实验仍交付原品种总入口、原品种逐笔分析、合并跨品种排序、目标品种逐笔分析与迁移报告。页面相对名称从方案读取。原品种入口与跨品种入口采用新标签页双向互链。\n13. 历史迁移 HTML 仍可使用 `build_v4_4_cross_instrument_comparison.py build --run-id \u003crun_id>` 发布。结果包比较使用 `tools\\build_v4_4_evaluation_framework.py`；未变化逐笔区块和不可变交易记录继续复用，并保留复用／新增数量。\n\n## 必做的迁移前冒烟测试\n\n新的通用迁移路径用于完整目标数据以前，要运行一个小型 15 秒目标 fixture：使用独立成本模型、空 scenario set、独立排名谱系与两到三个冻结 K200 候选。它必须证明 freeze 与 plan 完全一致、候选在读取目标结果以前冻结、使用目标成本、没有加载 K200 scenario、页面显示目标品种名称、目标结果只进入目标谱系、修改 freeze 会使 plan identity 失效、目标调参会被拒绝，并拒绝数据颗粒度不一致。该 fixture 只作为验证证据，永远不进入研究排名。\n\n## 简短指令格式\n\n`对 SImain 执行 transfer_exact。数据=...；样本=...；手续费／滑点／汇率=...；gap policy=...；low-activity policy=...。使用当前冻结的 K200 候选，不在 SImain 调参。`\n\n`对已完成的 SImain 迁移执行 target_local_refinement。邻域=...；沿用相同 SImain 配置与谱系。`\n\n`对 K200 执行 continuation_search。使用最新已完成 K200 阶段，遵循当前探索指南，保持相同配置与谱系，并交付通过 completed+active+pending 反连接的计划。`\n\n`对 NQ 执行 fresh_search。数据=...；样本=...；手续费／滑点／汇率=...；gap policy=...；low-activity policy=...。从大跨度覆盖开始。`\n\n成本或 gap 信息缺失时，要询问用户并停止计算。\n\nJSON 起点为 `research_variants\\short_momentum_net_drop_rebound_v4_4\\campaign_contracts\\CAMPAIGN_MANIFEST.template.json`。\n","modified":"2026-08-07T22:30:41.017Z","missing":false},{"id":"goal.zh","pair":"goal","group":"planning","path":"01_goal/PROJECT_GOAL.zh.md","lang":"zh","title":"项目目标","lead":"长期目标、当前里程碑、成功标准与非目标。","policy":"只有用户改变长期项目目标时更新。","markdown":"# 项目目标\n\n## 场景研究界面\n\n研究者可以选择一个已经登记的品种与日期行情，框选一段或多段区间并保存为场景，再把场景应用到已完成的评价结果包。生成的合格参数页面沿用当前总入口的排序流程，每个参数都链接到结果包自己的逐笔证据；整个过程不重跑策略。\n\n## 长期目标\n\n维护一套可复现、与品种无关的 V4.4 策略协议。任何已就绪品种配置都可以选取精确时间区间单独回测，结果按日期区间保存，并由明确的实验方案组织比较。继续保留 K200 证据谱系，同时支持其他期货品种的完整迁移、目标局部细化、续探和全新参数探索。\n\n## 当前里程碑\n\nK200 四段时间迁移已经完成。共有 218 组候选覆盖全部四段，只有两组每段都为正，而且都属于交易少、收益集中的低频结果。训练期与全测试期收益排名的 Spearman 相关为 -0.262；最终留出区间只有 25/400 组为正。当前证据不支持一套静态、广泛适用的参数。后续研究方向是用短窗口重估参数，另行评估行情状态门控，再进行候选冻结后的前推测试。当前没有接受参数。\n\n当前 K200 累计快照 `5b4e11b4c137028dc0a33d792a47800c8d792f6125e2cc8d2f5796ec6ef4fa94` 包含 5,320 个坐标、797,020 笔交易和十六个兼容正值开仓阶段。Continuation Round 15 包含 192 个大范围覆盖坐标和 84 个单参数细化坐标。笔均收益分支继续改善；全坐标总收益与情景一冠军保持不变。其他品种建立独立排名谱系，并通过明确的跨品种视图比较。当前没有接受参数。\n\n## 成功标准\n\n- 同 bar 回撤确认不会再假设 15 秒 OHLC 无法证明先后顺序的理论价成交。\n- 旧理论线按 `open >= trigger`、随后 `high >= trigger` 判断，等于也退出。\n- 每个 W 来源窗口的起点均不早于本次交易 H。\n- 平仓不会读取样本结束位置以后的价格。\n- `exclude_marked` 原子只按因果生命周期进入 baseline。\n- W 使用 1 到 W 的可用前缀，精确定义为 `w_open_to_end_low_drop = open[start] - low[end]`。\n- pending entry 保留信号，并在 120 根连续候选 bar 边界内按第一根真实成交 bar 的 open 开仓。\n- 毛收益与成本后模式同时切换排名和显示指标；默认使用成本后口径。\n- 品种配置绑定数据、成本、gap、低活跃、可选情景和排名谱系身份，不改变共享策略语义。\n- 结果包目录只使用品种和实际评价起止时间。训练、测试、迁移、留出或描述性用途都属于实验元数据。\n- 通用比较入口读取已完成结果包，按精确 `combo_id` 连接，并把每列指标路由到对应结果包自己的逐笔入口，不重写已有逐笔证据。\n- 调整结果框架时，现有稳定总入口和逐笔 HTML 的可见内容与行为保持不变；稳定跳转只有在兼容性成立后才会切换。\n- `transfer_exact`、`target_local_refinement`、`continuation_search` 与 `fresh_search` 使用不同证据规则，不能互相替代。\n- 跨品种迁移保持策略的 15 秒数据颗粒度；目标颗粒度不同会在计算以前停止。\n- 后续开仓信号要求 baseline、drop 与 threshold 都为正值；正值 threshold 边界相等仍有效。历史结果保持不可变，本次协议修复不会重算它们。\n- 现有 K200 结果保持不变；后续兼容 K200 结果与它们共同排序；其他品种名次保持独立。\n- 中间 continuation 轮只闭合不可变原始证据与小型汇总，不发布 HTML。获授权的多轮探索整体结束后，再生成一次共享累计总入口与共享逐笔入口，并按风险完成最终交付检查。只有用户明确要求时才中途发布。\n- 常规参数探索在同一轮内承担两项目的：大范围覆盖合法参数空间，降低遗漏潜在区域的概率；围绕表现较好的组合，每个区块只改一个参数，检查成本后收益或最大回撤能否改善。两类结果必须分开报告。\n\n## 非目标\n\n- 样本内领先坐标不代表接受或推广参数。\n- 衍生成本分析不改变原始成交与原始收益。\n- 跨品种比较不会把目标局部细化当成完整迁移成功的证据。\n","modified":"2026-08-08T09:25:54.753Z","missing":false},{"id":"constraints.en","pair":"constraints","group":"planning","path":"01_goal/PROJECT_CONSTRAINTS.en.md","lang":"en","title":"Project Constraints","lead":"Confirmed cross-project boundaries, quality rules, and open assumptions.","policy":"Update when the user accepts, changes, or retires a durable constraint.","markdown":"# Project Constraints\n\n## Confirmed constraints\n\n- The market selector reads only intervals registered in `runtime_inputs\\scenarios\\market_catalog.json`. A market entry binds one evaluation package and one exact data slice; later Chinext, Nasdaq, or other intervals extend the catalog instead of adding product-specific selector code.\n- A saved scenario belongs to exactly one market entry and contains one or more selected ranges. Range qualification uses the retained V4.4 rule and AND aggregation. Scenario application filters completed coordinates from existing evidence, preserves full-interval metrics for ranking, and never changes raw trades, summaries, or package manifests.\n\n- Changes outside the user's explicit request or accepted proposal require approval before implementation. Migration work begins with the agent requesting any missing source instrument, target instrument, data/sample, cost, gap, and execution facts, then writing a reviewed migration-plan file. Presentation labels read source and target display names from that plan; candidate-filter rules remain deferred until separately approved.\n- A completed migration delivery contains five items: the source-instrument main entry, source-instrument per-trade analysis, one combined cross-instrument ranking, target-instrument per-trade analysis, and a migration report. Source and cross-instrument entries link to each other in new tabs.\n- Migration HTML publication is incremental. A new combined run declares `incremental_parent_run`; the fixed builder reuses every unchanged target per-trade chunk from that completed parent and generates chunks only for new candidates. It may rebuild the small ranking index, catalog, and summaries, but it must not regenerate unchanged candidate trade chunks.\n- Final cumulative K200 publication is incremental when a compatible current snapshot exists. It reuses deterministic unchanged per-trade chunks and generates only missing coordinate chunks, while refreshing the cumulative ranking, catalog, summaries, and manifests. Reuse must not alter historical trade evidence or result metrics.\n- Implementation and verification stay deliberately lean. Use the smallest code change that satisfies the confirmed contract; add defensive branches only for concrete severe risks. Avoid broad regression, repeated hash audits, and browser matrices unless changed semantics/data/results or an observed failure makes them necessary. Whenever work has a visible result and the environment allows it, provide one representative screenshot and judge basic overlap, garbling, asymmetry, and obvious layout errors. Computer Use may open local Chrome `file:///` pages.\n- A replacement handoff package must pass its manifest, ZIP index, forbidden/duplicate path, and whole-archive SHA-256 checks before older packages or staging copies move to the Windows Recycle Bin. Packaging does not create a duplicate extraction tree or repeat every per-entry ZIP hash.\n- A package sent to another GPT for code review uses the compact source-review contract, normally around or below 100 MiB. It includes current source and tests, project management, runtime inputs, the current cumulative browser payload, and one representative per-trade chunk. It excludes the full raw/derived trade ledgers and every other per-coordinate trade chunk. Record the observed test result without changing source or tests; any remaining failure makes the archive a review candidate rather than a release-ready source package.\n- V4.4 lives in `D:\\Code\\backtest-release\\Backtest V4.4`; V4.3 remains immutable historical evidence.\n- V4.4 result bytes live physically under `F:\\Backtest\\Backtest V4.4\\results`. The compatible logical path `D:\\Code\\backtest-release\\Backtest V4.4\\results` is a Windows directory junction to that F-drive root. Future result writers must preserve this mapping; source, plans, and project management remain on D.\n- Completed evaluations use `results\\evaluation_packages\\\u003cinstrument_id>\\\u003cevaluation_start>__\u003cevaluation_end>`. The timestamp slug includes seconds. Folder names never encode training, test, transfer, holdout, or descriptive roles.\n- Every package records the exact instrument, interval, timezone, bar size, summary, candidate-set browser projections, immutable trade records, per-trade entry, provenance, and experiment note. Historical compatibility packages may hard-link immutable records and redirect their per-trade entry to a retained byte-preserved page.\n- Every backtest plan binds one executable instrument profile and one exact evaluated interval. Any instrument and interval are allowed when data, preparation, cost, gap, low-activity, bar granularity, and campaign-mode requirements are complete.\n- The generic comparison reader selects completed packages through `comparison_plan.json`, joins exact `combo_id` values, and never uses a directory name as an evidence role. Missing or duplicate comparison coordinates prevent complete status.\n- Current stable K200 main/per-trade entries and the retained 350-coordinate comparison/per-trade pages remain byte-preserved. A package-backed replacement may become the stable target only after exact row/value parity, unchanged visible text, unchanged first-row data, equal rendered row count, and zero browser errors.\n- `rolling_tr_sum` remains the sole baseline method. `all_window` is default; `exclude_marked` is optional and uses causal `baseline_available_from` timing.\n- W candidates use every available prefix from 1 through W. No full-W or minimum-window-ratio gate applies; an early prefix maximum may govern the remainder of a position.\n- The exact W candidate is `w_open_to_end_low_drop = open[start] - low[end]`, not an internal-high-to-later-low maximum ordered decline. Legacy raw audit names remain for compatibility.\n- Pending entry is a retained signal under `fill_first_real_open`: it fills at the first real-trade bar open within 120 continuous candidate bars without trigger recross, higher-high cancellation, or structural-reversal cancellation.\n- A rebound or speed signal on a non-real bar remains pending and fills at the next real-trade bar open inside the sample.\n- Each future campaign binds an instrument cost reference. Notional equals frozen reference price times point value; commission, slippage, and any FX conversion determine that stage's round-trip bps. Raw compute keeps `entry_slippage=0`, raw fills, and raw returns unchanged. Existing K200 rows keep their historical cost reference and are not recomputed.\n- Strategy semantics, instrument settings, and campaign intent are separate authorities. A new instrument cannot execute until the user confirms its cost model and gap policy.\n- The four official modes are `transfer_exact`, `target_local_refinement`, `continuation_search`, and `fresh_search`. Exact transfer requires an exact freeze/plan coordinate-set match; local refinement requires a completed same-target transfer parent and machine-validated bounded neighborhood; continuation search requires a completed same-instrument, same-lineage parent; fresh search imports no source candidates or parent stage and binds the current exploration guide plus its legal search space.\n- K200's authoritative execution granularity is 15 seconds. Every transfer target must use the same 15-second granularity, proven consistently by strategy contract, source and target profiles, preparation manifests, and observed data grids. Any mismatch stops and is reported to the user.\n- Schema-v5+ `profile_optional` with no profile scenario set means no scenarios. K200 event fallback is restricted to explicit legacy execution.\n- Gap and low-activity policies are supported, hash-bound executable identities. Profile declarations must match preparation-manifest policy/configuration/implementation identities; free-form `ready` labels are insufficient.\n- Future entry qualification requires finite positive baseline, drop, and threshold values plus inclusive `drop >= threshold`. Historical raw and derived result files remain unchanged.\n- Cumulative ranking uses the accepted V4.4 K200 major-version lineage as its partition. Minor V4.4 corrections remain beside existing rows in the same cumulative page. Engine, data-preparation, strategy, result-semantics, plan, and artifact hashes remain stage provenance and integrity evidence; they do not create a new ranking partition. A V4.5 major update creates a new K200 ranking lineage. Other instruments retain separate ranks and appear together only in a cross-instrument comparison.\n- Every parameter-exploration agent must read and follow `project_management\\05_domains\\research\\PARAMETER_EXPLORATION_GUIDE.en.md`. Improvement is a model-explained multi-metric judgment with no permanent high-weight metric and no fixed aggregate score.\n- Parameter-search resolution must scale with parameter magnitude. E, BH, and S use relative multiplicative grids; continued single-digit absolute-step densification is treated as overfitting. Leap-search phases cover nonadjacent under-sampled regions, while grid phases refine only closed-evidence anchors.\n- Exploration follows a repeating AI-led cycle: multi-round leap search, finite one-parameter grids around promising nonadjacent anchors, then renewed leap search. A round may be phase-specific. Each grid changes exactly one parameter while all other fields remain fixed; it has no fixed point-count cap, but finite bounds, step schedule, anchor, and expected coordinate count are frozen before compute. Interpret leap and grid evidence separately across the cycle.\n- The user may correct goals, anchors, ranges, or direction between cycles. Autonomous work while the user is unavailable stays inside the explicitly authorized duration, instrument, method, data, and resource boundary.\n- Mini KOSPI 200 tick facts remain provenance context only. The KRX contract multiplier is an active cost input.\n- Fixed historical main/trade templates and the bound local Plotly asset are required for delivery.\n- Every experiment needs a reviewed plan, isolated output, immutable raw closure, and an explicit evidence boundary. Intermediate rounds keep raw results and compact summaries only. Generate the cumulative main and shared per-trade HTML once after the exploration series ends, unless the user explicitly requests an intermediate publication.\n- One executor or multiple executors may perform analysis, backtest compute, and HTML delivery. Delivery cannot begin from partial
