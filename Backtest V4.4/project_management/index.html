raw output.\n- After Round N immutable closure, its HTML delivery and evidence analysis may run concurrently. Round N+1 planning, validation, and compute may overlap only with a closed current `SOURCE_FINAL`, exact plan/source identity and completed+active+pending anti-join, separate output roots and locks, a fresh memory/resource gate that includes the live delivery process, and exactly one cumulative HTML/union writer.\n- `DELIVERY_FINAL` is required once for the final cumulative main and shared per-trade entries after the exploration series ends. A result-affecting source inconsistency discovered during that publication pauses further compute until a new source identity closes.\n- Validation is risk-tiered. Version, engine, fill, return/cost, data, schema, execution-contract, and result-semantic changes require the complete regression suite. Frontend behavior changes require focused interaction checks. Presentation-only copy/style/layout changes require regenerated HTML, a simple functional check, and desktop/mobile screenshots; they do not require the complete suite unless behavior or data also changes.\n- User-requested ZIPs contain current-version code, project management, analysis reports, the hash-bound 15-second OHLC, and transaction-record CSVs from every completed V4.4 stage. The sole compute-result exception is `batches/**/trades.csv` plus each completed stage's derived `analysis/stage_trades.csv`, copied under `trade_records/` with a hash-bound trade-record manifest. Other result payloads remain excluded.\n- A formal source-release ZIP must preserve the project-relative source layout and include every repository module, template, plan definition, runtime input, dependency declaration, and local result fixture required by its packaged tests. It must expose one package-root test command and pass that command from an independent extraction. A compact UI-review ZIP may omit unrelated source/test dependencies only when it is labeled non-executable.\n- Every exploration round ends with a standalone handoff directory containing expanded, unique next-round coordinates in `next_round_parameters.csv`. The CSV must pass an exact completed+active+pending anti-join before it can be bound into a reviewed execution plan.\n- Before full target-data execution uses the generic transfer path, a small 15-second end-to-end smoke fixture must prove exact freeze/plan identity, target cost use, empty target scenarios, target-only lineage placement, target-name presentation, freeze-change invalidation, target-tuning rejection, and granularity enforcement.\n\n## Current exploration boundary\n\nThe active repaired K200 results remain under campaign `v4_4_positive_entry_signal_repair_20260805`. The current cumulative snapshot remains immutable. Future minor V4.4 stages use ranking lineage `k200m_v4_4_positive_entry_future_lineage` and are compared with the existing V4.4 rows even when implementation or preparation hashes differ. SImain, NQ, or another instrument uses its own lineage. Each intermediate round requires immutable raw closure, a reasoned handoff CSV, an exact anti-join, and a reviewed hash-bound plan; cumulative HTML is published once after the series. Never treat an in-sample leader as an accepted parameter.\n","modified":"2026-08-08T09:25:54.754Z","missing":false},{"id":"constraints.zh","pair":"constraints","group":"planning","path":"01_goal/PROJECT_CONSTRAINTS.zh.md","lang":"zh","title":"项目约束","lead":"已确认的通用边界、质量规则与待确认假设。","policy":"用户确认、修改或退役长期约束时更新。","markdown":"# 项目约束\n\n## 已确认约束\n\n- 行情选择器只读取 `runtime_inputs\\scenarios\\market_catalog.json` 登记的区间。每项行情绑定一个评价结果包和一个精确数据切片；以后加入 Chinext、Nasdaq 或其他区间时扩展目录，不增加品种专用选择器代码。\n- 一个场景只属于一项行情，可包含一段或多段选区。资格判断沿用 V4.4 规则，多段使用 AND。应用场景时从已有证据中筛出符合参数，排序继续使用该完整评价区间的指标，不改动原始逐笔、汇总或结果包清单。\n\n- 超出用户明确要求或已经同意方案的修改，必须在实施前取得许可。迁移任务开始时，agent 要询问缺少的原品种、目标品种、数据／样本、成本、gap 与执行信息，然后生成经审阅的迁移方案文件。展示列名从方案读取原品种与目标品种名称；候选过滤规则在获得单独同意前保持待定。\n- 迁移完成后的交付包含五项：原品种总入口、原品种逐笔分析、合并跨品种排序、目标品种逐笔分析与迁移报告。原品种入口和跨品种入口采用新标签页双向互链。\n- 迁移 HTML 采用增量发布。新的合并运行通过 `incremental_parent_run` 声明已完成父运行；固定构建器复用父运行中每个未变化的目标品种逐笔区块，只为新增候选生成新区块。小型排序索引、目录与汇总可以更新，但不能重新生成未变化候选的逐笔区块。\n- 存在兼容当前快照时，K200 最终累计发布采用增量方式：复用确定性命名且未变化的逐笔区块，只生成缺失坐标区块，同时更新累计排名、目录、汇总与清单。复用过程不得改变历史逐笔证据或结果指标。\n- 实现与核验保持精简。采用满足已确认契约的最小代码改动；只有具体且严重的风险才增加防御分支。除非语义、数据、结果发生变化，或已经观察到故障，否则不运行大范围回归、重复哈希审计与浏览器矩阵。工作存在可视结果且环境允许时，提供一张有代表性的截图，并判断是否存在重叠、乱码、不对称或明显布局错误；本地 Chrome `file:///` 页面可使用 Computer Use 打开。\n- 替代交付包必须通过清单、ZIP 索引、禁止／重复路径与整包 SHA-256 检查，旧包和 staging 副本才能移入 Windows 回收站。打包过程不建立重复解压目录，也不重复计算每个 ZIP 条目哈希。\n- 发给其他 GPT 做代码审阅时，使用紧凑源码审阅包，通常控制在 100 MiB 左右或以内。包内保留当前源码与测试、项目管理、运行输入、累计浏览载荷和一组代表性逐笔数据；完整原始／衍生逐笔账本及其他参数组合的逐笔文件不纳入。测试结果按实际情况记录，不为打包修改源码或测试；仍有失败项时，产物标记为审阅候选包，不能标记为已通过的正式源码发布包。\n- V4.4 位于 `D:\\Code\\backtest-release\\Backtest V4.4`；V4.3 保持为不可变历史证据。\n- V4.4 结果字节物理存放于 `F:\\Backtest\\Backtest V4.4\\results`。兼容逻辑路径 `D:\\Code\\backtest-release\\Backtest V4.4\\results` 是指向该 F 盘根目录的 Windows 目录联接。后续结果 writer 必须保留此映射；源码、计划与项目管理继续位于 D 盘。\n- 已完成评价统一保存到 `results\\evaluation_packages\\\u003cinstrument_id>\\\u003cevaluation_start>__\u003cevaluation_end>`，时间目录精确到秒。目录名不写训练、测试、迁移、留出或描述性角色。\n- 每个结果包记录准确品种、区间、时区、bar 周期、参数汇总、按候选集生成的浏览器精简数据、不可变逐笔记录、逐笔入口、来源与实验说明。历史兼容结果包可以硬链接不可变记录，并让逐笔入口跳转到保留且字节不变的历史页面。\n- 每份回测计划绑定一个已就绪品种配置和一个精确评价区间。数据、准备清单、成本、gap、低活跃、bar 颗粒度和实验模式要求齐全后，可以单独运行任意品种和时间区间。\n- 通用比较入口通过 `comparison_plan.json` 选择已完成结果包，按精确 `combo_id` 连接，不根据目录名判断证据角色。坐标缺失或重复时，比较不能标记为完成。\n- 当前 K200 稳定总入口／逐笔入口，以及保留的 350 组比较页和逐笔页保持字节不变。日期结果包页面只有在逐行数值完全一致、可见正文一致、首行数据一致、渲染行数一致且浏览器无错误后，才可以成为稳定入口目标。\n- `rolling_tr_sum` 仍是唯一 baseline 方法。`all_window` 为默认策略；`exclude_marked` 可选，并使用因果 `baseline_available_from` 时间。\n- W 候选使用 1 到 W 的全部可用前缀，不要求累积满 W，也不设置最小窗口比例；早期前缀形成的最大值可以继续控制本次持仓。\n- W 候选精确定义为 `w_open_to_end_low_drop = open[start] - low[end]`，不表示窗口内部 high 到后续 low 的最大有序下跌。原始审计字段名为兼容性保留。\n- pending entry 属于 `fill_first_real_open` 保留信号：在 120 根连续候选 bar 边界内按第一根真实成交 bar 的 open 开仓，不要求 trigger 再穿越，也不因更高 high 或结构反转取消。\n- 非真实 bar 上的回撤或速度信号仍进入 pending，并在样本内下一根真实成交 bar 的 open 平仓。\n- 每个后续 campaign 都要绑定品种成本参考。名义价值等于冻结参考价乘以 point value；手续费、滑点与必要汇率转换共同决定该阶段的往返 bps。原始运算保留 `entry_slippage=0`、原始成交与原始收益。现有 K200 行保留历史成本参考，不进行重算。\n- 策略语义、品种设置与 campaign 意图属于三项独立权威。新品种只有在用户确认成本模型和 gap policy 以后才能执行。\n- 四种正式模式为 `transfer_exact`、`target_local_refinement`、`continuation_search` 和 `fresh_search`。完整迁移要求 freeze 与 plan 坐标集完全相同；局部细化需要相同目标品种的已完成迁移父实验与机器验证的有限邻域；续探需要同品种、同谱系的已完成父阶段；全新搜索不导入源候选或父阶段，并绑定当前探索指南与合法搜索空间。\n- K200 的权威执行颗粒度为 15 秒。每个迁移目标必须同样使用 15 秒，并由策略协议、源／目标配置、数据准备清单与实际数据网格一致证明。任一不一致都要停止并报告用户。\n- schema-v5+ 的 `profile_optional` 遇到没有 scenario set 的品种配置时表示无情景；K200 事件回退只允许明确 legacy 执行。\n- gap 与低活跃 policy 属于受支持、绑定哈希的可执行身份。profile 声明必须与数据准备清单中的 policy／配置／实现身份一致；自由文本 `ready` 标签不足以执行。\n- 后续开仓资格要求 baseline、drop 与 threshold 都是有限正值，并保留 `drop >= threshold` 的正值边界相等。历史原始与衍生结果文件保持不变。\n- 累计排名以已接受的 V4.4 K200 大版本谱系作为分界。V4.4 内的小修正继续与现有行进入同一累计页面。引擎、数据准备、策略、结果语义、计划与产物哈希继续作为阶段来源和完整性证据，不再建立新的排名分区。升级到 V4.5 时建立新的 K200 排名谱系。其他品种保留独立排名，只在跨品种比较中并列展示。\n- 每个参数探索 agent 都必须阅读并遵守 `project_management\\05_domains\\research\\PARAMETER_EXPLORATION_GUIDE.en.md`。改善由模型结合多项指标解释，不给任何指标设置长期高权重，也不使用固定综合分数。\n- 参数搜索分辨率必须匹配参数尺度。E、BH、S 使用相对乘法网格；按个位数绝对步长持续加密，视为过拟合。跳跃搜索阶段覆盖互不相邻且采样不足的区域；网格阶段只细化已有闭合证据支持的锚点。\n- 探索采用 AI 主导的循环：多轮跳跃搜索、围绕互不相邻优秀锚点的有限单参数网格、再次跳跃搜索。单轮可以只属于一个阶段。每个网格固定其余字段，只测试一个参数；点数不设固定上限，但运算前必须冻结有限边界、步长安排、锚点和预计坐标数。跳跃与网格证据在完整循环中分开解释和报告。\n- 用户可以在循环之间修正目标、锚点、范围或方向。用户暂时不在线时，自主工作不得超出明确授权的时长、品种、方法、数据和资源边界。\n- Mini KOSPI 200 最小变动单位资料继续只作来源背景。KRX 合约乘数是当前成本输入。\n- 交付必须使用既有历史主入口／逐笔模板和绑定的本地 Plotly。\n- 每次实验都需要经审阅计划、隔离输出、不可变原始闭合和明确证据边界。中间轮只保留原始结果和小型汇总。整组探索结束后生成一次累计总入口与共享逐笔 HTML；只有用户明确要求时才中途发布。\n- 一个执行者或多个执行者均可完成分析、回测运算与 HTML 交付。交付不得从未闭合的原始结果开始工作。\n- Round N 原始结果不可变闭合后，其 HTML 交付与证据分析可以并行。Round N+1 的规划、验证与运算只能在当前 `SOURCE_FINAL` 已闭合、计划／源码身份及 completed+active+pending 精确反连接通过、输出根目录与锁相互独立、最新内存／资源门槛计入正在运行的交付进程，并且累计 HTML／union writer 恰好只有一个时重叠进行。\n- 整组探索结束后，最终累计总入口与共享逐笔入口只需完成一次 `DELIVERY_FINAL`。该次发布发现影响结果的源码不一致时，暂停后续运算，直到新源码身份闭合。\n- 验证按风险分级。版本、引擎、成交、收益／成本、数据、schema、执行契约与结果语义变化需要完整回归测试；前端行为变化需要针对性交互检查；纯文案／样式／布局变化只需重新生成 HTML、简单功能检查及桌面／手机截图，除非同时影响行为或数据，否则无需完整测试。\n- 用户要求 ZIP 时，包含当前版本代码、项目管理、分析报告、哈希绑定的 15 秒 OHLC，以及每个已完成 V4.4 阶段的逐笔交易 CSV。对运算结果的唯一例外是 `batches/**/trades.csv` 与每个已完成阶段的衍生 `analysis/stage_trades.csv`；它们复制到 `trade_records/`，并由哈希绑定的逐笔记录清单说明。其他结果载荷继续排除。\n- 正式源码发布 ZIP 必须保留项目相对目录结构，并包含包内测试所需的全部仓库模块、模板、计划定义、运行输入、依赖声明与本地结果 fixture。压缩包必须提供一条包根目录测试命令，并在独立解压副本中通过该命令。紧凑 UI 审阅 ZIP 只有在明确标注为不可执行时，才可省略无关的源码／测试依赖。\n- 每轮参数探索结束时，都要在独立交付文件夹中用 `next_round_parameters.csv` 保存完整展开且唯一的下一轮坐标。CSV 通过 completed+active+pending 精确反连接后，才能绑定为经审阅的执行计划。\n- 通用迁移路径用于完整目标数据以前，必须用小型 15 秒端到端 fixture 证明 freeze／plan 精确身份、目标成本、目标空情景、目标独立谱系、目标名称展示、freeze 变化导致身份失效、拒绝目标调参与颗粒度门禁。\n\n## 当前探索边界\n\n活动修复后 K200 结果继续使用 campaign `v4_4_positive_entry_signal_repair_20260805`，当前累计快照保持不可变。后续 V4.4 小修正使用排名谱系 `k200m_v4_4_positive_entry_future_lineage`；即使实现或数据准备哈希不同，也会与现有 V4.4 结果共同排序。SImain、NQ 或其他品种使用自己的谱系。每个中间轮次需要不可变原始闭合、逐行理由 CSV、精确反连接及经审阅的哈希绑定计划；累计 HTML 在整组结束后统一发布一次。样本内领先坐标不等于参数被接受。\n","modified":"2026-08-08T09:25:54.755Z","missing":false},{"id":"source.en","pair":"source","group":"state","path":"02_current_state/SOURCE_OF_TRUTH.en.md","lang":"en","title":"Current Valid Files","lead":"Authoritative entry points, configurations, artifacts, and validity boundaries.","policy":"Update when an authoritative path, branch, configuration, or artifact changes.","markdown":"# Current Valid Files\n\n## Formal V4.41 source release — 2026-08-09\n\n- ZIP: `D:\\Code\\backtest-release\\Backtest_V4.41_source_release_20260809.zip`.\n- SHA-256 sidecar: `D:\\Code\\backtest-release\\Backtest_V4.41_source_release_20260809.zip.sha256`.\n- Audit: `D:\\Code\\backtest-release\\Backtest_V4.41_source_release_20260809.zip.audit.json`.\n- Package source: `tools\\package_v4_41_source_review.ps1`; the retained filename is historical, while its default output and embedded state now describe the formal Windows source release.\n- Git release identity: tag `V4.41` on the published `v4.41` branch. Acceptance requires an independent extracted-package result of 112 passed, 2 skipped, and 0 fai ion_analysis\\trade_review\\index.html`，它跳转到当前快照并显示「显示测试集」。K200 测试逐笔入口仍为 `results\\cross_instrument_comparison\\runs\\k200_train_test_si__combined_350_v56_20260807\\trade_review_k200_test\\index.html`，并显示「显示训练集」。\n- 两个按钮都保留当前精确 `combo_id`，同时绑定目标研究合同，并在当前页打开配对逐笔页面。「隐藏训练集」／「隐藏测试集」和 Esc 可以关闭对照层；关闭时卸载 iframe。目标区间缺少该精确坐标时，不会改用邻近参数。\n- 配对按钮与周围工具栏按钮采用相同居中样式，悬停时没有下划线。内嵌页面不显示「当前参数」卡片；对照层打开期间隐藏外层内容，关闭后恢复。\n- 交易选择器的重复标题／计数和下方摘要行已经移除。drop、ratio、开仓基准、开仓阈值、W 基准和 active low 改为理由标题下方的紧凑彩色框，不再作为 Plotly 标注遮挡价格。Plotly 图例移到横轴下方。\n- 浏览器标签标题为「组合平仓逐笔查看」，图标为蓝色 `Z`。共享来源：`runtime_inputs\\templates\\historical_v4_trade.html`；专项检查：`tools\\qa_v4_4_trade_review_layout.mjs`；保留的同页对照证据：`project_management\\screenshots\\trade_review_inline_peer_20260809`。\n\n## 当前按日期区间保存的结果包框架——2026-08-08\n\n- 稳定比较入口：`results\\cross_instrument_comparison\\index.html`。该入口现在跳转到 `results\\evaluation_comparison\\index.html`；保留的 350 组运行页面和全部现有总入口／逐笔页面仍保持字节不变。\n- 当前证据适配器：`tools\\build_v4_4_evaluation_framework.py`。通用结果包登记程序：`tools\\register_v4_4_evaluation_package.py`，使用 `runtime_inputs\\templates\\EVALUATION_PACKAGE_SPEC.template.json`。浏览器一致性检查：`tools\\qa_v4_4_evaluation_framework.mjs`。机器审计：`results\\evaluation_comparison\\compatibility_audit.json`。\n- 结果包目录：`results\\evaluation_packages\\catalog.json`。当前三个结果包为 `K200\\20260526T000000__20260708T235200`、`K200\\20260708T235215__20260807T032145` 和 `SImain\\20260129T000000__20260223T235945`。\n- 每个结果包包含清单、准确日期实验记录、参数汇总、当前候选集的浏览器精简数据、硬链接的不可变逐笔记录和逐笔兼容入口。目录名不含训练、测试或迁移角色。\n- 当前比较方案：`results\\evaluation_comparison\\comparisons\\K200_20260526T000000__20260708T235200__K200_20260708T235215__20260807T032145__SImain_20260129T000000__20260223T235945\\comparison_plan.json`。\n- 兼容性结果：350 行及全部字段值与保留比较页面完全一致；比较页面 HTML 只在数据脚本来源处不同。新旧比较页面的标题、正文、首行数据和渲染行数相同，浏览器错误均为零。后来确认的 K200 训练／测试逐笔界面更新只改变小型 HTML 外壳与清单；逐笔数据、区块、指标、总入口、保留比较页和 SI 逐笔证据均未改变。\n- 这套结构现在是全项目结果存储规则。任何已就绪品种配置都可以选取精确区间创建独立结果包，并通过比较方案与其他结果包并列，不改变已有包身份。\n\n## 当前 K200 优参数初步后续重放——2026-08-07\n\n- 当前结果目录：`results\\temporal_migration\\v4_4_k20 te with 109 passed, 2 skipped, and 0 failed. The package script records that current result for its next run. No replacement compact ZIP has been generated, and the 2026-08-08 archive remains historical review evidence.\n\n## V4.41 current handoff package and local cleanup — 2026-08-08\n\nThe current portable handoff is `D:\\Code\\backtest-release\\Backtest_V4.41_current_complete_20260808.zip`; its adjacent `.sha256` sidecar is the whole-archive hash authority. It contains source, runtime inputs, current project documents, retained reports, and 4,467 immutable raw or available derived transaction ledgers from 110 completed V4.4-compatible stages. The package retains V4.41 release identity and V4.4 strategy/ranking compatibility.\n\nThe final package passed manifest identity, ZIP name/size, duplicate/forbidden-path, and whole-archive SHA-256 checks. Repeated per-entry ZIP hashing and a duplicate extraction tree are no longer part of normal verification. Nine canonical 2026-08-03 reports now live in the project handoff tree, so `.omo` is no longer required.\n\nAfter the final package passed, 22 obsolete package/sidecar files and two local directories were moved to the Windows Recycle Bin, totaling 39.972 GiB. Earlier in the same cleanup, `.omo` (68.72 MiB), old caches, Crashpad material, dashboard cache, and four obsolete QA images were also moved to the Recycle Bin. Current results, V4.2 evidence, the two V2 download dependencies, shared tools, provenance, and management archives remain retained.\n\n## V4.41 release identity — 2026-08-08\n\nV4.41 is the active release and presentation label. It is a minor release: the strategy major version, result contract, parameter identities, and cumulative ranking boundary remain V4.4. Completed V4.4 results remain active and authoritative within their original evidence boundaries and continue to enter the same cumulative ranking when their ranking lineage and result contracts match. `RELEASE.json` records this split identity; no historical result is archived or excluded by this release.\n\n## K200 paired per-trade review — 2026-08-08\n\nK200 training and later-period test reviews now form a bidirectional exact-coordinate pair. The toolbar names the destination (`显示测试集` or `显示训练集`) and carries the current `combo_id` plus the destination research-contract identity. The paired result opens as an overlay inside the current page and can be closed with its `隐藏…` button or Escape. Closing unloads the iframe so the paired chart does not retain another renderer. The established main and per-trade URLs remain valid.\n\nThe paired button is centered and uses the same hover state as adjacent toolbar buttons. The embedded page omits its `当前参数` card, while the outer page is hidden until the overlay closes. The trade selector keeps only the transaction dropdown. Entry/drop audit values moved from the plot into compact color-preserving boxes below the reason heading, and the legend moved below the candlestick chart. The browser tab omits the version number and uses a blue `Z` favicon. This is a presentation and routing update; trade chunks, OHLC, fills, metrics, ranking, and strategy behavior are unchanged.\n\n## Instrument- and interval-neutral evaluation packages — 2026-08-08\n\nV4.4 now stores published backtest evidence by instrument and exact evaluated interval under `results\\evaluation_packages`. Training, test, transfer, holdout, and descriptive meanings are assigned by `EXPERIMENT.md` and `comparison_plan.json`; they do not alter a package directory name. The current K200/K200/SI evidence is registered as three completed date packages, each with a manifest, neutral parameter summary, browser projection, immutable trade record, and per-trade entry.\n\n`results\\evaluation_comparison` loads the three package-owned browser projections and reconstructs the retained 350-coordinate comparison by exact `combo_id`. The reconstructed rows and values are exact, and the retained page shell is unchanged outside its script-source boundary. Browser inspection found identical visible text, title, first row, and row count with no errors. The stable cross-instrument URL now targets this reader. The cumulative main and retained comparison remain unchanged; later approved per-trade shell changes do not alter package data. The same framework accepts any ready instrument profile and any exact evaluation interval.\n\n## Current K200 optimal-parameter one-month replay — 2026-08-07\n\nFour workers evaluated a corrected frozen set of 100 training-period cost-positive candidates over the later month. The candidate set contains six retained headline controls and 94 exact coordinates not previously evaluated on that interval. The interval itself was already used by the earlier temporal campaign, so this run is parameter-level new evidence and post-hoc at the period level.\n\nOnly 29 candidates remain cost-positive, 28 are positive with at least ten trades, and eight have positive non-gap return. Median later return is -0.671%, median trade count is 84.5, and train/later rank Spearman is -0.346. The best total-return coordinate earns +9.175% but has -8.243% non-gap return. The strongest at-least-ten-trade non-gap coordinate is E112/BH612/TRW30/K1.3/W10/M2.5/S308 at +4.693% total and +4.573% non-gap return with ten trades; its Top-2 positive-return share is 72.2%.\n\nThe first completed attempt remains retained as historical, invalid-for-decisions evidence because its candidate queue admitted twelve cost-negative training rows. The `_v2_` result replaces it. No HTML was published and no parameter is accepted.\n\n## K200 train/test/SI unified migration — 2026-08-07\n\nThe stable cross-instrument entry now ranks 350 candidates with K200（训）, K200（测）, and SI return columns. It retains 250 completed SI results, freezes 100 new candidates from closed K200 temporal evidence before reading their SI outcomes, evaluates those candidates on SI with four workers, and replays all 350 on the K200 test interval. The final SI population contains 48,022 trades; the K200 test replay contains 34,248.\n\nThe visible rank heading is now `排名`; rank buttons display only `#N`. Rank opens SI per-trade evidence, while the K200（训）, K200（测）, and SI total-return cells use the same blue-button component and open their corresponding per-trade analyses in new tabs. K200（测） has a dedicated 350-candidate, 34,248-trade review; K200（训） routes to the existing cumulative K200 review.\n\nK200 test is positive for 199 candidates, SI for 275, and all three returns for 149. Within the new 100, the corresponding counts are 72, 59, and 43. The E320/BH240/TRW12/K1.25/W6, M4.25–4.75, S340–370 neighborhood is continuous and positive across all three samples, but its K200-test result remains gap-dependent. Static universal parameters remain unsupported; short-window re-estimation followed by a frozen forward test remains the more credible direction. Publication reused 250 existing SI per-trade chunks and generated 100. No parameter is accepted.\n\n## K200 training-to-subsequent-market temporal migration — 2026-08-07\n\nFour workers evaluated 400 frozen candidates in each of four sequential market slices after the completed training interval. Later freezes used only training evidence and already closed earlier slices; the fourth slice remained unseen until its candidate set was frozen. The same 400 final candidates were replayed over the complete subsequent interval for descriptive reporting only. Intermediate slices generated no HTML.\n\nR1/R2/R3/R4 contain 296/26/383/25 cost-positive coordinates. Only two of 218 candidates observed in every slice remain positive in all four, and both are low-frequency concentrated results. The training/full-test return-rank Spearman is -0.262; the training leader returns -1.567% over the full test with 14.902% drawdown. The final interpretation is `no_static_general_parameter_found`; no parameter is accepted.\n\n## Incremental K200 data and operational records — 2026-08-07\n\nThe active K200 source now contains 233,368 session-filled 15-second rows through `2026-08-07T03:21:45+09:00`. The latest increment came from 1,065,932 retained IBKR `TRADES` ticks and produced 34,168 cleaned 15-second rows; the repository source SHA-256 is `9760d367a109777c4789ce45d982a6c0708bacddad8f549450ed94f81ad5c405`. Prepared inputs, the K200 profile, policy attestation, runtime manifest, and source manifest now bind the extended source.\n\nEvery retained K200 acquisition directory now has a local `README.md` describing update history, the volume-based main-contract rule, the exact unadjusted 016M/016U split, lineage, and merge behavior. The retained SI directory now has `D:\\Code\\data\\ibkr\\SImain\\README.md`, recording SIH6 selection, exact intervals, unadjusted policy, merge rules, and update history. The same README contract is mandatory for future instruments and downloads. `project_management\\03_active_work\\BACKTEST_MANAGEMENT.en.md` and its Chinese mirror are the separate mandatory pre-run log for instrument, exact data file, evaluated start, and evaluated end. No historical backtest or HTML was regenerated by this data update.\n\n## On-demand candlestick interval statistics — 2026-08-07\n\nThe cumulative per-trade page adds `区间统计` immediately before the dark-theme control and removes the former view-mode explanation sentence. When enabled, a horizontal drag selects an inclusive candlestick interval and opens a compact flat three-column panel in the right detail column above trade reasons. It contains start/end time, first open, highest high, lowest low, final close, candlestick count, price change, amplitude, and maximum high-to-later-low drawdown.\n\nThe feature adds no startup computation or data request. It performs one linear scan over the selected interval after `plotly_selected`; native selection state is then cleared and the pale interval is redrawn as an ordinary Plotly shape. This keeps normal opacity outside the range and makes the selected rectangle persistent. Closing the panel clears the shape and returns the chart to zoom dragging. Changing parameters or redrawing the chart also clears the temporary panel. The `紫色` and `橙色` suffixes are removed from baseline and threshold annotations.\n\nThe page also adds mutually exclusive `持仓检测`. A short visible-candle press identifies whether the position remains open after that bar and derives the contemporaneous rebound and speed checks, while movement beyond five pixels remains available for Plotly zoom dragging. A raw candle uses its exact source bar; an aggregated candle uses the final source bar represented by its close. The panel reports active low, effective max-W baseline interval/value, multiplier, threshold, current rebound relation, and distance to the S-window exit; the selected close receives a blue point and the baseline interval uses a darker borderless blue highlight. Both inspection panels appear in the right detail column and collapse the parameter drawer when activated. Candlestick endpoint caps are removed with `whiskerwidth=0`. The completed snapshot shell can be refreshed independently from its immutable trade chunks and payloads.\n\n## Six-hour K200 leap/grid cycle and streamed cumulative delivery — 2026-08-06\n\nThe AI-led cycle closed 89 automated rounds with four workers: 60 leap rounds and 29 adaptive-grid rounds. The current cumulative snapshot is `eb3398757b8ffe52332aec6ecdedc60df86b70afb4e1509c8fa3fcccd7b53dd5`, containing 37,058 unique coordinates, 11,749,606 trades, and 109 compatible stages. It reused 5,320 unchanged trade chunks and generated 31,738. All four headline leaders remain unchanged from the prior 5,320-coordinate snapshot; `parameter_acceptance=none`.\n\nThe cumulative publisher now discovers nested generated plans recursively, loads and processes one stage at a time, streams the 22.13-GB union trade CSV, vectorizes cost metrics and native trade conversion, and uses four worker processes for missing trade chunks. Final publisher memory stayed below 2 GB instead of the former 14.4-GB peak. SI migration was not started because later leap rounds continued finding promising nonadjacent anchors, so K200 global closure was not established.\n\n## K200 cumulative-table presentation — 2026-08-06\n\nThe stable K200 entry now redirects to its main document, removing the repeated top navigation and persistent iframe. The page title is `V4.4 K200回测结果排序`, common blue accents are one step darker, and the full-width main table occupies nearly one viewport with a sticky header. Pagination renders 500 rows at a time while filtering and sorting continue over the complete eligible set.\n\nReturn columns are labeled `总收益`, `笔均`, and `回撤` in both return modes; the rank column is labeled `排名`. Rank links display only `#N` while retaining a 90-pixel blue button. The visible gap-dependence return audit, `segment_end`, waited-entry count, maximum wait, and research-contract section are absent. `往返成本 bps` and `跨 gap 笔数` are the final two columns. Result values, filters, rank rules, raw fields, and immutable snapshots are unchanged.\n\nThe trade-count control is labeled `交易数`. It retains `不限`, `至少 10 笔`, and `至少 20 笔`, removes the 100- and 150-trade presets, and adds strict editable lower and upper bounds labeled `大于 x 笔` and `小于 x 笔`. Both custom bounds may be active together. Main-table column headings are centered; body-cell alignment remains unchanged.\n\n## Unified 250-candidate migration ranking — 2026-08-06\n\nThe stable cross-instrument entry now ranks 250 compatible K200-to-SImain candidates together. Compatibility is defined by the same target instrument, target sample, cost model, strategy semantics, and result schema; experiment or migration identity is retained as provenance rather than used as a ranking partition. The publication contains 24,194 SImain trades, reuses 247 completed trade chunks, and adds three.\n\nThe new fixed-coordinate continuation tested K1.5/K1.6/K1.75. Target trades decline to 62/57/51 and cost-adjusted return declines to 23.9157%/16.7475%/20.1076%. K1.4 remains the local target peak at 35.6004% with 67 trades. Classification is `not_improved_target_peak_at_k1p4`; `parameter_acceptance=none`.\n\n## Dual-purpose K200 exploration delivery — 2026-08-05\n\nContinuation Round 15 formalizes the two continuing exploration purposes. The reviewed plan contains 192 deterministic broad-coverage coordinates and 84 one-parameter refinements around the unrestricted, Scenario-1, average-return, and low-drawdown anchors. Four workers closed 276 coordinates, 54,314 trades, and 35 batches.\n\nThe average-return branch improved. E96 is the new minimum-10 and minimum-20 average-trade leader with 25 trades, 35.2290% cost-adjusted total return, 1.23914% average trade, and 3.0190% drawdown. E128 is a balanced neighboring improvement with 29 trades, 38.9271% return, 1.16460% average trade, and 4.21795% drawdown. The unrestricted and Scenario-1 leaders remain unchanged. Broad coverage found no robust new primary leader.\n\nFinal incremental publication created snapshot `5b4e11b4c137028dc0a33d792a47800c8d792f6125e2cc8d2f5796ec6ef4fa94` with 5,320 coordinates, 797,020 trades, and sixteen stages. It reused 5,044 unchanged trade chunks and generated 276. `parameter_acceptance=none`.\n\n## Large K200 multiblock exploration and incremental cumulative delivery — 2026-08-05\n\nContinuation Round 14 added 294 exact new coordinates and 28,577 trades through a reviewed 37-batch, four-worker plan. The final cumulative snapshot is `db85efb36f3de1c1f8255c6108fb365ad9f3d337f77a8d37a0e0ae41982e5699`, with 5,044 coordinates, 742,706 trades, and fifteen compatible positive-entry stages. The cumulative publisher now reuses deterministic unchanged per-trade chunks from the current snapshot; this delivery reused 4,747 and generated 297.\n\nThe unrestricted total-return and Scenario-1 leaders are unchanged. Both minimum-trade average-return views now select E112/BH612/TRW24/K1.6/W16/M2/S308 at 29 trades, 38.4486% cost-adjusted total return, 1.15253% average trade, and 4.23380% drawdown. The change mainly reflects exit-time differences among retained entries and remains exposed to synthetic-signal and gap trades. Round classification is `improved`; `parameter_acceptance=none`.\n\n## Human project guide landing page — 2026-08-05\n\nThe project-management Dashboard now opens on a human-facing guide. `Project guide` is the first item in the left navigation and uses the same document header, metadata, content width, typography, outline, language control, and responsive page shell as every managed document. Its body contains two workflows: the four campaign modes with their shared backtest lifecycle, and the causal lifecycle of one trade from completed 15-second data through entry, exit, and transaction evidence. A generated directory below them links every managed document. This virtual guide is not a manifest document, does not change the AI reading matrix, and carries no strategy or evidence authority.\n\n## Incremental 247-candidate stricter-entry migration — 2026-08-05\n\nThe current stable cross-instrument entry contains 247 candidates: the completed 244-candidate parent plus three frozen K200 K-expansion coordinates. The three SImain results are all cost-positive. K1.2 has 85 trades and 16.4678% cost-adjusted return; K1.3 has 73 trades, 33.9182%, and 11.6094% drawdown; K1.4 has 67 trades, 35.6004%, and 11.9132% drawdown. The K1.1 parent anchor has 86 trades, 22.0575% return, and 14.6209% drawdown. Thus K1.3 and K1.4 reduce entries while improving target return and drawdown, while the same K direction reduces K200 return. Classification is `improved_on_target_mixed_across_instruments`; `parameter_acceptance=none`.\n\nMigration HTML now uses the fixed `build_v4_4_cross_instrument_comparison.py build --run-id \u003crun_id>` path. The 247-candidate publication reused 244 completed target trade chunks through same-volume hard links and generated only three new chunks. The ranking index, catalog, summaries, and manifests were refreshed without regenerating unchanged per-candidate trade evidence.\n\n## Plan-driven combined K200 to SImain delivery — 2026-08-05\n\nThe current cross-instrument entry combines the user-linked 180-candidate result with the repaired-source 64-candidate result. The sets have zero overlapping coordinates, so the current comparison contains 244 candidates, 25,129 K200 trades, and 23,799 SImain trades. It contains 210 SImain cost-positive candidates, 148 stable candidates, and 57 isolated positive candidates; source/target cost-return rank Spearman is 0.060149.\n\nThe page reads instrument display names and sample ranges from `research_variants\\short_momentum_net_drop_rebound_v4_4\\plans\\v4_4_migration_k200_to_simain_20260805.json`. The migration-batch column is absent. K200 total return is immediately before SImain total return, and clicking one sort header three times cycles ascending, descending, and restored default target ranking. The source main entry opens the cross-instrument page in a new tab; the comparison page exposes a new-tab source main entry. Final migration delivery includes source main, source per-trade, combined ranking, target per-trade, and the migration report.\n\n## New-rules K200 one-axis series — 2026-08-05\n\nTen four-worker rounds added thirty coordinates around the repaired unrestricted anchor E480/BH171/TRW12/K1.26/W6/M4.5/S388. Each round changed one parameter and tested three new points. Intermediate rounds closed raw evidence and compact handoffs without HTML; one final publication produced snapshot `0126cd77b436aef1434e7072bac0d6dfa15b3d2ad4dc2cf1b2fafe936ee1e626` with 4,747 coordinates, 713,886 trades, and thirteen compatible stages.\n\nBH expansion/contraction, TRW expansion/contraction, K expansion/contraction, both sides of M4.5, and S expansion are `not_improved`. W7 raises cost-adjusted total return from 82.4352% to 82.4664%, but the 0.0312-percentage-point gain is isolated: W8 and W9 are weaker, while W7 has lower average trade, slightly higher drawdown, and lower gap-excluded return than W6. The W direction is `mixed`; `parameter_acceptance` remains `none`.\n\n## Fixed-parameter E-window sensitivity — 2026-08-05\n\nThirteen new coordinates hold BH=171, TRW=11, K=1.4, W=6, M=4.5, and S=388 fixed while reducing E from the E=320 anchor through 304, 256, 192, 160, 136, 112, 96, 80, 64, 48, 32, 24, and 16. They are published in cumulative snapshot `b077548e654277738e1d953ce7bea01eb184a0e223f064c7728dbc2de4d1a561` and in the shared per-trade entry.\n\nThe evidence does not support the claim that E=320 is too large. Cost-adjusted total return falls from 78.2952% at E=320 to 75.7622% at E=304, 74.2774% at E=256, 62.0632% at E=192, 60.6744% at E=80, and 7.8332% at E=16. Smaller E can reduce trade count and maximum drawdown—for example E=64 records 108 trades, 62.3971% return, and 12.4072% drawdown versus E=320 at 114 trades, 78.2952% return, and 15.1499% drawdown—but the return sacrifice is material. `parameter_acceptance` remains `none`.\n\n## Instrument-neutral research interface — 2026-08-05\n\nThe V4.4 strategy semantics are separated from instrument profiles and campaign intent. K200 remains the ready default and its current repaired cumulative evidence contains 4,747 coordinates. SImain and NQ profiles remain incomplete templates for fresh campaigns; the retained SIH6 evaluation contract remains valid for the completed exact-transfer validation. Official campaign modes are `transfer_exact`, `target_local_refinement`, `continuation_search`, and `fresh_search`.\n\nSchema-v5 plans bind a campaign manifest, instrument profile, ranking lineage, and optional scenario policy. The accepted K200 V4.4 ranking lineage now spans minor implementation and preparation corrections; their hashes remain stage provenance. A V4.5 update creates a new cumulative partition. Other instruments use separate rank lineages and cross-instrument comparison.\n\nThe active low-activity policy is `confirmed_low_activity_gate`. Pending low-volume runs have no effect. Confirmation at 120 consecutive 15-second atoms retroactively excludes the run from later BH/TRW baselines, cancels unfilled entry orders, and blocks new entries until the first normal-volume atom. Existing positions retain normal exits. Prepared fields are `baseline_excluded_from` and `confirmed_low_activity_active`.\n\n## Cross-instrument comparison — 2026-08-05\n\nA separate current cross-instrument page validates 64 candidates frozen from the repaired 4,747-coordinate K200 snapshot on SImain SIH6 for 2026-01-29 through 2026-02-23. Source selection excludes the 266 historical transfers and current champions, then applies the source top-20%, minimum-10-trade, W/M/S-family, and within-family strictness-Pareto rules. It uses the fixed 3.57-bps research cost, exposes target/source/transfer metrics without a combined score, and keeps any SImain full-grid diagnostic separate.\n\nThe page retains four file-backed scope selectors plus global and composable field filters. A two-option return-view control switches ranking and displayed K200/SImain total return, median trade, maximum drawdown, and win rate between fee/slippage-adjusted and gross modes; adjusted mode is default. Its first column mirrors the K200 rank component with blue `查看 #N` buttons, and every frozen candidate opens its dedicated SImain per-trade review in a new tab. The 64 candidates create 6,755 SImain trades; 58 are cost-positive, 29 occupy stable positive regions, and source-versus-target return-rank Spearman is -0.45728. The historical 266-candidate comparison remains preserved under its run directory.\n\n## Status\n\nV4.4 is an independent research version with repaired execution semantics and a cost-aware derived ranking layer. It is not a final strategy release and no parameter has been accepted.\n\n## Current behavior\n\n- A prior rebound trigger exits at the real bar open when `open >= trigger`; otherwise it exits at the trigger when `high >= trigger`. Equality exits.\n- A strict-new-low bar uses only rebound baselines formed by earlier completed bars. When that same real bar confirms the rebound with its close, the fill is its close.\n- A W source window starts no earlier than H, the continuous-segment start, or `end-W+1`.\n- W accepts the available 1..W prefix. A shorter early prefix may remain the monotonic maximum for the position; no full-W or minimum-ratio gate applies.\n- Each candidate is `w_open_to_end_low_drop = open[start] - low[end]`; it is not an internal maximum ordered decline.\n- An open position remaining at the declared sample end exits at the sample-end bar close; no later price is read.\n- `all_window` remains the default. Under `exclude_marked`, a TR atom enters the baseline only when its causal `baseline_available_from` time has arrived.\n- A pending entry retains its signal and fills at the first real-trade open within the 120-bar continuity boundary without recross or structural cancellation.\n- The cumulative method label is `滚动 TR 总和均值`, matching the implemented baseline: sum every overlapping TRW group inside BH, then average those window sums. E is the fully observed high-search window, while the measured net drop runs only from strict H to the later signal low. BH ends at and includes the complete 15-second TR atom containing H. The implementation is causal—baseline atoms are at or before H, H must predate the signal bar, and batch results match stepwise-prefix delivery—but it shares the H boundary bar rather than implementing a strict H-minus-one separation.\n- Derived analysis offers gross and cost-adjusted modes; switching changes both rank order and return display. Delivered results preserve their historical cost contracts. Future campaigns bind a price-times-point-value notional model plus commission, slippage, and any FX conversion. The cumulative builder retains each stage's cost model; raw fills and raw returns remain unchanged.\n- The cumulative main-page generator exposes a keyboard-accessible, icon-only disclosure toggle on the `筛选与排序` panel. A fixed 40-by-36-pixel button contains a 20-pixel SVG chevron: up while expanded and down while collapsed. Collapsing preserves every selected filter and sort state while reducing the panel to one row. Layout and paint containment on the ranking table prevents the large table from being repainted during the height change. The user-selected snapshot `e4a20d1d5bcb8974f4341a3647e2e246c3c1ab855d66ce4b3d7d4998d7fb3d44` carries this UI-only publication; the current stable snapshot remains byte-preserved.\n- The stable cumulative main loads a lean summary payload under `results\\all_completed_union_analysis\\main` while its exact per-trade and scenario links continue routing into the immutable current snapshot. Each main-table row contains only the 32 fields used by controls, ranking, display, and routing; the current 5,044-row payload is 5,621,151 bytes. Filtering, metric ranking, and column sorting operate on integer row indexes without copying row objects. Table virtualization and sort-result caching remain intentionally absent.\n- Entry Reason step 2 uses hollow colored-outline ellipses for its high/entry point hover highlight. The collapsed per-trade Parameters tab sits six pixels above its prior desktop position; mobile drawer behavior is unchanged.\n- Candlestick line guides use solid strokes. Every market-range rectangle—including filtered-market, signal, baseline, rebound, frozen, and quiet-activity ranges—uses semantic translucent fill with no border. The chart omits the long theoretical-line/actual-fill annotation and the drop, ratio, entry-baseline, entry-threshold, W-baseline, and active-low value boxes. Those six bordered, semantically colored values now appear under Entry Reason; detailed side-panel exit reasoning remains.\n- ZIP handoffs contain the current code, project-management tree, canonical analysis reports, hash-bound 15-second OHLC, and per-stage raw/derived transaction CSVs. Package `D:\\\\Code\\\\backtest-release\\\\Backtest_V4.4_with_trade_records_20260803_final.zip` remains audited historical `SOURCE_FINAL_V4` evidence after the QA-only V5 source change; it is not a current-V5 source package. Other result payloads remain excluded.\n- A formal source-review ZIP preserves the project-relative code, data-preparation, plan, review-template, runtime-input, dependency, and local cumulative-fixture layout. It includes one package-root test runner and must pass it from an independent extraction. Compact UI-only archives may omit these dependencies only when explicitly labeled non-executable.\n- All current and future V4.4 result bytes are stored under `F:\\Backtest\\Backtest V4.4\\results`. The historical logical root `D:\\Code\\backtest-release\\Backtest V4.4\\results` remains available as a directory junction, so existing plans, manifests, main HTML, and shared per-trade HTML retain their paths without regeneration.\n\n## Temporary rerun\n\nThe user-selected coordinate E120/BH360/TRW6/K0.75/W1/M0.25/S480 completed with 3,882 trades. The reported 2026-06-19 11:07 trade now records a theoretical rebound line of 1514.825 and an actual same-bar close fill of 1514.850.\n\n## Historical pre-repair exploration context\n\nThe retired pre-repair lineage contained nineteen completed stages, 4,704 unique coordinates, and 706,470 trades in snapshot `20464535ee48376b73b847ea8454355b2acd58ab4c78c1273f3e97f9e37f76c7`. It remains historical review evidence; the current positive-entry lineage is described at the top of this document.\n\nAt fixed 3.57-bps research cost, the unrestricted leader is Round-8 E320/BH171/TRW11/K1.4/W6/M4.5/S388 with 114 trades and +78.4568% compounded return. Its median trade is -0.1789%, 39.3% of total return disappears without the best two trades, and non-gap compounded return is only +0.4662%, so the improvement remains gap-sensitive. The Scenario-1 leader is Round-8 E320/BH240/TRW22/K1.0/W6/M4.5/S330 with 89 trades and +55.9743%; the gain over the prior leader is only 0.0504 percentage points and remains gap-sensitive. Both average-return views now select Round-10 E160/BH720/TRW24/K1.6/W8/M3/S320 with 33 trades and +0.8458% average fixed-cost return.\n\nRounds 11–13 reopened the average-return branch with bounded broad controls, local surface refinement, and one-bar speed confirmation. The average-return leader remains E160/BH720/TRW24/K1.6/W10/M2.5/S308: 33 trades, +0.9464% cost-adjusted average return, +35.3717% cost-adjusted total return, and 4.54% maximum drawdown.\n\nRounds 14–15 applied the relative-resolution contract. Round 14 improved unrestricted cost-adjusted total return to 79.1437%. Round 15 then tested broad E/S interaction, the TRW/K ridge, and K stability, producing the current unrestricted leader E480/BH171/TRW12/K1.26/W6/M4.5/S388: 112 trades, 90.0092% gross return, 82.6033% cost-adjusted total return, 0.5627% cost-adjusted average return, and 15.1770% cost-adjusted maximum drawdown. Strong nearby E336/E576/E720 results indicate a broad plateau. Scenario 1 and the average-return leader did not improve in these two rounds.\n\nRound 16 used 205 sparse multimetric coordinates after exact anti-join: 170 large-span points and 35 paired-module points. It did not exceed the unrestricted or Scenario-1 total-return incumbents. Both average-return views now select E112/BH612/TRW24/K1.6/W10/M2.5/S308: 30 trades, 0.999935% cost-adjusted average return, 33.850987% cost-adjusted total return, and 4.823612% maximum drawdown. It also added the nondominated low-drawdown point E150/BH504/TRW24/K1.6/W10/M2.5/S310: 36 trades, 30.817684% cost-adjusted total return, and 3.089401% maximum drawdown.\n\nExisting stage pages remain historical evidence. Intermediate rounds close immutable raw evidence and compact summaries without rebuilding the shared cumulative HTML. After the exploration series ends, one explicit final publication refreshes the shared cumulative main and per-trade entries with every compatible old and new coordinate; earlier publication requires an explicit user request. Evidence analysis may continue after immutable raw closure under the closed-source, exact anti-join, separate-root/lock, and live-resource gates. `parameter_acceptance` remains `none`; no later round is prepared automatically.\n\n## Current P0-8 repair identity\n\nEntry qualification rejects zero or negative baseline, drop, or threshold before the inclusive threshold comparison. The prior 19-stage K200 campaign and snapshot `20464535ee48376b73b847ea8454355b2acd58ab4c78c1273f3e97f9e37f76c7` remain recoverable historical evidence. The current fifteen-stage positive-entry lineage is snapshot `db85efb36f3de1c1f8255c6108fb365ad9f3d337f77a8d37a0e0ae41982e5699`, containing 5,044 coordinates and 742,706 trades.\n","modified":"2026-08-08T19:27:46.180Z","missing":false},{"id":"version.zh","pair":"version","group":"state","path":"02_current_state/CURRENT_VERSION.zh.md","lang":"zh","title":"当前版本说明","lead":"当前交付物、行为、结构、接口、依赖与已知缺口。","policy":"交付物、行为、结构、接口、依赖或流程变化后更新。","markdown":"# 当前版本——V4.41 小版本，沿用 V4.4 排序谱系\n\n## V4.41 正式源码发布——2026-08-09\n\nV4.41 按方案 A 正式发布：GitHub 源码、Windows 紧凑源码 ZIP、SHA-256 sidecar、机器审计和 `V4.41` 标签。压缩包包含源码、测试、项目文档、运行契约、场景目录与工具、当前累计浏览数据、稳定总入口外壳和一组代表性逐笔区块；完整历史逐笔账本、依赖、缓存和其余参数逐笔区块不纳入。\n\n最终发布门槛为独立解压后 112 项通过、2 项跳过、0 项失败。两项跳过明确依赖紧凑包没有携带的封闭历史本地文件。预发布解压测试发现行情选择器来源哈希已经过期，绑定哈希在最终打包前完成修正。策略运算、已完成交易、收益、排名和保留结果快照均未重新计算。\n\n2026-08-08 紧凑审阅包继续作为不可变历史证据，不属于正式发布包。2026-08-08 数 GB 完整交接包保存在本地，不按方案 A 公开发布。\n\n## V4.41 行情场景扩展——2026-08-08\n\nV4.41 已加入目录驱动的行情选择器和场景应用层。这是 V4.4 主版本谱系内的研究交付扩展，不改变策略语义、已完成逐笔或累计排序兼容性。当前登记了三个行情区间和原有三个 K200 场景。场景应用结果写入独立排序页，现有稳定总入口和逐笔页面保持不变。\n\n选择器现在会在界面中说明场景目录流程，自动生成下一个未使用的场景 ID 和默认名称，只保留名称可修改，并把框选结果规范为铺满图表高度的时间带。保存仍写出完整的多场景目录；策略和资格规则没有变化。\n\n## V4.41 紧凑外部审阅包——2026-08-08\n\n`D:\\Code\\backtest-release\\Backtest_V4.41_source_review_20260808.zip` 保留为其他 GPT 已审阅的紧凑包。它包含 2026-08-08 当时的源码与测试、项目管理、运行输入、37,058 组参数的累计浏览载荷和一组代表性逐笔数据；3.5 GB 完整账本交接包及其他参数组合的逐笔文件不纳入。该不可变压缩包仍记录当时复现的 4 项失败、105 项通过和 2 项跳过。\n\n当前源码已经修复这四项审阅问题，同一套测试现为 109 项通过、2 项跳过、0 项失败。打包脚本会在下次运行时记录当前结果。尚未生成替代紧凑包，2026-08-08 压缩包继续作为历史审阅证据保留。\n\n## V4.41 当前交付包与本地清理——2026-08-08\n\n当前可移交包为 `D:\\Code\\backtest-release\\Backtest_V4.41_current_complete_20260808.zip`；相邻 `.sha256` sidecar 是整包哈希权威。交付包包含源码、运行输入、当前项目文档、保留报告，以及来自 110 个已完成且兼容 V4.4 阶段的 4,467 份不可变原始逐笔账本或已有衍生逐笔账本。交付身份采用 V4.41，策略／排序兼容边界保持 V4.4。\n\n最终包已通过清单身份、ZIP 名称／大小、重复／禁止路径和整包 SHA-256 检查。普通核验不再重复计算每个 ZIP 条目哈希，也不再建立重复解压目录。九份 2026-08-03 规范报告已经进入项目 handoff 目录，因此 `.omo` 不再是依赖。\n\n最终包通过后，22 个旧包／伴随文件和两个本地目录已移入 Windows 回收站，合计 39.972 GiB。同一轮清理还把 `.omo`（68.72 MiB）、旧缓存、Crashpad 材料、dashboard 缓存与四张过期 QA 图片移入回收站。当前结果、V4.2 证据、V2 的两个下载依赖、共享工具、来源记录和项目管理存档继续保留。\n\n## V4.41 发布身份——2026-08-08\n\nV4.41 是当前发布与界面显示版本。它属于小版本：策略主版本、结果合同、参数身份与累计排序边界继续采用 V4.4。已完成的 V4.4 结果在各自证据边界内继续有效；排序谱系与结果合同一致时，仍进入同一累计排序。`RELEASE.json` 记录这组双层身份；本次发布不会归档或排除任何历史结果。\n\n## K200 训练／测试配对逐笔查看——2026-08-08\n\nK200 训练区间和后续测试区间的逐笔页面现在可以按精确坐标双向切换。工具栏显示目标名称「显示测试集」或「显示训练集」，并携带当前 `combo_id` 和目标研究合同身份。配对结果在当前页的对照层中打开，可用「隐藏……」按钮或 Esc 关闭。关闭时卸载 iframe，配对图表不会长期保留额外 renderer。已有总入口与逐笔网址继续有效。\n\n配对按钮居中，并沿用相邻工具栏按钮的悬停样式。内嵌页面不显示「当前参数」卡片，对照层关闭前也不会透出外层页面。交易选择区域只保留下拉框。开仓／下跌审计值从图内迁移到理由标题下方的紧凑彩色框，图例移到 K 线图下方。浏览器标签不显示版本号，图标使用蓝色 `Z`。本次只改变展示和路由；逐笔区块、OHLC、成交、指标、排序和策略行为均未改变。\n\n## 与品种和区间无关的结果包——2026-08-08\n\nV4.4 现在按品种和实际评价区间保存已发布回测证据，根目录为 `results\\evaluation_packages`。训练、测试、迁移、留出或描述性含义由 `EXPERIMENT.md` 与 `comparison_plan.json` 说明，不改变结果包目录名。当前 K200／K200／SI 证据已经登记为三个完整日期结果包，每个包都有清单、统一参数汇总、浏览器精简数据、不可变逐笔记录和逐笔入口。\n\n`results\\evaluation_comparison` 分别加载三个结果包的浏览器数据，再按精确 `combo_id` 重建保留的 350 组比较。重建后的行和数值完全一致；页面外壳只有数据脚本来源发生变化。浏览器检查确认可见正文、标题、首行和行数相同，且没有错误。稳定跨品种网址已经转向该读取器。累计总入口和保留比较页保持不变；后来确认的逐笔外壳调整不改变结果包数据。同一框架可以读取任何已就绪品种配置和任意精确评价区间。\n\n## 当前 K200 优参数后续一个月重放——2026-08-07\n\n四个工作线程完成修正版 100 组冻结候选。所有候选在训练期成本后为正，其中 6 组是保留的主视图对照，94 组此前没有在该后续区间运行。该时间区间已经用于早期时间迁移，因此本轮在参数层面提供新增证据，在时间区间层面属于事后重放。\n\n100 组中只有 29 组成本后为正，28 组同时满足至少十笔，8 组非 gap 收益为正。后续收益中位数为 -0.671%，交易数中位数为 84.5，训练／后续排名 Spearman 为 -0.346。后续总收益最高点为 +9.175%，非 gap 收益为 -8.243%。至少十笔且非 gap 收益最高的坐标为 E112／BH612／TRW30／K1.3／W10／M2.5／S308：总收益 +4.693%，非 gap 收益 +4.573%，共十笔，Top2 正收益占比 72.2%。\n\n第一次已完成运行继续保留为历史记录，但不能参与当前决策，因为候选队列带入了十二组训练期成本后为负的坐标。`_v2_` 结果取代它。没有发布 HTML，也没有接纳参数。\n\n## K200 训练／测试／SI 统一迁移——2026-08-07\n\n跨品种稳定入口现在统一排序 350 组候选，并显示 K200（训）、K200（测）和 SI 三列收益。流程保留 250 组已完成 SI 结果，根据已闭合 K200 时间迁移证据冻结 100 组新增候选，在读取本批 SI 结果前完成冻结；随后用四个工作线程评价 SI，并把全部 350 组重放到 K200 测试期。SI 最终包含 48,022 笔交易，K200 测试期包含 34,248 笔。\n\n可见排名表头现统一为「排名」，排名按钮只显示「#N」。排名打开 SI 逐笔证据；K200（训）、K200（测）和 SI 三列总收益单元格复用相同蓝色按钮组件，并在新标签页打开各自对应的逐笔分析。K200（测）拥有覆盖 350 组候选、34,248 笔交易的专用逐笔入口；K200（训）跳转到既有累计 K200 逐笔入口。\n\nK200 测试期 199 组为正，SI 275 组为正，三列同时为正 149 组。新增 100 组的对应数量为 72、59 和 43。E320／BH240／TRW12／K1.25／W6、M4.25–4.75、S340–370 形成连续的三组正收益邻域，但 K200 测试期结果仍依赖 gap。静态通用参数依旧缺少证据；短窗口重估、冻结候选、随后前推评价更可信。发布复用 250 个既有 SI 逐笔区块，生成 100 个新区块。当前没有接纳参数。\n\n## K200 训练期至后续行情时间迁移——2026-08-07\n\n四个 worker 在训练区间之后的四段连续行情中，每段评价 400 个冻结候选。后续候选只读取训练证据与已经闭合的更早时间片；第四段的候选在查看该段结果以前完成冻结。同一批最终 400 组在完整后续区间重放，只用于描述。中间轮没有生成 HTML。\n\nR1/R2/R3/R4 的成本后正收益坐标为 296/26/383/25。218 组覆盖全部四段，只有两组四段全正，而且都属于低频、收益集中的结果。训练期与全测试期收益排名 Spearman 为 -0.262；训练期冠军在全测试期收益为 -1.567%，回撤为 14.902%。最终判断为 `no_static_general_parameter_found`，没有接受参数。\n\n## K200 增量数据与运行记录——2026-08-07\n\n活动 K200 来源现有 233,368 根补齐交易时段的 15 秒数据，结束于 `2026-08-07T03:21:45+09:00`。最新增量来自 1,065,932 笔保留的 IBKR `TRADES` Tick，生成 34,168 根清理后的 15 秒数据；仓库活动来源 SHA-256 为 `9760d367a109777c4789ce45d982a6c0708bacddad8f549450ed94f81ad5c405`。准备数据、K200 品种配置、政策证明、运行清单和源码清单均已绑定扩展后的来源。\n\n三个保留的 K200 下载目录现在都有自身的 `README.md`，记录更新时间、按成交量选择主力合约的规则、未复权 016M／016U 准确切割、血缘与合并方式。保留的 SI 目录也增加 `D:\\Code\\data\\ibkr\\SImain\\README.md`，记录 SIH6 选择、准确区间、未复权政策、合并规则和更新时间。后续所有品种和下载都执行同一 README 契约。`project_management\\03_active_work\\BACKTEST_MANAGEMENT.en.md` 及其中文镜像是独立的回测前必填记录，保存品种、准确数据文件、实际回测开始和结束时间。本次数据更新没有重新运行历史回测，也没有重新生成 HTML。\n\n## K 线区间统计按需计算——2026-08-07\n\n累计逐笔页在「深色 Dark」左侧增加「区间统计」，并移除原视图切换说明句。开启后，横向拖动会圈选一段连续 K 线；圈选结束时，右侧详情栏的交易理由上方显示紧凑三列结果框。内容包括开始、结束、起始价、最高价、最低价、最终价、K 线总数、涨跌幅、振幅和最高点至后续低点的最大回撤。\n\n该功能不增加启动计算与数据请求。`plotly_selected` 触发后，页面只线性扫描所选区间一次；随后清除原生选择状态，并用普通 Plotly 图形重画浅色选区。选区外行情保持正常明暗，选取框也会持续显示。关闭结果框会清除图形并恢复缩放拖动，参数变化或图表重绘也会清除临时结果。基准与阈值标注不再显示「紫色」「橙色」后缀。\n\n页面还增加与区间统计互斥的「持仓检测」。短按一根可见 K 线即可判断该 bar 完成后是否仍持仓，并复算当时的反弹与速度条件；移动超过五像素仍由 Plotly 执行拖动缩放。逐根 K 线使用自身来源 bar；合并 K 线使用与显示 close 对应的末端来源 bar。结果框显示 active low、有效 max-W 基准区间与基准值、倍数、阈值、当前反弹关系和 S 窗口速度距离；所选 close 显示蓝色点，基准区间采用更深的无描边蓝色着色。两种检测启用时会收起参数抽屉，结果框均位于右侧详情栏。K 线高低点末端横线已通过 `whiskerwidth=0` 移除。已完成快照可以只刷新逐笔页面外壳，不重建不可变逐笔区块与数据载荷。\n\n## 六小时 K200 跳跃／网格循环与流式累计交付——2026-08-06\n\nAI 主导循环使用四个工作线程闭合 89 轮自动探索：六十轮跳跃和二十九轮自适应网格。当前累计快照为 `eb3398757b8ffe52332aec6ecdedc60df86b70afb4e1509c8fa3fcccd7b53dd5`，包含 37,058 个唯一坐标、11,749,606 笔交易和 109 个兼容阶段；复用 5,320 个未变化逐笔区块，生成 31,738 个新区块。四个主视图冠军均与旧 5,320 坐标快照相同；`parameter_acceptance=none`。\n\n累计发布器现在递归发现嵌套生成计划，逐阶段读取和处理数据，以流式方式写入 22.13 GB 的累计交易 CSV，并向量化成本指标和逐笔转换，使用四个工作进程生成缺失区块。发布器最终内存低于 2 GB，旧路径峰值为 14.4 GB。后期跳跃轮仍持续找到互不相邻的优秀锚点，因此没有证明 K200 全局闭合，也没有启动 SI 迁移。\n\n## K200 累计表展示——2026-08-06\n\nK200 稳定入口现在跳转到主页面，不再保留重复顶栏与 iframe。页面标题改为「V4.4 K200回测结果排序」，常用蓝色加深一级；主表改用全宽布局，占用接近一个视口高度，并固定表头。分页每次渲染 500 行，筛选和排序仍覆盖完整合格集合。\n\n两种收益口径的列名统一为「总收益」「笔均」「回撤」，排名列统一为「排名」。排名按钮只显示「#名次」，蓝色按钮宽度保持 90 像素。页面移除 gap 依赖收益审计、`segment_end`、等待成交、最长等待和「研究合同」；「往返成本 bps」与「跨 gap 笔数」位于最后两列。结果数值、筛选、排名规则、底层字段与不可变快照均未改变。\n\n交易数筛选标题改为「交易数」，保留「不限」「至少 10 笔」「至少 20 笔」，移除至少 100 笔和至少 150 笔预设，并增加严格的「大于 x 笔」与「小于 x 笔」数字条件。两个自定义条件可以同时生效。主表列标题统一居中，数据单元格的对齐方式保持不变。\n\n## 250 候选统一迁移排序——2026-08-06\n\n稳定跨品种入口现在将 250 个兼容的 K200 → SImain 候选放在同一排名中。兼容条件为目标品种、目标样本、成本模型、策略语义与结果结构一致；实验或迁移身份保留为来源信息，不再用于分割排名。当前发布包含 24,194 笔 SImain 交易，复用 247 个已完成逐笔区块，并新增三个区块。\n\n新增固定坐标续探测试 K1.5／K1.6／K1.75。目标交易数降至 62／57／51 笔，成本后收益降至 23.9157%／16.7475%／20.1076%。K1.4 仍是目标品种局部峰值：67 笔、35.6004%。分类为 `not_improved_target_peak_at_k1p4`；`parameter_acceptance=none`。\n\n## K200 双目的探索交付——2026-08-05\n\nContinuation Round 15 固定了参数探索的两项目的。经审阅计划包含 192 个确定性大范围覆盖坐标，以及围绕全坐标、情景一、平均收益和低回撤锚点的 84 个单参数细化坐标。四个工作线程闭合 276 个坐标、54,314 笔交易和 35 个批次。\n\n平均收益分支得到改善。E96 成为至少 10 笔与至少 20 笔的笔均冠军：25 笔、成本后总收益 35.2290%、笔均 1.23914%、回撤 3.0190%。E128 是更均衡的相邻改善点：29 笔、总收益 38.9271%、笔均 1.16460%、回撤 4.21795%。全坐标与情景一冠军均未变化。大范围覆盖没有找到稳健的新主冠军。\n\n最终增量发布生成快照 `5b4e11b4c137028dc0a33d792a47800c8d792f6125e2cc8d2f5796ec6ef4fa94`，包含 5,320 个坐标、797,020 笔交易和十六个阶段。本次复用 5,044 个未变化逐笔区块，生成 276 个新区块。`parameter_acceptance=none`。\n\n## K200 大规模多区块探索与累计增量交付——2026-08-05\n\nContinuation Round 14 通过经审阅的 37 批次、四工作线程计划，新增 294 个精确坐标和 28,577 笔交易。最终累计快照为 `db85efb36f3de1c1f8255c6108fb365ad9f3d337f77a8d37a0e0ae41982e5699`，包含 5,044 个坐标、742,706 笔交易和十五个兼容正值开仓阶段。累计发布程序现在会从当前快照复用确定性命名且未变化的逐笔区块；本次复用 4,747 个，生成 297 个。\n\n全坐标总收益与情景一冠军均未变化。两个最低交易数约束下的笔均收益视图现在都选择 E112／BH612／TRW24／K1.6／W16／M2／S308：29 笔、成本后总收益 38.4486%、笔均 1.15253%、回撤 4.23380%。变化主要来自保留开仓的退出时间差异，且仍受合成信号与 gap 交易影响。本轮分类为 `improved`；`parameter_acceptance=none`。\n\n## 面向人的项目导览首页——2026-08-05\n\n项目管理 Dashboard 现在默认打开面向人的导览页。左侧目录第一项固定为「项目导览」；它与其他管理文档共用相同的文档页头、元数据、正文宽度、字体、页内目录、语言切换和响应式页面框架。正文包含两张流程图：一张说明四种 campaign 模式及共用回测生命周期，另一张说明一笔交易如何从已完成的 15 秒资料走到开仓、退出与逐笔证据。下方自动生成全部管理文档目录。该虚拟导览不属于 manifest 文档，不改变 AI 阅读矩阵，也不具有策略或证据权威。\n\n## 增量发布的 247 候选更严格开仓迁移——2026-08-05\n\n当前稳定跨品种入口包含 247 个候选：已完成的 244 候选父运行，加上三个冻结的 K200 K 扩张坐标。三个 SImain 结果全部为成本后正收益。K1.2 为 85 笔、16.4678%；K1.3 为 73 笔、33.9182%、回撤 11.6094%；K1.4 为 67 笔、35.6004%、回撤 11.9132%。K1.1 父锚点为 86 笔、22.0575%、回撤 14.6209%。因此 K1.3 与 K1.4 同时减少 SImain 开仓、提高目标收益并降低回撤；相同 K 方向会降低 K200 收益。分类为 `improved_on_target_mixed_across_instruments`；`parameter_acceptance=none`。\n\n迁移 HTML 现在固定使用 `build_v4_4_cross_instrument_comparison.py build --run-id \u003crun_id>`。本次 247 候选发布通过同卷硬链接复用 244 个已完成目标逐笔区块，只生成三个新增区块；排序索引、目录、汇总与清单完成更新，没有重新生成未变化候选的逐笔证据。\n\n## 方案驱动的 K200 → SImain 合并交付——2026-08-05\n\n当前跨品种入口合并用户指定的 180 个候选结果与修复后来源的 64 个候选结果。两组坐标没有重合，因此当前对比包含 244 个候选、25,129 笔 K200 交易与 23,799 笔 SImain 交易。其中 SImain 成本后正收益候选为 210 个，稳定候选为 148 个，孤立正收益候选为 57 个；原品种／目标品种成本后收益排名 Spearman 为 0.060149。\n\n页面从 `research_variants\\short_momentum_net_drop_rebound_v4_4\\plans\\v4_4_migration_k200_to_simain_20260805.json` 读取品种显示名称与样本区间。「迁移批次」列已经移除；K200 总收益紧邻并位于 SImain 总收益前方；同一表头点击三次依次为升序、降序与恢复默认目标排名。原品种总入口采用新标签页打开跨品种页，跨品种页也提供新标签页原品种入口。最终迁移交付包含原品种总入口、原品种逐笔、合并排序、目标品种逐笔与迁移报告。\n\n## 新规则 K200 单轴探索——2026-08-05\n\n十轮四-worker 探索围绕修复后的全坐标锚点 E480／BH171／TRW12／K1.26／W6／M4.5／S388 新增三十个坐标。每轮只修改一个参数，并测试三个新点。中间轮只闭合原始证据与精简交接，不生成 HTML；末轮统一发布快照 `0126cd77b436aef1434e7072bac0d6dfa15b3d2ad4dc2cf1b2fafe936ee1e626`，包含 4,747 个坐标、713,886 笔交易和十三个兼容阶段。\n\nBH 扩大／缩小、TRW 扩大／缩小、K 提高／降低、M4.5 两侧及 S 扩大均为 `not_improved`。W7 把成本后总收益从 82.4352%提高到 82.4664%，但增幅只有 0.0312 个百分点且没有连续性：W8、W9 较弱，W7 的笔均更低、回撤略高、剔除 gap 后收益也低于 W6。W 方向分类为 `mixed`；`parameter_acceptance` 保持 `none`。\n\n## 固定其他参数的 E 窗口敏感性——2026-08-05\n\n十三个新增坐标固定 BH=171、TRW=11、K=1.4、W=6、M=4.5、S=388，只把 E 从锚点 E=320 缩小到 304、256、192、160、136、112、96、80、64、48、32、24 与 16。结果已经发布到累计快照 `b077548e654277738e1d953ce7bea01eb184a0e223f064c7728dbc2de4d1a561` 与共享逐笔入口。\n\n证据不支持「E=320 太大」这一判断。成本后总收益从 E=320 的 78.2952% 降到 E=304 的 75.7622%、E=256 的 74.2774%、E=192 的 62.0632%、E=80 的 60.6744% 与 E=16 的 7.8332%。较小 E 可以减少交易数和最大回撤，例如 E=64 为 108 笔、62.3971% 收益与 12.4072% 回撤；E=320 为 114 笔、78.2952% 收益与 15.1499% 回撤，但收益代价明显。`parameter_acceptance` 继续为 `none`。\n\n## 与品种无关的研究接口——2026-08-05\n\nV4.4 策略语义已经与品种配置、campaign 意图分离。K200 继续作为已就绪默认品种，当前修复后累计证据包含 4,747 个坐标。SImain 与 NQ 对全新 campaign 继续使用未完成模板；已闭合的精确迁移继续沿用既有 SIH6 评价合同。正式 campaign 模式为 `transfer_exact`、`target_local_refinement`、`continuation_search` 与 `fresh_search`。\n\nschema-v5 计划绑定 campaign manifest、品种配置、排名谱系和可选情景策略。已接受的 K200 V4.4 排名谱系现在覆盖小幅实现与数据准备修正；相关哈希继续作为阶段来源。升级到 V4.5 时建立新的累计分区。其他品种使用独立排名谱系与跨品种比较。\n\n当前低活跃策略为 `confirmed_low_activity_gate`。低成交量连续段处于待确认状态时不影响策略。连续 120 根 15 秒原子确认后，该区间从此后的 BH／TRW baseline 中回溯排除，未成交开仓委托取消，并停止新开仓，直到第一根正常成交量原子。已有持仓继续使用原平仓规则。准备数据字段为 `baseline_excluded_from` 与 `confirmed_low_activity_active`。\n\n## 跨品种对比——2026-08-05\n\n当前独立跨品种页面使用 2026-01-29 至 2026-02-23 的 SImain SIH6，评价从修复后 4,747 坐标 K200 快照预先冻结的 64 个候选。来源筛选排除历史 266 个已迁移坐标与当前冠军，再应用来源前 20%、至少 10 笔、W／M／S 参数族和族内严格度 Pareto 规则。页面固定使用 3.57-bps 研究成本，不建立综合分数，并把 SImain 全网格诊断与冻结候选验证分开。\n\n页面保留四个以已完成文件为依据的范围选择器，以及全文与可叠加字段筛选。双选项收益口径控件同步切换 K200／SImain 的排名与收益显示；64 个冻结候选均可打开自己的 SImain 专用逐笔页面。它们共产生 6,755 笔 SImain 交易，58 个候选成本后为正，29 个位于稳定正收益区域；来源与目标收益排名 Spearman 为 -0.45728。历史 266 候选对比继续保留在原运行目录。\n\n## 状态\n\nV4.4 是包含成交语义修正与成本感知衍生排名层的独立研究版本。它还不是最终策略版本，也没有参数被接受。\n\n## 当前行为\n\n- 已存在的回撤触发线满足 `open >= trigger` 时按真实 bar 的 open 平仓；否则在 `high >= trigger` 时按 trigger 平仓；等于边界也平仓。\n- 严格创新低 bar 只能使用此前已完结 bar 形成的回撤基准。当同一根真实 bar 的 close 确认反弹时，按该 close 成交。\n- W 来源窗口的起点不得早于 H、当前连续段起点与 `end-W+1` 三者中的最晚位置。\n- W 接受 1 到 W 的可用前缀。较短的早期前缀可以继续作为本次持仓的单调最大值；不要求完整 W，也不设置最小窗口比例。\n- 每个候选均为 `w_open_to_end_low_drop = open[start] - low[end]`，不表示窗口内部最大有序下跌。\n- 样本结束时仍持仓，则按样本末端 bar 的 close 强制平仓，不读取更晚价格。\n- `all_window` 仍是默认方法。`exclude_marked` 仅在 TR 原子的因果 `baseline_available_from` 时间已经到达时允许其进入基准。\n- pending entry 保留信号，并在 120 根连续候选 bar 边界内按第一根真实成交 bar 的 open 开仓，不要求再穿越 trigger，也不增加结构取消。\n- 累计页面的方法标签为「滚动 TR 总和均值」，与实际基准公式一致：在 BH 内对每个重叠 TRW 组求和，再对全部窗口和求平均。E 是已经完整观察到的高点搜索范围，实际净下跌只从严格 H 延伸到后续信号低点。BH 截止并包含 H 所在的完整 15 秒 TR 原子。当前实现保持因果性——基准原子均位于 H 及以前、H 必须早于信号 bar、批量结果与逐步前缀交付一致——但它共享 H 边界 bar，没有采用严格截止到 H 前一根的分离方式。\n- 衍生分析提供毛收益与成本后模式；切换时排名和收益显示同步变化。已交付结果保留各自的历史成本契约。后续 campaign 绑定参考价乘以 point value 的名义价值模型，以及手续费、滑点与必要汇率转换。累计构建器保留每个阶段的成本模型；原始成交和原始收益保持不变。\n- 累计总入口生成器在「筛选与排序」面板提供支持键盘操作的纯图标披露按钮。固定 40×36 像素按钮包含 20 像素 SVG 折线箭头：展开时朝上，缩小时朝下。缩小后保留全部筛选与排序状态，并把面板压缩为一行。排名表采用布局与绘制隔离，避免面板高度变化时重新绘制整张大表。用户指定的快照 `e4a20d1d5bcb8974f4341a3647e2e246c3c1ab855d66ce4b3d7d4998d7fb3d44` 已发布这项纯 UI 变更；当前稳定快照继续保持原字节。\n- 稳定累计总入口从 `results\\all_completed_union_analysis\\main` 读取轻量汇总载荷，精确逐笔与情景链接继续进入不可变的当前快照。主表每行只保留控制、排名、显示及路由使用的 32 个字段；当前 5,044 行载荷为 5,621,151 字节。筛选、指标排名与列排序只操作整数行索引，不复制行对象。表格虚拟化与排序结果缓存按用户要求不加入。\n- 开仓理由第 2 项的 high／entry 点悬停高亮使用彩色轮廓、透明填充的空心椭圆。逐笔页面折叠后的「参数」标签在桌面端比原位置上移 6 像素；移动端抽屉行为保持不变。\n- K 线线性指引使用实线。全部行情区间矩形——包括过滤行情、信号、基准、回撤、冻结及低活跃区间——只保留语义半透明填色，不显示边框。图上不显示冗长的理论线／实际成交说明，也不显示跌幅、比例、开仓基准、开仓阈值、W 基准和活动低点数值框。这六项信息保留边框和语义颜色，放在「开仓理由」下方；详细侧栏退出推理继续保留。\n- ZIP 交接包包含当前代码、项目管理树、规范分析报告、哈希绑定的 15 秒 OHLC，以及各阶段原始／衍生逐笔交易 CSV。QA-only V5 源码变更后，压缩包 `D:\\\\Code\\\\backtest-release\\\\Backtest_V4.4_with_trade_records_20260803_final.zip` 继续作为已审计的历史 `SOURCE_FINAL_V4` 证据保留，不属于当前 V5 源码包。其他结果载荷继续排除。\n- 正式源码审阅 ZIP 保留项目相对的代码、数据准备、计划、审阅模板、运行输入、依赖与本地累计 fixture 目录结构，包含一条包根目录测试入口，并必须在独立解压副本中通过该入口。紧凑 UI 审阅包只有在明确标注为不可执行时，才可省略这些依赖。\n- 当前及后续全部 V4.4 结果字节存放于 `F:\\Backtest\\Backtest V4.4\\results`。历史逻辑根目录 `D:\\Code\\backtest-release\\Backtest V4.4\\results` 继续作为目录联接可用，因此已有计划、清单、总入口 HTML 与共享逐笔 HTML 保持原路径，无需重新生成。\n\n## 临时重跑\n\n用户指定的 E120/BH360/TRW6/K0.75/W1/M0.25/S480 坐标已完成，共 3,882 笔交易。被报告的 2026-06-19 11:07 交易现在记录理论回撤线 1514.825，并按同 bar close 1514.850 实际平仓。\n\n## 修复前历史探索背景\n\n已经退出权威的修复前 lineage 在快照 `20464535ee48376b73b847ea8454355b2acd58ab4c78c1273f3e97f9e37f76c7` 中包含十九个已完成阶段、4,704 个唯一坐标和 706,470 笔交易。它继续作为历史审阅证据；当前正值开仓谱系见本文顶部说明。\n\n按固定 3.57 bps 研究成本，全坐标领先组合为第 8 轮 E320／BH171／TRW11／K1.4／W6／M4.5／S388：114 笔交易、复利收益 +78.4568%。逐笔中位数为 -0.1789%，移除最佳两笔后总收益减少 39.3%，非 gap 复利收益仅 +0.4662%，因此增益仍明显依赖 gap。情景一领先组合为第 8 轮 E320／BH240／TRW22／K1.0／W6／M4.5／S330：89 笔交易、收益 +55.9743%；相对旧领先组合仅提高 0.0504 个百分点，且同样依赖 gap。两个笔均收益视图均改选第 10 轮 E160／BH720／TRW24／K1.6／W8／M3／S320：33 笔交易、固定成本后笔均收益 +0.8458%。\n\n第十一至十三轮以边界内大跨度对照、局部表面细化和单根 bar 速度确认恢复笔均收益分支。笔均收益领先组合保持 E160／BH720／TRW24／K1.6／W10／M2.5／S308：33 笔交易、成本后笔均收益 +0.9464%、成本后总收益 +35.3717%、最大回撤 4.54%。\n\n第十四至十五轮采用相对分辨率契约。第十四轮把全坐标成本后总收益提高到 79.1437%。第十五轮继续测试大跨度 E／S 交互、TRW／K ridge 与 K 稳定性，得到当前全坐标领先者 E480／BH171／TRW12／K1.26／W6／M4.5／S388：112 笔交易、毛收益 90.0092%、成本后总收益 82.6033%、成本后笔均收益 0.5627%、成本后最大回撤 15.1770%。相邻 E336／E576／E720 仍保持高位，说明它是宽阔平台。两轮均未改进情景一与笔均收益领先者。\n\n第十六轮经过精确反连接后采用 205 个稀疏多指标坐标，其中 170 个为大跨度点，35 个为模块配对点。全坐标与情景一总收益均未超过既有领先者。两个笔均收益视图现改选 E112／BH612／TRW24／K1.6／W10／M2.5／S308：30 笔交易、成本后笔均收益 0.999935%、成本后总收益 33.850987%、最大回撤 4.823612%。本轮还新增一个非支配低回撤点 E150／BH504／TRW24／K1.6／W10／M2.5／S310：36 笔交易、成本后总收益 30.817684%、最大回撤 3.089401%。\n\n已有阶段页面继续作为历史证据保留。中间轮次只闭合不可变原始证据与精简摘要，不重建共享累计 HTML。整组探索结束后，通过一次明确的最终发布刷新共享累计总入口与逐笔入口，并把全部新旧兼容坐标放在一起比较；提前发布需要用户明确要求。不可变原始闭合后，证据分析可以在源码闭合、精确反连接、根目录／锁隔离及在线资源门槛下继续。`parameter_acceptance` 保持 `none`；不会自动准备后续轮次。\n\n## 当前 P0-8 修复身份\n\n开仓资格会在包含等号的阈值比较以前拒绝零值或负值 baseline、drop、threshold。旧 19 阶段 K200 campaign 与快照 `20464535ee48376b73b847ea8454355b2acd58ab4c78c1273f3e97f9e37f76c7` 继续作为可恢复历史证据。当前十五阶段正值开仓谱系使用快照 `db85efb36f3de1c1f8255c6108fb365ad9f3d337f77a8d37a0e0ae41982e5699`，包含 5,044 个坐标与 742,706 笔交易。\n","modified":"2026-08-08T19:27:46.182Z","missing":false},{"id":"architecture.en","pair":"architecture","group":"state","path":"02_current_state/CODE_ARCHITECTURE.en.md","lang":"en","title":"Code Architecture","lead":"Current code flow, components, responsibilities, dependencies, and boundaries.","policy":"Update when code entry points, component responsibilities, call relationships, data flow, dependencies, or interface boundaries change.","markdown":"# Code Architecture\n\n## External-review repair boundary — 2026-08-09\n\n`build_v4_4_review_delivery.py::_native_trade_frame_fast` now returns an empty frame when a valid coordinate has no trades. The process worker writes the coordinate's normal `NATIVE_COMBO` record with `NATIVE_TRADES=[]`, `waited_count=0`, and `maximum_wait=0`. Thread and process publication therefore agree without manufacturing a trade.\n\n`analyze_v4_4_scenario_3_stage.py` continues to keep the complete stage `instrumentProfile` in `report_data.js`. Its compact `analysis_data.js` now carries only `instrumentSummary`: instrument ID, display name, ranking lineage, cost-model ID, experiment mode, and scenario policy. Local profile paths and policy implementation paths stay outside the compact browser payload.\n\n`build_v4_4_cross_instrument_comparison.py::_comparison_html` accepts optional injected base CSS for unit tests. Normal publication still reads the current cumulative page CSS. Cross-instrument tests therefore verify dynamic role-relative labels without requiring an F-drive snapshot. Presentation tests check current semantic properties and the current Entry Reason placement instead of obsolete CSS ordering or chart-label text.\n\n## Market-scenario flow\n\n`runtime_inputs\\scenarios\\market_catalog.json` maps selector choices to one instrument, evaluation package, market-data file, timezone, and exact interval. `tools\\build_v4_41_scenario_manager.py` creates interval-only gzip browser assets and publishes the selector without embedding a product-specific filename in the interface.\n\nThe selector loads one registered asset at a time, keeps selected ranges in browser memory, and saves the complete `scenario_catalog.json` through Chrome's file-save flow. The import control loads that full multi-scenario directory; a new draft receives the next unused `scenario_N` ID and `新场景N` default label, while only the label remains editable. Drawn ranges are normalized to full-height time bands. Each scenario repeats its data file, evaluation identity, displayed interval, and selected ranges so the file is self-describing.\n\n`tools\\apply_v4_41_scenario.py` resolves the bound evaluation package, evaluates every selected interval against `trade_records\\trades.csv`, ANDs segment qualification, filters the package's coordinate population, and generates `analysis_data.js` plus a copy of the current main shell. Migrated V4.4 scenes may reuse their compatible precomputed qualification field. New or edited scenes stream the immutable trade records. Per-trade links resolve through the package-owned `trade_review\\index.html`.\n\n## V4.41 handoff packaging\n\n- `tools\\package_v4_4_with_trade_records.ps1` publishes `Backtest_V4.41_current_with_trade_records_20260808.zip`. The script name keeps the V4.4 strategy-major namespace; the package identity and root release record are V4.41.\n- The package copies `RELEASE.json`, root runtime/configuration documents, the current research variant, `runtime_inputs`, `project_management`, tools, nine retained canonical reports from `research_variants\\short_momentum_net_drop_rebound_v4_4\\handoffs\\v4_4_cost_adjusted_multiround_20260803\\analysis_reports`, and immutable raw plus available derived trade ledgers from completed campaign stages. `.omo` is no longer a package dependency.\n- It excludes full result payloads, HTML snapshots, `.git`, `.omo`, dependencies, caches, browser profiles, and compiled bytecode. Raw batch trade ledgers are mandatory; a derived stage ledger is included only when that completed stage produced one. The resumable finalizer checks manifest identity, ZIP names and sizes, and the whole-archive SHA-256 without creating a duplicate extraction tree.\n\n## Release identity boundary\n\n- `RELEASE.json` owns the active presentation release (`V4.41`) and declares the unchanged V4.4 strategy/ranking major version. Engine manifests, parameter identities, and cumulative admission continue to use the existing V4.4 contracts and ranking lineage.\n- Page builders render V4.41 in active headings. `v4_4_engine.py::VERSION_LABEL`, `SOURCE_MANIFEST.json::version_label`, and `build_v4_4_combined_union_analysis.py::RANKING_MAJOR_VERSION` remain V4.4 so completed results stay compatible.\n\n## Date-based evaluation packages and generic comparison\n\n- `tools\\build_v4_4_evaluation_framework.py` publishes the result framework. It derives package identity from `instrument_id` and exact evaluation start/end; writes manifests, experiment notes, neutral summaries, candidate-set browser projections, immutable trade-record links, and per-trade compatibility routes; then builds a comparison plan and package-backed page.\n- `tools\\register_v4_4_evaluation_package.py` registers one newly completed instrument/interval from the declarative `runtime_inputs\\templates\\EVALUATION_PACKAGE_SPEC.template.json`. The spec maps source summary columns into neutral parameter and metric fields; registration creates the date package, hard-links immutable trade records, and updates the shared catalog without changing an existing package.\n- `results\\evaluation_packages\\catalog.json` is the machine-readable registry. Each instrument owns one directory per exact interval. Result packages do not encode an experiment role, so completed evidence can participate in several later plans.\n- `results\\evaluation_comparison` stores comparison catalogs and plans. Its browser loader reads each selected package projection, builds a `combo_id` lookup, restores role metrics to the retained page field contract in the original field order, and then runs the unchanged comparison UI.\n- Large retained trade CSVs use same-volume hard links inside compatibility packages. Package per-trade routes preserve query and hash values while forwarding to byte-preserved historical pages. Future native packages may own generated chunks locally and reuse unchanged chunks incrementally.\n- `tools\\qa_v4_4_evaluation_framework.mjs` compares the retained and package-backed pages in Chromium. It checks title, complete visible body text, first-row data, visible row count, and console/page errors, and captures both pages.\n- `run_v4_4_resumable_campaign.py` already resolves market data and preparation through an instrument profile and reads `train_start`/`train_end` from the plan. The storage layer removes K200 and train/test roles from directory identity without changing engine or runner semantics.\n\n## Current-optimal K200 one-month replay\n\n- `tools\\run_v4_4_k200_current_optimal_forward_initial.py` freezes a training-only multi-metric candidate population, anti-joins non-control rows against earlier temporal evaluations, writes a schema-4 exact-transfer plan, invokes the existing four-worker resumable campaign runner, and produces compact comparison and Markdown outputs without HTML.\n- Candidate eligibility requires positive cost-adjusted training return. Eight training-view controls are selected before the anti-joined additions; the freeze records whether each exact coordinate had any earlier test evaluation.\n- The script reuses `run_v4_4_k200_temporal_migration.py` for plan-safe execution and cost/dependency analysis, so engine, fill, cost, preparation, and gap semantics remain unchanged.\n\n## K200 train/test/SI triple-migration workflow\n\n- `tools\\run_v4_4_train_test_si_triple_migration.py` freezes 100 source-only temporal candidates after an exact anti-join against the retained 250 SI candidates, evaluates the new freeze on SI with four workers, replays the combined 350 on the K200 test interval, and writes the three-return comparison and final interpretation.\n- `build_v4_4_cross_instrument_comparison.py` reads the optional `source_test` contract, renders role-relative K200（训）, K200（测）, and SI return columns, routes each total-return button to role-specific per-trade evidence, and builds the dedicated K200（测） review from retained trade records without rerunning the strategy. K200（训） reuses the cumulative K200 review; SI retains its incremental review.\n- Final SI per-trade publication passes the retained 250-candidate run as `incremental_parent_run`; 250 chunks are reused and only the 100 new candidate chunks are generated. Intermediate migration stages do not publish HTML.\n\n## K200 temporal-migration workflow\n\n- `tools\\run_v4_4_k200_temporal_migration.py` freezes source-only multi-metric R1 candidates, runs four-worker resumable stages, writes compact cost/dependency summaries, and creates later candidate freezes from closed earlier slices plus source neighbors and structural controls. It preserves a final unseen slice and labels the full-interval replay as post-hoc descriptive evidence.\n- Plans and candidate CSV freezes live under `research_variants\\short_momentum_net_drop_rebound_v4_4\\plans\\k200_temporal_migration_20260807`; raw and derived stages live below `results\\temporal_migration\\v4_4_k200_temporal_migration_20260807`. Completed batches survive a memory-floor stop and resume without changing a freeze.\n- Finalization writes one temporal comparison HTML/CSV, one Markdown report, and one stage-native per-trade analysis. Existing analysis is retained on later report refreshes, so no completed compute or trade chunks are regenerated.\n- `build_v4_4_review_delivery.py::_stage_filter_bundle` accepts both the retained policy-neutral preparation identity and the current confirmed-low-activity-gate identity while preserving bound source and artifact hashes. `analyze_v4_4_scenario_3_stage.py::_atomic_json` serializes path-valued manifest fields as strings.\n\n## On-demand per-trade range-statistics presentation\n\n- `runtime_inputs\\templates\\historical_v4_trade.html` owns the paired-review control, version-free tab title, blue `Z` favicon, reason-panel metric boxes, simplified trade picker, and bottom legend. `build_v4_4_review_delivery.py` injects an optional peer route and research-contract identity while keeping the shared template instrument-neutral.\n- `results\\all_completed_union_analysis\\trade_review_peer.json` binds the current cumulative K200 review to its later-period test review. `build_v4_4_combined_union_analysis.py` reads that small publication contract for current-snapshot refreshes and future cumulative shells. `build_v4_4_cross_instrument_comparison.py` supplies the reverse link when it publishes the K200 test review.\n- `runtime_inputs\\templates\\historical_v4_trade.html` owns `区间统计`, Plotly horizontal selection, the right-column compact statistics panel, selection-complete calculation over existing OHLC, clearing of native selection state, a persistent pale ordinary shape over the interval, and close-time restoration of zoom mode.\n- The same template owns mutually exclusive `持仓检测`. It preserves Plotly zoom dragging, stores pointer-down on the chart, receives pointer-up on `document`, treats movement beyond five pixels as a drag, rejects non-left buttons, and maps a short press through the current axes to the nearest visible candle. It then resolves the exact raw source bar or an aggregate's final source bar, finds the enclosing trade, reconstructs the engine's max-completed-W next-bar-effective rebound state and S-window running-low state, adds a blue point at the selected close, and adds a darker borderless blue fill over the baseline-start-to-active-low span. Activating either mode collapses the parameter drawer.\n- The candlestick trace uses `whiskerwidth=0`, removing high/low endpoint caps without changing OHLC values.\n- `build_v4_4_review_delivery.py::refresh_trade_review_shell` regenerates only `trade_review\\index.html`, updates its resource audit and trade-review manifest, and leaves process payloads and per-coordinate trade chunks untouched.\n- `build_v4_4_combined_union_analysis.py::_refresh_completed_snapshot_trade_shell` updates the outer analysis and completion artifact references for a completed snapshot without invoking union-trade or chunk generation.\n\n## K200 incremental Tick acquisition and activation\n\n- `tools\\download_k200_incremental_ticks.py` resumes the retained IBKR K200 `TRADES` Tick checkpoint, preserves each acquisition directory, applies the current one-second immediate-recovery cleaner, builds session-filled 15-second derivatives, and creates an ordered extension candidate. It keeps the 10.25-second request pace; when IBKR omits a completion callback, one 500-tick page advances the unchanged cursor before 1,000-tick pages resume.\n- `tools\\write_k200_download_readme.py` writes and refreshes the `README.md` inside every retained K200 acquisition directory. It derives update history from the lineage manifests and records the audited main-contract rule, exact 016M/016U boundary, unadjusted merge policy, request range, status, and principal files.\n- `tools\\activate_k200_incremental_15s.py` appends the original active K200 source and independently cleaned supplement segments in strict timestamp order, replaces the repository-local active 15-second file, rebuilds prepared data, and refreshes the profile, attestation, runtime-input, and source-manifest identities. Historical result stages are not recomputed by activation.\n\n## K200 cumulative presentation route\n\n- `build_v4_4_cross_instrument_comparison.py::publish_current_main_standalone_view` publishes the stable root as a query/hash-preserving redirect to `main\\index.html`; the duplicate navigation shell and iframe are no longer generated.\n- `analyze_v4_4_scenario_3_stage.py::_legacy_v4_main_html` owns the current K200 title, colors, visible column order and labels, fixed-width rank links, 500-row client-side pagination, and the full-width sticky-header table viewport. It omits the research-contract section. `publish_stable_main_assets` refreshes only the lean main presentation from the current immutable snapshot payload.\n\n## Dual-purpose exploration utilities\n\n- `tools\\build_v4_4_k200_dual_purpose_round_15_plan.py` freezes deterministic broad coverage and exact one-parameter refinement blocks, performs the completed-coordinate anti-join, and writes the reviewed execution plan plus audit.\n- `tools\\analyze_v4_4_k200_dual_purpose_round_15.py` attaches plan block identities to completed stage results, compares broad and refinement branches separately, derives primary-view and trade-level diagnostics, and writes the anti-joined next-round handoff. These utilities do not change engine, fill, cost, or result semantics.\n\n## Incremental cumulative per-trade publication\n\n- `build_v4_4_combined_union_analysis.py` recursively resolves nested generated plans, loads stage summaries without retaining every trade frame, and processes retained trades one stage at a time. The cumulative trade CSV is streamed to a temporary file and atomically renamed after all stages close.\n- Deterministically named unchanged coordinate chunks are reused through same-volume hard links. Missing chunks use vectorized native-record construction and four worker processes; the ranking, catalog, process payload, summaries, manifests, and stable routes are refreshed once from the complete compatible stage set.\n- Closed stage manifests provide the publication audit boundary, avoiding repeated full trade-file hashing and per-trade execution audits during cumulative publication. Strategy, result, cost, scenario, and plan identities remain enforced.\n- The current delivery reused 5,320 chunks, generated 31,738, and published 37,058 coordinates/11,749,606 trades with publisher memory below 2 GB.\n\n## Instrument-neutral contracts\n\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\contracts\\STRATEGY_CONTRACT_V4_4.json` contains only shared entry, exit, timing, and state-machine semantics.\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\instrument_profiles\\*.json` bind instrument data, preparation evidence, cost, gap, low-activity, optional scenarios, and ranking lineage. K200 is ready; SImain and NQ remain templates until the user supplies cost and gap decisions.\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\campaign_contracts\\CAMPAIGN_MANIFEST.template.json` is the starting point for `transfer_exact`, `target_local_refinement`, or `fresh_search`.\n- `code\\instrument_contracts.py` validates those files and normalizes cost models. It calculates notional as reference price times point value and retains legacy K200 aliases.\n- Schema-v5 runner plans bind a campaign manifest, instrument profile, mode, ranking lineage, and scenario policy. Older plans omit these fields and retain their historical behavior.\n\n## Cross-instrument comparison\n\n- Incremental target trade-review publication is implemented in `build_v4_4_review_delivery.py::build_stage_trade_review`. A run config may name `incremental_parent_run`; `build_v4_4_cross_instrument_comparison.py` resolves its completed parent review, hard-links deterministic unchanged combo chunks into the new delivery, generates only missing combo chunks, then refreshes the small shell, catalog, process payload, summaries, and manifests. The fixed CLI is `build_v4_4_cross_instrument_comparison.py build --run-id \u003crun_id>`. Manifests record parent, reused count, generated count, and reuse mechanism.\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\code\\build_v4_4_repaired_source_transfer.py` can create a presentation union from completed exact-transfer result sets without rerunning either instrument. It removes batch provenance from the user table, binds a reviewed migration plan, writes instrument-neutral labels, publishes one combined target trade review and report, and redirects the repaired standalone result to the combined presentation.\n- The comparison builder reads relative source/target names and sample ranges from the run's `migration_plan`. Its table places source total return immediately before target total return and uses a three-state sort cycle. The cumulative navigation shell and comparison header provide reciprocal new-tab navigation.\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\code\\build_v4_4_cross_instrument_comparison.py` owns candidate freezing, isolated SImain evaluation, transfer diagnostics, CSV/JSON publication, the selectable/filterable K200-style rank table, dedicated SImain per-trade generation, completed-run catalog routing, and the cumulative navigation shell without changing immutable snapshots. Its build phase derives gross median-trade, drawdown, win-rate, and transfer-diagnostic fields from retained source/target trade CSVs for the presentation switch; it does not rerun target evaluation or alter frozen candidates.\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\code\\build_v4_4_strict_entry_transfer.py` freezes the source-only top-20% strict-entry K200 Pareto batch, calls the unchanged SImain evaluator, recomputes aggregate diagnostics across independently frozen transfer batches, and publishes one shared comparison plus one shared SImain per-trade entry. It records threshold quartiles and the five-dimensional cross-instrument Pareto set without a combined score.\n- `research_variants\\short_momentum_net_drop_rebound_v4_4\\c
