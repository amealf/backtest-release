<head>

<style>
:root{

  --panel:#151a21;

  --panel-soft:#12171e;
  --line:#2b323d;
  --line-strong:#3a4451;
  --line-soft:#242b35;
  --text:#f2f4f7;
  --body:#d0d5dc;
  --muted:#9aa4b2;
  --blue:#4a9cf5;
  --blue-soft:#1b2f45;
  --red:#f03f5d;
  --green:#00b578;
  --orange:#ff7a00;
  --purple:#ef9bbb;
  --focus:#74b5ff;
  --focus-ring:#74b5ff;
  --drawer-bg:#000000;
  --drawer-control-bg:#000000;
  --drawer-title:#a8d4ff;
  --drawer-focus:#74b5ff;
  --drawer-focus-soft:rgba(116,181,255,.16);
  --selected-text:#ffffff;
  --danger-border:#8d3f49;
  --danger-surface:#32171c;
  --danger-text:#ffbac0;
  --missing-text:#a3afbd;
  --missing-surface:#10161e;
  --missing-border:#465468;
  --option-bg:#0b0f14;
  --option-text:#edf2f7;
  --option-muted-bg:#161d27;

  --hover-bg:rgb(19,27,38);
  --hover-opacity:.74;

  --hover-text:#f8fafc;
  --z-drawer:20;
  --z-drawer-tab:21;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#edf3f8;
  --panel:#ffffff;
  --panel-strong:#f8fbff;
  --panel-soft:#ffffff;
  --line:#d7e1ec;
  --line-strong:#c6d4e1;
  --line-soft:#e8eef5;
  --text:#062348;
  --body:#52657d;
  --muted:#63758c;
  --blue:#1f77b4;
  --blue-soft:#eff6ff;
  --red:#ef4444;
  --green:#159447;
  --orange:#f97316;
  --purple:#8b5cf6;
  --focus:#1d4ed8;
  --focus-ring:#1d4ed8;
  --drawer-bg:#ffffff;
  --drawer-control-bg:#f8fbff;
  --drawer-title:#2a3f5f;
  --drawer-focus:#2563eb;
  --drawer-focus-soft:rgba(37,99,235,.12);
  --selected-text:#0f3f91;
  --danger-border:#fecaca;
  --danger-surface:#fff1f0;
  --danger-text:#b91c1c;
  --missing-text:#8a97a8;
  --missing-surface:#f8fafc;
  --missing-border:#d2dce8;
  --option-bg:#ffffff;
  --option-text:#102a43;
  --option-muted-bg:#eef3f8;
  --option-muted-text:#6b7a8c;
  --option-selected-bg:#b8d8ff;

  --hover-border:rgba(15,23,42,.22);
  --hover-text:#111827;
  --z-drawer:20;

}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{width:100%;min-height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif}
body{font-size:14px}
a{color:var(--blue);text-decoration:none;text-underline-offset:3px}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
.wrap{padding:14px 18px 18px}
.view-switch,.panel,.box{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.view-switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;margin-bottom:14px}
.view-copy{color:var(--muted);font-size:13px}
.review-label{display:inline-flex;align-items:center;margin-right:8px;padding:2px 7px;border:1px solid var(--line-strong);border-radius:999px;color:var(--text);font-weight:760;letter-spacing:.01em}
.view-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.view-tabs{display:flex;gap:6px;align-items:center}
.view-btn{height:32px;border:1px solid var(--line-strong);background:var(--panel-soft);border-radius:6px;color:var(--text);padding:0 12px;font-weight:650;cursor:pointer}
.view-btn:hover{background:var(--panel-strong);border-color:var(--muted)}
.view-tabs a.view-btn{display:inline-flex;align-items:center;text-decoration:none}
.view-btn.active{border-color:var(--blue);background:var(--blue-soft);color:var(--selected-text)}
.segmented{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:7px;background:var(--panel-soft);padding:2px}
.segmented-option{min-width:86px;height:28px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--body);padding:0 9px;font:inherit;font-size:12px;font-weight:720;cursor:pointer}
.segmented-option:hover{background:var(--panel-strong);color:var(--text)}
.segmented-option[aria-pressed="true"]{border-color:var(--focus);background:var(--blue-soft);color:var(--selected-text);box-shadow:0 0 0 1px var(--focus)}
.segmented-option:focus-visible{position:relative;z-index:1;outline-color:var(--focus-ring)}
.range-stats-toggle[aria-pressed="true"],.holding-check-toggle[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--selected-text)}
.all-results{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px}
.all-results-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.all-results-title{font-weight:780;font-size:15px}.all-results-note{color:var(--muted);font-size:12px}
.all-results-controls{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px}
.controls-drawer{position:fixed;z-index:var(--z-drawer);top:84px;right:16px;width:min(456px,calc(100vw - 32px));height:calc(100dvh - 100px);max-height:calc(100vh - 100px);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;background:var(--drawer-bg);border:1px solid var(--line-strong);border-radius:10px;box-shadow:-4px 0 8px rgba(0,0,0,.16);transform:translateX(0);transition:transform 180ms cubic-bezier(.2,.8,.2,1);will-change:transform}
.controls-drawer[data-open="false"]{transform:translateX(calc(100% + 18px));pointer-events:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.drawer-head h2{margin:0;font-size:15px;line-height:1.2;color:var(--drawer-title)}
.drawer-copy{margin-top:3px;color:var(--muted);font-size:12px;line-height:1.4}
.drawer-collapse,.controls-open-tab{border:1px solid var(--line-strong);background:var(--panel-soft);color:var(--text);cursor:pointer;font:inherit;font-weight:780}
.drawer-collapse{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:6px;font-size:15px}
.drawer-collapse:hover,.controls-open-tab:hover{background:var(--panel-strong);border-color:var(--muted)}
.controls-open-tab{position:fixed;z-index:var(--z-drawer-tab);right:0;top:calc(84px + 8px);display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px 0 8px;border-radius:7px 0 0 7px;border-right:0;font-size:12px;box-shadow:-3px 0 8px rgba(0,0,0,.10)}
.controls-open-tab[hidden]{display:none}
.controls-drawer .controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start;overflow:auto;overscroll-behavior:contain;padding:12px;margin:0;border:0;background:transparent}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
#segmentField[hidden]{display:none}
.field--wide{grid-column:span 2}
.controls-drawer .field--wide{grid-column:span 1}
.controls-drawer .drawer-span-two{grid-column:1 / -1}
label{font-size:12px;color:var(--muted)}
.controls-drawer label{color:var(--drawer-title);font-weight:700}
select,input{height:32px;border:1px solid var(--line-strong);border-radius:6px;background:var(--panel-soft);color:var(--text);font-size:13px;padding:0 8px;min-width:0}
select:hover,input:hover{border-color:var(--muted)}
.controls-drawer select,.controls-drawer input{background:var(--drawer-control-bg)}
.controls-drawer select:focus,.controls-drawer input:focus,.controls-drawer select:focus-visible,.controls-drawer input:focus-visible{outline:none;border-color:var(--drawer-focus);background:var(--drawer-focus-soft);box-shadow:0 0 0 2px rgba(116,181,255,.32)}
input::placeholder{color:var(--muted)}
select.missing-selection{color:var(--missing-text);background:var(--missing-surface);border-color:var(--missing-border)}
select option{color:var(--option-text)!important;background:var(--option-bg)!important}
select option.missing-option,select option.no-trade-option{color:var(--option-muted-text)!important;background:var(--option-muted-bg)!important}
select option:checked{color:var(--option-selected-text)!important;background:var(--option-selected-bg)!important}
.status{grid-column:1 / -1;display:none;border:1px solid var(--danger-border);background:var(--danger-surface);color:var(--danger-text);border-radius:8px;padding:9px 11px}
.selection-card{margin:12px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel-soft)}
.selection-card-title{margin-bottom:5px;color:var(--muted);font-size:12px;font-weight:760}
.selection-summary{color:var(--body);font-size:12px;line-height:1.55}
.detail-layout{display:grid;grid-template-columns:minmax(720px,1fr) minmax(450px,480px);gap:14px;align-items:start}
.panel{overflow:hidden}
.param-panel{margin-top:14px}
.param-grid{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:10px}
.param-item{border:1px solid var(--line-soft);border-radius:8px;padding:10px;background:var(--panel-soft)}
.param-name{font-weight:760;margin-bottom:5px}
.param-desc{color:var(--body);font-size:13px;line-height:1.55}
.chart-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.chart-title{font-weight:760}
.subtle{font-size:13px;color:var(--muted);line-height:1.45}
#chart{width:100%;height:720px}
.chart-panel{position:relative}
.chart-panel.range-selecting .nsewdrag,.chart-panel.holding-checking .nsewdrag{cursor:crosshair!important}
.range-stats{position:absolute;z-index:10;top:78px;left:14px;width:min(510px,calc(100% - 28px));overflow:hidden;border:1px solid var(--line-strong);border-radius:10px;background:var(--panel);color:var(--text)}
.range-stats-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:15px;font-weight:780}
.range-stats-close{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--muted);font:inherit;font-size:21px;line-height:1;cursor:pointer}
.range-stats-close:hover{background:var(--panel-strong);color:var(--text)}
.range-stats-period{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin:0;padding:10px 12px 5px}
.range-stats-period>div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;min-width:0}
.range-stats-period dt,.range-stat dt{color:var(--muted)}
.range-stats-period dd,.range-stat dd{margin:0;font-variant-numeric:tabular-nums}
.range-stats-period dd{overflow-wrap:anywhere;color:var(--body)}
.range-stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 16px;margin:0;padding:7px 12px 12px}
.range-stat{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.range-stat dd{color:var(--text);font-size:14px;font-weight:740;white-space:nowrap}
.range-stat--empty{visibility:hidden}
.range-value-up{color:var(--green)!important}.range-value-down{color:var(--red)!important}
.holding-check{width:min(560px,calc(100% - 28px))}
.holding-check-time{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 12px 5px;color:var(--body);font-variant-numeric:tabular-nums}
.holding-check-status{font-weight:760;color:var(--text)}
.holding-check-body{display:grid;grid-template-columns:116px minmax(0,1fr);gap:7px 12px;padding:7px 12px 12px;font-size:13px;line-height:1.42}
.holding-check-body dt{color:var(--muted)}
.holding-check-body dd{margin:0;color:var(--text);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.holding-check-body .holding-check-note{grid-column:1 / -1;padding-top:2px;color:var(--body)}
.side{display:flex;flex-direction:column;gap:12px}
.side .side-inspection{position:static;top:auto;left:auto;width:100%;margin:0;box-shadow:none}
.box{padding:13px}
.box h2{font-size:17px;line-height:1.25;margin:0 0 10px}
.reason-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.reason-head h2{margin:0}
.reason-panel[hidden]{display:none}
.trade-metrics{display:flex;flex-wrap:wrap;align-items:stretch;gap:7px;margin:0 0 10px}
.trade-metric{display:inline-flex;align-items:center;min-width:0;min-height:28px;padding:4px 8px;border:1.4px solid currentColor;border-radius:4px;background:var(--panel-soft);font-size:12px;font-weight:650;line-height:1.3;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.trade-metric--stack{display:grid;gap:1px}
.trade-metric--red{color:var(--red)}
.trade-metric--purple{color:var(--purple)}
.trade-metric--orange{color:var(--orange)}
.trade-metric--green{color:var(--green)}
.trade-picker{border:1px solid var(--line-strong);background:var(--panel-soft);border-radius:8px;padding:8px;margin-bottom:12px}
.trade-picker select{width:100%;min-width:420px;max-width:100%;height:36px;border-color:var(--line-strong);background:var(--panel-soft);font-weight:650}
.step{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:13px;line-height:1.5}
.step:first-of-type{border-top:0}
.num{width:20px;height:20px;border-radius:50%;background:var(--blue-soft);color:#a9d3ff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:760}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:13px;line-height:1.5}
.baseline-line{font-size:13px;color:var(--body);line-height:1.55}
.shapelayer,.shapelayer *,.annotation,.annotation *{pointer-events:none!important}
.hoverlayer .hovertext .bg,.hoverlayer .hovertext rect,.hoverlayer .hovertext path{fill:var(--hover-bg)!important;fill-opacity:var(--hover-opacity)!important;stroke:var(--hover-border)!important;stroke-opacity:1!important}
.hoverlayer .hovertext text{fill:var(--hover-text)!important}
:root[data-theme="light"] .param-item{background:#fbfdff}
:root[data-theme="light"] .view-btn.active{border-color:#1d4ed8;background:#eff6ff;color:#0f3f91}
:root[data-theme="light"] .trade-picker{border-color:#d9e5f2;background:linear-gradient(180deg,#f8fbff 0%,#fff 100%)}
:root[data-theme="light"] .trade-picker select{border-color:#a9bed4;background:#fff}
:root[data-theme="light"] .trade-metric--red{color:#991b1b}
:root[data-theme="light"] .trade-metric--purple{color:#5b21b6}
:root[data-theme="light"] .trade-metric--orange{color:#9a3412}
:root[data-theme="light"] .trade-metric--green{color:#0d6f36}
:root[data-theme="light"] .step{border-color:#edf2f7}
:root[data-theme="light"] .num{background:#dbeafe;color:#174ea6}
:root[data-theme="light"] .baseline-line{color:#64748b}
:root[data-theme="light"] .hoverlayer .hovertext .bg,:root[data-theme="light"] .hoverlayer .hovertext rect,:root[data-theme="light"] .hoverlayer .hovertext path{stroke-opacity:.45!important}
@media (max-width:1240px){
  .detail-layout{grid-template-columns:1fr}
  .param-grid{grid-template-columns:1fr}
  .trade-picker select{min-width:0}
}
@media (max-width:1180px){
  .all-results-controls{grid-template-columns:repeat(3,minmax(150px,1fr))}
  #chart{height:680px}
}
@media (max-width:680px){
  .wrap{padding:10px}
  .view-switch{align-items:flex-start;flex-direction:column}
  .view-actions{width:100%;justify-content:flex-start}
  .view-tabs{width:100%;flex-wrap:wrap}
  .view-btn{flex:1 1 auto;justify-content:center}
  .theme-segmented{width:100%}
  .segmented-option{flex:1 1 50%}
  .reason-head{align-items:flex-start;flex-direction:column}
  .reason-segmented{width:100%}
  .all-results-head{align-items:flex-start;flex-direction:column}
  .all-results-controls{grid-template-columns:1fr}
  .controls-drawer{top:10px;right:10px;width:calc(100vw - 20px);height:calc(100dvh - 20px);max-height:calc(100vh - 20px)}
  .controls-open-tab{top:16px}
  .chart-head{align-items:flex-start;flex-direction:column}
  #chart{height:620px}
  .range-stats{top:72px;left:10px;width:calc(100% - 20px)}
  .range-stats-period,.range-stats-grid{grid-template-columns:1fr 1fr}
  .range-stats-period>div{grid-template-columns:58px minmax(0,1fr)}
  .range-stat--empty{display:none}
}
@media (prefers-reduced-motion:reduce){.controls-drawer{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="view-switch">
    <div class="view-copy"><span class="review-label">V4 净跌幅回撤逐笔查看</span></div>
    <div class="view-actions">
      <a id="peerReviewLink" class="view-btn" href="#" hidden></a>
      <button id="rangeStatsBtn" class="view-btn range-stats-toggle" type="button" aria-pressed="false">区间统计</button>
      <button id="holdingCheckBtn" class="view-btn holding-check-toggle" type="button" aria-pressed="false">持仓检测</button>
      <div class="segmented theme-segmented" role="group" aria-label="页面主题 Page theme">
        <button id="darkThemeBtn" class="segmented-option" type="button" aria-pressed="true">深色 Dark</button>
        <button id="lightThemeBtn" class="segmented-option" type="button" aria-pressed="false">浅色 Light</button>
      </div>
      <div class="view-tabs">
        <button id="fullBtn" class="view-btn active" type="button">训练/测试整体</button>
        <button id="localBtn" class="view-btn" type="button">局部窗口</button>
        <a id="originalLink" class="view-btn" href="../outcome_native/index.html" target="_blank" rel="noopener">原始HTML</a>
      </div>
    </div>
  </div>

  

  <aside id="controlsDrawer" class="controls-drawer" data-open="true" aria-label="参数选择" aria-hidden="false">
    <div class="drawer-head">
      <div><h2>参数选择</h2><div class="drawer-copy">调整参数后载入真实逐笔结果</div></div>
      <button id="controlsCollapse" class="drawer-collapse" type="button" aria-controls="controlsDrawer" aria-expanded="true" aria-label="收起参数侧边栏">▶</button>
    </div>
    <div class="controls">
    <div class="field field--wide"><label for="methodSelect">BM 开仓基准方法</label><select id="methodSelect"></select></div>
    <div class="field field--wide"><label id="periodLabel" for="periodSelect">N / TR 基准单位</label><select id="periodSelect"></select></div>
    <div class="field"><label id="entryLabel" for="entrySelect">E 开仓窗口</label><select id="entrySelect"></select></div>
    <div class="field field--wide"><label id="historyLabel" for="historySelect">BH 开仓完整 15s TR 原子跨度</label><select id="historySelect"></select></div>
    <div class="field field--wide"><label id="contextLabel" for="contextSelect">TRW 开仓完整 15s TR 原子滚动窗口</label><select id="contextSelect"></select></div>
    <div class="field" style="display:none"><label for="sampleSelect">区间样本数</label><select id="sampleSelect"></select></div>
    <div class="field"><label for="kSelect">K 开仓阈值倍率（k_drop）</label><select id="kSelect"></select></div>
    <div class="field"><label for="absSelect">A 波幅绝对下限（abs_floor_value）</label><select id="absSelect"></select></div>
    
    <div class="field field--wide"><label id="speedWindowLabel" for="speedWindowSelect">S 速度平仓窗口</label><select id="speedWindowSelect"></select></div>
    <div class="field field--wide"><label id="reboundWindowLabel" for="reboundWindowSelect">W 净下跌窗口（连续 15s 执行 bar）</label><select id="reboundWindowSelect"></select></div>
    <div class="field"><label for="reboundMultiplierSelect">M 回撤阈值倍率</label><select id="reboundMultiplierSelect"></select></div>
    <div class="field"><label for="reverseWindowSelect">RVW 反向窗口</label><select id="reverseWindowSelect"></select></div>
    <div class="field"><label for="reverseLimitSelect">RVL 反向上限</label><select id="reverseLimitSelect"></select></div>
    <div id="segmentField" class="field"><label for="segmentSelect">集合</label><select id="segmentSelect"><option value="all">训练+测试</option><option value="train">训练集</option><option value="test">测试集</option></select></div>

function fmt(value, digits=3) {
  const n = Number(value);
  return Number.isFinite(n) ? n.toFixed(digits) : "";
}
function compactNumber(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "";
  return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}
function timeframeUnit(seconds) {
  const value = Number(seconds);
  if (!Number.isFinite(value) || value <= 0) return "bar";
  if (value % 60 === 0) return `${compactNumber(value / 60)}min`;
  return `${compactNumber(value)}s`;
}
function durationFromBars(bars, secondsPerBar) {
  const count = Number(bars);
  const seconds = count * Number(secondsPerBar);
  if (!Number.isFinite(seconds)) return "";
  if (seconds % 60 === 0) return `${compactNumber(seconds / 60)}min`;
  return `${compactNumber(seconds)}s`;
}
function executionBarsLabel(value) {
  const bars = Number(value);
  if (!Number.isFinite(bars)) return "未提供";
  return subminuteExecution
    ? `${durationFromBars(bars, executionBarSeconds)} / ${compactNumber(bars)}×${timeframeUnit(executionBarSeconds)} bar`
    : `${compactNumber(bars)} bar`;
}
function volatilityBarsLabel(value, suffix="TR") {
  const bars = Number(value);
  if (!Number.isFinite(bars)) return "未提供";
  return subminuteExecution
    ? `${durationFromBars(bars, volatilityTrBarSeconds)} / ${compactNumber(bars)}×${timeframeUnit(volatilityTrBarSeconds)} ${suffix}`
    : `${compactNumber(bars)} bar`;
}
function recordedNumber(value) {
  if (value === null || value === undefined || value === "") return NaN;
  const n = Number(value);
  return Number.isFinite(n) ? n : NaN;
}
function fmtRecorded(value, digits=3) {
  const n = recordedNumber(value);
  return Number.isFinite(n) ? n.toFixed(digits) : "未记录";
}
function booleanFlag(value) {
  if (value === true || value === 1 || String(value).toLowerCase() === "true" || String(value) === "1") return true;
  if (value === false || value === 0 || String(value).toLowerCase() === "false" || String(value) === "0") return false;
  return null;
}
function pct(value, digits=2) {
  const n = Number(value);
  return Number.isFinite(n) ? `${(n * 100).toFixed(digits)}%` : "";
}
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
}

function frozenIntervalLabel(startIndex, endIndex) {
  const start = Number(startIndex);
  const end = Number(endIndex);
  if (!Number.isFinite(start) || !Number.isFinite(end) || end < start) return "未记录";
  const intervals = Math.max(0, Math.round(end - start));
  let remaining = Math.max(0, Math.round(intervals * executionBarSeconds));
  const hours = Math.floor(remaining / 3600);
  remaining -= hours * 3600;
  const minutes = Math.floor(remaining / 60);
  const seconds = remaining - minutes * 60;
  const parts = [];
  if (hours) parts.push(`${hours}小时`);
  if (minutes) parts.push(`${minutes}分`);
  if (seconds || !parts.length) parts.push(`${seconds}秒`);
  return `${parts.join("")}（${intervals} 个 ${timeframeUnit(executionBarSeconds)} 间隔）`;
}

function rangeSelectionBounds(event, state) {

          : Number.NaN)
      : Number.isFinite(recordedHistoryEnd) && recordedHistoryEnd >= 0
        ? recordedHistoryEnd
        : latestBaselineEnd;
    const historyStartX = indexToVisibleX(historyStart, range);
    const historyEndX = indexToVisibleX(historyEnd, range);
    const activeRanges = activeHistoryRanges(fa.activeSession, historyStart, historyEnd, range);
    const baselineFillShapes = activeRanges.length
      ? activeRanges.flatMap(item => cleanShapes([xRangeFill(item.startX, item.endX, theme.baselineFill)]))

      ? activeRanges.flatMap(item => cleanShapes([xRangeHighlight(item.startX, item.endX, theme.baselineOutline)]))
      : baselineHistoryHoverShapes(historyStartX, historyEndX);
    const highPrice = Number(selectedInView.entry_signal_high_price ?? selectedInView.signal_high_price);
    const lowPrice = Number(selectedInView.entry_signal_low_price ?? selectedInView.signal_low_price);
    const labelX = Math.min(range.idx.length - 1, (lowX ?? entryX ?? 0) + Math.max(24, Math.round(range.idx.length * .025)));
    const signalBand = xRangeBand(signalStartX, signalEndX, theme.signalFill);
    const signalGuideLines = cleanShapes([
      signalStartX != null ? {type:"line",xref:"x",yref:"y",x0:signalStartX,x1:labelX,y0:highPrice,y1:highPrice,line:{color:theme.red,width:1.6,dash:"solid"}} : null,

      shapes.push(...cleanShapes([

    }
    const theoreticalEntryPrice = Number(selectedInView.entry_price);
    currentHighlightSets = {
      drop_points: cleanShapes([

      rebound_anchor: cleanShapes([circleShape(reboundAnchorX, reboundAnchorPrice, range, theme.red), vline(reboundAnchorX, theme.signalOutline)]),

      rebound_baseline: cleanShapes([reboundWindowGuide]),
      rebound_threshold: cleanShapes([reboundThresholdGuide, circleShape(exitX, reboundTriggerPrice, range, theme.orange)]),
      rebound_check: cleanShapes([reboundCheckGuide, circleShape(reboundLowX, reboundLowPrice, range, theme.green), circleShape(exitX, reboundCheckPrice, range, theme.green)]),
      entry: cleanShapes([circleShape(entryX, Number(selectedInView.entry_price), range, theme.green), vline(entryX, theme.greenOutline)]),
      exit_point: cleanShapes([circleShape(exitX, Number(selectedInView.exit_price), range, theme.ink), vline(exitX, theme.exitGuide), {type:"line",xref:"x",yref:"y",x0:entryX,x1:exitX,y0:Number(selectedInView.entry_price),y1:Number(selectedInView.exit_price),line:{color:theme.blue,width:3,dash:"solid"}}]),
      phase_signal: [],
      phase_baseline: cleanShapes([...baselineHoverShapes, xRangeHighlight(reboundBaselineStartX, reboundBaselineEndX, theme.baselineOutline)]),
      phase_threshold: cleanShapes([xRangeHighlight(signalStartX, signalEndX, theme.orangeOutline), reboundThresholdGuide])
    };
    currentHighlightAnnotationSets = {
      drop_points: cleanShapes([
        pointPriceAnnotation(highX, highPrice, `最高价 ${fmt(highPrice,4)}`, theme.orange, theme.orangeText, theme.annotationBg, "above"),
        pointPriceAnnotation(entryX, theoreticalEntryPrice, `理论成交价 ${fmt(theoreticalEntryPrice,4)}`, theme.green, theme.ink, theme.annotationBg, "below")
      ])
    };
  } else {
    currentHighlightSets = {};
    currentHighlightAnnotationSets = {};
  }
  currentRangeSelectionShapes = [];
  currentHoldingShapes = [];
  currentHoldingAnnotations = [];
  currentBaseShapes = shapes.slice();
  currentBaseAnnotations = annotations.slice();
  const layout = {
    template:theme.template,
    height:720,
    margin:{l:56,r:118,t:24,b:116,pad:0},
    font:{color:theme.body,family:"Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif"},
      hovermode:"closest",
      hoversubplots:"axis",
      dragmode:rangeStatsEnabled ? "select" : "zoom",
      selectdirection:"h",
      newselection:{line:{color:"rgba(0,0,0,0)",width:0}},
      activeselection:{fillcolor:theme.rangeSelectionFill,opacity:1},
    spikedistance:-1,
    hoverdistance:3,
    showlegend:true,
    legend:{orientation:"h",yanchor:"top",y:-0.13,xanchor:"left",x:0,entrywidth:0.32,entrywidthmode:"fraction",font:{size:11,color:theme.body}},
    xaxis:{domain:[0,1],anchor:"free",position:0,range:initialViewport,fixedrange:false,tickmode:"array",tickvals:tick.vals,ticktext:tick.text,rangeslider:{visible:false},showgrid:false,zeroline:false,showspikes:true,spikemode:"across",spikesnap:"cursor",spikecolor:theme.spike,spikethickness:theme.axisShowLine ? 1.4 : 1,showticklabels:true,tickfont:{color:theme.body},showline:theme.axisShowLine,linecolor:theme.axis,linewidth:1.2},
    yaxis:{domain:[0,1],title:{text:"price",font:{color:theme.body}},tickformat:".2f",fixedrange:true,showgrid:true,gridcolor:theme.grid,zeroline:false,anchor:"x",tickfont:{color:theme.body},showline:theme.axisShowLine,linecolor:theme.axis,linewidth:1.2},
    yaxis2:{title:{text:"capital",font:{color:theme.body}},overlaying:"y",side:"right",fixedrange:true,showgrid:false,zeroline:false,tickfont:{color:theme.body},showline:theme.axisShowLine,linecolor:theme.axis,linewidth:1.2},
    paper_bgcolor:theme.paper,
    plot_bgcolor:theme.plot,
    hoverlabel:{bgcolor:theme.hoverBg,bordercolor:theme.hoverBorder,font:{color:theme.hoverText}},
    shapes,
    annotations
  };
  const plotPromise = Plotly.react("chart", data, layout, {responsive:true,displaylogo:false,displayModeBar:false,scrollZoom:true,doubleClick:false});
  const gd = document.getElementById("chart");
  gd._dropValueHoverTheme = theme;
  gd._dropValueRenderedRange = range;
  gd._dropValueCandleState = {
    x,idx,open,high,low,close,limit:candleLimit,
    displayStep:candles.step,
    displayedX:candles.x.slice(),
    displayedHigh:candles.high.slice(),
    displaySourceEndX:candles.sourceEndX.slice(),
    currentKey:`0:${Math.max(0, x.length - 1)}:${candles.step}`
  };
  bindCandleDetailRefresh();
  bindZoomReset(range);
  bindTradePointClicks();
  bindHoverLabelStyle();
    bindReasonHighlights();
    bindRangeStatsSelection();
    bindHoldingCheckClick();
  const originalBase = String(combo.original_html_base || "../outcome_native/index.html");
  els.originalLink.hidden = originalBase === "__hidden__";
  if (!els.originalLink.hidden) {
    const originalJoin = originalBase.includes("?") ? "&" : "?";
    els.originalLink.href = `${originalBase}${originalJoin}combo_id=${encodeURIComponent(combo.combo_id)}&view=combined&segment=${encodeURIComponent(els.segment.value || "all")}`;
  }
  return Promise.resolve(plotPromise).then(() => fitVisibleCandles(initialViewport[0], initialViewport[1]));
}
async function update() {
  if (!features) {
    els.status.style.display = "block";
    els.status.textContent = "process_payload.js 加载失败。";
    return;
  }
  const selectedReboundWindow = els.reboundWindow.value;
  const selectedReboundMultiplier = els.reboundMultiplier.value;
  const selectedSpeedWindow = els.speedWindow.value;
  const selectedHistory = els.history.value;
  const selectedContext = els.context.value;
  const selectedSample = els.sample.value;
  const selectedReverseWindow = els.reverseWindow.value;
  const selectedReverseLimit = els.reverseLimit.value;
  fillHistory(selectedHistory);
  fillContext(selectedContext);
  fillSample(selectedSample);
  fillSpeedWindow(selectedSpeedWindow);
  fillReboundWindow(selectedReboundWindow);
  fillReboundMultiplier(selectedReboundMultiplier);
  fillReverseWindow(selectedReverseWindow);
  fillReverseLimit(selectedReverseLimit);
  markMissingOptions();
  fullViewDetailTrade = null;
  currentCombo = findCombo();
  updatePeerReviewLink(currentCombo);
  if (!currentCombo) {
    els.status.style.display = "block";
    els.status.textContent = "当前参数没有匹配组合；灰色选项仍可选择，用于检查缺失参数。";
    renderPhase(null);
    return;
  }
  els.status.style.display = "none";
  try {
    currentTrades = await loadTrades(currentCombo);
  } catch (error) {
    els.status.style.display = "block";
    els.status.textContent = error.message || String(error);
    currentTrades = [];
  }
  const segmentRows = selectedSegmentTrades(currentTrades);
  selectedTrade = chooseTrade(segmentRows);
  drawChart(currentCombo, currentTrades, selectedTrade);
  if (window.parent !== window) {
    window.parent.postMessage(
      {type: "short-drop-trade-explain-ready", combo_id: currentCombo.combo_id},
      "*"
    );
  }
}
function init() {
  initControlsDrawer();
  updateThemeControls();
  selectReasonMode(reasonMode, false);
  els.darkTheme.addEventListener("click", () => {
    if (currentTheme !== "dark") void selectTheme("dark");
  });
  els.lightTheme.addEventListener("click", () => {
    if (currentTheme !== "light") void selectTheme("light");
  });
  els.rangeStatsToggle.addEventListener("click", () => setRangeStatsMode(!rangeStatsEnabled));
  els.rangeStatsClose.addEventListener("click", () => setRangeStatsMode(false));
  els.holdingCheckToggle.addEventListener("click", () => setHoldingCheckMode(!holdingCheckEnabled));
  els.holdingCheckClose.addEventListener("click", () => setHoldingCheckMode(false));
  els.entryReasonBtn.addEventListener("click", () => selectReasonMode("entry"));
  els.exitReasonBtn.addEventListener("click", () => selectReasonMode("exit"));
  if (allResultsCatalog) {
    els.fullBtn.classList.toggle("active", viewMode === "full");
    els.localBtn.classList.toggle("active", viewMode === "local");
    els.fullBtn.addEventListener("click", () => {
      viewMode = "full";
      fullViewDetailTrade = null;
      els.fullBtn.classList.add("active");
      els.localBtn.classList.remove("active");
      if (currentCombo) drawChart(currentCombo, currentTrades, selectedTrade);
    });
    els.localBtn.addEventListener("click", () => {
      viewMode = "local";
      fullViewDetailTrade = null;
      els.localBtn.classList.add("active");
      els.fullBtn.classList.remove("active");
      if (currentCombo) drawChart(currentCombo, currentTrades, selectedTrade);
    });
    void initAllResultsCatalog();
    return;
  }
  if (!features) return update();
  if (unifiedN1) {
    els.periodLabel.textContent = subminuteExecution ? "N / TR 基准单位" : "N 基准单位";
    els.entryLabel.textContent = subminuteExecution ? `E 开仓窗口（${timeframeUnit(executionBarSeconds)} 执行）` : "E 开仓窗口";
    els.historyLabel.textContent = `BH 开仓完整 ${timeframeUnit(volatilityTrBarSeconds)} TR 原子跨度`;
    els.contextLabel.textContent = `TRW 开仓完整 ${timeframeUnit(volatilityTrBarSeconds)} TR 原子滚动窗口`;
    els.speedWindowLabel.textContent = subminuteExecution ? `S 速度窗口（${timeframeUnit(executionBarSeconds)} 执行）` : "S 速度平仓窗口";
    els.reboundWindowLabel.textContent = subminuteExecution ? `W 净下跌窗口（连续 ${timeframeUnit(executionBarSeconds)} 执行 bar）` : "W 回撤 TR 窗口";
  }
  fillMethod(features.entry_baseline_method);
  fillSelect(els.period, uniqueValues("period"), value => unifiedN1
    ? (subminuteExecution ? `${value}N / ${timeframeUnit(volatilityTrBarSeconds)} TR / ${timeframeUnit(executionBarSeconds)} 执行` : `${value}N / ${value} bar`)
    : String(value));
  fillEntry(DEFAULT_PARAMS.entry_window_multiplier);
  fillHistory(DEFAULT_PARAMS.baseline_history_multiplier);
  fillContext(DEFAULT_PARAMS.baseline_window_multiplier);
  fillSample(DEFAULT_PARAMS.baseline_sample_count_target);
  fillSelect(els.k, uniqueValues("k_drop"));
  fillSelect(els.abs, uniqueValues("abs_floor"));
  fillSelect(els.daily, uniqueValues("daily_floor_mult"));
  fillSpeedWindow(DEFAULT_PARAMS.exit_wait_bars);
  fillReboundWindow(DEFAULT_PARAMS.rebound_tr_window_bars);
  fillReboundMultiplier(DEFAULT_PARAMS.rebound_multiplier);
  fillDateFilters();
  fillReverseWindow(DEFAULT_PARAMS.reverse_up_window_multiplier);
  fillReverseLimit(DEFAULT_PARAMS.reverse_up_limit_multiplier);
  const comboId = params.get("combo_id");
  const preferred = comboId ? (features.combos || []).find(c => c.combo_id === comboId) : defaultCombo();
  if (preferred) {
    els.period.value = String(preferred.period);
    els.entryWindow.value = String(preferred.entry_window_multiplier);
    els.history.value = String(preferred.baseline_history_multiplier);
    els.context.value = String(preferred.baseline_window_multiplier ?? "");
    els.sample.value = String(preferred.baseline_sample_count_target ?? "");
    els.k.value = String(preferred.k_drop);
    els.abs.value = String(preferred.abs_floor);
    els.daily.value = String(preferred.daily_floor_mult);
    els.speedWindow.value = String(preferred.exit_wait_bars ?? "");
    els.reboundWindow.value = String(preferred.rebound_tr_window_bars ?? "");
    els.reboundMultiplier.value = String(preferred.rebound_multiplier ?? "");
    els.reverseWindow.value = String(preferred.reverse_up_window_multiplier);
    els.reverseLimit.value = String(preferred.reverse_up_limit_multiplier);
  }
  fillEntry(preferred?.entry_window_multiplier ?? DEFAULT_PARAMS.entry_window_multiplier);
  fillHistory(preferred?.baseline_history_multiplier ?? DEFAULT_PARAMS.baseline_history_multiplier);
  fillContext(preferred?.baseline_window_multiplier ?? DEFAULT_PARAMS.baseline_window_multiplier);
  fillSample(preferred?.baseline_sample_count_target ?? DEFAULT_PARAMS.baseline_sample_count_target);
  fillSpeedWindow(preferred?.exit_wait_bars ?? DEFAULT_PARAMS.exit_wait_bars);
  fillReboundWindow(preferred?.rebound_tr_window_bars ?? DEFAULT_PARAMS.rebound_tr_window_bars);
  fillReboundMultiplier(preferred?.rebound_multiplier ?? DEFAULT_PARAMS.rebound_multiplier);
  fillReverseWindow(preferred?.reverse_up_window_multiplier ?? DEFAULT_PARAMS.reverse_up_window_multiplier);

  [els.startDate, els.endDate].forEach(select => select.addEventListener("change", update));

}
