<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V4 统一综合分析</title>
<style>
:root{--bg:#f3f6fa;--panel:#fff;--subtle:#f7f9fc;--ink:#132238;--muted:#52677f;--line:#d5dfeb;--strong:#aab9ca;--accent:#185fb8;--accent-ink:#fff;--soft:#eaf3ff;--good:#087744;--bad:#a84d0b;--focus:color-mix(in srgb,var(--accent) 34%,transparent)}[data-theme=dark]{--bg:#10161e;--panel:#151d27;--subtle:#111821;--ink:#e8f1fb;--muted:#aabbd0;--line:#334050;--strong:#53657a;--accent:#72b7ff;--accent-ink:#071321;--soft:#172a3e;--good:#75d9a4;--bad:#ffbd7b;--focus:color-mix(in srgb,var(--accent) 42%,transparent)}*{box-sizing:border-box}html{color-scheme:light}html[data-theme=dark]{color-scheme:dark}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,select{font:inherit}.shell{max-width:1580px;margin:auto;padding:22px 20px 48px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:16px}.page-title{min-width:0}.page-title h1{margin:0;font-size:23px;line-height:1.25;letter-spacing:-.02em;text-wrap:balance}.page-title p{max-width:72ch;margin:5px 0 0;color:var(--muted);text-wrap:pretty}.theme,.segmented button,.rank-link,select{min-height:36px;border:1px solid var(--strong);border-radius:7px;background:var(--panel);color:var(--ink)}.theme,.segmented button{padding:7px 11px;cursor:pointer}.theme:hover,.segmented button:hover,select:hover{border-color:var(--accent)}.theme:focus-visible,.segmented button:focus-visible,select:focus-visible,.rank-link:focus-visible,th button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.theme{flex:0 0 auto}.cards{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;margin-bottom:14px}.metric{min-height:92px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.metric-label{display:block;color:var(--muted);font-size:12px;font-weight:650}.metric b{display:block;margin-top:5px;font-size:20px;line-height:1.2;overflow-wrap:anywhere}.metric small{display:block;margin-top:6px;color:var(--muted);font-size:12px}.control-panel{margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.control-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:13px 15px;border-bottom:1px solid var(--line)}.control-head h2,.contract-head h2{margin:0;font-size:16px;line-height:1.35;text-wrap:balance}.control-head p{max-width:70ch;margin:3px 0 0;color:var(--muted);font-size:12px}.control-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px;padding:12px}.control-group{min-width:0;margin:0;padding:10px 11px 11px;background:var(--subtle);border:1px solid var(--line);border-radius:9px}.control-group legend{padding:0 4px;color:var(--muted);font-size:12px;font-weight:700}.control-group.method{grid-column:span 3}.control-group.scenario{grid-column:span 5}.control-group.slice{grid-column:span 4}.control-group.metric-axis,.control-group.count-axis{grid-column:span 6}.control-note{display:block;margin:7px 1px 0;color:var(--muted);font-size:11px;line-height:1.35}.segmented{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}.segmented button{flex:0 1 auto;background:var(--panel);transition:border-color 160ms ease-out,background-color 160ms ease-out,color 160ms ease-out}.segmented button.active{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:720}.method-select{width:100%;padding:7px 30px 7px 10px}.summary{min-height:45px;padding:11px 14px;background:var(--soft);border-top:1px solid var(--line);color:var(--ink)}.summary strong{font-weight:740}.summary-detail{display:block;margin-top:2px;color:var(--muted);font-size:12px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}table{border-collapse:collapse;min-width:100%;width:max-content}th,td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}th{position:sticky;top:0;z-index:1;background:var(--panel)}th:first-child,td:first-child,th:last-child,td:last-child{text-align:left}th button{border:0;background:transparent;color:inherit;padding:0;font-weight:720;cursor:pointer}.rank-link{display:inline-flex;align-items:center;justify-content:center;padding:6px 9px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:720;text-decoration:none}.combo{display:inline-block;max-width:185px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;color:var(--accent);font-family:ui-monospace,Consolas,monospace}.yes{color:var(--good);font-weight:720}.no{color:var(--bad);font-weight:720}.empty{padding:42px 24px;text-align:center}.empty h2{margin:0 0 5px;font-size:16px}.empty p{max-width:58ch;margin:0 auto;color:var(--muted)}.contract-panel{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.contract-head{padding:12px 14px;border-bottom:1px solid var(--line)}.contract-panel .table-wrap{border:0;border-radius:0}.contract-panel th{position:static;color:var(--muted)}@media(max-width:1050px){.control-group.method,.control-group.slice{grid-column:span 6}.control-group.scenario{grid-column:span 12}.control-group.metric-axis,.control-group.count-axis{grid-column:span 6}}@media(max-width:720px){.shell{padding:15px 11px 36px}.page-head,.control-head{align-items:stretch;flex-direction:column;gap:10px}.theme{align-self:flex-start}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.control-group.method,.control-group.scenario,.control-group.slice,.control-group.metric-axis,.control-group.count-axis{grid-column:span 12}.segmented button{flex:1 1 140px}}@media(max-width:430px){.cards{grid-template-columns:1fr}.segmented button{flex-basis:100%}}@media(prefers-reduced-motion:reduce){.segmented button{transition:none}}
</style></head><body><main class="shell"><header class="page-head"><div class="page-title"><h1>V4 统一综合分析</h1><p>情景、策略范围、排序指标与交易数门槛彼此独立；每次选择都形成可追溯的训练样本排名。</p></div><button class="theme" id="theme" type="button">深色 Dark</button></header><section aria-label="当前分析统计"><div id="cards" class="cards"></div></section><section id="controls" class="control-panel" aria-labelledby="control-title"><div class="control-head"><div><h2 id="control-title">筛选与排序</h2><p>过滤条件只改变成员集合；排序指标只决定集合内的名次。</p></div></div><div class="control-grid"><fieldset class="control-group method"><legend>开仓方法</legend><select id="method" class="method-select" aria-label="开仓方法"><option value="rolling_tr_sum">滚动 TR 总和</option><option value="tr_average">TR 平均值</option></select><span class="control-note">两种方法维持独立排名。</span></fieldset><fieldset class="control-group scenario"><legend>情景过滤</legend><div id="scenario-controls" class="segmented" role="group" aria-label="情景过滤"></div><span class="control-note">仅筛选事件资格，不改变收益指标。</span></fieldset><fieldset class="control-group slice"><legend>策略范围</legend><div id="slice-controls" class="segmented" role="group" aria-label="策略范围"></div><span class="control-note">3–15 分钟短跌要求 E 与 W 同时属于规定集合。</span></fieldset><fieldset class="control-group metric-axis"><legend>排序指标</legend><div id="metric-controls" class="segmented" role="group" aria-label="排序指标"></div><span class="control-note">按所选训练指标降序排列。</span></fieldset><fieldset class="control-group count-axis"><legend>最低交易数</legend><div id="count-controls" class="segmented" role="group" aria-label="最低交易数"></div><span class="control-note">在其他过滤条件之后应用门槛。</span></fieldset></div><div id="status" class="summary" role="status" aria-live="polite"></div></section><div id="table" class="table-wrap"></div><section id="contract-panel" class="contract-panel"><div class="contract-head"><h2>研究合同</h2></div><div id="contract-table" class="table-wrap"></div></section></main><script src="analysis_data.js"></script><script>
const DATA=window.V4_ANALYSIS_DATA;
(()=>{
  'use strict';
  if(!DATA){document.body.textContent='分析资料未加载';return;}
  let method='rolling_tr_sum',scenarioFilter='none',sliceFilter='all',metric='absolute_return',countFilter='all',sortKey='rank',sortDir=1;
  const $=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])),number=value=>value==null||Number.isNaN(Number(value))?'—':Number(value).toLocaleString(undefined,{maximumFractionDigits:4}),percentage=value=>value==null||Number.isNaN(Number(value))?'—':(Number(value)*100).toFixed(3)+'%',text=value=>value===true?'是':value===false?'否':String(value??'—');
  const methods={rolling_tr_sum:'滚动 TR 总和',tr_average:'TR 平均值'};
  const scenarios=[['none','无情景过滤'],['event_01','仅 event_01'],['event_02','仅 event_02'],['both_and','event_01 与 event_02']];
  const slices=[['all','全策略'],['short_drop_3_15m','3–15 分钟短跌']];
  const metrics=[['absolute_return','总收益'],['average_trade','笔均收益']];
  const counts=[['all','不限'],['ge10','至少 10 笔'],['ge20','至少 20 笔']];
  const columns=[['rank','当前排名'],['e','E'],['bh','BH'],['trw','TRW'],['k','K'],['w','W'],['m','M'],['train_return','总收益'],['train_avg_trade','笔均'],['train_trade_count','笔数'],['train_max_drawdown_abs','回撤'],['train_return_excluding_gap_spanning_trades','排除 gap 收益'],['gap_spanning_trade_count','gap 笔数'],['segment_end_exit_count','segment_end'],['high_single_bar_share_ge_0p8_count','单根≥80%'],['signal_single_bar_share_median','单根中位'],['signal_single_bar_share_p95','单根 P95'],['synthetic_signal_trade_count','合成信号'],['event_01_qualified','event_01'],['event_02_qualified','event_02'],['combo_id','参数组合']];
  const label=(items,id)=>items.find(item=>item[0]===id)?.[1]||id;
  const metricKey=()=>metric==='average_trade'?'train_avg_trade':'train_return';
  const minimumTrades=()=>countFilter==='ge20'?20:countFilter==='ge10'?10:0;
  const scenarioQualifies=row=>scenarioFilter==='event_01'?row.event_01_qualified:scenarioFilter==='event_02'?row.event_02_qualified:scenarioFilter==='both_and'?row.event_01_qualified&&row.event_02_qualified:true;
  const sliceQualifies=row=>sliceFilter==='short_drop_3_15m'?row.short_drop_3_15m_member:true;
  const route=row=>String(DATA.nativeTradeRoute||'trade_explain/index.html?combo_id={combo_id}').replace('{combo_id}',encodeURIComponent(row.combo_id));
  function rankedRows(){const key=metricKey();return DATA.rows.filter(row=>row.method===method&&scenarioQualifies(row)&&sliceQualifies(row)&&Number(row.train_trade_count)>=minimumTrades()&&Number.isFinite(Number(row[key]))).sort((a,b)=>Number(b[key])-Number(a[key])||String(a.combo_id).localeCompare(String(b.combo_id))).map((row,index)=>({...row,current_rank:index+1}));}
  function value(row,key){if(key==='rank')return `<a class="rank-link" data-combo-id="${esc(row.combo_id)}" target="_blank" rel="noopener" href="${route(row)}">查看 #${row.current_rank}</a>`;if(key==='combo_id')return `<a class="combo" target="_blank" rel="noopener" title="${esc(row.combo_id)}" aria-label="${esc(row.combo_id)}" href="${route(row)}">${esc(row.combo_id)}</a>`;if(key==='event_01_qualified'||key==='event_02_qualified')return `<span class="${row[key]?'yes':'no'}">${text(row[key])}</span>`;if(key==='train_return'||key==='train_avg_trade'||key==='train_max_drawdown_abs'||key==='train_return_excluding_gap_spanning_trades')return percentage(row[key]);return number(row[key]);}
  function controlButtons(container,items,current,dataName){$(container).innerHTML=items.map(([id,currentLabel])=>`<button type="button" class="${current===id?'active':''}" aria-pressed="${current===id}" data-${dataName}="${id}">${esc(currentLabel)}</button>`).join('');}
  function bindControls(){controlButtons('scenario-controls',scenarios,scenarioFilter,'scenario');controlButtons('slice-controls',slices,sliceFilter,'slice');controlButtons('metric-controls',metrics,metric,'metric');controlButtons('count-controls',counts,countFilter,'count');document.querySelectorAll('[data-scenario]').forEach(node=>node.onclick=()=>{scenarioFilter=node.dataset.scenario;resetRanking();});document.querySelectorAll('[data-slice]').forEach(node=>node.onclick=()=>{sliceFilter=node.dataset.slice;resetRanking();});document.querySelectorAll('[data-metric]').forEach(node=>node.onclick=()=>{metric=node.dataset.metric;resetRanking();});document.querySelectorAll('[data-count]').forEach(node=>node.onclick=()=>{countFilter=node.dataset.count;resetRanking();});}
  function resetRanking(){sortKey='rank';sortDir=1;render();}
  function render(){bindControls();const base=DATA.rows.filter(row=>row.method===method),ranked=rankedRows(),scenarioLabel=label(scenarios,scenarioFilter),sliceLabel=label(slices,sliceFilter),metricLabel=label(metrics,metric),countLabel=label(counts,countFilter),key=metricKey();$('cards').innerHTML=[["可排名组合",number(ranked.length),`方法全集 ${number(base.length)}`],["情景过滤",scenarioLabel,scenarioFilter==='none'?'不限制事件资格':'按已保存资格筛选'],["策略范围",sliceLabel,sliceFilter==='all'?'包含全部 E/W':'E 与 W 同时为 3–15 分钟'],["最高指标值",ranked.length?percentage(ranked[0][key]):'真实空集',`${metricLabel} · ${countLabel}`]].map(([cardLabel,current,detail])=>`<div class="metric"><span class="metric-label">${esc(cardLabel)}</span><b>${esc(current)}</b><small>${esc(detail)}</small></div>`).join('');$('status').innerHTML=`<strong>${esc(methods[method])} · ${esc(scenarioLabel)} · ${esc(sliceLabel)} · ${esc(metricLabel)}降序 · ${esc(countLabel)}</strong><span class="summary-detail">筛选后 ${number(ranked.length)} / ${number(base.length)} 个组合；页面显示前 ${number(Math.min(250,ranked.length))} 行，完整历史排名 CSV 继续保留。</span>`;let rows=[...ranked];rows.sort((a,b)=>{const av=sortKey==='rank'?a.current_rank:a[sortKey],bv=sortKey==='rank'?b.current_rank:b[sortKey];if(av==null&&bv==null)return String(a.combo_id).localeCompare(String(b.combo_id));if(av==null)return 1;if(bv==null)return -1;if(typeof av==='string'||typeof bv==='string')return sortDir*String(av).localeCompare(String(bv));return sortDir*(Number(av)-Number(bv));});if(!rows.length){$('table').innerHTML='<div class="empty"><h2>当前条件形成真实空集</h2><p>可放宽情景过滤、策略范围或最低交易数；已保存结果保持不变。</p></div>';return;}$('table').innerHTML='<table><thead><tr>'+columns.map(([columnKey,columnLabel])=>`<th><button type="button" data-sort="${columnKey}">${columnLabel}${sortKey===columnKey?(sortDir===1?' ▲':' ▼'):''}</button></th>`).join('')+'</tr></thead><tbody>'+rows.slice(0,250).map(row=>'<tr>'+columns.map(([columnKey])=>`<td>${value(row,columnKey)}</td>`).join('')+'</tr>').join('')+'</tbody></table>';document.querySelectorAll('[data-sort]').forEach(node=>node.onclick=()=>{const key=node.dataset.sort;sortDir=sortKey===key?-sortDir:1;sortKey=key;render();});}
  function renderContract(){$('contract-table').innerHTML='<table><tbody>'+[['过滤合同',DATA.filterContract.id],['过滤规则',DATA.filterContract.policy],['参数单位','E/W：15 秒执行 bar；BH/TRW：15 秒 TR 原子；K：方法独立；M：净下跌反弹倍率。'],['情景过滤','none 不限制资格；event_01 与 event_02 各自筛选；两情景使用 AND。情景不改变历史执行。'],['策略范围','全策略或 3–15 分钟短跌成员集合；范围不承担排序职责。'],['排序指标','总收益 train_return 或笔均收益 train_avg_trade，分别降序排列。'],['诊断边界','gap 排除收益、gap 交易、segment_end、单根贡献与合成信号数量全部保留。'],['3–15 分钟短跌合同','E/W 均须属于 12、16……60 个 15 秒 bar（60 秒步长）；两个条件使用 AND。']].map(([rowLabel,current])=>`<tr><th>${esc(rowLabel)}</th><td>${esc(current)}</td></tr>`).join('')+'</tbody></table>';}
  $('method').onchange=()=>{method=$('method').value;resetRanking();};renderContract();render();
  function applyTheme(dark){document.documentElement.dataset.theme=dark?'dark':'';localStorage.setItem('v4-unified-theme',dark?'dark':'light');$('theme').textContent=dark?'浅色 Light':'深色 Dark';}
  applyTheme(localStorage.getItem('v4-unified-theme')==='dark');$('theme').onclick=()=>applyTheme(document.documentElement.dataset.theme!=='dark');
})();
</script></body></html>
