<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>V4.41 场景要求查看器</title>
  <style>
    :root{color-scheme:light;--bg:#eef3f7;--panel:#fff;--soft:#f7fafc;--line:#d5dfe9;--ink:#10233b;--text:#344b66;--muted:#63758c;--focus:#1266b3;--accent:#1266b3;--accent-ink:#fff;--market-1:#2563eb;--market-2:#0f9f75;--market-3:#d97706}
    :root[data-theme="dark"]{color-scheme:dark;--bg:#10161e;--panel:#171f29;--soft:#121923;--line:#354352;--ink:#f2f7fb;--text:#d1dce6;--muted:#9eafc0;--focus:#72b9ff;--accent:#72b9ff;--accent-ink:#07131f;--market-1:#72a7ff;--market-2:#54d8ad;--market-3:#f4b55f}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}body{overflow-x:hidden;font-size:14px}button,select,a{font:inherit}button,a{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--focus) 38%,transparent);outline-offset:2px}
    .shell{max-width:1800px;margin:auto;padding:16px 20px 30px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:12px}h1{margin:0 0 5px;font-size:25px;line-height:1.25;letter-spacing:-.02em}.subtitle{max-width:78ch;color:var(--muted);line-height:1.6}.header-actions,.tool-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}.button,.segmented,.tool,.panel,.rule-panel{border:1px solid var(--line);background:var(--panel)}.button,.segmented button{min-height:38px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--text);padding:7px 12px;font-weight:700;text-decoration:none}.button{display:inline-flex;align-items:center;justify-content:center;border-color:var(--line);background:var(--panel);color:var(--ink)}.button:hover,.segmented button:hover{background:var(--soft)}
    .tool{display:flex;align-items:flex-end;flex-wrap:wrap;gap:12px;padding:12px;border-radius:10px;margin-bottom:12px}.scenario-picker{display:flex;min-width:0;flex:1 1 620px;flex-direction:column;gap:6px}.field-label{font-size:12px;color:var(--muted)}.segmented{display:inline-flex;align-items:stretch;gap:3px;padding:3px;border-radius:9px;flex-wrap:wrap}.segmented button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.field{display:flex;min-width:145px;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted)}select{height:38px;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--soft);color:var(--ink);padding:0 30px 0 8px}
    .rule-panel{display:grid;grid-template-columns:minmax(240px,1.2fr) minmax(0,2.8fr);gap:16px;padding:14px;border-radius:10px;margin-bottom:12px}.rule-summary h2{margin:0 0 5px;font-size:18px}.rule-summary p{margin:0;color:var(--muted);line-height:1.55}.rule-list{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rule{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--soft);color:var(--text);font-weight:700}.rule strong{color:var(--ink)}
    .panel{border-radius:10px;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 14px;border-bottom:1px solid var(--line)}.panel-title{font-size:16px;font-weight:800}.meta{color:var(--muted);font-size:12px;text-align:right}#chart{height:650px;width:100%;touch-action:none}.results{margin-top:12px}.results h2{font-size:17px;margin:0 0 4px}.note{color:var(--muted);line-height:1.5}.scenario-membership{display:flex;gap:7px;flex-wrap:wrap}.membership{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--soft);font-weight:700}.dot{width:9px;height:9px;border-radius:50%}.table-wrap{overflow:auto;overscroll-behavior:contain}table{border-collapse:collapse;width:100%;min-width:980px;font-variant-numeric:tabular-nums}th,td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}th{position:sticky;top:0;background:var(--soft);z-index:1;color:var(--text);font-size:12px}th:first-child,td:first-child{text-align:left}tbody tr:nth-child(even){background:var(--soft)}.source-note{margin-top:12px;padding:10px 2px;color:var(--muted);font-size:12px;line-height:1.55;overflow-wrap:anywhere}
    @media(max-width:900px){.shell{padding:10px}.top{flex-direction:column}.header-actions{align-self:stretch;justify-content:flex-end}.rule-panel{grid-template-columns:1fr}.panel-head{align-items:flex-start;flex-direction:column}.meta{text-align:left}#chart{height:540px}}@media(max-width:580px){h1{font-size:21px}.header-actions{width:100%;display:grid;grid-template-columns:1fr 1fr}.button{width:100%}.scenario-picker{flex-basis:100%}.segmented{width:100%}.segmented button{flex:1 1 calc(50% - 4px)}.field{flex:1}.tool-actions{width:100%}.tool-actions .button{flex:1}#chart{height:460px}.rule{flex:1 1 100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div><h1>V4.41 场景要求查看器</h1><div class="subtitle">使用已保存的行情选区展示场景合同。彩色区域是资格检查区间；图表只解释要求，不改变回测结果。</div></div>
    <div class="header-actions"><a class="button" href="__BACK_HREF__">返回总入口</a><button id="theme" class="button" type="button">深色 Dark</button></div>
  </header>
  <section class="tool" aria-label="场景查看工具">
    <div class="scenario-picker"><span class="field-label">场景</span><div id="scenario-tabs" class="segmented" role="group" aria-label="场景要求"></div></div>
    <div class="field"><label for="resolution">显示精度</label><select id="resolution"><option value="15">15 秒</option><option value="60" selected>1 分钟</option><option value="300">5 分钟</option></select></div>
    <div class="tool-actions"><button id="reset" class="button" type="button">恢复选区范围</button></div>
  </section>
  <section class="rule-panel" aria-labelledby="rule-title">
    <div class="rule-summary"><h2 id="rule-title"></h2><p id="rule-description"></p></div>
    <div id="rule-list" class="rule-list"></div>
  </section>
  <section class="panel"><div class="panel-head"><div class="panel-title" id="chart-title">K200 · 场景行情</div><div id="meta" class="meta"></div></div><div id="chart" role="img" aria-label="展示场景固定行情区间的 K200 K 线图"></div></section>
  <section class="panel results"><div class="panel-head"><div><h2>场景包含的行情</h2><div id="scenario-note" class="note"></div></div><div id="scenario-membership" class="scenario-membership"></div></div><div class="table-wrap"><table><thead><tr><th>行情</th><th>开始时间</th><th>结束时间</th><th>时长</th><th>高点</th><th>低点</th><th>跌幅（点）</th><th>跌幅（%）</th><th>最大不利反弹</th><th>最长未创新低</th></tr></thead><tbody id="segment-body"></tbody></table></div></section>
  <div id="source-note" class="source-note"></div>
</main>
<script src="__PLOTLY_HREF__"></script>
<script src="__PROCESS_PAYLOAD_HREF__"></script>
<script src="scenario_requirements_data.js"></script>
<script>
(()=>{
  'use strict';
  const CONTRACT=window.V4_4_SCENARIO_REQUIREMENTS,FEATURES=window.PROCESS_PAYLOAD?.features,$=id=>document.getElementById(id);
  if(!CONTRACT||!FEATURES||!Array.isArray(FEATURES.datetime)){document.body.textContent='场景要求资料未加载';return;}
  const palette={market_01:'var(--market-1)',market_02:'var(--market-2)',market_03:'var(--market-3)'};
  const plotPalette={light:{paper:'#fff',plot:'#fff',ink:'#10233b',grid:'rgba(75,100,125,.16)',up:'#f6f7f8',down:'#7d8894',line:'#5c6773'},dark:{paper:'#171f29',plot:'#10161e',ink:'#f2f7fb',grid:'rgba(170,190,210,.13)',up:'#1bb57a',down:'#7b8794',line:'#b9c5d1'}};
  const scenarioItems=[['all','全部场景'],...CONTRACT.scenarios.map(row=>[row.scenario_id,row.label_zh])],scenarioMap=new Map(CONTRACT.scenarios.map(row=>[row.scenario_id,row])),segmentMap=new Map(CONTRACT.segments.map(row=>[row.segment_id,row]));
  const requested=new URLSearchParams(location.search).get('scenario');let current=scenarioItems.some(row=>row[0]===requested)?requested:'all',theme=localStorage.getItem('v4-unified-theme')==='dark'?'dark':'light';
  const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const parse=value=>Date.parse(String(value).replace(' ','T')+'+09:00'),chartTime=value=>String(value).replace(' ','T'),chartTimeFromMs=value=>new Date(value+9*3600000).toISOString().slice(0,19),number=(value,digits=2)=>Number(value).toLocaleString(undefined,{minimumFractionDigits:digits,maximumFractionDigits:digits}),pct=value=>(Number(value)*100).toFixed(3)+'%';
  function color(segmentId,alpha=1){const raw=getComputedStyle(document.documentElement).getPropertyValue('--market-'+segmentId.slice(-1)).trim();if(alpha===1)return raw;const hex=raw.startsWith('#')?raw:'#2563eb',r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${alpha})`;}
  function activeSegments(){if(current==='all')return CONTRACT.segments;const scenario=scenarioMap.get(current);return scenario.segment_ids.map(id=>segmentMap.get(id)).filter(Boolean);}
  function activeLabel(){return scenarioItems.find(row=>row[0]===current)?.[1]||'全部场景';}
  function aggregate(rows,seconds){if(seconds===15)return rows;const step=seconds*1000,out=[];let bucket=null,last=null;for(const row of rows){const next=Math.floor(row.ms/step)*step;if(next!==bucket){last={ms:row.ms,time:row.time,open:row.open,high:row.high,low:row.low,close:row.close};out.push(last);bucket=next}else{last.high=Math.max(last.high,row.high);last.low=Math.min(last.low,row.low);last.close=row.close;}}return out;}
  function visibleRows(segments){const padding=30*60*1000,start=Math.min(...segments.map(row=>parse(row.start_time)))-padding,end=Math.max(...segments.map(row=>parse(row.end_time)))+padding,rows=[];for(let index=0;index<FEATURES.datetime.length;index++){const ms=parse(FEATURES.datetime[index]);if(ms<start||ms>end)continue;const open=Number(FEATURES.open[index]),high=Number(FEATURES.high[index]),low=Number(FEATURES.low[index]),close=Number(FEATURES.close[index]);if([open,high,low,close].every(Number.isFinite))rows.push({ms,time:FEATURES.datetime[index],open,high,low,close});}return {start,end,rows:aggregate(rows,Number($('resolution').value))};}
  function renderTabs(){$('scenario-tabs').innerHTML=scenarioItems.map(([id,label])=>`<button type="button" aria-pressed="${id===current}" data-scenario="${esc(id)}">${esc(label)}</button>`).join('');document.querySelectorAll('[data-scenario]').forEach(node=>node.onclick=()=>{current=node.dataset.scenario;history.replaceState(null,'','?scenario='+encodeURIComponent(current));render();});}
  function renderRules(){const rule=CONTRACT.qualification_rule,scenario=current==='all'?null:scenarioMap.get(current),count=scenario?scenario.segment_ids.length:CONTRACT.segments.length;$('rule-title').textContent=current==='all'?'全部场景要求总览':scenario.label_zh+'资格要求';$('rule-description').textContent=current==='all'?'情景一与情景二各检查一段行情；情景三要求三段行情同时合格。':`${scenario.label_zh} 包含 ${count} 段行情，aggregation=${scenario.aggregation}。`;$('rule-list').innerHTML=[['检查区间','(开始, 结束]'],['区间内开仓',String(rule.required_entry_count)+' 次'],['区间内平仓',String(rule.required_exit_count)+' 次'],['结束时状态',rule.must_hold_past_segment_end?'继续持仓':'不限'],['后续退出','回撤或速度']].map(([label,value])=>`<span class="rule"><strong>${esc(label)}</strong> · ${esc(value)}</span>`).join('');}
  function renderTable(segments){$('segment-body').innerHTML=segments.map(row=>`<tr><td><span class="membership"><span class="dot" style="background:${color(row.segment_id)}"></span>${esc(row.label_zh)}</span></td><td>${esc(row.start_time)}</td><td>${esc(row.end_time)}</td><td>${esc(row.duration)}</td><td>${number(row.selected_high)}</td><td>${number(row.selected_low)}</td><td>${number(row.selected_drop_points)}</td><td>${pct(row.selected_drop_rate)}</td><td>${number(row.selected_rebound_points,3)}</td><td>${esc(row.selected_rebound_duration)}</td></tr>`).join('');$('scenario-membership').innerHTML=segments.map(row=>`<span class="membership"><span class="dot" style="background:${color(row.segment_id)}"></span>${esc(row.label_zh)}</span>`).join('');$('scenario-note').textContent=current==='all'?'显示三段唯一行情以及三个场景之间的包含关系。':`${activeLabel()} 的全部行情都必须分别满足同一资格规则。`;}
  function draw(){const segments=activeSegments(),view=visibleRows(segments),rows=view.rows;if(!rows.length){$('chart').textContent='当前 OHLC 中找不到场景时间范围';return;}const p=plotPalette[theme],x=rows.map(row=>chartTime(row.time)),shapes=segments.map(row=>({type:'rect',xref:'x',yref:'paper',x0:chartTime(row.start_time),x1:chartTime(row.end_time),y0:0,y1:1,fillcolor:color(row.segment_id,.14),line:{color:color(row.segment_id),width:2},layer:'below'})),annotations=segments.map(row=>({xref:'x',yref:'paper',x:chartTimeFromMs((parse(row.start_time)+parse(row.end_time))/2),y:1,text:row.label_zh,showarrow:false,yanchor:'bottom',font:{color:color(row.segment_id),size:12},bgcolor:p.paper,bordercolor:color(row.segment_id),borderwidth:1,borderpad:3}));Plotly.react('chart',[{type:'candlestick',name:'K200',x,open:rows.map(row=>row.open),high:rows.map(row=>row.high),low:rows.map(row=>row.low),close:rows.map(row=>row.close),increasing:{line:{color:p.line,width:.8},fillcolor:p.up},decreasing:{line:{color:p.line,width:.8},fillcolor:p.down},whiskerwidth:.45,hoverlabel:{namelength:0}}],{height:innerWidth<580?460:innerWidth<900?540:650,template:theme==='dark'?'plotly_dark':'plotly_white',paper_bgcolor:p.paper,plot_bgcolor:p.plot,font:{color:p.ink},margin:{l:72,r:20,t:42,b:54},showlegend:false,dragmode:'zoom',hovermode:'x unified',shapes,annotations,xaxis:{title:{text:'时间 · Asia/Seoul'},rangeslider:{visible:false},type:'date',range:[chartTimeFromMs(view.start),chartTimeFromMs(view.end)]},yaxis:{gridcolor:p.grid,title:{text:'OHLC'},fixedrange:false}},{responsive:true,displaylogo:false,scrollZoom:true});$('chart-title').textContent='K200 · '+activeLabel();$('meta').textContent=`${rows.length.toLocaleString()} 根显示 K 线 · ${$('resolution').selectedOptions[0].textContent} · 彩色区域为固定资格区间`;}
  function applyTheme(next){theme=next;document.documentElement.dataset.theme=next;localStorage.setItem('v4-unified-theme',next);$('theme').textContent=next==='dark'?'浅色 Light':'深色 Dark';draw();}
  function render(){renderTabs();renderRules();const segments=activeSegments();renderTable(segments);draw();$('source-note').textContent=`场景定义 SHA-256 ${CONTRACT.scenario_definition_sha256} · 市场选定器来源 SHA-256 ${CONTRACT.market_selector_source.sha256} · 图表读取当前逐笔交付的完整 OHLC。`;window.V4_4_SCENARIO_REQUIREMENTS_READY=true;}
  $('theme').onclick=()=>applyTheme(theme==='dark'?'light':'dark');$('resolution').onchange=draw;$('reset').onclick=draw;document.documentElement.dataset.theme=theme;$('theme').textContent=theme==='dark'?'浅色 Light':'深色 Dark';render();
})();
</script>
</body>
</html>
